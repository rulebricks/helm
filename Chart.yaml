apiVersion: v2
name: stack
description: A unified Helm chart for deploying Rulebricks and its dependencies (Kafka, Supabase, Traefik, etc.)
type: application
version: 0.3.0
appVersion: "0.3.0"
icon: https://d1zic6dm9txw4h.cloudfront.net/rulebricks-docs-assets/static/images/application/logo.png
home: https://rulebricks.com
sources:
  - https://github.com/rulebricks/helm
maintainers:
  - name: Rulebricks
    email: support@rulebricks.com
    url: https://rulebricks.com
keywords:
  - rulebricks
  - rules-engine
  - business-rules
  - decision-engine
  - enterprise
dependencies:
  - name: rulebricks
    version: 0.1.1
    repository: file://charts/rulebricks
  # Strimzi Kafka operator — upstream OCI chart from quay.io (replaced the frozen
  # bitnamilegacy kafka subchart). The operator and Kafka broker images are
  # re-pointed to docker.io/rulebricks/* via the strimzi-kafka-operator values
  # (operator) and templates/kafka-strimzi.yaml (broker spec.kafka.image).
  - name: strimzi-kafka-operator
    version: 1.0.1
    repository: oci://quay.io/strimzi-helm
    condition: kafka.enabled
  - name: clickstack
    version: 0.1.0
    repository: file://charts/clickstack
    condition: global.clickstack.enabled
  - name: supabase
    version: 0.1.4
    repository: file://charts/supabase
    condition: supabase.enabled
  # Tier-2 dependencies — upstream community charts (reverted from the DHI
  # re-images). Every image these charts pull is re-pointed to
  # docker.io/rulebricks/* through each chart's native image values; the CLI sets
  # those defaults and applies global.imageRegistry (see values.yaml). NOTE: only
  # kube-prometheus-stack honors a parent global.imageRegistry — the other five
  # need their per-chart image keys set (the CLI does this; hand-installers must
  # set them too). Versions confirmed against the upstream repos.
  - name: kube-prometheus-stack
    version: 87.3.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
  - name: traefik
    version: 41.0.1
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  - name: keda
    version: 2.20.1
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
  - name: cert-manager
    version: v1.20.3
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  - name: vector
    version: 0.56.0
    repository: https://helm.vector.dev
    condition: vector.enabled
  - name: vector
    alias: vector-agent
    version: 0.56.0
    repository: https://helm.vector.dev
    condition: vector-agent.enabled
  - name: external-dns
    version: 1.21.1
    repository: https://kubernetes-sigs.github.io/external-dns/
    condition: external-dns.enabled
