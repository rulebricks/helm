name: Mirror Images

# Declarative image mirror pipeline. Single source of truth: images/manifest.yaml.
# Each entry is mirrored/built into docker.io/rulebricks/<name>:<tag>.
#
# Digest pinning (writing resolved sha256 into values.yaml global.imageDigests via
# a PR) is intentionally NOT done here — the chart references images by :tag and we
# control the rulebricks/* registry. scripts/images/{sync,render-digests}.sh remain
# in the repo so digest pinning can be re-enabled later if desired.
#
# Jobs:
#   plan -> read manifest, emit the matrix of entries
#   sync -> per-entry (matrix) mirror/build into rulebricks/*

on:
  schedule:
    # Daily freshness re-mirror + re-pin (avoids the bitnamilegacy staleness trap).
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "images/manifest.yaml"
      - "images/**"
      - "scripts/images/**"

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Build matrix from manifest
        id: set
        run: |
          MATRIX="$(yq -o=json -I=0 '.images' images/manifest.yaml)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.entry.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DHI (dhi.io)
        if: matrix.entry.auth == 'dhi'
        # DHI Community is pullable by ANY authenticated Docker Hub account, so the
        # same DOCKERHUB_* credential that pushes to rulebricks/* also authenticates
        # dhi.io — one secret pair covers everything (target push + DHI + Docker Hub
        # sources). Public sources (quay/ghcr/registry.k8s.io) need no login.
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub (target namespace + docker.io sources)
        # docker.io/rulebricks/* is the (private) push target; docker.io-sourced
        # entries also read from here.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror / build / resolve
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          name='${{ matrix.entry.name }}'
          kind='${{ matrix.entry.kind }}'
          case "${kind}" in
            mirror)   scripts/images/mirror.sh   "${name}" ;;
            build)    scripts/images/build.sh    "${name}" ;;
            external) scripts/images/external.sh "${name}" ;;
            *) echo "::error::unknown kind '${kind}' for entry '${name}'"; exit 1 ;;
          esac
