name: Mirror Images

# Declarative image mirror pipeline. Single source of truth: images/manifest.yaml.
# Each entry is mirrored/built into docker.io/rulebricks/<name>:<tag>.
#
# Digest pinning (writing resolved sha256 into values.yaml global.imageDigests via
# a PR) is intentionally NOT done here — the chart references images by :tag and we
# control the rulebricks/* registry. scripts/images/{sync,render-digests}.sh remain
# in the repo so digest pinning can be re-enabled later if desired.
#
# Jobs:
#   plan -> read manifest, emit the matrix of entries
#   sync -> per-entry (matrix) mirror/build into rulebricks/*

on:
  schedule:
    # Weekly freshness re-mirror for mutable tags and same-tag upstream rebuilds.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "images/manifest.yaml"
      - "images/**"
      - "scripts/images/**"

permissions:
  contents: read

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reproducible Go dependency pins
        run: scripts/images/verify-go-build-pins.sh

      - name: Test registry retry policy
        run: scripts/images/test-common.sh

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Build matrix from manifest
        id: set
        run: |
          MATRIX="$(yq -o=json -I=0 '.images' images/manifest.yaml)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.entry.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registries
        env:
          SOURCE_AUTH: ${{ matrix.entry.auth }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/images/common.sh
          docker_login_with_retry docker.io "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}"
          if [ "${SOURCE_AUTH}" = "dhi" ]; then
            docker_login_with_retry dhi.io "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}"
          fi

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror / build / resolve
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          name='${{ matrix.entry.name }}'
          kind='${{ matrix.entry.kind }}'
          case "${kind}" in
            mirror)   scripts/images/mirror.sh   "${name}" ;;
            build)    scripts/images/build.sh    "${name}" ;;
            external) scripts/images/external.sh "${name}" ;;
            *) echo "::error::unknown kind '${kind}' for entry '${name}'"; exit 1 ;;
          esac
