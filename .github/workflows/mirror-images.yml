name: Mirror Images

# Declarative, drift-free image mirror pipeline (design Section D.4).
#
# Single source of truth: images/manifest.yaml. Each entry is mirrored, built, or
# resolved (external) into docker.io/rulebricks/<name>:<tag>, then the resolved
# manifest-list digests are pinned back into the chart (values.yaml) + the
# manifest (audit trail) via an automated PR.
#
# Jobs:
#   plan  -> read manifest, emit the matrix of entries
#   sync  -> per-entry (matrix) mirror/build/external + upload <name>.digest
#   pin   -> collect all digests, render-digests.sh, open chore/image-digests PR

on:
  schedule:
    # Daily freshness re-mirror + re-pin (avoids the bitnamilegacy staleness trap).
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "images/manifest.yaml"
      - "images/**"
      - "scripts/images/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Build matrix from manifest
        id: set
        run: |
          MATRIX="$(yq -o=json -I=0 '.images' images/manifest.yaml)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.entry.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DHI (dhi.io)
        if: matrix.entry.auth == 'dhi'
        # DHI Community is pullable by ANY authenticated Docker Hub account, so the
        # same DOCKERHUB_* credential that pushes to rulebricks/* also authenticates
        # dhi.io — one secret pair covers everything (target push + DHI + Docker Hub
        # sources). Public sources (quay/ghcr/registry.k8s.io) need no login.
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub (target namespace + docker.io sources)
        # docker.io/rulebricks/* is the (private) push target; docker.io-sourced
        # entries also read from here.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror / build / resolve
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          name='${{ matrix.entry.name }}'
          kind='${{ matrix.entry.kind }}'
          case "${kind}" in
            mirror)   scripts/images/mirror.sh   "${name}" ;;
            build)    scripts/images/build.sh    "${name}" ;;
            external) scripts/images/external.sh "${name}" ;;
            *) echo "::error::unknown kind '${kind}' for entry '${name}'"; exit 1 ;;
          esac

      - name: Upload digest fragment
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.entry.name }}
          path: ${{ runner.temp }}/${{ matrix.entry.name }}.digest
          if-no-files-found: error
          retention-days: 7

  pin:
    name: Pin digests
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Download digest fragments
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Render digests into values.yaml + manifest
        env:
          OUT_DIR: ${{ runner.temp }}/digests
        run: scripts/images/render-digests.sh

      - name: Open digest-refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/image-digests
          base: main
          title: "chore: refresh mirrored image digests"
          commit-message: "chore: refresh mirrored image digests"
          body: |
            Automated refresh of `docker.io/rulebricks/*` image digests.

            - `images/digests.json` rebuilt from the mirrored/built/external images.
            - `global.imageDigests` in `values.yaml` re-pinned.
            - per-entry `digest:` fields in `images/manifest.yaml` updated (audit trail).

            Source of truth: `images/manifest.yaml`. Generated by `.github/workflows/mirror-images.yml`.
          labels: |
            automated
            images
          delete-branch: true
