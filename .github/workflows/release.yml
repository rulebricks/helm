name: Helm Chart

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_chart:
        description: Force a chart release even when path filters would not match
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  CANONICAL_CHART_NAMESPACE: rulebricks/helm

# Image mirroring lives in .github/workflows/mirror-images.yml (driven by
# images/manifest.yaml). This workflow is purely: validate -> detect chart change
# -> package & push the OCI chart.

jobs:
  validate:
    name: Validate Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.17.0"

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo add vector https://helm.vector.dev --force-update
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ --force-update
          helm repo add autoscaler https://kubernetes.github.io/autoscaler --force-update
          helm repo update

      - name: Build Dependencies
        run: helm dependency build .

      - name: Lint
        # The schema intentionally rejects the shipped defaults (secrets have no
        # working defaults and must be provided at install time), so lint needs
        # the same CI-only fake secrets the render step uses.
        run: helm lint . -f ci/validate-values.yaml

      - name: Render chart for validation
        # ONE full-feature render (all toggles on, supabase enabled) feeds both the
        # image-version guard and the workload/ClickHouse checks below, so the chart
        # isn't re-rendered several times. CI-only test secrets live in
        # ci/validate-values.yaml (excluded from the packaged chart via .helmignore).
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            -f ci/validate-values.yaml \
            --set monitoring.enabled=true \
            --set kube-prometheus-stack.prometheus.enabled=true \
            --set kube-prometheus-stack.grafana.enabled=true \
            --set kube-prometheus-stack.grafana.imageRenderer.enabled=true \
            --set kube-prometheus-stack.kube-state-metrics.kubeRBACProxy.enabled=true \
            --set kube-prometheus-stack.prometheusOperator.admissionWebhooks.enabled=true \
            --set kube-prometheus-stack.thanosRuler.enabled=true \
            --set global.externalDnsEnabled=true --set external-dns.enabled=true \
            --set cluster-autoscaler.enabled=true \
            --set cluster-autoscaler.autoDiscovery.clusterName=ci-cluster \
            --set cluster-autoscaler.awsRegion=us-east-1 \
            --set supabase.enabled=true \
            > /tmp/rulebricks-rendered.yaml

      - name: Verify Image Versions Match Manifest
        # SSOT guard: every rendered docker.io/rulebricks/* image must match an
        # images/manifest.yaml entry at the same tag (catches chart/CLI tag drift).
        run: scripts/images/verify-versions.sh /tmp/rulebricks-rendered.yaml

      - name: Validate Rendered Workloads And ClickHouse Bootstrap
        run: |
          ruby -ryaml <<'RUBY'
          rendered = File.read("/tmp/rulebricks-rendered.yaml", encoding: "UTF-8")
          docs = rendered.split(/^---\s*$/).map do |chunk|
            YAML.load(chunk)
          rescue Psych::SyntaxError
            nil
          end.compact.select { |doc| doc.is_a?(Hash) }

          workload_kinds = ["Deployment", "DaemonSet", "StatefulSet"]
          mismatches = docs.map do |doc|
            next unless workload_kinds.include?(doc["kind"])
            selector = doc.dig("spec", "selector", "matchLabels") || {}
            labels = doc.dig("spec", "template", "metadata", "labels") || {}
            missing = selector.reject { |key, value| labels[key] == value }
            next if missing.empty?

            name = doc.dig("metadata", "name")
            "#{doc["kind"]}/#{name}: selector labels not present on pod template: #{missing.inspect}"
          end.compact

          unless mismatches.empty?
            warn mismatches.join("\n")
            exit 1
          end

          hyperdx = docs.find do |doc|
            doc["kind"] == "Deployment" &&
              doc.dig("metadata", "name").to_s.end_with?("-clickstack-hyperdx")
          end
          env = hyperdx&.dig("spec", "template", "spec", "containers", 0, "env") || []
          env_by_name = env.each_with_object({}) { |item, acc| acc[item["name"]] = item }
          required_env = ["DEFAULT_CONNECTIONS", "DEFAULT_SOURCES", "CLICKHOUSE_PASSWORD"]
          missing_env = required_env.reject { |name| env_by_name.key?(name) }
          unless missing_env.empty?
            warn "HyperDX deployment is missing env vars: #{missing_env.join(", ")}"
            exit 1
          end
          unless env_by_name.dig("DEFAULT_CONNECTIONS", "value").to_s.include?("$(CLICKHOUSE_PASSWORD)")
            warn "HyperDX DEFAULT_CONNECTIONS must reference $(CLICKHOUSE_PASSWORD)"
            exit 1
          end

          # The decision-logs view is seeded by the clickhouse-view post-install Job
          # (its clickhouse-client args carry the SQL); this replaced the old
          # -clickhouse-init-scripts Secret mechanism.
          view_job = docs.find do |doc|
            doc["kind"] == "Job" &&
              doc.to_s.include?("CREATE OR REPLACE VIEW rulebricks.decision_logs")
          end
          if view_job.nil?
            warn "ClickHouse decision-logs view Job not found"
            exit 1
          end
          required = [
            "CREATE DATABASE IF NOT EXISTS otel",
            "CREATE OR REPLACE VIEW rulebricks.decision_logs"
          ]
          missing = required.reject { |needle| view_job.to_s.include?(needle) }
          unless missing.empty?
            warn "ClickHouse view Job is missing: #{missing.join(", ")}"
            exit 1
          end
          RUBY

  changes:
    name: Detect Release Changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      chart: ${{ github.event_name == 'workflow_dispatch' && inputs.release_chart || steps.filter.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Chart Release Changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            chart:
              - 'Chart.yaml'
              - 'Chart.lock'
              - 'values.yaml'
              - 'values.schema.json'
              - 'templates/**'
              - 'charts/**'
              - 'crds/**'
              - 'images/manifest.yaml'

  release:
    name: Release Chart
    needs:
      - validate
      - changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: helm-chart-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.17.0"

      - name: Resolve Release Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(awk '/^version:/ {print $2; exit}' Chart.yaml)
          if ! echo "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid base chart version in Chart.yaml: $BASE_VERSION"
            exit 1
          fi

          LATEST_VERSION=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | sub("^v"; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // ""')

          VERSION=$(BASE_VERSION="$BASE_VERSION" LATEST_VERSION="$LATEST_VERSION" python - <<'PY'
          import os

          def parse(version: str) -> tuple[int, int, int]:
              return tuple(int(part) for part in version.split("."))  # type: ignore[return-value]

          base = parse(os.environ["BASE_VERSION"])
          latest_raw = os.environ.get("LATEST_VERSION", "")

          if not latest_raw:
              next_version = base
          else:
              latest = parse(latest_raw)
              if latest < base:
                  next_version = base
              else:
                  next_version = (latest[0], latest[1], latest[2] + 1)

          print(".".join(str(part) for part in next_version))
          PY
          )

          echo "Base chart version: $BASE_VERSION"
          echo "Latest released version: ${LATEST_VERSION:-none}"
          echo "Next release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Chart Version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          path = Path("Chart.yaml")
          lines = path.read_text().splitlines()
          updated = []
          for line in lines:
              if line.startswith("version:"):
                  updated.append(f"version: {version}")
              elif line.startswith("appVersion:"):
                  updated.append(f'appVersion: "{version}"')
              else:
                  updated.append(line)
          path.write_text("\n".join(updated) + "\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo add vector https://helm.vector.dev --force-update
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ --force-update
          helm repo add autoscaler https://kubernetes.github.io/autoscaler --force-update
          helm repo update

      - name: Build Dependencies
        run: helm dependency build .

      - name: Package Chart
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_NAME=$(awk '/^name:/ {print $2; exit}' Chart.yaml)
          helm package . --destination dist
          CHART_PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"
          # Public contract: the CLI resolves infrastructure image tags from the
          # manifest inside the tarball (per chart version). A package without it
          # would silently break CLI tag resolution — fail the release instead.
          if ! tar -tzf "$CHART_PACKAGE" | grep -qx "${CHART_NAME}/images/manifest.yaml"; then
            echo "::error::images/manifest.yaml is missing from ${CHART_PACKAGE}; the CLI resolves image tags from it (check .helmignore)"
            exit 1
          fi
          shasum -a 256 "$CHART_PACKAGE" | tee "${CHART_PACKAGE}.sha256"
          echo "chart_name=$CHART_NAME" >> "$GITHUB_OUTPUT"
          echo "chart_package=$CHART_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "checksum_file=${CHART_PACKAGE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Canonical OCI Chart
        id: push_canonical
        run: |
          OUTPUT=$(helm push "${{ steps.package.outputs.chart_package }}" "oci://${{ env.REGISTRY }}/${{ env.CANONICAL_CHART_NAMESPACE }}" 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/Digest:/ {print $2}' | tail -n1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine OCI digest from helm push output"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Write Release Notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.push_canonical.outputs.digest }}"
          cat > release-notes.md <<EOF
          # Rulebricks Helm ${VERSION}

          ## Install

          \`\`\`bash
          helm install rulebricks oci://ghcr.io/rulebricks/helm/stack \\
            --namespace rulebricks \\
            --create-namespace \\
            --version ${VERSION} \\
            -f your-values.yaml
          \`\`\`

          ## Digest Pinning

          \`\`\`bash
          helm install rulebricks oci://ghcr.io/rulebricks/helm/stack@${DIGEST} \\
            --namespace rulebricks \\
            --create-namespace \\
            -f your-values.yaml
          \`\`\`

          ## Artifacts

          - OCI: \`oci://ghcr.io/rulebricks/helm/stack:${VERSION}\`
          - Digest: \`${DIGEST}\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Rulebricks Helm ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "${{ steps.package.outputs.chart_package }}" \
            "${{ steps.package.outputs.checksum_file }}"
