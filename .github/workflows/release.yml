name: Helm Chart

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_chart:
        description: Force a chart release even when path filters would not match
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  CANONICAL_CHART_NAMESPACE: rulebricks/helm
  KAFKA_TAG: 4.0.0-debian-12-r10
  KAFKA_SOURCE_IMAGE: docker.io/bitnamilegacy/kafka
  KAFKA_TARGET_IMAGE: docker.io/rulebricks/kafka
  CLICKHOUSE_TAG: 25.7.5-debian-12-r0
  CLICKHOUSE_SOURCE_IMAGE: docker.io/bitnamilegacy/clickhouse
  CLICKHOUSE_TARGET_IMAGE: docker.io/rulebricks/clickhouse
  CLICKHOUSE_KEEPER_SOURCE_IMAGE: docker.io/bitnamilegacy/clickhouse-keeper
  CLICKHOUSE_KEEPER_TARGET_IMAGE: docker.io/rulebricks/clickhouse-keeper
  JMX_EXPORTER_TAG: 1.4.0-debian-12-r0
  JMX_EXPORTER_SOURCE_IMAGE: docker.io/bitnamilegacy/jmx-exporter
  JMX_EXPORTER_TARGET_IMAGE: docker.io/rulebricks/jmx-exporter
  KUBECTL_TAG: 1.33.4-debian-12-r0
  KUBECTL_SOURCE_IMAGE: docker.io/bitnamilegacy/kubectl
  KUBECTL_TARGET_IMAGE: docker.io/rulebricks/kubectl
  OS_SHELL_TAG: 12-debian-12-r51
  OS_SHELL_SOURCE_IMAGE: docker.io/bitnamilegacy/os-shell
  OS_SHELL_TARGET_IMAGE: docker.io/rulebricks/os-shell
  HYPERDX_TAG: 2.19.0
  HYPERDX_SOURCE_IMAGE: docker.hyperdx.io/hyperdx/hyperdx
  HYPERDX_TARGET_IMAGE: docker.io/rulebricks/hyperdx
  CLICKSTACK_OTEL_COLLECTOR_TAG: 2.19.0
  CLICKSTACK_OTEL_COLLECTOR_SOURCE_IMAGE: docker.clickhouse.com/clickhouse/clickstack-otel-collector
  CLICKSTACK_OTEL_COLLECTOR_TARGET_IMAGE: docker.io/rulebricks/clickstack-otel-collector
  FERRETDB_TAG: 2.7.0
  FERRETDB_SOURCE_IMAGE: ghcr.io/ferretdb/ferretdb
  FERRETDB_TARGET_IMAGE: docker.io/rulebricks/ferretdb
  POSTGRES_DOCUMENTDB_TAG: 17-0.107.0-ferretdb-2.7.0
  POSTGRES_DOCUMENTDB_SOURCE_IMAGE: ghcr.io/ferretdb/postgres-documentdb
  POSTGRES_DOCUMENTDB_TARGET_IMAGE: docker.io/rulebricks/postgres-documentdb

jobs:
  validate:
    name: Validate Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.17.0"

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add traefik https://helm.traefik.io/traefik --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo add vector https://helm.vector.dev --force-update
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ --force-update
          helm repo update

      - name: Build Dependencies
        run: helm dependency build .

      - name: Lint
        run: helm lint .

      - name: Template Default Install
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            --set global.domain=rulebricks.example.com \
            --set global.email=ops@example.com

      - name: Template Gateway API Install
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            --set global.domain=rulebricks.example.com \
            --set global.email=ops@example.com \
            --set rulebricks.ingress.type=gateway-api \
            --set rulebricks.ingress.gatewayApi.gatewayName=rulebricks-gateway

      - name: Template Ingress Disabled Install
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            --set global.domain=rulebricks.example.com \
            --set global.email=ops@example.com \
            --set rulebricks.ingress.enabled=false

      - name: Template External Valkey And Auth Install
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            --set global.domain=rulebricks.example.com \
            --set global.email=ops@example.com \
            --set global.supabase.jwtSecret=test-jwt-secret-with-at-least-32-characters-long \
            --set global.externalAuth.enabled=true \
            --set rulebricks.redis.enabled=false \
            --set rulebricks.redis.external.host=valkey.example.com

      - name: Validate Rendered Workloads And ClickHouse Bootstrap
        run: |
          helm template rulebricks . \
            --namespace rulebricks \
            --set global.domain=rulebricks.example.com \
            --set global.email=ops@example.com \
            > /tmp/rulebricks-rendered.yaml

          ruby -ryaml <<'RUBY'
          rendered = File.read("/tmp/rulebricks-rendered.yaml")
          docs = rendered.split(/^---\s*$/).map do |chunk|
            YAML.load(chunk)
          rescue Psych::SyntaxError
            nil
          end.compact.select { |doc| doc.is_a?(Hash) }

          workload_kinds = ["Deployment", "DaemonSet", "StatefulSet"]
          mismatches = docs.map do |doc|
            next unless workload_kinds.include?(doc["kind"])
            selector = doc.dig("spec", "selector", "matchLabels") || {}
            labels = doc.dig("spec", "template", "metadata", "labels") || {}
            missing = selector.reject { |key, value| labels[key] == value }
            next if missing.empty?

            name = doc.dig("metadata", "name")
            "#{doc["kind"]}/#{name}: selector labels not present on pod template: #{missing.inspect}"
          end.compact

          unless mismatches.empty?
            warn mismatches.join("\n")
            exit 1
          end

          bootstrap = docs.find do |doc|
            doc["kind"] == "Secret" &&
              doc.dig("metadata", "name").to_s.end_with?("-clickhouse-init-scripts")
          end
          script = bootstrap&.dig("stringData", "01-decision-logs-view.sh").to_s

          required = [
            "CREATE DATABASE IF NOT EXISTS otel",
            "CREATE OR REPLACE VIEW rulebricks.decision_logs"
          ]
          missing = required.reject { |needle| script.include?(needle) }
          unless missing.empty?
            warn "ClickHouse bootstrap is missing: #{missing.join(", ")}"
            exit 1
          end
          RUBY

  changes:
    name: Detect Release Changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      chart: ${{ github.event_name == 'workflow_dispatch' && inputs.release_chart || steps.filter.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Chart Release Changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            chart:
              - 'Chart.yaml'
              - 'Chart.lock'
              - 'values.yaml'
              - 'values.schema.json'
              - 'templates/**'
              - 'charts/**'
              - 'crds/**'
              - 'scripts/publish-*.sh'
              - 'images/**'

  release:
    name: Release Chart
    needs:
      - validate
      - changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: helm-chart-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.17.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect Image Changes
        id: image_changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            kafka:
              - 'charts/kafka/**'
              - 'scripts/publish-kafka-image.sh'
            clickhouse:
              - 'charts/clickhouse/**'
              - 'scripts/publish-clickhouse-image.sh'
            clickstack:
              - 'charts/clickstack/**'
              - 'scripts/publish-clickstack-images.sh'
            sidecars:
              - 'scripts/publish-bitnami-sidecars.sh'
              - 'charts/kafka/Chart.yaml'
              - 'charts/clickhouse/Chart.yaml'

      - name: Publish Kafka Image
        if: steps.image_changes.outputs.kafka == 'true'
        env:
          KAFKA_TAG: ${{ env.KAFKA_TAG }}
          SOURCE_IMAGE: ${{ env.KAFKA_SOURCE_IMAGE }}
          TARGET_IMAGE: ${{ env.KAFKA_TARGET_IMAGE }}
        run: bash scripts/publish-kafka-image.sh

      - name: Skip Kafka Publish
        if: steps.image_changes.outputs.kafka != 'true'
        run: echo "::notice title=Skipping Kafka publish::No relevant files changed in this push."

      - name: Publish ClickHouse Image
        if: steps.image_changes.outputs.clickhouse == 'true'
        env:
          CLICKHOUSE_TAG: ${{ env.CLICKHOUSE_TAG }}
          SOURCE_IMAGE: ${{ env.CLICKHOUSE_SOURCE_IMAGE }}
          TARGET_IMAGE: ${{ env.CLICKHOUSE_TARGET_IMAGE }}
          KEEPER_SOURCE_IMAGE: ${{ env.CLICKHOUSE_KEEPER_SOURCE_IMAGE }}
          KEEPER_TARGET_IMAGE: ${{ env.CLICKHOUSE_KEEPER_TARGET_IMAGE }}
        run: bash scripts/publish-clickhouse-image.sh

      - name: Skip ClickHouse Publish
        if: steps.image_changes.outputs.clickhouse != 'true'
        run: echo "::notice title=Skipping ClickHouse publish::No relevant files changed in this push."

      - name: Publish ClickStack Images
        if: steps.image_changes.outputs.clickstack == 'true'
        env:
          HYPERDX_TAG: ${{ env.HYPERDX_TAG }}
          HYPERDX_SOURCE_IMAGE: ${{ env.HYPERDX_SOURCE_IMAGE }}
          HYPERDX_TARGET_IMAGE: ${{ env.HYPERDX_TARGET_IMAGE }}
          CLICKSTACK_OTEL_COLLECTOR_TAG: ${{ env.CLICKSTACK_OTEL_COLLECTOR_TAG }}
          CLICKSTACK_OTEL_COLLECTOR_SOURCE_IMAGE: ${{ env.CLICKSTACK_OTEL_COLLECTOR_SOURCE_IMAGE }}
          CLICKSTACK_OTEL_COLLECTOR_TARGET_IMAGE: ${{ env.CLICKSTACK_OTEL_COLLECTOR_TARGET_IMAGE }}
          FERRETDB_TAG: ${{ env.FERRETDB_TAG }}
          FERRETDB_SOURCE_IMAGE: ${{ env.FERRETDB_SOURCE_IMAGE }}
          FERRETDB_TARGET_IMAGE: ${{ env.FERRETDB_TARGET_IMAGE }}
          POSTGRES_DOCUMENTDB_TAG: ${{ env.POSTGRES_DOCUMENTDB_TAG }}
          POSTGRES_DOCUMENTDB_SOURCE_IMAGE: ${{ env.POSTGRES_DOCUMENTDB_SOURCE_IMAGE }}
          POSTGRES_DOCUMENTDB_TARGET_IMAGE: ${{ env.POSTGRES_DOCUMENTDB_TARGET_IMAGE }}
        run: bash scripts/publish-clickstack-images.sh

      - name: Skip ClickStack Image Publish
        if: steps.image_changes.outputs.clickstack != 'true'
        run: echo "::notice title=Skipping ClickStack image publish::No relevant files changed in this push."

      - name: Publish Bitnami Sidecars
        if: steps.image_changes.outputs.sidecars == 'true'
        env:
          JMX_EXPORTER_TAG: ${{ env.JMX_EXPORTER_TAG }}
          JMX_EXPORTER_SOURCE_IMAGE: ${{ env.JMX_EXPORTER_SOURCE_IMAGE }}
          JMX_EXPORTER_TARGET_IMAGE: ${{ env.JMX_EXPORTER_TARGET_IMAGE }}
          KUBECTL_TAG: ${{ env.KUBECTL_TAG }}
          KUBECTL_SOURCE_IMAGE: ${{ env.KUBECTL_SOURCE_IMAGE }}
          KUBECTL_TARGET_IMAGE: ${{ env.KUBECTL_TARGET_IMAGE }}
          OS_SHELL_TAG: ${{ env.OS_SHELL_TAG }}
          OS_SHELL_SOURCE_IMAGE: ${{ env.OS_SHELL_SOURCE_IMAGE }}
          OS_SHELL_TARGET_IMAGE: ${{ env.OS_SHELL_TARGET_IMAGE }}
        run: bash scripts/publish-bitnami-sidecars.sh

      - name: Skip Bitnami Sidecars Publish
        if: steps.image_changes.outputs.sidecars != 'true'
        run: echo "::notice title=Skipping Bitnami sidecars publish::No relevant files changed in this push."

      - name: Resolve Release Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_VERSION=$(awk '/^version:/ {print $2; exit}' Chart.yaml)
          if ! echo "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid base chart version in Chart.yaml: $BASE_VERSION"
            exit 1
          fi

          LATEST_VERSION=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | sub("^v"; "") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // ""')

          VERSION=$(BASE_VERSION="$BASE_VERSION" LATEST_VERSION="$LATEST_VERSION" python - <<'PY'
          import os

          def parse(version: str) -> tuple[int, int, int]:
              return tuple(int(part) for part in version.split("."))  # type: ignore[return-value]

          base = parse(os.environ["BASE_VERSION"])
          latest_raw = os.environ.get("LATEST_VERSION", "")

          if not latest_raw:
              next_version = base
          else:
              latest = parse(latest_raw)
              if latest < base:
                  next_version = base
              else:
                  next_version = (latest[0], latest[1], latest[2] + 1)

          print(".".join(str(part) for part in next_version))
          PY
          )

          echo "Base chart version: $BASE_VERSION"
          echo "Latest released version: ${LATEST_VERSION:-none}"
          echo "Next release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Chart Version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          path = Path("Chart.yaml")
          lines = path.read_text().splitlines()
          updated = []
          for line in lines:
              if line.startswith("version:"):
                  updated.append(f"version: {version}")
              elif line.startswith("appVersion:"):
                  updated.append(f'appVersion: "{version}"')
              else:
                  updated.append(line)
          path.write_text("\n".join(updated) + "\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Add Helm Repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo add traefik https://helm.traefik.io/traefik --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo add vector https://helm.vector.dev --force-update
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ --force-update
          helm repo update

      - name: Build Dependencies
        run: helm dependency build .

      - name: Package Chart
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_NAME=$(awk '/^name:/ {print $2; exit}' Chart.yaml)
          helm package . --destination dist
          CHART_PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"
          shasum -a 256 "$CHART_PACKAGE" | tee "${CHART_PACKAGE}.sha256"
          echo "chart_name=$CHART_NAME" >> "$GITHUB_OUTPUT"
          echo "chart_package=$CHART_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "checksum_file=${CHART_PACKAGE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Canonical OCI Chart
        id: push_canonical
        run: |
          OUTPUT=$(helm push "${{ steps.package.outputs.chart_package }}" "oci://${{ env.REGISTRY }}/${{ env.CANONICAL_CHART_NAMESPACE }}" 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/Digest:/ {print $2}' | tail -n1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine OCI digest from helm push output"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Write Release Notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIGEST="${{ steps.push_canonical.outputs.digest }}"
          cat > release-notes.md <<EOF
          # Rulebricks Helm ${VERSION}

          ## Install

          \`\`\`bash
          helm install rulebricks oci://ghcr.io/rulebricks/helm/stack \\
            --namespace rulebricks \\
            --create-namespace \\
            --version ${VERSION} \\
            -f your-values.yaml
          \`\`\`

          ## Digest Pinning

          \`\`\`bash
          helm install rulebricks oci://ghcr.io/rulebricks/helm/stack@${DIGEST} \\
            --namespace rulebricks \\
            --create-namespace \\
            -f your-values.yaml
          \`\`\`

          ## Artifacts

          - OCI: \`oci://ghcr.io/rulebricks/helm/stack:${VERSION}\`
          - Digest: \`${DIGEST}\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Rulebricks Helm ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "${{ steps.package.outputs.chart_package }}" \
            "${{ steps.package.outputs.checksum_file }}"
