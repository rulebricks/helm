# File structure of values.yaml:
# |-- 1.  Database
# |-- 2.  Studio
# |-- 3.  Auth
# |-- 4.  Rest
# |-- 5.  Realtime
# |-- 6.  Meta
# |-- 7.  Kong

secret:
  # jwt will be used to reference secret in multiple services:
  # Anon & Service key: Studio, Kong
  # JWT Secret: Auth, Rest, Realtime
  jwt:
    anonKey: ""
    serviceKey: ""
    secret: ""
    # specify existing secret, which takes precedence over variables above
    secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      anonKey: anonKey
      serviceKey: serviceKey
      secret: secret
  # database credentials
  # these fields must be provided even if using external database
  db:
    username: ""
    password: ""
    database: ""
    # specify existing secret, which takes precedence over variables above
    secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      host: ""
      port: ""
      username: username
      password: password
      database: database
  # smtp will be used to reference secret including smtp credentials
  smtp:
    # username: ""
    # password: ""
    # specify existing secret, which takes precedence over variables above
    # secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      username: username
      password: password
  # secret used to access the studio dashboard
  # leave it empty to disable dashboard authentication
  dashboard:
    # username: ""
    # password: ""
    # specify existing secret, which takes precedence over variables above
    # secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      username: username
      password: password
  # realtime encryption secrets. Required when realtime is enabled.
  #   secretKeyBase: long random string (signs/encrypts Realtime tokens)
  #   dbEncKey:      exactly 16 bytes (encrypts tenant DB credentials)
  realtime:
    secretKeyBase: ""
    dbEncKey: ""
    # specify existing secret, which takes precedence over variables above
    secretRef: ""
    # override secret keys for existing secret refs (keys in the secret)
    secretRefKey:
      secretKeyBase: SECRET_KEY_BASE
      dbEncKey: DB_ENC_KEY

# External (managed) PostgreSQL - one switch for the whole concept.
# Setting enabled=true makes this the database for every Supabase service:
#   * the bundled in-cluster Postgres (db.* below) is NOT deployed
#   * services connect to host/port with the credentials below
#   * Realtime uses the replication role instead of the bundled superuser
#   * a pre-install/upgrade hook runs bootstrap.sql to create the roles, schemas,
#     auth helpers, and publication the services expect (see externalDatabase.bootstrap)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  # Optional: source host/port/username/password/database from one existing secret.
  # When unset, the chart keeps using secret.db.
  secretRef: ""
  secretRefKey:
    # host/port default empty for backward compatibility. Set these to source
    # DB_HOST/DB_PORT from the same external database Secret.
    host: ""
    port: ""
    username: username
    password: password
    database: database
  # One-time initialization of a bare external database. Runs bootstrap.sql as the
  # DB master/owner via a Helm hook. Set enabled=false if you run bootstrap.sql
  # yourself (e.g. from CI) and prefer not to place master credentials in-cluster.
  bootstrap:
    enabled: true
    # Inline master/owner credentials used to initialize the database. The chart
    # materializes these (plus secret.db.password) into a short-lived pre-install
    # hook Secret. masterPassword is required unless secretRef is set.
    masterUsername: "postgres"
    masterPassword: ""
    # Advanced: a PRE-CREATED secret with keys master-username, master-password,
    # service-password. When set, it is used instead of the inline values above.
    secretRef: ""
    # Role your app migrations run as (the DB master/owner on RDS).
    appRole: "postgres"
    # Image providing psql for the hook job. When empty, the bootstrap job uses
    # global.images.postgres17 (rulebricks/postgres:17-debian13) via the supabase.image
    # helper. Set to a full image ref only to override.
    image: ""

# Optional: Postgres Database
# A standalone Postgres database configured to work with Supabase services.
# You can spin up any other Postgres database container if required.
# If so, make sure to adjust DB_HOST accordingly to point to the right database service.
db:
  # Enable database provisioning
  enabled: true
  # The bundled supabase/postgres image's built-in bootstrap superuser. POSTGRES_USER
  # is forced to this (NOT secret.db.username) so the pre-seeded image's migrate.sh /
  # initdb scripts and the db-role-init sidecar connect as a role that actually exists.
  # secret.db.username stays the app/migration role (the managed-instance master in
  # external-DB mode). Changing this away from supabase_admin breaks first-boot seeding.
  superuserName: "supabase_admin"
  image:
    registry: docker.io
    repository: rulebricks/supabase-postgres
    pullPolicy: IfNotPresent
    tag: "17.6.1.142"
  imagePullSecrets: []
  replicaCount: 1
  nameOverride: ""
  fullnameOverride: ""
  livenessProbe: {}
  readinessProbe: {}
  # First-boot role/ownership init for the bundled supabase/postgres image. That
  # image ships a pre-seeded PGDATA, so Postgres skips /docker-entrypoint-initdb.d
  # and never applies the service-role passwords (99-roles.sql) or hands the auth.*
  # helper functions to supabase_auth_admin. Without this, authenticator/
  # supabase_auth_admin/supabase_admin keep their baked-in passwords and auth/realtime/
  # rest/meta crashloop, and GoTrue's migration fails with "must be owner of function uid".
  # The db-role-init native sidecar (k8s >= 1.28) runs an idempotent 99-role-init.sql
  # over a loopback (trusted) connection on every boot. Disable only if you manage
  # these yourself or run an image that does not pre-seed PGDATA.
  roleInit:
    enabled: true
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    # Postgres in the supabase-postgres image runs as uid/gid 999 ("postgres").
    # Setting fsGroup makes mounted volumes group-accessible to that process; the
    # volume-permissions init container additionally fixes ownership of the PVC
    # data dir so initdb can set its 0700 permissions.
    fsGroup: 999
  securityContext:
    {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 5432
  environment:
    POSTGRES_HOST: /var/run/postgresql
    PGPORT: "5432"
    POSTGRES_PORT: "5432"
    JWT_EXP: 3600
    # POSTGRES_HOST_AUTH_METHOD: md5
    # Enable SSL for postgres by specifying paths for mounted certificate key pair
    # POSTGRES_SSL_CERT: /path/to/ssl/server.crt
    # POSTGRES_SSL_KEY: /path/to/ssl/server.key
  # volumeMounts:
  #   - name: volume_name
  #     mountPath: /path/to/my/secret
  # volumes:
  #   - name: volume_name
  #     secret:
  #       defaultMode: 733
  #       secretName: my_secret
  #       items:
  #       - key: my_secret.txt
  #         path: name_of_file_in_container.txt
  resources:
    {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  persistence:
    enabled: true
    storageClassName: ""
    annotations: {}
    size: 8Gi
    accessModes:
      - ReadWriteOnce
    class: ""
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional migration scripts can be defined here
  config: {}

