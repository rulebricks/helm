    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    {}
    # fsGroup: 2000
  securityContext:
    {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 9999
  # URL overrides - if set, these take precedence over auto-computed values
  # Use when app hostname differs from global.domain
  siteUrl: ""          # Override GOTRUE_SITE_URL (e.g., "https://app.example.com")
  externalUrl: ""      # Override API_EXTERNAL_URL (e.g., "https://supabase.example.com")
  # Additional redirect URLs beyond the auto-computed list
  additionalRedirectUrls: []

  environment:
    # Override the database hostname if using external database
    # DB_HOST: DATABASE.NAMESPACE.svc.cluster.local
    DB_USER: supabase_auth_admin
    DB_PORT: 5432
    DB_DRIVER: postgres
    DB_SSL: disable # disable, allow, prefer, require, verify-ca, verify-full
    # NOTE: API_EXTERNAL_URL, GOTRUE_SITE_URL, and GOTRUE_URI_ALLOW_LIST are
    # computed from global.domain and global.tlsEnabled, but can be overridden
    # using auth.siteUrl and auth.externalUrl above
    GOTRUE_API_HOST: "0.0.0.0"
    GOTRUE_API_PORT: "9999"
    GOTRUE_DISABLE_SIGNUP: "false"
    # JWT settings
    GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    GOTRUE_JWT_ADMIN_ROLES: service_role
    GOTRUE_JWT_AUD: authenticated
    GOTRUE_JWT_EXP: "3600"
    # Email settings
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    GOTRUE_MAILER_AUTOCONFIRM: "false"
    GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "false"
    # SMTP settings are configured via global.smtp in parent chart
    # Phone settings
    GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
    GOTRUE_SMS_AUTOCONFIRM: "true"
    # Security settings
    GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
    GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
    GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    GOTRUE_EXTERNAL_MANUAL_LINKING_ENABLED: "false"
    # Rate limits
    GOTRUE_RATE_LIMIT_EMAIL_SENT: "3600"
    GOTRUE_RATE_LIMIT_SMS_SENT: "3600"
    GOTRUE_RATE_LIMIT_VERIFY: "3600"
    # URL paths for email links
    GOTRUE_MAILER_URLPATHS_INVITE: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
    # NOTE: Email subjects and templates are set dynamically from global.emails
  envFrom:
    []
    # - secretRef:
    #     name: env-secret
  # volumeMounts:
  #   - name: volume_name
  #     mountPath: /path/to/my/secret
  # volumes:
  #   - name: volume_name
  #     secret:
