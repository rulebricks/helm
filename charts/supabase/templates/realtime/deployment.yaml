{{- if .Values.realtime.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.realtime.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  {{- if not .Values.realtime.autoscaling.enabled }}
  replicas: {{ .Values.realtime.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "supabase.realtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.realtime.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.realtime.selectorLabels" . | nindent 8 }}
        {{- with .Values.realtime.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.realtime.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.realtime.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.realtime.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-db
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.global.images.postgres15 "name" "postgres15") | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: {{ include "supabase.db.host" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "username" "default" "username") }}
            - name: DB_PORT
              value: {{ include "supabase.db.port" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U $(DB_USER); do
              echo "Waiting for database to start..."
              sleep 2
              done
            - echo "Database is ready"
      containers:
        - name: {{ include "supabase.realtime.name" $ }}
          securityContext:
            {{- toYaml .Values.realtime.securityContext | nindent 12 }}
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.realtime.image "name" "supabase-realtime") | quote }}
          imagePullPolicy: {{ .Values.realtime.image.pullPolicy }}
          command: ["/bin/sh"]
          args: ["-c", "/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server"]
          env:
            {{- $dbSkipKeys := list "DB_HOST" "DB_PORT" "DB_USER" "SECRET_KEY_BASE" "DB_ENC_KEY" }}
            {{- range $key, $value := .Values.realtime.environment }}
            {{- if not (has $key $dbSkipKeys) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: DB_USER
              value: {{ include "supabase.realtime.dbUser" . | quote }}
            # SECRET_KEY_BASE / DB_ENC_KEY are sensitive — sourced from a Secret,
            # never rendered as plaintext pod env.
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.realtime.secretName" . }}
                  key: {{ include "supabase.realtime.secretKey" (dict "root" . "field" "secretKeyBase" "default" "SECRET_KEY_BASE") }}
            - name: DB_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.realtime.secretName" . }}
                  key: {{ include "supabase.realtime.secretKey" (dict "root" . "field" "dbEncKey" "default" "DB_ENC_KEY") }}
            - name: DB_HOST
              value: {{ include "supabase.db.host" . | quote }}
            - name: DB_PORT
              value: {{ include "supabase.db.port" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "password" "default" "password") }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "database" "default" "database") }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.secret | default "secret" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: secret
                  {{- end }}
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.secret | default "secret" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: secret
                  {{- end }}
            # Realtime >=2.1x requires METRICS_JWT_SECRET to sign its /metrics auth
            # token; reuse the API JWT secret (no safe default — boot aborts without it).
            - name: METRICS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.secret | default "secret" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: secret
                  {{- end }}
            - name: SELF_HOST_TENANT_NAME
              value: {{ include "supabase.realtime.fullname" . }}
            - name: APP_NAME
              value: {{ include "supabase.realtime.fullname" . }}
          {{- with .Values.realtime.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.realtime.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          {{- with .Values.realtime.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.realtime.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.realtime.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.realtime.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.realtime.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.realtime.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}