{{- /*
Hook-scoped credentials for the external-database bootstrap.

Materializes the master/owner credentials (inline values) plus the shared
service-role password (secret.db.password) into a short-lived Secret that exists
BEFORE the bootstrap Job runs (chart-managed secrets are normal resources, created
after pre-install hooks). Only rendered for the inline path - when
externalDatabase.bootstrap.secretRef is set, that pre-created Secret is used and
must carry keys: master-username, master-password, service-password.

Created as a pre-install/pre-upgrade hook at a weight before the bootstrap Job and
deleted once the hook succeeds, so master credentials do not linger in the cluster.
*/ -}}
{{- if and .Values.externalDatabase.enabled .Values.externalDatabase.bootstrap.enabled (not .Values.externalDatabase.bootstrap.secretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.fullname" . }}-db-bootstrap-creds
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  master-username: {{ .Values.externalDatabase.bootstrap.masterUsername | default "postgres" | quote }}
  master-password: {{ .Values.externalDatabase.bootstrap.masterPassword | required "externalDatabase.bootstrap.masterPassword is required (or set externalDatabase.bootstrap.secretRef)" | quote }}
  service-password: {{ .Values.secret.db.password | required "secret.db.password is required to bootstrap an external database" | quote }}
{{- end }}
