{{- if and .Values.db.enabled (not .Values.externalDatabase.enabled) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.db.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  {{- if not .Values.db.autoscaling.enabled }}
  replicas: {{ .Values.db.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "supabase.db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.db.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.db.selectorLabels" . | nindent 8 }}
        {{- with .Values.db.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.db.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.db.serviceAccountName" . }}
      {{- with .Values.db.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.db.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.db.persistence.enabled }}
        # The supabase-postgres image runs as the non-root "postgres" user, so it
        # cannot chown/chmod a freshly-attached PVC data dir that the CSI driver
        # mounts as root (e.g. Azure Disk / EBS). Fix ownership as root before
        # Postgres' entrypoint runs initdb.
        - name: volume-permissions
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.db.image "name" "supabase-postgres") | quote }}
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - chown -R postgres:postgres /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-volume
              subPath: postgres-data
        {{- end }}
        - name: init-db
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.db.image "name" "supabase-postgres") | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Copying init scripts into existing image script directory..."
              cp -r /docker-entrypoint-initdb.d/* /initdb.d/
              cp /custom-init-scripts/98-webhooks.sql /initdb.d/init-scripts/
              cp /custom-init-scripts/99-roles.sql /initdb.d/init-scripts/
              cp /custom-init-scripts/99-logs.sql /initdb.d/migrations/
              cp /custom-init-scripts/99-realtime.sql /initdb.d/migrations/

              echo "Copying user-defined migration scripts..."
              cp /custom-migrations/* /initdb.d/migrations/ || echo "Skip migrations"
              echo "Initialization scripts are ready"
          volumeMounts:
            - mountPath: /custom-init-scripts
              name: custom-init-scripts
            - mountPath: /custom-migrations
              name: custom-migrations
            - mountPath: /initdb.d
              name: initdb-scripts-data
        {{- if .Values.db.roleInit.enabled }}
        # Native sidecar (restartPolicy: Always, k8s >= 1.28). The supabase/postgres
        # image ships a pre-seeded PGDATA, so Postgres skips
        # /docker-entrypoint-initdb.d and never applies the service-role passwords or
        # the auth.* function ownership GoTrue needs. This sidecar waits for the local
        # Postgres and runs 99-role-init.sql on every boot over a loopback (127.0.0.1)
        # connection, which the image's pg_hba.conf trusts — so it works even before
        # the roles have the right password. The SQL is idempotent.
        - name: db-role-init
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.db.image "name" "supabase-postgres") | quote }}
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "db-role-init: waiting for local postgres on 127.0.0.1:${PGPORT}..."
              until psql -h 127.0.0.1 -p "${PGPORT}" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'SELECT 1' >/dev/null 2>&1; do
                sleep 2
              done
              echo "db-role-init: applying role-password + auth-ownership init..."
              psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p "${PGPORT}" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /custom-init-scripts/99-role-init.sql
              echo "db-role-init: complete; idling."
              exec tail -f /dev/null
          env:
            - name: PGPORT
              value: {{ .Values.db.environment.PGPORT | default "5432" | quote }}
            - name: POSTGRES_USER
              # The bundled supabase/postgres image ships a PRE-SEEDED PGDATA; its
              # migrate.sh / initdb scripts and the db-role-init sidecar connect as
              # the image's bootstrap superuser (supabase_admin) over loopback-trust.
              # This is the image identity, NOT the app/migration role
              # (secret.db.username, which stays the managed-instance master in
              # external-DB mode). Sourcing POSTGRES_USER from the app username made
              # the pre-seeded image's seed abort ("role supabase_admin does not
              # exist") and left the DB unseeded.
              value: {{ .Values.db.superuserName | default "supabase_admin" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.password | default "password" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: password
                  {{- end }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.database | default "database" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: database
                  {{- end }}
          volumeMounts:
            # Reuse the existing -initdb ConfigMap volume; it carries 99-role-init.sql.
            - mountPath: /custom-init-scripts
              name: custom-init-scripts
              readOnly: true
        {{- end }}
      containers:
        - name: {{ include "supabase.db.name" $ }}
          securityContext:
            {{- toYaml .Values.db.securityContext | nindent 12 }}
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.db.image "name" "supabase-postgres") | quote }}
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.db.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_USER
              # The bundled supabase/postgres image ships a PRE-SEEDED PGDATA; its
              # migrate.sh / initdb scripts and the db-role-init sidecar connect as
              # the image's bootstrap superuser (supabase_admin) over loopback-trust.
              # This is the image identity, NOT the app/migration role
              # (secret.db.username, which stays the managed-instance master in
              # external-DB mode). Sourcing POSTGRES_USER from the app username made
              # the pre-seeded image's seed abort ("role supabase_admin does not
              # exist") and left the DB unseeded.
              value: {{ .Values.db.superuserName | default "supabase_admin" | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.password | default "password" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: password
                  {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.password | default "password" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: password
                  {{- end }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.database | default "database" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: database
                  {{- end }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.db.secretRef }}
                  name: {{ .Values.secret.db.secretRef }}
                  key: {{ .Values.secret.db.secretRefKey.database | default "database" }}
                  {{- else }}
                  name: {{ include "supabase.secret.db" . }}
                  key: database
                  {{- end }}
          {{- with .Values.db.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.db.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d
              name: initdb-scripts-data
            {{- with .Values.db.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.db.persistence.enabled }}
            - mountPath: /var/lib/postgresql/data
              name: postgres-volume
              subPath: postgres-data
            {{- end }}
          {{- with .Values.db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: initdb-scripts-data
          emptyDir:
            medium: ""
        - name: custom-init-scripts
          configMap:
            name: {{ include "supabase.db.fullname" . }}-initdb
        - name: custom-migrations
          configMap:
            name: {{ include "supabase.db.fullname" . }}-migrations
        {{- with .Values.db.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.db.persistence.enabled }}
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: {{ include "supabase.db.fullname" . }}-pvc
        {{- end }}
      {{- with .Values.db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.db.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.db.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}