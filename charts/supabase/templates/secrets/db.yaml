{{- if not .Values.secret.db.secretRef }}
{{- if not .Values.secret.db.password }}
{{- /*
  Fail fast on a missing self-managed Postgres password. The bundled-DB
  db-role-init sidecar applies this to the service login roles (authenticator,
  supabase_auth_admin, ...); an empty value makes 99-role-init.sql abort
*/ -}}
{{- fail "supabase: secret.db.password is required unless secret.db.secretRef is set. The bundled Postgres db-role-init sidecar needs it to set the service-role passwords; an empty value makes supabase auth/rest/realtime crashloop ('POSTGRES_PASSWORD is empty'). Set secret.db.password (or point secret.db.secretRef at an existing Secret)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.secret.db" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secret.db }}
{{- if $value }}
{{- if or (eq (typeOf $value) "string") (eq (typeOf $value) "numeric") }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- end }}
{{- end }}
  password_encoded: {{ .Values.secret.db.password | urlquery | b64enc }}
{{- end }}
