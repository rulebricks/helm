{{- /*
Realtime encryption secrets. SECRET_KEY_BASE signs/encrypts Realtime tokens;
DB_ENC_KEY (16 bytes) encrypts tenant DB credentials. Created from inline values
unless secret.realtime.secretRef points at a pre-created secret. Required when
Realtime is enabled and no secretRef is set - fail fast rather than ship a default.
*/ -}}
{{- if and .Values.realtime.enabled (not (and .Values.secret.realtime .Values.secret.realtime.secretRef)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.secret.realtime" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY_BASE: {{ .Values.secret.realtime.secretKeyBase | required "secret.realtime.secretKeyBase is required when realtime is enabled (or set secret.realtime.secretRef)" | b64enc }}
  DB_ENC_KEY: {{ .Values.secret.realtime.dbEncKey | required "secret.realtime.dbEncKey is required when realtime is enabled (or set secret.realtime.secretRef)" | b64enc }}
{{- end }}
