{{- if .Values.auth.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.auth.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  {{- if not .Values.auth.autoscaling.enabled }}
  replicas: {{ .Values.auth.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "supabase.auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.auth.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.auth.selectorLabels" . | nindent 8 }}
        {{- with .Values.auth.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.auth.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.auth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.auth.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-db
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: {{ include "supabase.db.host" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "username" "default" "username") }}
            - name: DB_PORT
              value: {{ include "supabase.db.port" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U $(DB_USER); do
              echo "Waiting for database to start..."
              sleep 2
              done
            - echo "Database is ready"
      containers:
        - name: {{ include "supabase.auth.name" $ }}
          securityContext:
            {{- toYaml .Values.auth.securityContext | nindent 12 }}
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          env:
            {{- /* 
              Environment variable rendering order:
              1. Values from auth.environment (skip computed keys to avoid duplicates)
              2. Computed URL values (with explicit override support)
              3. Secrets and other required values
              
              Keys that are computed: GOTRUE_SITE_URL, API_EXTERNAL_URL, GOTRUE_URI_ALLOW_LIST
              These can be overridden via auth.siteUrl, auth.externalUrl, auth.additionalRedirectUrls
            */ -}}
            {{- $computedKeys := list "GOTRUE_SITE_URL" "API_EXTERNAL_URL" "GOTRUE_URI_ALLOW_LIST" "GOTRUE_SMTP_HOST" "GOTRUE_SMTP_PORT" "GOTRUE_SMTP_ADMIN_EMAIL" "GOTRUE_SMTP_SENDER_NAME" "GOTRUE_MAILER_AUTOCONFIRM" "DB_HOST" "DB_PORT" -}}
            {{- range $key, $value := .Values.auth.environment }}
            {{- if not (has $key $computedKeys) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* URL configuration - explicit values take precedence over computed */ -}}
            {{- if .Values.global }}
            {{- if .Values.global.domain }}
            {{- $domain := .Values.global.domain }}
            {{- $protocol := ternary "https" "http" (eq (.Values.global.tlsEnabled | toString) "true") }}
            {{- /* GOTRUE_SITE_URL - check auth.environment first, then auth.siteUrl, then compute */ -}}
            {{- $siteUrl := index $.Values.auth.environment "GOTRUE_SITE_URL" | default (.Values.auth.siteUrl | default (printf "%s://%s" $protocol $domain)) }}
            - name: GOTRUE_SITE_URL
              value: {{ $siteUrl | quote }}
            {{- /* API_EXTERNAL_URL - check auth.environment first, then auth.externalUrl, then compute */ -}}
            {{- $externalUrl := index $.Values.auth.environment "API_EXTERNAL_URL" | default (.Values.auth.externalUrl | default (printf "%s://supabase.%s" $protocol $domain)) }}
            - name: API_EXTERNAL_URL
              value: {{ $externalUrl | quote }}
            {{- /* GOTRUE_URI_ALLOW_LIST - compute base list then add any additional URLs */ -}}
            {{- $baseAllowList := printf "%s://%s,%s://%s/*,%s://%s/auth/changepass,%s://%s/settings/password,%s://%s/dashboard" $protocol $domain $protocol $domain $protocol $domain $protocol $domain $protocol $domain }}
            {{- $allowList := $baseAllowList }}
            {{- if .Values.auth.additionalRedirectUrls }}
            {{- $allowList = printf "%s,%s" $baseAllowList (join "," .Values.auth.additionalRedirectUrls) }}
            {{- end }}
            {{- /* Allow complete override via auth.environment */ -}}
            {{- $allowList = index $.Values.auth.environment "GOTRUE_URI_ALLOW_LIST" | default $allowList }}
            - name: GOTRUE_URI_ALLOW_LIST
              value: {{ $allowList | quote }}
            {{- end }}
            {{- if .Values.global.smtp }}
            - name: GOTRUE_SMTP_HOST
              value: {{ .Values.global.smtp.host | quote }}
            - name: GOTRUE_SMTP_PORT
              value: {{ .Values.global.smtp.port | quote }}
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: {{ .Values.global.smtp.from | quote }}
            - name: GOTRUE_SMTP_SENDER_NAME
              value: {{ .Values.global.smtp.fromName | quote }}
            {{- end }}
            {{- /* Email customization from global.supabase.emails */ -}}
            {{- if .Values.global.supabase.emails }}
            {{- if .Values.global.supabase.emails.subjects }}
            - name: GOTRUE_MAILER_SUBJECTS_INVITE
              value: {{ .Values.global.supabase.emails.subjects.invite | quote }}
            - name: GOTRUE_MAILER_SUBJECTS_CONFIRMATION
              value: {{ .Values.global.supabase.emails.subjects.confirmation | quote }}
            - name: GOTRUE_MAILER_SUBJECTS_RECOVERY
              value: {{ .Values.global.supabase.emails.subjects.recovery | quote }}
            - name: GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE
              value: {{ .Values.global.supabase.emails.subjects.emailChange | quote }}
            {{- end }}
            {{- if .Values.global.supabase.emails.templates }}
            - name: GOTRUE_MAILER_TEMPLATES_INVITE
              value: {{ .Values.global.supabase.emails.templates.invite | quote }}
            - name: GOTRUE_MAILER_TEMPLATES_CONFIRMATION
              value: {{ .Values.global.supabase.emails.templates.confirmation | quote }}
            - name: GOTRUE_MAILER_TEMPLATES_RECOVERY
              value: {{ .Values.global.supabase.emails.templates.recovery | quote }}
            - name: GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE
              value: {{ .Values.global.supabase.emails.templates.emailChange | quote }}
            {{- end }}
            {{- end }}
            {{- /* SSO / External OIDC provider configuration from global.sso */ -}}
            {{- if and .Values.global.sso .Values.global.sso.enabled .Values.global.sso.provider }}
            {{- /*
              Map global.sso.provider to the GoTrue provider name (uppercased).
              Native: azure->AZURE, google->GOOGLE, keycloak->KEYCLOAK
              Mapped: okta->WORKOS, ory/other->KEYCLOAK (generic OIDC bridge)
            */ -}}
            {{- $ssoProvider := .Values.global.sso.provider }}
            {{- $nativeProviders := list "azure" "google" "keycloak" }}
            {{- if eq $ssoProvider "okta" }}
              {{- $ssoProvider = "workos" }}
            {{- else if not (has $ssoProvider $nativeProviders) }}
              {{- $ssoProvider = "keycloak" }}
            {{- end }}
            {{- $gotrueProvider := upper $ssoProvider }}
            {{- /* Secret name: use global.secrets.secretRef if provided, else release-name-sso */ -}}
            {{- $ssoSecretName := printf "%s-sso" .Release.Name }}
            {{- $ssoClientIdKey := "SSO_CLIENT_ID" }}
            {{- $ssoClientSecretKey := "SSO_CLIENT_SECRET" }}
            {{- if and .Values.global.secrets .Values.global.secrets.secretRef }}
              {{- $ssoSecretName = .Values.global.secrets.secretRef }}
              {{- if .Values.global.secrets.secretRefKeys }}
                {{- $ssoClientIdKey = .Values.global.secrets.secretRefKeys.ssoClientId | default "SSO_CLIENT_ID" }}
                {{- $ssoClientSecretKey = .Values.global.secrets.secretRefKeys.ssoClientSecret | default "SSO_CLIENT_SECRET" }}
              {{- end }}
            {{- end }}
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_ENABLED
              value: "true"
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $ssoSecretName }}
                  key: {{ $ssoClientIdKey }}
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $ssoSecretName }}
                  key: {{ $ssoClientSecretKey }}
            {{- $ssoProtocol := ternary "https" "http" (eq (.Values.global.tlsEnabled | toString) "true") }}
            {{- $ssoExternalUrl := index $.Values.auth.environment "API_EXTERNAL_URL" | default (.Values.auth.externalUrl | default (printf "%s://supabase.%s" $ssoProtocol .Values.global.domain)) }}
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_REDIRECT_URI
              value: {{ printf "%s/auth/v1/callback" $ssoExternalUrl | quote }}
            {{- /*
              Provider URL: native providers point GoTrue directly at the IdP.
              Custom providers (ory, other) route through the app's SSO proxy,
              which translates Keycloak-style OIDC paths to the actual IdP paths.
              The raw IdP URL is configured on the app pods as SSO_PROVIDER_URL.
            */ -}}
            {{- $isNativeProvider := has .Values.global.sso.provider (list "azure" "google" "keycloak") }}
            {{- if and .Values.global.sso.url $isNativeProvider }}
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_URL
              value: {{ .Values.global.sso.url | quote }}
            {{- else if not $isNativeProvider }}
            - name: GOTRUE_EXTERNAL_{{ $gotrueProvider }}_URL
              value: {{ printf "%s://%s/api/sso-proxy" $ssoProtocol .Values.global.domain | quote }}
            {{- end }}
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
            {{- else }}
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: {{ index .Values.auth.environment "GOTRUE_MAILER_AUTOCONFIRM" | default "false" | quote }}
            {{- end }}
            {{- end }}
            - name: DB_HOST
              value: {{ include "supabase.db.host" . | quote }}
            - name: DB_PORT
              value: {{ include "supabase.db.port" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "password" "default" "password") }}
            - name: DB_PASSWORD_ENC
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.encodedPasswordKey" . }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "database" "default" "database") }}
            - name: GOTRUE_DB_DATABASE_URL
              value: $(DB_DRIVER)://$(DB_USER):$(DB_PASSWORD_ENC)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?search_path=auth&sslmode=$(DB_SSL)
            - name: GOTRUE_DB_DRIVER
              value: $(DB_DRIVER)
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.secret | default "secret" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: secret
                  {{- end }}
            - name: GOTRUE_SMTP_USER
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.smtp.secretRef }}
                  name: {{ .Values.secret.smtp.secretRef }}
                  key: {{ .Values.secret.smtp.secretRefKey.username | default "username" }}
                  {{- else }}
                  name: {{ include "supabase.secret.smtp" . }}
                  key: username
                  {{- end }}
            - name: GOTRUE_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.smtp.secretRef }}
                  name: {{ .Values.secret.smtp.secretRef }}
                  key: {{ .Values.secret.smtp.secretRefKey.password | default "password" }}
                  {{- else }}
                  name: {{ include "supabase.secret.smtp" . }}
                  key: password
                  {{- end }}
          {{- with .Values.auth.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auth.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auth.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 9999
              protocol: TCP
          {{- with .Values.auth.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auth.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.auth.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auth.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auth.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auth.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}