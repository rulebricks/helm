{{- if and .Values.db.enabled (not .Values.externalDatabase.enabled) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "supabase.fullname" . }}-test-db
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              pg_isready -h $(DB_HOST) -p $(DB_PORT) -U $(DB_USER) || $(echo "\e[0;31mFailed to connect to the database." && exit 1)
              echo "Database is ready"
          env:
            {{- include "supabase.db.hostEnv" . | nindent 12 }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "username" "default" "username") }}
            {{- include "supabase.db.portEnv" . | nindent 12 }}
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.global.images.postgres17 "name" "postgres17") | quote }}
          imagePullPolicy: IfNotPresent
          name: test-db
      restartPolicy: Never
{{- end }}
