{{- if .Values.studio.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.studio.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  {{- if not .Values.studio.autoscaling.enabled }}
  replicas: {{ .Values.studio.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "supabase.studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.studio.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.studio.selectorLabels" . | nindent 8 }}
        {{- with .Values.studio.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.studio.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.studio.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.studio.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "supabase.studio.name" $ }}
          securityContext:
            {{- toYaml .Values.studio.securityContext | nindent 12 }}
          image: {{ include "supabase.image" (dict "root" $ "image" .Values.studio.image "name" "supabase-studio") | quote }}
          imagePullPolicy: {{ .Values.studio.image.pullPolicy }}
          env:
            {{- /* Chart-managed names below; skipped here so user-supplied
                   studio.environment entries can never duplicate them. */}}
            {{- $studioSkipKeys := list "SUPABASE_PUBLIC_URL" "DB_HOST" "DB_PORT" "POSTGRES_HOST" "POSTGRES_PORT" "POSTGRES_DB" }}
            {{- range $key, $value := .Values.studio.environment }}
            {{- if not (has $key $studioSkipKeys) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Override SUPABASE_PUBLIC_URL with global.domain and global.tlsEnabled */ -}}
            {{- if .Values.global }}
            {{- if .Values.global.domain }}
            {{- $protocol := ternary "https" "http" (eq (.Values.global.tlsEnabled | toString) "true") }}
            - name: SUPABASE_PUBLIC_URL
              value: {{ printf "%s://supabase.%s" $protocol .Values.global.domain | quote }}
            {{- else }}
            - name: SUPABASE_PUBLIC_URL
              value: {{ .Values.studio.environment.SUPABASE_PUBLIC_URL | default "http://localhost" | quote }}
            {{- end }}
            {{- else }}
            - name: SUPABASE_PUBLIC_URL
              value: {{ .Values.studio.environment.SUPABASE_PUBLIC_URL | default "http://localhost" | quote }}
            {{- end }}
            {{- if .Values.kong.enabled }}
            - name: SUPABASE_URL
              value: http://{{ include "supabase.kong.fullname" . }}:{{ .Values.kong.service.port }}
            {{- end }}
            {{- if .Values.meta.enabled }}
            - name: STUDIO_PG_META_URL
              value: http://{{ include "supabase.meta.fullname" . }}:{{ .Values.meta.service.port }}
            {{- end }}
            {{- /*
              Studio's Default-Project connection (the SQL/Table editor /query
              path) connects to the DB as the admin role using POSTGRES_PASSWORD.
              Upstream's docker-compose sets this on the studio service; the chart
              must too, or the Table Editor fails with "password authentication
              failed for user supabase_admin". Sourced from the same db Secret
              every other service uses, so it matches the role passwords.
            */}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Resolved via the shared helper so externalDatabase.secretRef
                  # takes precedence, matching every other Supabase component.
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "password" "default" "password") }}
            {{- /*
              Studio builds its default-project connection string as
              postgresql://<user>:<POSTGRES_PASSWORD>@<POSTGRES_HOST>:<POSTGRES_PORT>/<POSTGRES_DB>
              and falls back to the upstream docker-compose host "db" when unset.
              The db ExternalName alias makes that fallback resolve, but a TLS
              server certificate can never match the alias name, so hostname
              verification breaks against managed databases. Point Studio at the
              REAL resolved host (secret-ref aware, same source as every other
              component) so the connection string it hands postgres-meta is
              verifiable end to end.
            */}}
            {{- include "supabase.db.hostEnv" . | nindent 12 }}
            {{- include "supabase.db.portEnv" . | nindent 12 }}
            - name: POSTGRES_HOST
              value: $(DB_HOST)
            - name: POSTGRES_PORT
              value: $(DB_PORT)
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.db.secretName" . }}
                  key: {{ include "supabase.db.secretKey" (dict "root" . "field" "database" "default" "database") }}
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.anonKey | default "anonKey" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: anonKey
                  {{- end }}
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secret.jwt.secretRef }}
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.serviceKey | default "serviceKey" }}
                  {{- else }}
                  name: {{ include "supabase.secret.jwt" . }}
                  key: serviceKey
                  {{- end }}
          {{- with .Values.studio.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.studio.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.studio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.studio.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.studio.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}