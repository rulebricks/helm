{{- /*
  CA bundle for TLS to the external managed database (externalDatabase.sslRootCert).
  Consumed by postgres-meta as PG_META_DB_SSL_ROOT_CERT: that env is the ONLY way
  meta encrypts the per-request connections Studio's Table/SQL editor sends (their
  connection strings carry no sslmode, and meta's DEFAULT_POOL_CONFIG.ssl is unset
  without a root cert), so without it Studio fails against force-TLS servers (RDS
  Postgres 15+) with pg_hba "no encryption" rejections.
*/ -}}
{{- if and .Values.externalDatabase .Values.externalDatabase.enabled .Values.externalDatabase.sslRootCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.fullname" . }}-db-ca
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.pem: |
    {{- .Values.externalDatabase.sslRootCert | nindent 4 }}
{{- end }}
