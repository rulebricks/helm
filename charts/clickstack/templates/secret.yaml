{{- if and .Values.enabled .Values.ferretdb.enabled (not .Values.ferretdb.auth.existingSecret) -}}
{{- $name := include "clickstack.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingPassword := "" -}}
{{- if and $existing $existing.data -}}
{{- $existingPassword = (index $existing.data "ferretdb-password" | default "") -}}
{{- end -}}
{{- $password := .Values.ferretdb.auth.password | default (ternary ($existingPassword | b64dec) (randAlphaNum 32) (ne $existingPassword "")) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  ferretdb-password: {{ $password | quote }}
  ferretdb-postgresql-url: {{ printf "postgres://%s:%s@127.0.0.1:5432/postgres" (.Values.ferretdb.auth.username | default "hyperdx") $password | quote }}
{{- end }}
