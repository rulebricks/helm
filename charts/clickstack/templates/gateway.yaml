{{- $retentionDays := .Values.clickhouse.retentionDays | default 7 | int -}}
{{- $derivedTtl := printf "%dh" (mul $retentionDays 24) -}}
{{- $ttl := .Values.clickhouse.ttl | default $derivedTtl -}}
{{- $filters := .Values.collector.filters | default dict -}}
{{- $traceFilters := get $filters "traces" | default dict -}}
{{- $logFilters := get $filters "logs" | default dict -}}
{{- $traceAllow := get $traceFilters "httpPathAllowRegex" | default "" -}}
{{- $traceDeny := get $traceFilters "httpPathDenyRegex" | default "" -}}
{{- $logDeny := get $logFilters "bodyDenyRegex" | default "" -}}
{{- $traceFilterEnabled := or (ne $traceAllow "") (ne $traceDeny "") -}}
{{- $logFilterEnabled := ne $logDeny "" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickstack.collector.gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-gateway
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14317
          http:
            endpoint: 0.0.0.0:14318
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
          - DiskPressure
          - PIDPressure
        allocatable_types_to_report:
          - cpu
          - memory
          - storage
      prometheus/rulebricks:
        config:
          scrape_configs:
            - job_name: rulebricks-app
              metrics_path: /api/metrics
              static_configs:
                - targets:
                    - {{ printf "%s.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 80 | quote }}
            - job_name: rulebricks-hps
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "%s-hps.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 80 | quote }}
            - job_name: rulebricks-hps-worker
              metrics_path: /metrics
              dns_sd_configs:
                - names:
                    - {{ printf "%s-hps-worker.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
                  type: A
                  port: 3000
            - job_name: kube-state-metrics
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "%s-kube-state-metrics.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 8080 | quote }}
            - job_name: kafka-exporter
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "%s-kafka-exporter.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 9308 | quote }}
            - job_name: kafka-jmx
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "%s-kafka-jmx-metrics.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 5556 | quote }}
            - job_name: redis-exporter
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "%s-redis-exporter.%s.svc.cluster.local:%d" .Release.Name .Release.Namespace 9121 | quote }}
            - job_name: keda-operator
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "keda-operator.%s.svc.cluster.local:%d" .Release.Namespace 9666 | quote }}
            - job_name: keda-metrics-apiserver
              metrics_path: /metrics
              static_configs:
                - targets:
                    - {{ printf "keda-operator-metrics-apiserver.%s.svc.cluster.local:%d" .Release.Namespace 8080 | quote }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.collector.memoryLimitMiB | default 800 }}
        spike_limit_mib: {{ div (.Values.collector.memoryLimitMiB | default 800 | int) 4 }}
{{- if or $traceFilterEnabled $logFilterEnabled }}
      {{- /* Telemetry noise controls (collector.filters values). Each OTTL
           condition DROPS matching data. Span rules only look at HTTP server
           path attributes (http.route / http.target / url.path), so internal
           spans - Kafka publishes, worker execution, DB calls - always pass
           and /api/v1 trace trees stay intact. error_mode ignore: a condition
           that errors (nil attribute, non-string body) keeps the data. */}}
      filter/noise:
        error_mode: ignore
{{- if $traceFilterEnabled }}
        traces:
          span:
{{- if $traceDeny }}
            - attributes["http.route"] != nil and IsMatch(attributes["http.route"], "{{ $traceDeny }}")
            - attributes["http.target"] != nil and IsMatch(attributes["http.target"], "{{ $traceDeny }}")
            - attributes["url.path"] != nil and IsMatch(attributes["url.path"], "{{ $traceDeny }}")
{{- end }}
{{- if $traceAllow }}
            - attributes["http.route"] != nil and not IsMatch(attributes["http.route"], "{{ $traceAllow }}")
            - attributes["http.target"] != nil and not IsMatch(attributes["http.target"], "{{ $traceAllow }}")
            - attributes["url.path"] != nil and not IsMatch(attributes["url.path"], "{{ $traceAllow }}")
{{- end }}
{{- end }}
{{- if $logFilterEnabled }}
        logs:
          log_record:
            - body != nil and IsMatch(body, "{{ $logDeny }}")
{{- end }}
{{- end }}
      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Release.Namespace | quote }}
            action: upsert
          - key: k8s.cluster.namespace
            value: {{ .Release.Namespace | quote }}
            action: upsert
          - key: rulebricks.observability.backend
            value: clickstack
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      clickhouse:
        endpoint: ${env:CLICKHOUSE_NATIVE_ENDPOINT}
        database: ${env:HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE}
        username: ${env:CLICKHOUSE_USER}
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: {{ .Values.clickhouse.createSchema | default true }}
        ttl: {{ $ttl | quote }}
        logs_table_name: {{ .Values.clickhouse.logsTableName | default "otel_logs" | quote }}
        traces_table_name: {{ .Values.clickhouse.tracesTableName | default "otel_traces" | quote }}
        metrics_tables:
          gauge:
            name: {{ .Values.clickhouse.metricsTables.gauge | default "otel_metrics_gauge" | quote }}
          sum:
            name: {{ .Values.clickhouse.metricsTables.sum | default "otel_metrics_sum" | quote }}
          summary:
            name: {{ .Values.clickhouse.metricsTables.summary | default "otel_metrics_summary" | quote }}
          histogram:
            name: {{ .Values.clickhouse.metricsTables.histogram | default "otel_metrics_histogram" | quote }}
          exponential_histogram:
            name: {{ .Values.clickhouse.metricsTables.exponentialHistogram | default "otel_metrics_exp_histogram" | quote }}
        async_insert: true
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000
      debug:
        verbosity: basic
    extensions:
      # Liveness/readiness target for the collector (ClickStack distro ships this).
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces/rulebricks:
          receivers: [otlp]
          processors: [memory_limiter{{ if $traceFilterEnabled }}, filter/noise{{ end }}, resource, batch]
          exporters: [clickhouse]
        logs/rulebricks:
          receivers: [otlp]
          processors: [memory_limiter{{ if $logFilterEnabled }}, filter/noise{{ end }}, resource, batch]
          exporters: [clickhouse]
        metrics/rulebricks:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [clickhouse]
        metrics/rulebricks-prometheus:
          receivers: [prometheus/rulebricks]
          processors: [memory_limiter, resource, batch]
          exporters: [clickhouse]
        metrics/k8s-cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource, batch]
          exporters: [clickhouse]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickstack.collector.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector-gateway
spec:
  type: ClusterIP
  selector:
    {{- include "clickstack.collector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clickstack.collector.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: collector-gateway
spec:
  replicas: {{ .Values.collector.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "clickstack.collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector-gateway
  template:
    metadata:
      labels:
        {{- with .Values.collector.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "clickstack.collector.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector-gateway
      annotations:
        {{- with .Values.collector.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "clickstack.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ include "clickstack.image" (dict "root" $ "image" .Values.collector.image "name" "clickstack-otel-collector") | quote }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 14317
            - name: otlp-http
              containerPort: 14318
            - name: healthcheck
              containerPort: 13133
          env:
            - name: CUSTOM_OTELCOL_CONFIG_FILE
              value: /etc/otelcol/config.yaml
            - name: CLICKHOUSE_ENDPOINT
              value: {{ include "clickstack.clickhouse.httpEndpoint" . | quote }}
            - name: CLICKHOUSE_NATIVE_ENDPOINT
              value: {{ include "clickstack.clickhouse.nativeEndpoint" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickstack.clickhouse.passwordSecretName" . }}
                  key: {{ .Values.clickhouse.existingSecretKey | default "admin-password" }}
            - name: HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | default "otel" | quote }}
            - name: HYPERDX_LOG_LEVEL
              value: {{ .Values.hyperdx.logLevel | default "info" | quote }}
            - name: OPAMP_SERVER_URL
              value: {{ printf "http://%s:%d" (include "clickstack.hyperdx.fullname" .) (int .Values.hyperdx.ports.opamp) | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.collector.gateway.resources | nindent 12 }}
          {{- with .Values.collector.gateway.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.collector.gateway.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.collector.gateway.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "clickstack.collector.gateway.fullname" . }}-config
