{{- if and .Values.hyperdx.enabled .Values.hyperdx.ingress.enabled (eq (.Values.hyperdx.ingress.type | default "ingress") "gateway-api") -}}
{{- $name := include "clickstack.hyperdx.fullname" . -}}
{{- $ingress := .Values.hyperdx.ingress | default dict -}}
{{- $gateway := $ingress.gatewayApi | default dict -}}
{{- $hostname := $ingress.hostname | default (printf "observability.%s" .Values.global.domain) -}}
{{- if not $gateway.gatewayName }}
{{- fail "hyperdx.ingress.gatewayApi.gatewayName is required when using gateway-api ingress type" }}
{{- end }}
{{- if not $hostname }}
{{- fail "hyperdx.ingress.hostname or global.domain is required when HyperDX ingress is enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hyperdx
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gateway.gatewayName }}
      {{- with $gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: {{ ternary "Exact" "PathPrefix" (eq ($ingress.pathType | default "Prefix") "Exact") }}
            value: {{ $ingress.path | default "/" | quote }}
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.hyperdx.ports.app }}
{{- end }}
