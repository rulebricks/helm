{{- /*
FerretDB's volumeClaimTemplates previously included the chart's version label.
Because volumeClaimTemplates are immutable, changing the ClickStack appVersion
made StatefulSet upgrades fail. Orphan-delete the StatefulSet before upgrades
so Helm can recreate it with stable claim-template metadata. The existing pod
and PVC remain in place and are adopted by the replacement StatefulSet.
*/ -}}
{{- if .Values.ferretdb.enabled }}
{{- $statefulSet := include "clickstack.ferretdb.fullname" . }}
{{- $name := printf "%s-sts-fix" $statefulSet | trunc 63 | trimSuffix "-" }}
{{- $kubectl := required "global.images.kubectl is required" .Values.global.images.kubectl }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ferretdb-sts-fix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ferretdb-sts-fix
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $statefulSet | quote }}]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ferretdb-sts-fix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ferretdb-sts-fix
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ferretdb-sts-fix
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $sched := .Values.global.scheduling | default dict }}
      {{- with $sched.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sched.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sched.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: recreate-statefulset
          image: {{ include "clickstack.image" (dict "root" $ "image" $kubectl "name" "kubectl") | quote }}
          imagePullPolicy: IfNotPresent
          command: ["kubectl"]
          args:
            - delete
            - statefulset
            - {{ $statefulSet }}
            - --namespace={{ .Release.Namespace }}
            - --cascade=orphan
            - --ignore-not-found=true
            - --wait=true
            - --timeout=60s
{{- end }}
