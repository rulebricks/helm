{{- if .Values.collector.agent.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickstack.collector.agent.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-agent
data:
  config.yaml: |
    receivers:
      filelog:
        include:
          {{- range .Values.collector.agent.filelog.include }}
          - {{ . | quote }}
          {{- end }}
        exclude:
          {{- range .Values.collector.agent.filelog.exclude }}
          - {{ . | quote }}
          {{- end }}
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          load: {}
          network: {}
      kubeletstats:
        collection_interval: {{ .Values.collector.agent.kubeletstats.collectionInterval | default "30s" }}
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.container.name
            - k8s.node.name
          labels:
            - tag_name: service.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: k8s.app.component
              key: app.kubernetes.io/component
              from: pod
      transform/service_name:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil or attributes["service.name"] == ""
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil or attributes["service.name"] == ""
      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Release.Namespace | quote }}
            action: upsert
          - key: k8s.cluster.namespace
            value: {{ .Release.Namespace | quote }}
            action: upsert
          - key: rulebricks.observability.backend
            value: clickstack
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp:
        endpoint: {{ printf "%s.%s.svc.cluster.local:4317" (include "clickstack.collector.gateway.fullname" .) .Release.Namespace | quote }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
    extensions:
      # Liveness/readiness target for the collector (ClickStack distro ships this).
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, transform/service_name, resource, batch]
          exporters: [otlp]
        metrics/k8s:
          receivers: [hostmetrics, kubeletstats]
          processors: [k8sattributes, transform/service_name, resource, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "clickstack.collector.agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector-agent
spec:
  selector:
    matchLabels:
      {{- include "clickstack.collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector-agent
  template:
    metadata:
      labels:
        {{- with .Values.collector.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "clickstack.collector.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector-agent
      annotations:
        {{- with .Values.collector.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "clickstack.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ include "clickstack.image" (dict "root" $ "image" .Values.collector.image "name" "clickstack-otel-collector") | quote }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          {{- with .Values.collector.agent.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: healthcheck
              containerPort: 13133
              protocol: TCP
          env:
            - name: CUSTOM_OTELCOL_CONFIG_FILE
              value: /etc/otelcol/config.yaml
            - name: OPAMP_SERVER_URL
              value: {{ printf "http://%s:%d" (include "clickstack.hyperdx.fullname" .) (int .Values.hyperdx.ports.opamp) | quote }}
            - name: CLICKHOUSE_ENDPOINT
              value: {{ include "clickstack.clickhouse.httpEndpoint" . | quote }}
            - name: CLICKHOUSE_NATIVE_ENDPOINT
              value: {{ include "clickstack.clickhouse.nativeEndpoint" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickstack.clickhouse.passwordSecretName" . }}
                  key: {{ .Values.clickhouse.existingSecretKey | default "admin-password" }}
            - name: HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | default "otel" | quote }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            {{- toYaml .Values.collector.agent.resources | nindent 12 }}
          {{- with .Values.collector.agent.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.collector.agent.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.collector.agent.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "clickstack.collector.agent.fullname" . }}-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}
