nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  domain: ""
  tlsEnabled: false
  externalDnsEnabled: false
  version: ""
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Standalone-install fallback; the parent stack chart overrides this via its
  # own global.images (and global.imageDigests pins the digest).
  images:
    busybox: { registry: docker.io, repository: rulebricks/busybox, tag: "1.38.0-alpine" }

clickhouse:
  database: otel
  endpoint: ""
  nativeEndpoint: ""
  username: rulebricks
  existingSecret: ""
  existingSecretKey: admin-password
  createSchema: true
  # Operator-facing retention window for ClickStack operational telemetry.
  # The chart converts this to the ClickHouse exporter TTL (days * 24h).
  retentionDays: 7
  # Advanced override. Leave empty to derive from retentionDays.
  ttl: ""
  logsTableName: otel_logs
  tracesTableName: otel_traces
  metricsTables:
    gauge: otel_metrics_gauge
    sum: otel_metrics_sum
    summary: otel_metrics_summary
    histogram: otel_metrics_histogram
    exponentialHistogram: otel_metrics_exp_histogram

hyperdx:
  enabled: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: rulebricks/hyperdx
    tag: "2.31.0"
    pullPolicy: IfNotPresent
  ports:
    app: 8080
    api: 8000
    opamp: 4320
  logLevel: info
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podLabels:
    rulebricks.com/workload-group: infrastructure
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Health probes (override or set to {} to disable). HyperDX serves its UI/API on
  # the "http" port; a TCP check is a safe default that satisfies cluster policies
  # requiring liveness + readiness.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  startupProbe: {}
  env: []
  ingress:
    enabled: true
    type: "ingress" # "ingress" or "gateway-api"
    className: traefik
    hostname: ""
    path: /
    pathType: Prefix
    annotations: {}
    allowedIPs: []
    gatewayApi:
      gatewayName: ""
      gatewayNamespace: ""
      sectionName: ""
    tls:
      enabled: ""

collector:
  image:
    registry: docker.io
    repository: rulebricks/clickstack-otel-collector
    tag: "2.31.0-r1"
    pullPolicy: IfNotPresent
  memoryLimitMiB: 800
  gateway:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    podLabels:
      rulebricks.com/workload-group: infrastructure
    podAnnotations: {}
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Health probes (override or set to {} to disable). Backed by the collector's
    # health_check extension on the "healthcheck" port (13133).
    livenessProbe:
      httpGet:
        path: /
        port: healthcheck
      initialDelaySeconds: 15
      periodSeconds: 15
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /
        port: healthcheck
      initialDelaySeconds: 10
      periodSeconds: 10
    startupProbe: {}
  agent:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podLabels:
      rulebricks.com/workload-group: infrastructure
    podAnnotations: {}
    nodeSelector: {}
    tolerations:
      - key: rulebricks.com/pool
        operator: Equal
        value: burst
        effect: NoSchedule
    affinity: {}
    # Health probes (override or set to {} to disable). Backed by the collector's
    # health_check extension on the "healthcheck" port (13133).
    livenessProbe:
      httpGet:
        path: /
        port: healthcheck
      initialDelaySeconds: 15
      periodSeconds: 15
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /
        port: healthcheck
      initialDelaySeconds: 10
      periodSeconds: 10
    startupProbe: {}
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        - /var/log/pods/*/clickstack-collector-agent/*.log
        - /var/log/pods/*/clickstack-collector-gateway/*.log
    kubeletstats:
      collectionInterval: 30s

ferretdb:
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/ferretdb
    tag: "2.7.0-r1"
    pullPolicy: IfNotPresent
  postgresImage:
    registry: docker.io
    repository: rulebricks/postgres-documentdb
    tag: "17-0.107.0-ferretdb-2.7.0-r1"
    pullPolicy: IfNotPresent
  auth:
    username: hyperdx
    password: ""
    existingSecret: ""
    existingSecretKey: password
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  resources:
    ferretdb:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    postgres:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  # Health probes (override or set to {} to disable). FerretDB exposes the
  # Mongo-compatible listener on "mongo"; the bundled postgres sidecar uses
  # pg_isready for readiness and a TCP liveness check on "postgres".
  livenessProbe:
    tcpSocket:
      port: mongo
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: mongo
    initialDelaySeconds: 10
    periodSeconds: 10
  startupProbe: {}
  postgres:
    livenessProbe:
      tcpSocket:
        port: postgres
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 6
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -ec
          - pg_isready -U "$POSTGRES_USER" -d postgres
      initialDelaySeconds: 10
      periodSeconds: 10
    startupProbe: {}
  podLabels:
    rulebricks.com/workload-group: infrastructure
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  nodeSelector: {}
  tolerations: []
  affinity: {}
