{{- $domain := .Values.global.domain | default "localhost" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rulebricks-chart.app.configmap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
data:
  {{- /* App always expects HTTPS - no dependency on global.tlsEnabled */ -}}
  {{- $protocol := "https" }}
  {{- $tlsEnabled := eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
  {{- $routerEntrypoint := ternary "websecure" "web" $tlsEnabled }}
  PROTOCOL: "https"
  DOMAIN_NAME: {{ $domain | quote }}
  ROUTER_ENTRYPOINT: {{ $routerEntrypoint | quote }}
  # Supabase configuration (non-sensitive)
  # - Self-hosted (supabase.enabled: true): URL derived from global.domain
  # - External (supabase.enabled: false): URL from global.supabase.url
  # Note: Sensitive keys (anonKey, serviceKey) are stored in the app secret
  {{- $supabaseAnonKey := "" }}
  {{- $supabaseUrl := "" }}
  {{- if and .Values.global .Values.global.supabase }}
    {{- $supabaseAnonKey = .Values.global.supabase.anonKey | default "" }}
    {{- /* Check if external Supabase URL is explicitly provided */ -}}
    {{- if .Values.global.supabase.url }}
      {{- $supabaseUrl = .Values.global.supabase.url }}
    {{- end }}
  {{- end }}
  {{- /* If no explicit URL, derive public URL from global.domain (self-hosted) */ -}}
  {{- if not $supabaseUrl }}
    {{- $supabaseUrl = printf "%s://supabase.%s" $protocol $domain }}
  {{- end }}
  {{- /* The browser Supabase client authenticates every request to the Kong
       gateway with this key (the `apikey` header); without it, every
       dashboard -> PostgREST call 401s even though server-side calls (which
       use the service key from the app Secret) keep working. It is consumed
       here at TEMPLATE time, so global.secrets.secretRef cannot supply it -
       require an inline value or the runtime global.supabase.secretRef seam. */ -}}
  {{- $anonKeyRefName := "" }}
  {{- if and .Values.global .Values.global.supabase }}
    {{- $anonKeyRefName = .Values.global.supabase.secretRef | default "" }}
  {{- end }}
  {{- if and (not $supabaseAnonKey) (not $anonKeyRefName) }}
    {{- fail "global.supabase.anonKey is required: it is the PUBLIC Supabase key the browser sends to the API gateway, and the app ConfigMap embeds it at template time (global.secrets.secretRef cannot supply it). Set global.supabase.anonKey inline (derive it from jwtSecret, see values.yaml), or set global.supabase.secretRef to an existing Secret carrying it (key per global.supabase.secretRefKey.anonKey, default 'anonKey')." }}
  {{- end }}
  # Public key is safe for ConfigMap (embedded in client bundle for Next.js)
  SUPABASE_PUBLIC_KEY: {{ $supabaseAnonKey | quote }}
  SUPABASE_URL: {{ $supabaseUrl | quote }}
  NEXT_PUBLIC_EMAIL: {{ .Values.global.email | default .Values.app.email | default "" | quote }}
  NEXT_PUBLIC_PROTOCOL: "https"
  NEXT_PUBLIC_DOMAIN_NAME: {{ $domain | quote }}
  {{- /* The app image bakes __NEXT_PUBLIC_APP_URL__ placeholders at build
       time and its entrypoint substitutes them from this env var. Newer app
       releases build auth redirect URLs (e.g. the admin-invite accept link)
       from it, so without it invite emails carry a literal
       __NEXT_PUBLIC_APP_URL__ and are unusable. */}}
  APP_URL: {{ printf "%s://%s" $protocol $domain | quote }}
  NEXT_PUBLIC_APP_URL: {{ printf "%s://%s" $protocol $domain | quote }}
  NEXT_PUBLIC_SUPABASE_URL: {{ $supabaseUrl | quote }}
  NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: {{ $supabaseAnonKey | quote }}
  SELF_HOSTED: "1"
  NEXT_PUBLIC_SELF_HOSTED: "1"
  NEXT_PUBLIC_SANITY_PROJECT_ID: "0tthc473"
  SANITY_PROJECT_ID: "0tthc473"
  SANITY_API_DATASET: "production"
  {{- if .Values.redis.enabled }}
  # Redis-compatible HTTP service - using templated service name
  KV_REST_API_URL: {{ printf "http://%s.%s.svc.cluster.local" (include "rulebricks-chart.serverless-redis-http.fullname" .) .Release.Namespace | quote }}
  KV_REST_API_TOKEN: "local_redis"
  # Raw redis:// URL for direct Valkey/Redis-compatible clients
  REDIS_URL: {{ printf "redis://%s.%s.svc.cluster.local:6379" (include "rulebricks-chart.redis.fullname" .) .Release.Namespace | quote }}
  {{- else }}
  # Redis-compatible HTTP API settings (internal bridge or external HTTP API)
  KV_REST_API_URL: {{ include "rulebricks-chart.redis.httpUrl" . | quote }}
  KV_REST_API_TOKEN: {{ include "rulebricks-chart.redis.httpToken" . | quote }}
  # Raw redis:// URL for direct Valkey/Redis-compatible clients
  REDIS_URL: {{ include "rulebricks-chart.redis.connectionString" . | quote }}
  {{- end }}
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  # SMTP configuration (non-sensitive only - credentials are in the app secret)
  {{- if .Values.global.smtp }}
  SMTP_HOST: {{ .Values.global.smtp.host | default "" | quote }}
  SMTP_PORT: {{ .Values.global.smtp.port | default "" | quote }}
  SMTP_FROM: {{ .Values.global.smtp.from | default "" | quote }}
  SMTP_FROM_NAME: {{ .Values.global.smtp.fromName | default "" | quote }}
  {{- else if .Values.app.smtp }}
  SMTP_HOST: {{ .Values.app.smtp.host | default "" | quote }}
  SMTP_PORT: {{ .Values.app.smtp.port | default "" | quote }}
  SMTP_FROM: {{ .Values.app.smtp.from | default "" | quote }}
  SMTP_FROM_NAME: {{ .Values.app.smtp.fromName | default "" | quote }}
  {{- end }}
  # Kafka topic namespace prefix. Emitted unconditionally because HPS applies it
  # to all topics (including the always-on solution work topics), independent of
  # whether decision logging is enabled.
  KAFKA_TOPIC_PREFIX: {{ include "rulebricks-chart.kafka.topicPrefix" . | quote }}
  # Kafka/Logging configuration
  {{- if .Values.app.logging }}
  {{- if .Values.app.logging.enabled }}
  KAFKA_ENABLED: "1"
  # Kafka brokers - use templated URL if not explicitly set
  {{- $kafkaBrokers := .Values.app.logging.kafkaBrokers | default (include "rulebricks-chart.kafka.bootstrapServers" .) }}
  KAFKA_BROKERS: {{ $kafkaBrokers | quote }}
  KAFKA_TOPIC: {{ .Values.app.logging.kafkaTopic | default "logs" | quote }}
  KAFKA_SSL: {{ ternary "true" "false" (.Values.app.logging.kafkaSsl | default false) | quote }}
  {{- with .Values.app.logging.kafkaSasl }}
  {{- with .mechanism }}
  KAFKA_SASL_MECHANISM: {{ . | quote }}
  {{- end }}
  {{- with .region }}
  KAFKA_SASL_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  LOG_QUERY_BACKEND: "clickhouse_oss"
  NEXT_PUBLIC_LOG_QUERY_BACKEND: "clickhouse_oss"
  CLICKHOUSE_URL: {{ printf "http://%s-clickhouse.%s.svc.cluster.local:8123" .Release.Name .Release.Namespace | quote }}
  CLICKHOUSE_USER: "rulebricks"
  CLICKHOUSE_DATABASE: "rulebricks"
  {{- end }}
  {{- end }}
  # Enterprise SSO Configuration
  # Tells the frontend which provider is configured and enables SSO login flow
  {{- if and .Values.global .Values.global.sso .Values.global.sso.enabled .Values.global.sso.provider }}
  SSO_ENABLED: "1"
  {{- /* Map provider to Supabase provider name */ -}}
  {{- $provider := .Values.global.sso.provider }}
  {{- $nativeProviders := list "azure" "google" "okta" "keycloak" }}
  {{- $isNative := has $provider $nativeProviders }}
  {{- /* Okta uses WorkOS, custom providers use Keycloak as OIDC handler */ -}}
  {{- $ssoProvider := $provider }}
  {{- if eq $provider "okta" }}
    {{- $ssoProvider = "workos" }}
  {{- else if not $isNative }}
    {{- $ssoProvider = "keycloak" }}
  {{- end }}
  NEXT_PUBLIC_SSO_PROVIDER: {{ $ssoProvider | quote }}
  # Raw provider name for app proxy logic (ory, azure, etc.)
  SSO_PROVIDER: {{ $provider | quote }}
  {{- if .Values.global.sso.url }}
  # IdP URL for app's built-in OIDC proxy (used for custom providers)
  SSO_PROVIDER_URL: {{ .Values.global.sso.url | quote }}
  {{- end }}
  {{- end }}
  # External Authentication (Token Passthrough) - non-sensitive env
  {{- if and .Values.global .Values.global.externalAuth .Values.global.externalAuth.enabled }}
  EXTERNAL_AUTH_TOKEN_PASSTHROUGH: "true"
  NEXT_PUBLIC_EXTERNAL_AUTH_TOKEN_PASSTHROUGH: "true"
  {{- with .Values.global.externalAuth.header }}
  EXTERNAL_AUTH_HEADER: {{ . | quote }}
  {{- end }}
  {{- if .Values.global.externalAuth.claims }}
  {{- with .Values.global.externalAuth.claims.id }}
  EXTERNAL_AUTH_CLAIM_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.global.externalAuth.claims.email }}
  EXTERNAL_AUTH_CLAIM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.global.externalAuth.claims.name }}
  EXTERNAL_AUTH_CLAIM_NAME: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.global.externalAuth.publicPaths }}
  EXTERNAL_AUTH_PUBLIC_PATHS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}