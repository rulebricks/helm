{{- $cache := .Values.cache | default dict -}}
{{- $admin := $cache.valkeyAdmin | default dict -}}
{{- if $admin.enabled }}
{{- $name := include "rulebricks-chart.valkeyAdmin.fullname" . -}}
{{- $image := $admin.image | default dict -}}
{{- $service := $admin.service | default dict -}}
{{- $resources := $admin.resources | default dict -}}
{{- $servicePort := ($service.port | default 8080) -}}
{{- $ingress := $admin.ingress | default dict -}}
{{- $isTraefikIngress := and (eq ($admin.exposure | default "internal") "ingress") $ingress.enabled (ne ($ingress.type | default "ingress") "gateway-api") -}}
{{- $basicAuth := $ingress.basicAuth | default dict -}}
{{- $basicAuthSecret := $basicAuth.existingSecret | default (printf "%s-basic-auth" $name) -}}
{{- $cacheHost := ternary (include "rulebricks-chart.redis.fullname" .) (((.Values.redis.external | default dict).host) | default "" | toString) .Values.redis.enabled -}}
{{- $cachePort := ternary "6379" ((((.Values.redis.external | default dict).port) | default 6379) | toString) .Values.redis.enabled -}}
{{- $cacheTls := ternary "true" "false" (and (not .Values.redis.enabled) .Values.redis.external .Values.redis.external.tls .Values.redis.external.tls.enabled) -}}
{{- $cacheHasAuth := eq (include "rulebricks-chart.redis.hasAuth" .) "true" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-ui-preseed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
data:
  # Injected into the console's index.html by the seed-ui init container.
  # Valkey Admin keeps its connection list in browser localStorage and has no
  # server-side mechanism to pre-register a connection
  # (https://github.com/valkey-io/valkey-admin/issues/363), so without this
  # the console greets operators with an empty "You Have No Connections!"
  # screen. This seeds the Rulebricks cache connection so it appears in the
  # UI out of the box. A null password makes the UI prompt for one on
  # connect (used when the external cache requires auth).
  preseed.js: |
    (function () {
      "use strict";
      try {
        var KEY = "VALKEY_CONNECTIONS";
        var host = {{ $cacheHost | quote }};
        var port = {{ $cachePort | quote }};
        // Mirrors the app's own connectionId derivation: sanitized "<host>-<port>".
        var id = (host + "-" + port).replace(/[^a-zA-Z0-9_-]/g, "-");
        var store;
        try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
        if (!store[id]) {
          var details = {
            host: host,
            port: port,
            username: "",
            password: {{ ternary "null" "\"\"" $cacheHasAuth }},
            tls: {{ $cacheTls }},
            verifyTlsCertificate: false,
            alias: "Rulebricks Cache",
            endpointType: "node",
            authType: "password"
          };
          store[id] = {
            status: "Not Connected",
            errorMessage: null,
            connectionDetails: details,
            // The connection list only renders entries with history, so seed one event.
            connectionHistory: [{ timestamp: Date.now(), event: "Connected" }],
            searchableText: [id, details.host, details.port, details.username, details.alias]
              .filter(Boolean).join(" ").toLowerCase()
          };
          localStorage.setItem(KEY, JSON.stringify(store));
        }
      } catch (e) {
        /* best-effort: the console still works without the seeded entry */
      }
    })();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  replicas: {{ $admin.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: valkey-admin
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- with $admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $admin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Copies the bundled frontend to an emptyDir and injects preseed.js
      # (see the ConfigMap above) so the app's cache connection shows up in
      # the console without manual entry.
      initContainers:
        - name: seed-ui
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" $image "name" "valkey-admin") | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              set -e
              cp -r /app/apps/frontend/dist/. /ui/
              cp /seed/preseed.js /ui/assets/preseed.js
              sed -i 's|<script type="module"|<script src="./assets/preseed.js"></script><script type="module"|' /ui/index.html
          volumeMounts:
            - name: ui
              mountPath: /ui
            - name: ui-preseed
              mountPath: /seed
      containers:
        - name: valkey-admin
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" $image "name" "valkey-admin") | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DEPLOYMENT_MODE
              value: "Web"
            - name: VALKEY_HOST
              {{- if .Values.redis.enabled }}
              value: {{ include "rulebricks-chart.redis.fullname" . | quote }}
              {{- else }}
              value: {{ .Values.redis.external.host | quote }}
              {{- end }}
            - name: VALKEY_PORT
              {{- if .Values.redis.enabled }}
              value: "6379"
              {{- else }}
              value: {{ .Values.redis.external.port | default 6379 | quote }}
              {{- end }}
            - name: VALKEY_TLS
              value: {{ ternary "true" "false" (and (not .Values.redis.enabled) .Values.redis.external .Values.redis.external.tls .Values.redis.external.tls.enabled) | quote }}
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            {{- end }}
            {{- with $admin.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: ui
              mountPath: /app/apps/frontend/dist
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ui
          emptyDir: {}
        - name: ui-preseed
          configMap:
            name: {{ $name }}-ui-preseed
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  type: {{ $service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $servicePort }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if and $isTraefikIngress (not $basicAuth.existingSecret) $basicAuth.users }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $basicAuthSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
type: Opaque
stringData:
  users: |-
    {{- range $basicAuth.users }}
    {{ . }}
    {{- end }}
{{- end }}
{{- if $isTraefikIngress }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-basic-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  basicAuth:
    secret: {{ $basicAuthSecret }}
{{- if $ingress.allowedIPs }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-ip-whitelist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
spec:
  ipWhiteList:
    sourceRange:
      {{- range $ingress.allowedIPs }}
      - {{ . | quote }}
      {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey-admin
  annotations:
    {{- with $ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
    cert-manager.io/cluster-issuer: {{ .Release.Name }}-letsencrypt
    {{- end }}
    {{- if and .Values.global .Values.global.externalDnsEnabled }}
    external-dns.alpha.kubernetes.io/hostname: {{ $ingress.hostname | default (printf "valkey.%s" .Values.global.domain) }}
    external-dns.alpha.kubernetes.io/ttl: "300"
    {{- end }}
    {{- $middlewares := list (printf "%s-%s-basic-auth@kubernetescrd" .Release.Namespace $name) -}}
    {{- if $ingress.allowedIPs }}
      {{- $middlewares = append $middlewares (printf "%s-%s-ip-whitelist@kubernetescrd" .Release.Namespace $name) -}}
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- if eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
    {{- end }}
spec:
  ingressClassName: {{ $ingress.className | default "traefik" }}
  {{- if eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
  tls:
    - hosts:
        - {{ $ingress.hostname | default (printf "valkey.%s" .Values.global.domain) }}
      # Dedicated per-host secret: the shared <release>-tls-secret only covers
      # global.domain, so cert-manager (via the cluster-issuer annotation above)
      # must issue a separate certificate for the valkey subdomain.
      secretName: {{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ $ingress.hostname | default (printf "valkey.%s" .Values.global.domain) | quote }}
      http:
        paths:
          - path: {{ $ingress.path | default "/" }}
            pathType: {{ $ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $servicePort }}
{{- end }}
{{- end }}
