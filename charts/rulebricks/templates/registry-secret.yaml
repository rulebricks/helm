{{- /* Skipped when global.registry.existingPullSecret names a pre-created
     dockerconfigjson Secret (BYO image-pull credentials). */ -}}
{{- if not (dig "registry" "existingPullSecret" "" (.Values.global | default dict)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rulebricks-chart.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "rulebricks-chart.imagePullSecret" . }}
{{- end }}
