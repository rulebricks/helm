{{- if and .Values.hps .Values.hps.enabled .Values.hps.workers.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 80
      targetPort: {{ .Values.metrics.worker.port | default 3000 }}
      protocol: TCP
---
{{- /* Workers are stateless Kafka consumers. A Deployment (not StatefulSet)
     creates pods in parallel, so KEDA scale-out delivers burst capacity in
     seconds instead of one OrderedReady pod at a time.
     UPGRADE NOTE: releases prior to this change shipped a StatefulSet with
     the same name; Helm replaces the workload kind during upgrade. Workers
     briefly cycle and the Kafka queue absorbs the gap (in-flight messages
     are redelivered to the new pods). */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-worker
spec:
  replicas: {{ .Values.hps.workers.replicas | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hps-worker
        rulebricks.com/workload-group: application
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.hps.workers.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Workers share the app ConfigMap/Secret via envFrom, which is
             not hot-reloaded; roll pods when either changes (see
             app-deployment.yaml). */}}
        checksum/app-config: {{ include (print $.Template.BasePath "/app-configmap.yaml") . | sha256sum }}
        checksum/app-secret: {{ include (print $.Template.BasePath "/app-secret.yaml") . | sha256sum }}
        {{- if .Values.global.tlsPrivateCaBundle }}
        checksum/private-ca: {{ .Values.global.tlsPrivateCaBundle | sha256sum }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      serviceAccountName: {{ include "rulebricks-chart.hps-worker.serviceAccountName" . }}
      {{- /* Burst-tier scheduling priority: workers are the first preemption
           victims so critical infrastructure (kafka, clickhouse, db) can
           always reschedule during an aggressive scale-out. Defaults to the
           release-scoped burst PriorityClass created by the parent chart;
           override via hps.workers.priorityClassName. */ -}}
      {{- /* Default true, but respect an explicit global.priorityClasses.enabled=false.
           Mirrors templates/priorityclasses.yaml so the burst class is only
           referenced when it is actually created. */ -}}
      {{- $pcEnabled := true }}
      {{- if and .Values.global .Values.global.priorityClasses (hasKey .Values.global.priorityClasses "enabled") }}
        {{- $pcEnabled = .Values.global.priorityClasses.enabled }}
      {{- end }}
      {{- $burstPC := .Values.hps.workers.priorityClassName | default (ternary (printf "%s-burst" .Release.Name) "" $pcEnabled) }}
      {{- with $burstPC }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $workerNodeSelector := .Values.hps.workers.nodeSelector | default dict }}
      {{- if and (not $workerNodeSelector) .Values.global .Values.global.scheduling }}
        {{- $workerNodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $workerNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global. The burst-pool
           toleration is ALWAYS appended (additive): cluster-setup can provide
           a dedicated worker pool tainted rulebricks.com/pool=burst:NoSchedule
           (one large parked/on-demand node, or a future Karpenter NodePool),
           and workers must be able to land there. On clusters
           without that taint the toleration is inert. */ -}}
      {{- $workerTolerations := .Values.hps.workers.tolerations | default list }}
      {{- if and (not $workerTolerations) .Values.global .Values.global.scheduling }}
        {{- $workerTolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- $workerTolerations = append $workerTolerations (dict "key" "rulebricks.com/pool" "operator" "Equal" "value" "burst" "effect" "NoSchedule") }}
      tolerations:
        {{- toYaml $workerTolerations | nindent 8 }}
      {{- /* Affinity precedence: worker affinity > global scheduling affinity > soft default anti-affinity.
           Workers always gain a SOFT preference for nodes labeled
           rulebricks.com/pool=burst (unless the resolved affinity already
           defines its own nodeAffinity, which then wins). Soft = clusters
           without the label schedule exactly as before. */ -}}
      {{- $workerAffinity := .Values.hps.workers.affinity | default dict }}
      {{- if and (not $workerAffinity) .Values.global .Values.global.scheduling }}
        {{- $workerAffinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- if not $workerAffinity }}
        {{- $workerAffinity = dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "podAffinityTerm" (dict "labelSelector" (dict "matchExpressions" (list (dict "key" "rulebricks.com/workload-group" "operator" "In" "values" (list "infrastructure")))) "topologyKey" "kubernetes.io/hostname")))) }}
      {{- end }}
      {{- if not (hasKey $workerAffinity "nodeAffinity") }}
        {{- $burstNodeAffinity := dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "preference" (dict "matchExpressions" (list (dict "key" "rulebricks.com/pool" "operator" "In" "values" (list "burst")))))) }}
        {{- $workerAffinity = merge (dict "nodeAffinity" $burstNodeAffinity) $workerAffinity }}
      {{- end }}
      affinity:
        {{- toYaml $workerAffinity | nindent 8 }}
      {{- with .Values.hps.workers.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Only wait for the in-cluster Kafka service. When external brokers are
             configured (app.logging.kafkaBrokers set), the service does not exist. */ -}}
      {{- $externalKafka := false }}
      {{- if and .Values.app.logging .Values.app.logging.kafkaBrokers }}
      {{- $externalKafka = true }}
      {{- end }}
      {{- if not $externalKafka }}
      initContainers:
        {{- /* Wait for the broker AND the consumer-group coordinator to be
             serving before the worker starts. On a fresh cluster the
             coordinator is often still loading after the broker port opens;
             starting the worker then makes it crash-loop until Kafka is ready.
             JMX is disabled so the Kafka CLI does not try to bind the broker
             JMX port. timeout(1) guards nc: busybox nc's -w only bounds the
             connect, so a connection that is accepted but never answered
             (Kafka mid-startup) blocks the read forever and wedges this init
             container. */}}
        - name: wait-for-kafka
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
          command: ["sh", "-ec"]
          args:
            - |
              BOOT="{{ .Release.Name }}-kafka-kafka-bootstrap"
              echo "Waiting for Kafka bootstrap $BOOT:9092 ..."
              until echo | timeout 5 nc -w 2 "$BOOT" 9092 >/dev/null 2>&1; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka bootstrap reachable!"
      {{- end }}
      containers:
        - name: hps-worker
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" (merge (dict "tag" (printf "worker-%s" (include "rulebricks-chart.hps.imageTag" .))) .Values.hps.image)) | quote }}
          imagePullPolicy: {{ .Values.hps.image.pullPolicy }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.worker.port | default 3000 }}
              protocol: TCP
          {{- end }}
          resources:
            {{- /* Workers do CPU-bound rule evaluation on a single-threaded
                 runtime: a full core each (request = limit) avoids CFS
                 throttling mid-batch. Scale out, not up. */}}
            requests:
              cpu: {{ .Values.hps.workers.resources.requests.cpu | default "1000m" }}
              memory: {{ .Values.hps.workers.resources.requests.memory | default "1Gi" }}
            limits:
              cpu: {{ .Values.hps.workers.resources.limits.cpu | default "1000m" }}
              memory: {{ .Values.hps.workers.resources.limits.memory | default "1Gi" }}
          {{- /* Default liveness: the worker's /health endpoint reports 503 when
               its Kafka consumer has fatally crashed and in-process recovery has
               not yet succeeded (e.g. MSK IAM re-authentication failures after
               workload-identity credential rotation). Without this probe such a
               pod stays Running forever while consuming nothing. Thresholds are
               generous so the worker's own reconnect/backoff recovery gets ~2
               minutes before the pod is replaced. */}}
          {{- $workerLiveness := .Values.hps.workers.livenessProbe | default (dict
                "httpGet" (dict "path" "/health" "port" (.Values.metrics.worker.port | default 3000))
                "initialDelaySeconds" 30
                "periodSeconds" 15
                "timeoutSeconds" 5
                "failureThreshold" 8) }}
          livenessProbe:
            {{- toYaml $workerLiveness | nindent 12 }}
          {{- with .Values.hps.workers.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hps.workers.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
            - secretRef:
                name: {{ include "rulebricks-chart.app.secretName" . | trim }}
            {{- /* Extra envFrom references */ -}}
            {{- with .Values.hps.workers.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            - name: REDIS_URL
              value: {{ include "rulebricks-chart.redis.connectionStringAuth" . | quote }}
            {{- end }}
            - name: WORKER_TOPICS
              value: {{ .Values.hps.workers.topics | default "solution" | quote }}
            - name: NODE_ENV
              value: "production"
            {{- /* Per-partition fetch ceiling; kept at 2x the Kafka message
                 cap (hps.limits in values.yaml) so full-size request chunks
                 batch efficiently. Fallback equals the worker code default. */}}
            - name: WORKER_MAX_BYTES_PER_PARTITION
              value: {{ ((.Values.hps.limits).workerFetchMaxBytes) | default 4194304 | int64 | quote }}
            {{- with .Values.app.logging.kafkaSasl }}
            {{- if .existingSecret }}
            # Optional external Kafka SASL credentials secret
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- /* Corporate root CA for privately-issued ingress certificates
                 (additive to Node's default trust store). */ -}}
            {{- if .Values.global.tlsPrivateCaBundle }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rulebricks/ca/ca.crt
            {{- end }}
            {{- /* OpenTelemetry tracing env (no-op unless global.tracing.enabled) */ -}}
            {{- include "rulebricks-chart.tracing.env" (dict "root" . "serviceName" "rulebricks-hps-worker") | nindent 12 }}
            {{- /* Extra environment variables */ -}}
            {{- with .Values.hps.workers.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.global.tlsPrivateCaBundle }}
          volumeMounts:
            - name: private-ca
              mountPath: /etc/rulebricks/ca
              readOnly: true
          {{- end }}
      {{- if .Values.global.tlsPrivateCaBundle }}
      volumes:
        - name: private-ca
          configMap:
            name: {{ .Release.Name }}-private-ca
      {{- end }}
{{- end }}
