{{- if and .Values.hps .Values.hps.enabled .Values.hps.workers.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: 3000
---
{{- /* Workers are stateless Kafka consumers. A Deployment (not StatefulSet)
     creates pods in parallel, so KEDA scale-out delivers burst capacity in
     seconds instead of one OrderedReady pod at a time.
     UPGRADE NOTE: releases prior to this change shipped a StatefulSet with
     the same name; Helm replaces the workload kind during upgrade. Workers
     briefly cycle and the Kafka queue absorbs the gap (in-flight messages
     are redelivered to the new pods). */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-worker
spec:
  replicas: {{ .Values.hps.workers.replicas | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hps-worker
        rulebricks.com/workload-group: application
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.hps.workers.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      serviceAccountName: {{ include "rulebricks-chart.hps-worker.serviceAccountName" . }}
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $workerNodeSelector := .Values.hps.workers.nodeSelector | default dict }}
      {{- if and (not $workerNodeSelector) .Values.global .Values.global.scheduling }}
        {{- $workerNodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $workerNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $workerTolerations := .Values.hps.workers.tolerations | default list }}
      {{- if and (not $workerTolerations) .Values.global .Values.global.scheduling }}
        {{- $workerTolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $workerTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity precedence: worker affinity > global scheduling affinity > soft default anti-affinity */ -}}
      {{- $workerAffinity := .Values.hps.workers.affinity | default dict }}
      {{- if and (not $workerAffinity) .Values.global .Values.global.scheduling }}
        {{- $workerAffinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $workerAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: rulebricks.com/workload-group
                  operator: In
                  values:
                  - infrastructure
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.hps.workers.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Only wait for the in-cluster Kafka service. When external brokers are
             configured (app.logging.kafkaBrokers set), the service does not exist. */ -}}
      {{- $externalKafka := false }}
      {{- if and .Values.app.logging .Values.app.logging.kafkaBrokers }}
      {{- $externalKafka = true }}
      {{- end }}
      {{- if not $externalKafka }}
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z {{ .Release.Name }}-kafka 9092; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka is ready!"
      {{- end }}
      containers:
        - name: hps-worker
          image: {{ .Values.hps.image.repository }}:worker-{{ include "rulebricks-chart.hps.imageTag" . }}
          imagePullPolicy: {{ .Values.hps.image.pullPolicy }}
          resources:
            {{- /* Workers do CPU-bound rule evaluation on a single-threaded
                 runtime: a full core each (request = limit) avoids CFS
                 throttling mid-batch. Scale out, not up. */}}
            requests:
              cpu: {{ .Values.hps.workers.resources.requests.cpu | default "1000m" }}
              memory: {{ .Values.hps.workers.resources.requests.memory | default "1Gi" }}
            limits:
              cpu: {{ .Values.hps.workers.resources.limits.cpu | default "1000m" }}
              memory: {{ .Values.hps.workers.resources.limits.memory | default "1Gi" }}
          envFrom:
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
            - secretRef:
                name: {{ include "rulebricks-chart.app.secretName" . | trim }}
            {{- /* Extra envFrom references */ -}}
            {{- with .Values.hps.workers.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: WORKER_TOPICS
              value: {{ .Values.hps.workers.topics | default "solution" | quote }}
            - name: NODE_ENV
              value: "production"
            {{- with .Values.app.logging.kafkaSasl }}
            {{- if .existingSecret }}
            # Optional external Kafka SASL credentials secret
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- /* Extra environment variables */ -}}
            {{- with .Values.hps.workers.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
