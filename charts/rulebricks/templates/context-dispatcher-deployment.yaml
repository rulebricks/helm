{{- if eq (include "rulebricks-chart.contexts.enabled" .) "true" }}
{{- $contexts := .Values.hps.contexts -}}
{{- $dispatcher := $contexts.dispatcher -}}
{{- $port := ($dispatcher.service | default dict).port | default 3000 -}}
{{- $brokers := .Values.app.logging.kafkaBrokers | default (include "rulebricks-chart.kafka.bootstrapServers" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-dispatcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-dispatcher
spec:
  replicas: {{ $dispatcher.replicas | default 2 }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: context-dispatcher
        {{- if not (hasKey ($dispatcher.podLabels | default dict) "rulebricks.com/workload-group") }}
        rulebricks.com/workload-group: application
        {{- end }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $dispatcher.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.podAnnotations $dispatcher.podAnnotations }}
      annotations:
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $dispatcher.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rulebricks-chart.hps.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      {{- include "rulebricks-chart.scheduling" (dict "Values" .Values "component" $dispatcher) | nindent 6 }}
      initContainers:
        - name: wait-for-kafka
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ $brokers | quote }}
          args:
            - |
              broker="${KAFKA_BOOTSTRAP%%,*}"
              host="${broker%:*}"
              port="${broker##*:}"
              if [ "$host" = "$port" ]; then port=9092; fi
              host="${host#\[}"; host="${host%\]}"
              echo "Waiting for Kafka bootstrap ${host}:${port} ..."
              until echo | nc -w 2 "$host" "$port" 2>/dev/null; do
                sleep 2
              done
      containers:
        - name: context-dispatcher
          image: {{ include "rulebricks-chart.context-dispatcher.image" . | quote }}
          imagePullPolicy: {{ .Values.hps.image.pullPolicy }}
          {{- with $dispatcher.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $dispatcher.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          resources:
            {{- toYaml $dispatcher.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml $dispatcher.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $dispatcher.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml $dispatcher.startupProbe | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
          env:
            {{- include "rulebricks-chart.contexts.databaseEnv" . | nindent 12 }}
            {{- include "rulebricks-chart.contexts.env" (dict "root" . "role" "dispatcher") | nindent 12 }}
            {{- include "rulebricks-chart.kafka.credentialsEnv" . | nindent 12 }}
            {{- include "rulebricks-chart.tracing.env" (dict "root" . "serviceName" "rulebricks-context-dispatcher") | nindent 12 }}
{{- end }}
