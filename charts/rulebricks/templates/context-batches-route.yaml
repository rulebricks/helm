{{- /*
Only the nested batch branch belongs to HPS:
  /api/v1/contexts/{slug}/batches[/...]

Core Ingress/HTTPRoute PathPrefix matching cannot express a wildcard middle
segment without also stealing interactive /contexts/{slug}/{identity} traffic
from the app. Render a dedicated regex route with higher specificity instead:
Traefik/nginx use ImplementationSpecific Ingress matching; Gateway API uses
RegularExpression (implementation-specific, supported by the default Traefik
Gateway provider). The ordinary app catch-all remains unchanged.
*/ -}}
{{- if and (eq (include "rulebricks-chart.contexts.enabled" .) "true") .Values.ingress.enabled }}
{{- $ingress := .Values.ingress | default dict -}}
{{- $hostname := $ingress.hostname | default .Values.global.domain -}}
{{- $regex := "^/api/v1/contexts/[^/]+/batches(/.*)?$" -}}
{{- if eq ($ingress.type | default "ingress") "gateway-api" }}
{{- $gateway := $ingress.gatewayApi | default dict -}}
{{- if not $gateway.gatewayName }}
{{- fail "ingress.gatewayApi.gatewayName is required when using gateway-api ingress type" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rulebricks-chart.fullname" . }}-context-batches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-batches-route
spec:
  parentRefs:
    - name: {{ $gateway.gatewayName }}
      {{- with $gateway.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: {{ $regex | quote }}
      backendRefs:
        - name: {{ include "rulebricks-chart.context-admission.fullname" . }}
          port: 80
{{- else }}
{{- $ingressClass := $ingress.className | default "traefik" -}}
{{- if not (or (eq $ingressClass "traefik") (eq $ingressClass "nginx")) }}
{{- fail (printf "Context batch routing requires regex-capable ingress class traefik or nginx (got %q); use ingress.type=gateway-api with RegularExpression or keep contexts disabled" $ingressClass) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rulebricks-chart.fullname" . }}-context-batches
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-batches-route
  annotations:
    {{- with $ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq $ingressClass "traefik" }}
    traefik.ingress.kubernetes.io/router.pathmatcher: PathRegexp
    traefik.ingress.kubernetes.io/router.priority: "200"
    {{- if eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
    {{- end }}
    {{- else }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: {{ ternary "true" "false" (eq (include "rulebricks-chart.tlsEnabled" .) "true") | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $ingressClass }}
  {{- if eq (include "rulebricks-chart.tlsEnabled" .) "true" }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ include "rulebricks-chart.tls.secretName" . }}
  {{- end }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /api/v1/contexts/[^/]+/batches(/.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "rulebricks-chart.context-admission.fullname" . }}
                port:
                  number: 80
{{- end }}
{{- end }}
