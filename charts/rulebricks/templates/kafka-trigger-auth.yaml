{{- /*
TriggerAuthentication for the KEDA Kafka lag triggers (external Kafka only),
keyed off app.logging.kafkaSasl.mechanism:
  - aws-iam: podIdentity aws - the KEDA operator's own identity signs the MSK
    connection (attach it to the keda-operator ServiceAccount via IRSA or an
    EKS Pod Identity association).
  - PLAIN/SCRAM: secretTargetRef - KEDA can only take username/password
    through a TriggerAuthentication. Credentials resolve like the HPS
    workers': kafkaSasl.existingSecret (with its key names), else the chart's
    app secret.
Not created for in-cluster Kafka (plaintext) or GCP-flavored OAUTHBEARER (lag
trigger skipped entirely - see kafka.gatedTokenAuth).
*/}}
{{- if and .Values.hps .Values.hps.enabled (or ((.Values.hps.workers).keda).enabled ((.Values.hps).keda).enabled) }}
{{- $logging := ((.Values.app).logging) | default dict }}
{{- if and (include "rulebricks-chart.kafka.awsIamAuth" .) $logging.kafkaBrokers }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "rulebricks-chart.kafka.triggerAuthName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-lag-auth
spec:
  podIdentity:
    provider: aws
{{- else if include "rulebricks-chart.kafka.kedaSaslMode" . }}
{{- $sasl := .Values.app.logging.kafkaSasl }}
{{- $secretName := $sasl.existingSecret | default (include "rulebricks-chart.app.secretName" . | trim) }}
{{- $usernameKey := $sasl.existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
{{- $passwordKey := $sasl.existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "rulebricks-chart.kafka.triggerAuthName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-lag-auth
spec:
  secretTargetRef:
    - parameter: username
      name: {{ $secretName }}
      key: {{ $usernameKey }}
    - parameter: password
      name: {{ $secretName }}
      key: {{ $passwordKey }}
{{- end }}
{{- end }}
