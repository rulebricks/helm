{{- /*
HTTPRoute resource for Rulebricks (Kubernetes Gateway API)
Only rendered when ingress.type is "gateway-api"
*/ -}}
{{- $name := include "rulebricks-chart.fullname" . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $ingressApp := $ingress.app | default dict -}}
{{- $appIngressEnabled := true -}}
{{- if hasKey $ingressApp "enabled" -}}
  {{- $appIngressEnabled = $ingressApp.enabled -}}
{{- end -}}
{{- $hpsIngressEnabled := and .Values.hps .Values.hps.enabled -}}
{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "ingress") "gateway-api") (or $appIngressEnabled $hpsIngressEnabled) }}
{{- $gateway := $ingress.gatewayApi | default dict -}}
{{- $hostname := $ingress.hostname | default .Values.global.domain -}}

{{- if not $gateway.gatewayName }}
{{- fail "ingress.gatewayApi.gatewayName is required when using gateway-api ingress type" }}
{{- end }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gateway.gatewayName }}
      {{- if $gateway.gatewayNamespace }}
      namespace: {{ $gateway.gatewayNamespace }}
      {{- end }}
      {{- if $gateway.sectionName }}
      sectionName: {{ $gateway.sectionName }}
      {{- end }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    {{- if and .Values.hps .Values.hps.enabled }}
    # HPS API endpoints - route to HPS service
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/solve/
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/bulk-solve/
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/v1/parallel-solve
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    # Fleet warm-up: pre-scale trigger + status poll (HPS-owned)
    - matches:
        - path:
            type: Exact
            value: /api/v1/scale
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/flows/
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    # Context batch ingestion (self-hosted bulk mode); "batch" is a reserved
    # context slug so the rest of /api/v1/contexts/* stays on the app
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/contexts/batch/
      backendRefs:
        - name: {{ include "rulebricks-chart.hps.fullname" . }}
          port: 80
    {{- end }}
    {{- if $appIngressEnabled }}
    # Default route - all other traffic to main app
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: 80
    {{- end }}
{{- end }}
