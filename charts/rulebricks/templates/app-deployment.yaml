apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.app.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.app.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /* Pod annotations (global + component) */ -}}
      {{- if or (and .Values.global .Values.global.podAnnotations) .Values.app.podAnnotations }}
      annotations:
        {{- if and .Values.global .Values.global.podAnnotations }}
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- end }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      serviceAccountName: {{ include "rulebricks-chart.app.serviceAccountName" . }}
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $nodeSelector := .Values.app.nodeSelector | default dict }}
      {{- if and (not $nodeSelector) .Values.global .Values.global.scheduling }}
        {{- $nodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $tolerations := .Values.app.tolerations | default list }}
      {{- if and (not $tolerations) .Values.global .Values.global.scheduling }}
        {{- $tolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity: component-level overrides global */ -}}
      {{- $affinity := .Values.app.affinity | default dict }}
      {{- if and (not $affinity) .Values.global .Values.global.scheduling }}
        {{- $affinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.app.image.repository }}:{{ include "rulebricks-chart.app.imageTag" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.app.resources.requests.cpu | default "256m" }}
              memory: {{ .Values.app.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.app.resources.limits.cpu | default "512m" }}
              memory: {{ .Values.app.resources.limits.memory | default "1Gi" }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.livenessProbe.httpGet.path | default "/" }}
              port: {{ .Values.app.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readinessProbe.httpGet.path | default "/api/health" }}
              port: {{ .Values.app.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold }}
          env:
            # License and contact (from secret)
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "licenseKey" "default" "LICENSE_KEY") | trim }}
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: EMAIL
            # SMTP credentials (from secret)
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "smtpUser" "default" "SMTP_USER") | trim }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "smtpPass" "default" "SMTP_PASS") | trim }}
            # Supabase keys (from secret)
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "supabaseServiceKey" "default" "SUPABASE_SERVICE_KEY") | trim }}
            # AI API key (from secret, optional)
            {{- $aiEnabled := false }}
            {{- if and .Values.global .Values.global.ai .Values.global.ai.enabled }}
              {{- $aiEnabled = true }}
            {{- else if and .Values.app.ai .Values.app.ai.enabled }}
              {{- $aiEnabled = true }}
            {{- end }}
            {{- if $aiEnabled }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "openaiApiKey" "default" "OPENAI_API_KEY") | trim }}
            {{- end }}
            # Redis HTTP API endpoint/token
            {{- if and (not .Values.redis.enabled) .Values.redis.external .Values.redis.external.httpApi .Values.redis.external.httpApi.enabled .Values.redis.external.httpApi.existingSecret }}
            # External HTTP API (e.g. Upstash) credentials sourced from an existing secret
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.httpApi.existingSecret }}
                  key: {{ .Values.redis.external.httpApi.existingSecretUrlKey | default "redis-url" }}
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.httpApi.existingSecret }}
                  key: {{ .Values.redis.external.httpApi.existingSecretTokenKey | default "redis-token" }}
            {{- else }}
            # From configmap (in-cluster bridge or inline external HTTP API)
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rulebricks-chart.app.configmap" . }}
                  key: KV_REST_API_URL
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rulebricks-chart.app.configmap" . }}
                  key: KV_REST_API_TOKEN
            {{- end }}
            {{- /* External Redis password: injected at runtime so it never lands in a ConfigMap.
                   REDIS_PASSWORD must precede REDIS_URL for Kubernetes $(VAR) expansion. */ -}}
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            - name: REDIS_URL
              value: {{ include "rulebricks-chart.redis.connectionStringAuth" . | quote }}
            {{- end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-clickhouse-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}
                  key: admin-password
            {{- with .Values.app.logging.kafkaSasl }}
            {{- if .existingSecret }}
            # Optional external Kafka SASL credentials secret
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- /* OpenTelemetry tracing env (no-op unless global.tracing.enabled) */ -}}
            {{- include "rulebricks-chart.tracing.env" (dict "root" . "serviceName" "rulebricks-app") | nindent 12 }}
            {{- /* Extra environment variables from values */ -}}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            # Load all non-sensitive config from ConfigMap
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
            # Load all secrets (this provides remaining sensitive values)
            - secretRef:
                name: {{ include "rulebricks-chart.app.secretName" . | trim }}
            {{- /* Extra envFrom references (additional ConfigMaps/Secrets) */ -}}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}