apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.app.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.app.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Roll pods whenever the app config/secret changes: both are
             consumed via envFrom, which Kubernetes does NOT hot-reload, so
             without these a config-only upgrade (switching SMTP hosts,
             enabling SSO, ...) leaves running pods on stale settings until a
             manual restart. */}}
        checksum/app-config: {{ include (print $.Template.BasePath "/app-configmap.yaml") . | sha256sum }}
        checksum/app-secret: {{ include (print $.Template.BasePath "/app-secret.yaml") . | sha256sum }}
        {{- if .Values.global.tlsPrivateCaBundle }}
        checksum/private-ca: {{ .Values.global.tlsPrivateCaBundle | sha256sum }}
        {{- end }}
        {{- if and .Values.global .Values.global.podAnnotations }}
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- end }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      serviceAccountName: {{ include "rulebricks-chart.app.serviceAccountName" . }}
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $nodeSelector := .Values.app.nodeSelector | default dict }}
      {{- if and (not $nodeSelector) .Values.global .Values.global.scheduling }}
        {{- $nodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $tolerations := .Values.app.tolerations | default list }}
      {{- if and (not $tolerations) .Values.global .Values.global.scheduling }}
        {{- $tolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity: component-level overrides global */ -}}
      {{- $affinity := .Values.app.affinity | default dict }}
      {{- if and (not $affinity) .Values.global .Values.global.scheduling }}
        {{- $affinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" (merge (dict "tag" (include "rulebricks-chart.app.imageTag" .)) .Values.app.image)) | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.app.resources.requests.cpu | default "256m" }}
              memory: {{ .Values.app.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.app.resources.limits.cpu | default "512m" }}
              memory: {{ .Values.app.resources.limits.memory | default "1Gi" }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.livenessProbe.httpGet.path | default "/" }}
              port: {{ .Values.app.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readinessProbe.httpGet.path | default "/api/health" }}
              port: {{ .Values.app.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold }}
          env:
            {{- /* Next.js standalone (server.js) uses $HOSTNAME as its bind
                 address, and Kubernetes sets HOSTNAME to the pod name. On CNIs
                 where the pod name resolves to an address other than the pod IP
                 the kubelet probes, every probe is refused and the pod is
                 killed on the liveness timer (~120s silent crashloop). Bind to
                 all interfaces by default; an explicit HOSTNAME entry in
                 app.extraEnv replaces this. */ -}}
            {{- $hostnameOverridden := false }}
            {{- range .Values.app.extraEnv }}
              {{- if eq (default "" .name) "HOSTNAME" }}
                {{- $hostnameOverridden = true }}
              {{- end }}
            {{- end }}
            {{- if not $hostnameOverridden }}
            - name: HOSTNAME
              value: "0.0.0.0"
            {{- end }}
            # License and contact (from secret)
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "licenseKey" "default" "LICENSE_KEY") | trim }}
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "email" "default" "EMAIL") | trim }}
            # SMTP credentials (from secret)
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "smtpUser" "default" "SMTP_USER") | trim }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "smtpPass" "default" "SMTP_PASS") | trim }}
            # Supabase keys (from secret)
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "supabaseServiceKey" "default" "SUPABASE_SERVICE_KEY") | trim }}
            {{- /* External Auth Token Passthrough JWT secret. Normally arrives
                 via envFrom under the literal JWT_SECRET key; this explicit env
                 (which wins over envFrom) applies the secretRefKeys.jwtSecret
                 mapping for BYO Secrets using a different key name. */ -}}
            {{- if and .Values.global .Values.global.externalAuth .Values.global.externalAuth.enabled .Values.global.secrets .Values.global.secrets.secretRef }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "jwtSecret" "default" "JWT_SECRET") | trim }}
            {{- end }}
            {{- /* Public anon key runtime seam: when global.supabase.secretRef
                 names an existing Secret, inject the browser-facing key from it
                 (key per global.supabase.secretRefKey.anonKey, same pattern as
                 the supabase subchart's secret.* blocks). */ -}}
            {{- $supabaseSecretRef := "" }}
            {{- $supabaseAnonKeyRefKey := "anonKey" }}
            {{- if and .Values.global .Values.global.supabase }}
              {{- $supabaseSecretRef = .Values.global.supabase.secretRef | default "" }}
              {{- if .Values.global.supabase.secretRefKey }}
                {{- $supabaseAnonKeyRefKey = .Values.global.supabase.secretRefKey.anonKey | default "anonKey" }}
              {{- end }}
            {{- end }}
            {{- if $supabaseSecretRef }}
            - name: SUPABASE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $supabaseSecretRef }}
                  key: {{ $supabaseAnonKeyRefKey }}
            - name: NEXT_PUBLIC_SUPABASE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $supabaseSecretRef }}
                  key: {{ $supabaseAnonKeyRefKey }}
            {{- end }}
            # Redis-compatible HTTP API endpoint/token
            {{- if and (not .Values.redis.enabled) .Values.redis.external .Values.redis.external.httpApi .Values.redis.external.httpApi.enabled .Values.redis.external.httpApi.existingSecret }}
            # External HTTP API (e.g. Upstash) credentials sourced from an existing secret
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.httpApi.existingSecret }}
                  key: {{ .Values.redis.external.httpApi.existingSecretUrlKey | default "redis-url" }}
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.external.httpApi.existingSecret }}
                  key: {{ .Values.redis.external.httpApi.existingSecretTokenKey | default "redis-token" }}
            {{- else }}
            # From configmap (in-cluster bridge or inline external HTTP API)
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rulebricks-chart.app.configmap" . }}
                  key: KV_REST_API_URL
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rulebricks-chart.app.configmap" . }}
                  key: KV_REST_API_TOKEN
            {{- end }}
            {{- /* External Valkey/Redis-compatible password: injected at runtime so it never lands in a ConfigMap.
                   REDIS_PASSWORD must precede REDIS_URL for Kubernetes $(VAR) expansion. */ -}}
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            - name: REDIS_URL
              value: {{ include "rulebricks-chart.redis.connectionStringAuth" . | quote }}
            {{- end }}
            {{- $chApp := .Values.app.clickhouse | default dict }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $chApp.existingSecret | default (printf "%s-clickhouse-credentials" .Release.Name | trunc 63 | trimSuffix "-") }}
                  key: {{ $chApp.existingSecretKey | default "admin-password" }}
            {{- with .Values.app.logging.kafkaSasl }}
            {{- if .existingSecret }}
            # Optional external Kafka SASL credentials secret
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- /* Corporate root CA for privately-issued ingress certificates:
                 the app fetches https://supabase.<domain> internally, which
                 fails TLS verification on a private root without this.
                 NODE_EXTRA_CA_CERTS is additive to the default trust store. */ -}}
            {{- if .Values.global.tlsPrivateCaBundle }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rulebricks/ca/ca.crt
            {{- end }}
            {{- /* OpenTelemetry tracing env (no-op unless global.tracing.enabled) */ -}}
            {{- include "rulebricks-chart.tracing.env" (dict "root" . "serviceName" "rulebricks-app") | nindent 12 }}
            {{- /* Extra environment variables from values */ -}}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            # Load all non-sensitive config from ConfigMap
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
            # Parent-chart bridge for the persistence-derived decision-log mode.
            # Optional keeps the rulebricks subchart usable on its own.
            - configMapRef:
                name: {{ printf "%s-app-ch-%d" .Release.Name .Release.Revision | trunc 63 | trimSuffix "-" }}
                optional: true
            # Load all secrets (this provides remaining sensitive values)
            - secretRef:
                name: {{ include "rulebricks-chart.app.secretName" . | trim }}
            {{- /* Extra envFrom references (additional ConfigMaps/Secrets) */ -}}
            {{- with .Values.app.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.global.tlsPrivateCaBundle }}
          volumeMounts:
            - name: private-ca
              mountPath: /etc/rulebricks/ca
              readOnly: true
          {{- end }}
      {{- if .Values.global.tlsPrivateCaBundle }}
      volumes:
        - name: private-ca
          configMap:
            name: {{ .Release.Name }}-private-ca
      {{- end }}