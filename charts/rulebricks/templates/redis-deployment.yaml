{{- if .Values.redis.enabled }}
{{- /* Redis must reject allocations before the pod's memory limit kills it.
     Reserve headroom for allocator, connections and persistence buffers;
     this budget follows the deployment's memory allocation, not ticket count. */ -}}
{{- $memory := .Values.redis.resources.limits.memory | default "4Gi" | toString -}}
{{- $unit := regexFind "[a-zA-Z]+$" $memory -}}
{{- $units := dict "Ki" 1024 "Mi" 1048576 "Gi" 1073741824 "Ti" 1099511627776 "Pi" 1125899906842624 "Ei" 1152921504606846976 "k" 1000 "M" 1000000 "G" 1000000000 "T" 1000000000000 "P" 1000000000000000 "E" 1000000000000000000 "m" 0.001 -}}
{{- $multiplier := 1.0 -}}
{{- if $unit }}
  {{- if not (hasKey $units $unit) }}{{ fail "Unsupported redis.resources.limits.memory quantity" }}{{ end -}}
  {{- $multiplier = get $units $unit | float64 -}}
{{- end -}}
{{- $memoryBytes := mulf (regexReplaceAll "[a-zA-Z]+$" $memory "" | float64) $multiplier -}}
{{- $maxmemory := mulf $memoryBytes 0.8 | floor | int64 -}}
{{- if le $maxmemory 0 }}{{ fail "redis.resources.limits.memory must be positive" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the single replica holds an RWO PVC, and a
  # rolling surge pod deadlocks on it (Multi-Attach: the new pod cannot mount
  # the volume until the old one dies, which waits on the new pod's
  # readiness). Only surfaces on upgrades that change the pod spec.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.redis.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.redis.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $redisNodeSelector := .Values.redis.nodeSelector | default dict }}
      {{- if and (not $redisNodeSelector) .Values.global .Values.global.scheduling }}
        {{- $redisNodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $redisNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $redisTolerations := .Values.redis.tolerations | default list }}
      {{- if and (not $redisTolerations) .Values.global .Values.global.scheduling }}
        {{- $redisTolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $redisTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity: component-level overrides global */ -}}
      {{- $redisAffinity := .Values.redis.affinity | default dict }}
      {{- if and (not $redisAffinity) .Values.global .Values.global.scheduling }}
        {{- $redisAffinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $redisAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.redis.image "name" "valkey") | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | default "200m" }}
              memory: {{ .Values.redis.resources.requests.memory | default "256Mi" }}
            limits:
              {{- with .Values.redis.resources.limits.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              memory: {{ .Values.redis.resources.limits.memory | default "4Gi" }}
          # --dir is explicit so the AOF/RDB land on the PVC regardless of the
          # image's WORKDIR (DHI images may differ from the official valkey image).
          # --protected-mode no is required with DHI images: the official
          # valkey/redis Docker images patch the compiled default to "no", but
          # hardened images keep the upstream default ("yes"), which rejects
          # every non-loopback connection when no password is set and breaks
          # HPS, SRH, and the valkey-admin console. The service is ClusterIP,
          # so it is only reachable from inside the cluster.
          # Keep the measured every-second AOF policy. Ownership must not be
          # evicted under memory pressure; AOF does not provide batch rollback.
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", {{ $maxmemory | quote }}, "--maxmemory-policy", "noeviction", "--dir", "/data", "--protected-mode", "no"]
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "rulebricks-chart.redis.pvc" . }}
{{- end }}
