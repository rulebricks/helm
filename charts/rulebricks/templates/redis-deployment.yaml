{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.redis.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.redis.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $redisNodeSelector := .Values.redis.nodeSelector | default dict }}
      {{- if and (not $redisNodeSelector) .Values.global .Values.global.scheduling }}
        {{- $redisNodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $redisNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $redisTolerations := .Values.redis.tolerations | default list }}
      {{- if and (not $redisTolerations) .Values.global .Values.global.scheduling }}
        {{- $redisTolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $redisTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity: component-level overrides global */ -}}
      {{- $redisAffinity := .Values.redis.affinity | default dict }}
      {{- if and (not $redisAffinity) .Values.global .Values.global.scheduling }}
        {{- $redisAffinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $redisAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.redis.image "name" "valkey") | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | default "200m" }}
              memory: {{ .Values.redis.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.redis.resources.limits.memory | default "4Gi" }}
          # --dir is explicit so the AOF/RDB land on the PVC regardless of the
          # image's WORKDIR (DHI images may differ from the official valkey image).
          # --protected-mode no is required with DHI images: the official
          # valkey/redis Docker images patch the compiled default to "no", but
          # hardened images keep the upstream default ("yes"), which rejects
          # every non-loopback connection when no password is set and breaks
          # HPS, SRH, and the valkey-admin console. The service is ClusterIP,
          # so it is only reachable from inside the cluster.
          args: ["--appendonly", "yes", "--dir", "/data", "--protected-mode", "no"]
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "rulebricks-chart.redis.pvc" . }}
{{- end }}