{{- /*
Image pre-pull DaemonSet: warms the HPS server and worker images onto every
node (including freshly autoscaled burst nodes) so the first real pod on a
new node skips the 20-40s image pull during a burst scale-out. initContainers
run `node -e ""` (both images are Node-based) and exit immediately; the pause
main container keeps the DaemonSet pod resident so the kubelet retains the
images. Requests are near-zero so this never affects bin-packing.
*/}}
{{- $prepull := (.Values.hps).imagePrepull | default dict }}
{{- /* Default true, but respect an explicit `enabled: false` (a plain
     `| default true` would treat the boolean false as empty and re-enable it). */ -}}
{{- $prepullEnabled := true }}
{{- if hasKey $prepull "enabled" }}
{{- $prepullEnabled = $prepull.enabled }}
{{- end }}
{{- if and .Values.hps .Values.hps.enabled $prepullEnabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rulebricks-chart.hps.fullname" . }}-image-prepull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-prepull
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.hps.fullname" . }}-image-prepull
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.hps.fullname" . }}-image-prepull
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: image-prepull
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      {{- /* Reach the Rulebricks burst pool by default without tolerating
           shutdown, out-of-service, or unreachable node taints. Add explicit
           prepull.tolerations for architecture taints when needed. */}}
      {{- $defaultPrepullTolerations := list (dict "key" "rulebricks.com/pool" "operator" "Equal" "value" "burst" "effect" "NoSchedule") }}
      {{- $prepullTolerations := $prepull.tolerations | default $defaultPrepullTolerations }}
      tolerations:
        {{- toYaml $prepullTolerations | nindent 8 }}
      {{- with $prepull.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $prepullResources := $prepull.resources | default dict }}
      {{- $initResources := $prepullResources.init | default (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "128Mi")) }}
      {{- $pauseResources := $prepullResources.pause | default (dict "requests" (dict "cpu" "5m" "memory" "16Mi") "limits" (dict "cpu" "10m" "memory" "32Mi")) }}
      initContainers:
        - name: prepull-hps
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" (merge (dict "tag" (include "rulebricks-chart.hps.imageTag" .)) .Values.hps.image)) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["node", "-e", "process.exit(0)"]
          resources:
            {{- toYaml $initResources | nindent 12 }}
        - name: prepull-hps-worker
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" (merge (dict "tag" (printf "worker-%s" (include "rulebricks-chart.hps.imageTag" .))) .Values.hps.image)) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["node", "-e", "process.exit(0)"]
          resources:
            {{- toYaml $initResources | nindent 12 }}
      containers:
        - name: pause
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.global.images.pause "name" "pause") | quote }}
          resources:
            {{- toYaml $pauseResources | nindent 12 }}
{{- end }}
