apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.serverless-redis-http.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: serverless-redis-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.serverless-redis-http.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.serverless-redis-http.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels (uses redis settings) */ -}}
        {{- with .Values.redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* Node selector: uses redis settings, falls back to global */ -}}
      {{- $srhNodeSelector := .Values.redis.nodeSelector | default dict }}
      {{- if and (not $srhNodeSelector) .Values.global .Values.global.scheduling }}
        {{- $srhNodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $srhNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: uses redis settings, falls back to global */ -}}
      {{- $srhTolerations := .Values.redis.tolerations | default list }}
      {{- if and (not $srhTolerations) .Values.global .Values.global.scheduling }}
        {{- $srhTolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $srhTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: serverless-redis-http
          image: hiett/serverless-redis-http:latest
          ports:
            - containerPort: 80
          env:
            - name: SRH_MODE
              value: "env"
            - name: SRH_TOKEN
              {{- if .Values.redis.enabled }}
              value: "local_redis"
              {{- else }}
              value: {{ include "rulebricks-chart.redis.httpToken" . | quote }}
              {{- end }}
            {{- /* External Redis password: defined before SRH_CONNECTION_STRING so Kubernetes
                   $(VAR) expansion can inject it into the connection string at runtime. */ -}}
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            {{- end }}
            - name: SRH_CONNECTION_STRING
              {{- if .Values.redis.enabled }}
              # Reference the templated redis service name
              value: "redis://{{ include "rulebricks-chart.redis.fullname" . }}:6379"
              {{- else if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
              value: {{ include "rulebricks-chart.redis.connectionStringAuth" . | quote }}
              {{- else }}
              value: {{ include "rulebricks-chart.redis.connectionString" . | quote }}
              {{- end }}
          {{- with .Values.redis.serverlessHttp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redis.serverlessHttp.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redis.serverlessHttp.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}