{{- if and .Values.hps .Values.hps.enabled .Values.hps.workers.enabled .Values.hps.workers.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rulebricks-chart.hps-worker.fullname" . }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-worker-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rulebricks-chart.hps-worker.fullname" . }}
  minReplicaCount: {{ .Values.hps.workers.keda.minReplicaCount | default 3 }}
  {{- /* Bounded by the solution topic partition count: workers beyond it sit idle. */}}
  maxReplicaCount: {{ .Values.hps.workers.keda.maxReplicaCount | default 48 }}
  pollingInterval: {{ .Values.hps.workers.keda.pollingInterval | default 15 }}  # Check interval in seconds
  cooldownPeriod: {{ .Values.hps.workers.keda.cooldownPeriod | default 300 }}  # Wait before scaling down in seconds
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- if .Values.hps.workers.keda.scalingBehavior }}
        {{- toYaml .Values.hps.workers.keda.scalingBehavior | nindent 8 }}
        {{- else }}
        {{- /* Rule traffic is bursty (idle -> firehose). Scale-up is
             exponential: act immediately (no stabilization) and double the
             fleet (or add 8 pods, whichever is greater) every 15s, so
             min -> max takes ~3-4 doubling periods. Scale-down is smooth: wait
             out a 5-minute quiet window, then shed at most 25% of replicas per
             minute so a brief lull between bursts never collapses the fleet. */}}
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 8
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Max
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        {{- end }}
  triggers:
  # Primary triggers: Kafka lag for each topic
  - type: kafka
    metadata:
      # Use templated Kafka bootstrap servers - handles any release name and namespace
      {{- $kafkaBrokers := "" }}
      {{- if and .Values.app .Values.app.logging .Values.app.logging.kafkaBrokers }}
        {{- $kafkaBrokers = .Values.app.logging.kafkaBrokers }}
      {{- else }}
        {{- $kafkaBrokers = (include "rulebricks-chart.kafka.bootstrapServers" .) }}
      {{- end }}
      bootstrapServers: {{ $kafkaBrokers }}
      consumerGroup: generic-workers
      # Must match the topic HPS actually produces/consumes (HPS applies the prefix).
      topic: {{ include "rulebricks-chart.kafka.topicPrefix" . }}solution
      # Lag is in MESSAGES; with chunked bulk dispatch each message is a
      # bounded unit of work, so this approximates seconds of fleet backlog.
      lagThreshold: "{{ .Values.hps.workers.keda.lagThreshold | default 100 }}"
      offsetResetPolicy: latest
  # Backup trigger: CPU (in case Kafka metrics fail)
  - type: cpu
    metadata:
      type: Utilization
      value: "{{ .Values.hps.workers.keda.cpuThreshold | default 25 }}"
{{- end }}
