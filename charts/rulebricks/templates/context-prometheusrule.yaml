{{- if and (eq (include "rulebricks-chart.contexts.enabled" .) "true") .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-context-pipeline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-monitoring
spec:
  groups:
    - name: rulebricks.contexts
      rules:
        - alert: RulebricksContextWorkStalled
          expr: max(rulebricks_context_work_oldest_age_seconds{namespace="{{ .Release.Namespace }}"}) > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Context work has remained unprocessed"
            description: "The oldest authoritative Postgres Context work item is over five minutes old."
        - alert: RulebricksContextTopicLagHigh
          expr: sum(kafka_consumergroup_lag{namespace="{{ .Release.Namespace }}",consumergroup="{{ .Values.hps.contexts.consumerGroup | default "context-workers" }}",topic="{{ include "rulebricks-chart.contexts.topic" . }}"}) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Context Kafka transport lag is high"
            description: "The context-workers group has more than 1,000 compact work IDs waiting."
        - alert: RulebricksContextDispatchFailures
          expr: ((sum(increase(rulebricks_hps_context_dispatch_total{namespace="{{ .Release.Namespace }}",outcome="delayed"}[10m])) or vector(0)) + (sum(increase(rulebricks_context_work_total{namespace="{{ .Release.Namespace }}",role="dispatcher",outcome="partial"}[10m])) or vector(0))) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Context dispatcher is failing to publish work IDs"
            description: "Postgres remains authoritative, but dispatch failures are delaying Context processing."
        - alert: RulebricksContextWorkersUnavailable
          expr: max(rulebricks_context_process_up{namespace="{{ .Release.Namespace }}",role="worker"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No healthy Context worker consumer"
            description: "All scraped Context workers report their Kafka consumer down."
        - alert: RulebricksContextBatchErrors
          expr: increase(rulebricks_hps_context_batches_total{namespace="{{ .Release.Namespace }}",outcome="error"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Context batch items are failing"
            description: "One or more Context batch items entered an error state in the last 15 minutes."
{{- end }}
