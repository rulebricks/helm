{{- if eq (include "rulebricks-chart.contexts.enabled" .) "true" }}
{{- $dispatcherPdb := (.Values.hps.contexts.dispatcher.podDisruptionBudget | default dict) -}}
{{- if $dispatcherPdb.enabled }}
{{- if and $dispatcherPdb.minAvailable $dispatcherPdb.maxUnavailable }}
{{- fail "hps.contexts.dispatcher.podDisruptionBudget: set only one of minAvailable or maxUnavailable" }}
{{- end }}
{{- if not (or $dispatcherPdb.minAvailable $dispatcherPdb.maxUnavailable) }}
{{- fail "hps.contexts.dispatcher.podDisruptionBudget: set minAvailable or maxUnavailable when enabled" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-dispatcher
spec:
  {{- with $dispatcherPdb.minAvailable }}
  minAvailable: {{ if contains "%" (toString .) }}{{ . | quote }}{{ else }}{{ int . }}{{ end }}
  {{- end }}
  {{- with $dispatcherPdb.maxUnavailable }}
  maxUnavailable: {{ if contains "%" (toString .) }}{{ . | quote }}{{ else }}{{ int . }}{{ end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.context-dispatcher.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- end }}
{{- $workerPdb := (.Values.hps.contexts.workers.podDisruptionBudget | default dict) -}}
{{- if $workerPdb.enabled }}
{{- if and $workerPdb.minAvailable $workerPdb.maxUnavailable }}
{{- fail "hps.contexts.workers.podDisruptionBudget: set only one of minAvailable or maxUnavailable" }}
{{- end }}
{{- if not (or $workerPdb.minAvailable $workerPdb.maxUnavailable) }}
{{- fail "hps.contexts.workers.podDisruptionBudget: set minAvailable or maxUnavailable when enabled" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rulebricks-chart.context-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: context-worker
spec:
  {{- with $workerPdb.minAvailable }}
  minAvailable: {{ if contains "%" (toString .) }}{{ . | quote }}{{ else }}{{ int . }}{{ end }}
  {{- end }}
  {{- with $workerPdb.maxUnavailable }}
  maxUnavailable: {{ if contains "%" (toString .) }}{{ . | quote }}{{ else }}{{ int . }}{{ end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.context-worker.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
