apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rulebricks-chart.fullname" . }}-test-connection"
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
      command: ['wget']
      args: ['{{ include "rulebricks-chart.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
