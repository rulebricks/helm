{{- /*
HPS gather-plane autoscaler.

HPS pods do double duty: they serve HTTP AND consume/parse every chunk
response from the solution-response topic (the "gather plane"). Gather work
scales linearly with request rate, so a fixed replica count becomes the
system's throughput ceiling (observed in load testing: response-topic lag
accumulates, latency climbs, client throughput plateaus while workers and
Kafka sit idle).

WHY THIS SCALER IS DELIBERATELY CONSERVATIVE (unlike the worker scaler):
workers send each response to an EXPLICIT partition chosen at request time
from the partitions the originating HPS pod owned at that moment
(selectResponsePartition). Every HPS scale event rebalances the response
consumer group (kafkajs eager protocol), so partition ownership moves and
responses for in-flight requests can land on a pod with no registered
handler - those requests time out. Scale events must therefore be RARE and
one-pod-at-a-time: long stabilization windows, single-pod policies. Do NOT
copy the worker scaler's exponential behavior here until the app gains
sticky assignment or cross-pod handler handoff.
*/}}
{{- if and .Values.hps .Values.hps.enabled (.Values.hps.keda).enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rulebricks-chart.hps.fullname" . }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rulebricks-chart.hps.fullname" . }}
  minReplicaCount: {{ .Values.hps.keda.minReplicaCount | default (.Values.hps.replicas | default 2) }}
  maxReplicaCount: {{ .Values.hps.keda.maxReplicaCount | default 8 }}
  pollingInterval: {{ .Values.hps.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.hps.keda.cooldownPeriod | default 600 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          selectPolicy: Max
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
        scaleDown:
          stabilizationWindowSeconds: 900
          selectPolicy: Max
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    {{- /* Under GCP-flavored OAUTHBEARER the KEDA operator can't reach Kafka
         directly, so skip the lag trigger and rely on the CPU fallback. */}}
    {{- if not (include "rulebricks-chart.kafka.gatedTokenAuth" .) }}
    # Primary: response-topic lag for the gather consumer group. Lag here
    # means responses are waiting to be parsed/dispatched - the direct
    # signal that the gather plane is the bottleneck.
    - type: kafka
      metadata:
        {{- $kafkaBrokers := "" }}
        {{- $externalKafka := false }}
        {{- if and .Values.app .Values.app.logging .Values.app.logging.kafkaBrokers }}
          {{- $kafkaBrokers = .Values.app.logging.kafkaBrokers }}
          {{- $externalKafka = true }}
        {{- else }}
          {{- $kafkaBrokers = (include "rulebricks-chart.kafka.bootstrapServers" .) }}
        {{- end }}
        bootstrapServers: {{ $kafkaBrokers }}
        consumerGroup: hps-response-consumer
        topic: {{ include "rulebricks-chart.kafka.topicPrefix" . }}solution-response
        lagThreshold: "{{ .Values.hps.keda.lagThreshold | default 300 }}"
        offsetResetPolicy: latest
      {{- if and $externalKafka (include "rulebricks-chart.kafka.awsIamAuth" .) }}
        {{- /* MSK IAM = KEDA's oauthbearer SASL with the aws_msk_iam token
             provider (there is no `sasl: aws_msk_iam` mode). TLS-only, and
             KEDA has no env fallback for the region. */}}
        {{- $sasl := (((.Values.app).logging).kafkaSasl) | default dict }}
        tls: enable
        sasl: oauthbearer
        saslTokenProvider: aws_msk_iam
        awsRegion: {{ required "app.logging.kafkaSasl.region is required when kafkaSasl.mechanism is aws-iam" $sasl.region }}
      authenticationRef:
        name: {{ include "rulebricks-chart.kafka.triggerAuthName" . }}
      {{- else if include "rulebricks-chart.kafka.kedaSaslMode" . }}
      {{- /* External Kafka with a static SASL credential: see the worker scaler
           for the rationale. Empty (unchanged trigger) for in-cluster Kafka. */}}
        tls: {{ include "rulebricks-chart.kafka.kedaTlsMode" . }}
        sasl: {{ include "rulebricks-chart.kafka.kedaSaslMode" . }}
      authenticationRef:
        name: {{ include "rulebricks-chart.kafka.triggerAuthName" . }}
      {{- end }}
    {{- end }}
    # Fallback: CPU (event-loop pressure shows up as CPU on the hps container);
    # the sole trigger under GCP-flavored token auth.
    {{- /* metricType (not metadata.type) is the KEDA >= 2.7 form; the legacy
         metadata 'type' key was removed in KEDA 2.18 and makes the whole
         ScaledObject fail to parse ("KEDAScalerFailed"), silently disabling
         autoscaling. */}}
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.hps.keda.cpuThreshold | default 60 }}"
{{- end }}
