{{- if and .Values.hps .Values.hps.enabled }}
{{- /* HPS is stateless: no volumes, no reliance on stable pod identity. It was
     historically a StatefulSet because response partitions were derived from
     the pod ordinal; partition selection now comes from live consumer-group
     assignments (gated by the /ready probe), so a Deployment is correct.
     UPGRADE NOTE: releases prior to this change shipped a StatefulSet (and a
     companion -hps-headless Service) with the same name; Helm replaces the
     workload kind and removes the headless Service during upgrade. HPS pods
     briefly cycle and the response consumer group rebalances once. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rulebricks-chart.hps.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hps
spec:
  replicas: {{ .Values.hps.replicas | default 1 }}
  {{- /* Surge one pod at a time and wait for readiness (Kafka group join)
       before terminating an old pod: every HPS membership change rebalances
       the response consumer group, so rollouts must stay gradual - the same
       reasoning as the deliberately conservative KEDA scaler (hps-keda.yaml). */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rulebricks-chart.hps.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rulebricks-chart.hps.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hps
        rulebricks.com/workload-group: application
        {{- /* Global pod labels */ -}}
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- /* Component-specific pod labels */ -}}
        {{- with .Values.hps.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      serviceAccountName: {{ include "rulebricks-chart.hps.serviceAccountName" . }}
      {{- /* Node selector: component-level overrides global */ -}}
      {{- $nodeSelector := .Values.hps.nodeSelector | default dict }}
      {{- if and (not $nodeSelector) .Values.global .Values.global.scheduling }}
        {{- $nodeSelector = .Values.global.scheduling.nodeSelector | default dict }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: component-level overrides global */ -}}
      {{- $tolerations := .Values.hps.tolerations | default list }}
      {{- if and (not $tolerations) .Values.global .Values.global.scheduling }}
        {{- $tolerations = .Values.global.scheduling.tolerations | default list }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Affinity: component-level overrides global */ -}}
      {{- $hpsAffinity := .Values.hps.affinity | default dict }}
      {{- if and (not $hpsAffinity) .Values.global .Values.global.scheduling }}
        {{- $hpsAffinity = .Values.global.scheduling.affinity | default dict }}
      {{- end }}
      {{- with $hpsAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hps.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $hpsAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: rulebricks.com/workload-group
                  operator: In
                  values:
                  - infrastructure
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- /* Only wait for the in-cluster Kafka service. When external brokers are
             configured (app.logging.kafkaBrokers set), the service does not exist. */ -}}
      {{- $externalKafka := false }}
      {{- if and .Values.app.logging .Values.app.logging.kafkaBrokers }}
      {{- $externalKafka = true }}
      {{- end }}
      {{- if not $externalKafka }}
      initContainers:
        {{- /* Wait for the broker AND the consumer-group coordinator to be
             serving before HPS starts. On a fresh cluster the coordinator is
             often still loading after the broker port opens; starting HPS then
             leaves its consumer unable to join and /ready stuck at 503. JMX is
             disabled so the Kafka CLI does not try to bind the broker JMX port. */}}
        - name: wait-for-kafka
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
          command: ["sh", "-ec"]
          args:
            - |
              BOOT="{{ .Release.Name }}-kafka-kafka-bootstrap"
              echo "Waiting for Kafka bootstrap $BOOT:9092 ..."
              until echo | nc -w 2 "$BOOT" 9092 2>/dev/null; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka bootstrap reachable!"
      {{- end }}
      containers:
        - name: hps
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" (merge (dict "tag" (include "rulebricks-chart.hps.imageTag" .)) .Values.hps.image)) | quote }}
          imagePullPolicy: {{ .Values.hps.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.hps.resources.requests.cpu | default "1000m" }}
              memory: {{ .Values.hps.resources.requests.memory | default "1Gi" }}
            limits:
              cpu: {{ .Values.hps.resources.limits.cpu | default "2000m" }}
              memory: {{ .Values.hps.resources.limits.memory | default "2Gi" }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold }}
          {{- /* Readiness gates on the Kafka response consumer owning
               partitions (/ready returns 503 until group join); pods must not
               receive traffic while they would have to guess response
               partitions. Liveness stays on /health (process-alive). Requires
               an HPS image that serves /ready (ships with this chart version). */}}
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold }}
          envFrom:
            - configMapRef:
                name: {{ include "rulebricks-chart.app.configmap" . }}
            - secretRef:
                name: {{ include "rulebricks-chart.app.secretName" . | trim }}
            {{- /* Extra envFrom references */ -}}
            {{- with .Values.hps.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Supabase service key (from the shared app secret). Use the same
            # external-secret key mapping as the app container.
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks-chart.app.secretName" . | trim }}
                  key: {{ include "rulebricks-chart.app.secretKey" (dict "root" . "field" "supabaseServiceKey" "default" "SUPABASE_SERVICE_KEY") | trim }}
            {{- if eq (include "rulebricks-chart.redis.hasAuth" .) "true" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "rulebricks-chart.redis.passwordSecretRef" . | nindent 18 }}
            - name: REDIS_URL
              value: {{ include "rulebricks-chart.redis.connectionStringAuth" . | quote }}
            {{- end }}
            - name: HPS_REPLICAS
              value: "{{ .Values.hps.replicas }}"
            {{- /* MAX_WORKERS is HPS's view of the solution topic partition
                 count (fallback partition estimation + health reporting).
                 Decoupled from keda.maxReplicaCount, which is a replica
                 bound, not a partition count. */}}
            - name: MAX_WORKERS
              value: "{{ .Values.hps.workers.solutionPartitions | default (.Values.hps.workers.keda.maxReplicaCount | default 8) }}"
            {{- with .Values.app.logging.kafkaSasl }}
            {{- if .existingSecret }}
            # Optional external Kafka SASL credentials secret
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- /* OpenTelemetry tracing env (no-op unless global.tracing.enabled) */ -}}
            {{- include "rulebricks-chart.tracing.env" (dict "root" . "serviceName" "rulebricks-hps") | nindent 12 }}
            {{- /* Extra environment variables */ -}}
            {{- with .Values.hps.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
