{{- $exporter := .Values.kafkaExporter | default dict -}}
{{- /* kafka-exporter (danielqsj, chart ships v1.9.0) speaks PLAIN/SCRAM natively
     (credentials inherited from app.logging.kafkaSasl - existingSecret or the
     chart's app secret) and AWS MSK IAM via --sasl.mechanism=awsiam (credentials
     come from the pod's IAM identity - attach a role to the exporter's
     ServiceAccount via IRSA or an EKS Pod Identity association, see
     kafkaExporter.serviceAccount). Only GCP-flavored OAUTHBEARER
     (metadata-server tokens) remains unsupported and auto-skips; front the
     broker with the kafka-proxy bridge and set forceEnable if you need Kafka
     metrics there. */}}
{{- if and $exporter.enabled (or $exporter.forceEnable (not (include "rulebricks-chart.kafka.gatedTokenAuth" .))) }}
{{- $name := include "rulebricks-chart.kafkaExporter.fullname" . -}}
{{- $image := $exporter.image | default dict -}}
{{- $service := $exporter.service | default dict -}}
{{- $resources := $exporter.resources | default dict -}}
{{- $brokers := $exporter.brokers | default .Values.app.logging.kafkaBrokers | default (printf "%s-kafka-kafka-bootstrap:9092" .Release.Name) -}}
{{- /* SASL/TLS only apply when the exporter targets EXTERNAL brokers: kafkaSasl
     describes the external cluster's auth, and the in-cluster Strimzi listener
     is plaintext (a stray mechanism must not break the in-cluster exporter). */ -}}
{{- $externalBrokers := or $exporter.brokers .Values.app.logging.kafkaBrokers -}}
{{- $sasl := (((.Values.app).logging).kafkaSasl) | default dict -}}
{{- $awsIam := and $externalBrokers (include "rulebricks-chart.kafka.awsIamAuth" .) -}}
{{- $staticMechanism := include "rulebricks-chart.kafka.exporterSaslMechanism" . -}}
{{- /* Static PLAIN/SCRAM needs a credential to carry: an existingSecret, or
     inline username/password rendered into the chart's app secret. */ -}}
{{- $staticSasl := and $externalBrokers $staticMechanism (or $sasl.existingSecret $sasl.username) -}}
{{- $kafkaSsl := eq (toString (.Values.app.logging.kafkaSsl | default false)) "true" -}}
{{- $serviceAccount := $exporter.serviceAccount | default dict -}}
{{- $saCreate := true -}}{{- if hasKey $serviceAccount "create" }}{{- $saCreate = $serviceAccount.create }}{{- end -}}
{{- $saName := $serviceAccount.name | default (ternary $name "default" $saCreate) -}}
{{- if $saCreate }}
{{- /* Dedicated ServiceAccount so the exporter's IAM role (MSK IAM metrics
     read) can be scoped narrowly, separate from HPS/app identities. Inert on
     clusters that don't attach an identity to it. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kafka-exporter
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- with $exporter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $exporter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $saName }}
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      {{- with $exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-exporter
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" $image "name" "kafka-exporter") | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          {{- if $staticSasl }}
          {{- /* Same credential resolution as the KEDA TriggerAuthentication:
               the user's existingSecret (with its configurable key names), else
               the chart's app secret where inline kafkaSasl.username/password
               are rendered. Exposed as env so the password reaches the flags
               via $(VAR) expansion and never lands in the pod spec. */}}
          {{- $secretName := $sasl.existingSecret | default (include "rulebricks-chart.app.secretName" . | trim) }}
          env:
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $sasl.existingSecretUsernameKey | default "KAFKA_SASL_USERNAME" }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $sasl.existingSecretPasswordKey | default "KAFKA_SASL_PASSWORD" }}
          {{- end }}
          args:
            {{- range $broker := splitList "," $brokers }}
            - --kafka.server={{ trim $broker }}
            {{- end }}
            - --topic.filter={{ $exporter.topicFilter | default ".*" }}
            - --group.filter={{ $exporter.groupFilter | default ".*" }}
            {{- if $awsIam }}
            {{- /* Credentials come from the pod's IAM identity via the
                 ServiceAccount above. Region falls back to the AWS_REGION env
                 the IRSA webhook injects when unset. */}}
            - --sasl.enabled
            - --sasl.mechanism=awsiam
            {{- with $sasl.region }}
            - --sasl.aws-region={{ . }}
            {{- end }}
            {{- else if $staticSasl }}
            - --sasl.enabled
            - --sasl.mechanism={{ $staticMechanism }}
            - --sasl.username=$(KAFKA_SASL_USERNAME)
            - --sasl.password=$(KAFKA_SASL_PASSWORD)
            {{- end }}
            {{- /* MSK IAM is TLS-only; otherwise TLS follows kafkaSsl. */}}
            {{- if or $awsIam (and $externalBrokers $kafkaSsl) }}
            - --tls.enabled
            {{- end }}
            {{- if $exporter.tlsInsecureSkipVerify }}
            - --tls.insecure-skip-tls-verify
            {{- end }}
            {{- range $exporter.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          resources:
            {{- toYaml $resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $service.port | default 9308 }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- $serviceMonitor := $exporter.serviceMonitor | default dict -}}
{{- if and ($serviceMonitor.enabled | default true) .Values.metrics .Values.metrics.serviceMonitor .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $serviceMonitor.interval | default .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ $serviceMonitor.scrapeTimeout | default .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
{{- end }}
