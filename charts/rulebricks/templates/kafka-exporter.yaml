{{- $exporter := .Values.kafkaExporter | default dict -}}
{{- /* kafka-exporter (danielqsj) only speaks PLAIN/SCRAM/GSSAPI, so it cannot
     authenticate to a token-auth broker (AWS MSK IAM / GCP OAUTHBEARER) and would
     crashloop. Auto-skip under token auth unless explicitly forced; front it with
     the kafka-proxy bridge if you need Kafka metrics against a managed cluster. */}}
{{- if and $exporter.enabled (or $exporter.forceEnable (not (include "rulebricks-chart.kafka.tokenAuth" .))) }}
{{- $name := include "rulebricks-chart.kafkaExporter.fullname" . -}}
{{- $image := $exporter.image | default dict -}}
{{- $service := $exporter.service | default dict -}}
{{- $resources := $exporter.resources | default dict -}}
{{- $brokers := $exporter.brokers | default .Values.app.logging.kafkaBrokers | default (printf "%s-kafka-kafka-bootstrap:9092" .Release.Name) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kafka-exporter
        {{- if and .Values.global .Values.global.podLabels }}
        {{- toYaml .Values.global.podLabels | nindent 8 }}
        {{- end }}
        {{- with $exporter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $exporter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      {{- with $exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka-exporter
          image: {{ include "rulebricks-chart.image" (dict "root" $ "image" $image "name" "kafka-exporter") | quote }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          args:
            {{- range $broker := splitList "," $brokers }}
            - --kafka.server={{ trim $broker }}
            {{- end }}
            - --topic.filter={{ $exporter.topicFilter | default ".*" }}
            - --group.filter={{ $exporter.groupFilter | default ".*" }}
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          resources:
            {{- toYaml $resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $service.port | default 9308 }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- $serviceMonitor := $exporter.serviceMonitor | default dict -}}
{{- if and ($serviceMonitor.enabled | default true) .Values.metrics .Values.metrics.serviceMonitor .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $serviceMonitor.interval | default .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ $serviceMonitor.scrapeTimeout | default .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
{{- end }}
