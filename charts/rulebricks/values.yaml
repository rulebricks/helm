app:
  image:
    registry: docker.io
    repository: rulebricks/app
    pullPolicy: IfNotPresent
  replicas: 2
  # Node scheduling configuration. Keep overrides preferred-only unless your
  # platform team intentionally wants hard placement.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional labels for pods (merged with global.podLabels)
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Additional annotations for pods (merged with global.podAnnotations)
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # The app runs a CPU-bound startup pass before serving on :3000; keep a real
  # CPU baseline or startup can overrun the liveness probe window.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2000m"
      memory: 2Gi
  # Extra environment variables to inject (list of name/value or valueFrom objects).
  # The chart sets HOSTNAME=0.0.0.0 by default so the server binds all
  # interfaces; adding your own HOSTNAME entry replaces that default.
  # Example:
  #   - name: MY_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: value
  extraEnv: []
  # Extra envFrom references (additional ConfigMaps/Secrets to load)
  # Example:
  #   - configMapRef:
  #       name: app-extra-config
  #   - secretRef:
  #       name: app-extra-secrets
  extraEnvFrom: []
  # Logging/Kafka configuration (optional)
  logging:
    enabled: false
    kafkaBrokers: ""  # Override Kafka brokers URL, defaults to in-cluster Kafka
    kafkaTopic: "logs"
    # Prefix applied to all Kafka topic names so they don't collide on a
    # shared or managed cluster. Set to "" to disable prefixing.
    kafkaTopicPrefix: "com.rulebricks."
    kafkaSsl: false
    kafkaSasl:
      mechanism: ""    # "aws-iam" | "scram-sha-256" | "scram-sha-512" | "plain" | ""
      region: ""       # Required when mechanism is "aws-iam"; credentials come from pod IAM.
      username: ""     # SCRAM/PLAIN only
      password: ""     # SCRAM/PLAIN only
      existingSecret: ""
      existingSecretUsernameKey: "KAFKA_SASL_USERNAME"
      existingSecretPasswordKey: "KAFKA_SASL_PASSWORD"
  # ClickHouse credentials for the decision-log query path. Set existingSecret
  # to match a BYO clickhouse.auth.existingSecret in the parent chart.
  clickhouse:
    existingSecret: ""
    existingSecretKey: "admin-password"
  # SMTP configuration (optional, can also be set via global.smtp)
  smtp: {}
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  tlsEnabled: true
  email: "support@rulebricks.com"
  licenseKey: ""
  supabaseUrl: ""
  supabaseServiceKey: ""
  supabaseAnonKey: ""

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
  app:
    path: /api/metrics
  hps:
    path: /metrics
  worker:
    # Workers expose Prometheus metrics here, scraped via the headless worker
    # Service and ServiceMonitor.
    path: /metrics
    port: 3000

hps:
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/hps
    pullPolicy: Always
  replicas: 1
  # Autoscaler for the HPS request plane. Conservative by design: HPS scale
  # events rebalance the response consumer group, so pods are added and
  # removed gradually.
  keda:
    enabled: false
    minReplicaCount: 2
    # Leave maxReplicaCount unset to inherit the derived default.
    # maxReplicaCount: 16
    pollingInterval: 15
    cooldownPeriod: 600
    # Response-topic backlog (messages) that triggers scale-up.
    lagThreshold: 50
    # CPU percentage of request that triggers scale-up.
    cpuThreshold: 45
  # Fleet warm-up (/api/v1/scale): pre-scales the worker fleet to its ceiling
  # ahead of large batch workloads. Requires a shared Redis backend.
  warmup:
    enabled: true
    # How long one warm-up call holds the fleet at max; repeat calls refresh it.
    ttlSeconds: 600
    # One-shot post-install prewarm so image prepull caches images on burst
    # nodes before they deallocate (useful on Azure).
    prewarmOnInstall: false
  # Pre-pull the HPS server and worker images onto every node (DaemonSet) so
  # burst scale-outs skip the image pull on freshly provisioned nodes.
  imagePrepull:
    enabled: true
    # Add architecture tolerations here if your node pools are tainted.
    nodeSelector: {}
    tolerations:
      - key: rulebricks.com/pool
        operator: Equal
        value: burst
        effect: NoSchedule
    resources:
      init:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      pause:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 10m
          memory: 32Mi
  # Node scheduling configuration. Custom affinity can include stricter rules
  # if your platform team requires them.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional custom topology spread constraints. The chart does not set a
  # default spread rule so compute pods can prefer non-infrastructure nodes.
  # topologySpreadConstraints: []
  # Pod labels/annotations
  podLabels: {}
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # Payload and deadline envelope, rendered into HPS/worker env vars. These
  # defaults support 20 MiB serialized items; size bodyLimitBytes, the Kafka
  # message caps, and nodeHeapMb/resources together when tuning.
  limits:
    bodyLimitBytes: 134217728 # HTTP_BODY_LIMIT_BYTES
    rpcTimeoutMs: 60000 # RPC_TIMEOUT_MS (whole-request Kafka deadline)
    requestTimeoutMs: 30000 # HTTP_REQUEST_TIMEOUT_MS (body receive)
    itemMaxBytes: 20971520 # ITEM_MAX_BYTES (per payload in a bulk array)
    contextBatchBodyLimitBytes: 4718592 # CONTEXT_BATCH_BODY_LIMIT_BYTES
    contextBatchMaxItems: 10000 # CONTEXT_BATCH_MAX_ITEMS
    largeBodyThresholdBytes: 8388608 # LARGE_BODY_THRESHOLD_BYTES (gate)
    largeBodyMaxConcurrent: 2 # LARGE_BODY_MAX_CONCURRENT (per replica)
    chunkMaxChunks: 64 # CHUNK_MAX_CHUNKS (max fan-out per request)
    chunkHardMaxBytes: 1048576 # CHUNK_HARD_MAX_BYTES (per-chunk input cap)
    responseFetchMaxBytes: 67108864 # RESPONSE_MAX_BYTES_PER_PARTITION (HPS)
    workerFetchMaxBytes: 67108864 # WORKER_MAX_BYTES_PER_PARTITION (worker)
    logRetryBufferMaxBytes: 134217728 # LOG_RETRY_BUFFER_MAX_BYTES (HPS + worker)
    shutdownDrainMs: 25000 # KAFKA_SHUTDOWN_DRAIN_MS (in-flight drain)
    terminationGracePeriodSeconds: 30 # HPS pod grace (>= drain + overhead)
    # nodeHeapMb: 1024 # NODE_OPTIONS --max-old-space-size; unset = image default
  # Extra environment variables.
  # Bulk chunk sizing is self-tuning and needs no configuration here; the
  # only chunking values to tune are chunkMaxChunks and chunkHardMaxBytes
  # under `limits` above.
  extraEnv:
    # Reuse one sandbox context per execution unit (faster context ingest on
    # schemas with derived fields). Set "0" to disable.
    - name: RB_FN_CONTEXT_REUSE
      value: "1"
    # Bound the relationship cascade that runs after a context batch commits:
    # max dependent parents re-evaluated per relationship, and a wall-clock
    # budget before the remainder is deferred.
    - name: CONTEXT_CASCADE_MAX_INSTANCES
      value: "2000"
    - name: CONTEXT_CASCADE_BUDGET_MS
      value: "45000"
  extraEnvFrom: []
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  workers:
    enabled: true
    replicas: 3 # Starting replicas
    topics: "solution"
    # Node scheduling configuration.
    # Optional custom topology spread constraints. The chart does not set a
    # default spread rule so workers can prefer non-infrastructure nodes.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # topologySpreadConstraints: []
    # Pod labels/annotations
    podLabels: {}
    podAnnotations: {}
    # Health probes. Empty = no probe rendered. The worker's metrics endpoint
    # is a convenient probe target, e.g.:
    #   readinessProbe:
    #     httpGet: { path: /metrics, port: metrics }
    #     initialDelaySeconds: 10
    #     periodSeconds: 10
    #   livenessProbe:
    #     tcpSocket: { port: metrics }
    #     initialDelaySeconds: 30
    #     periodSeconds: 15
    livenessProbe: {}
    readinessProbe: {}
    startupProbe: {}
    serviceAccount:
      create: false
      annotations: {}
      automount: true
      name: ""
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    # Extra environment variables. Keep RB_FN_CONTEXT_REUSE in sync with the
    # HPS server setting above.
    extraEnv:
      - name: RB_FN_CONTEXT_REUSE
        value: "1"
    extraEnvFrom: []
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    # KEDA-based autoscaling for workers
    keda:
      enabled: true
      minReplicaCount: 3
      maxReplicaCount: 50
      lagThreshold: 25 # Scale up before a sustained backlog develops
      cpuThreshold: 75 # Backup: scale on CPU
      memoryThreshold: 80
      pollingInterval: 5 # How often to check metrics (seconds)
      cooldownPeriod: 300 # Wait before scaling down (seconds)

redis:
  # Deploy bundled Valkey (set to false to use an external Valkey/Redis-compatible endpoint).
  # The redis key is retained for compatibility with existing chart overrides.
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/valkey
    tag: "9.1.1-debian13"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "4Gi"
    storageClass: "gp3"
  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  # Serverless Redis-compatible HTTP bridge configuration
  serverlessHttp:
    resources: {}
    livenessProbe: {}
    readinessProbe: {}
  affinity: {}
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "4Gi"
  # External Valkey/Redis-compatible configuration (used when redis.enabled: false)
  external:
    # Host of the external Valkey/Redis-compatible server
    host: ""
    # Port (default: 6379)
    port: 6379
    # Password (leave empty for no auth)
    password: ""
    # Or reference an existing secret
    existingSecret: ""
    existingSecretKey: "redis-password"
    # TLS configuration
    tls:
      enabled: false
    # For Upstash/serverless Redis-compatible HTTP API
    httpApi:
      # If using Upstash or a similar HTTP-based Redis-compatible service
      enabled: false
      url: ""
      token: ""
      existingSecret: ""
      existingSecretUrlKey: "redis-url"
      existingSecretTokenKey: "redis-token"

# Serverless Redis-compatible HTTP bridge.
serverlessRedisHttp:
  image:
    registry: docker.io
    repository: rulebricks/serverless-redis-http
    tag: "0.0.10-r3"

cache:
  valkeyAdmin:
    # Official Valkey Admin web console (Apache-2.0). Disabled by default.
    enabled: false
    image:
      registry: docker.io
      repository: rulebricks/valkey-admin
      tag: "1.0.2-r1"
      pullPolicy: IfNotPresent
    replicas: 1
    # "internal" renders only a ClusterIP service. Operators can use
    # kubectl port-forward for zero public surface. "ingress" requires
    # BasicAuth users and exposes the console behind Traefik.
    exposure: internal # internal | ingress
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      type: "ingress" # "ingress" or "gateway-api"
      className: traefik
      hostname: "" # Defaults to valkey.<global.domain>
      annotations: {}
      path: /
      pathType: Prefix
      gatewayApi:
        gatewayName: ""
        gatewayNamespace: ""
        sectionName: ""
      basicAuth:
        # Traefik BasicAuth users in htpasswd format. The CLI should generate
        # this so plaintext passwords never land in values.yaml.
        users: []
        existingSecret: ""
        existingSecretKey: users
      allowedIPs: []
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podLabels: {}
    podAnnotations: {}
  redisExporter:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/redis-exporter
      tag: "1.88.0-debian13"
      pullPolicy: IfNotPresent
    service:
      port: 9121
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podLabels: {}
    podAnnotations: {}

kafkaExporter:
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/kafka-exporter
    tag: "1.9.0-debian13"
    pullPolicy: IfNotPresent
  service:
    port: 9308
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # Empty means the chart derives the in-cluster Kafka service. For external
  # Kafka, set comma-separated bootstrap brokers here or via the CLI mapping.
  brokers: ""
  topicFilter: ".*"
  groupFilter: ".*"
  # SASL/TLS against external brokers is inherited from app.logging.kafkaSsl
  # and app.logging.kafkaSasl; no exporter-specific auth values are needed.
  # Skip TLS certificate verification (self-signed broker certs).
  tlsInsecureSkipVerify: false
  # Extra kafka_exporter flags, e.g. "--kafka.version=3.6.0".
  extraArgs: []
  # For AWS MSK IAM, set the IRSA annotation (eks.amazonaws.com/role-arn) with
  # a role granting kafka-cluster:Connect and Describe permissions. The
  # exporter is skipped under aws-iam until the annotation is present.
  serviceAccount:
    create: true
    # Defaults to "<release>-kafka-exporter".
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

ingress:
  enabled: true
  app:
    # Render the app catch-all route. Set false when a separate auth proxy owns app routing.
    enabled: true
  # Ingress type: "ingress" (standard K8s Ingress) or "gateway-api" (HTTPRoute)
  type: "ingress"
  # Ingress class name (used when type: "ingress")
  className: traefik
  # Hostname override (defaults to global.domain if not set)
  hostname: ""
  annotations:
    # CORS configuration using Traefik annotations
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Methods: "GET,OPTIONS,PUT,POST,DELETE,PATCH"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Origin: "*"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Headers: "*"
  # hosts: configured automatically from global.domain
  paths:
    - path: /
      pathType: Prefix
  # Gateway API configuration (used when type: "gateway-api")
  gatewayApi:
    # Name of the Gateway resource to attach to (required for gateway-api)
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (e.g., "https" for TLS listener)
    sectionName: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

volumes: []
volumeMounts: []

podSecurityContext: {}
securityContext: {}
