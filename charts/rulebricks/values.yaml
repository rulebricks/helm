app:
  image:
    registry: docker.io
    repository: rulebricks/app
    pullPolicy: IfNotPresent
  replicas: 2
  # Node scheduling configuration. Keep overrides preferred-only unless your
  # platform team intentionally wants hard placement.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional labels for pods (merged with global.podLabels)
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Additional annotations for pods (merged with global.podAnnotations)
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # Baseline app sizing. The Next.js app runs a CPU-bound startup pass (runtime
  # NEXT_PUBLIC_* placeholder substitution across the .next build) before it
  # serves on :3000; a too-small CPU limit makes that overrun the liveness probe
  # window and crash-loop the pod, so keep a real baseline here.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2000m"
      memory: 2Gi
  # Extra environment variables to inject (list of name/value or valueFrom objects)
  # Note: the chart sets HOSTNAME=0.0.0.0 on the app container by default so the
  # Next.js standalone server binds to all interfaces. (Kubernetes otherwise sets
  # HOSTNAME to the pod name; on some CNIs that resolves to an address the kubelet
  # doesn't probe, which fails every liveness check and silently crash-loops the
  # pod.) Adding your own HOSTNAME entry here replaces that default.
  # Example:
  #   - name: MY_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: value
  extraEnv: []
  # Extra envFrom references (additional ConfigMaps/Secrets to load)
  # Example:
  #   - configMapRef:
  #       name: app-extra-config
  #   - secretRef:
  #       name: app-extra-secrets
  extraEnvFrom: []
  # Logging/Kafka configuration (optional)
  logging:
    enabled: false
    kafkaBrokers: ""  # Override Kafka brokers URL, defaults to in-cluster Kafka
    kafkaTopic: "logs"
    # Prefix applied to ALL Kafka topic names (solution, solution-response, logs, ...)
    # so they don't collide on a shared/managed Kafka cluster. HPS prepends this to
    # its topics; the chart applies it to KEDA lag triggers and the Vector consumer.
    # Set to "" to disable prefixing entirely.
    kafkaTopicPrefix: "com.rulebricks."
    kafkaSsl: false
    kafkaSasl:
      mechanism: ""    # "aws-iam" | "scram-sha-256" | "scram-sha-512" | "plain" | ""
      region: ""       # Required when mechanism is "aws-iam"; credentials come from pod IAM.
      username: ""     # SCRAM/PLAIN only
      password: ""     # SCRAM/PLAIN only
      existingSecret: ""
      existingSecretUsernameKey: "KAFKA_SASL_USERNAME"
      existingSecretPasswordKey: "KAFKA_SASL_PASSWORD"
  # ClickHouse credentials for the decision-log query path. Defaults to the
  # parent chart's <release>-clickhouse-credentials Secret; set existingSecret
  # to match a BYO clickhouse.auth.existingSecret in the parent chart.
  clickhouse:
    existingSecret: ""
    existingSecretKey: "admin-password"
  # AI features (optional)
  ai:
    enabled: false
  # SMTP configuration (optional, can also be set via global.smtp)
  smtp: {}
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  tlsEnabled: true
  email: "support@rulebricks.com"
  licenseKey: ""
  supabaseUrl: ""
  supabaseServiceKey: ""
  supabaseAnonKey: ""

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
  app:
    path: /api/metrics
  hps:
    path: /metrics
  worker:
    # HPS workers expose Prometheus metrics on this path (served by the small
    # metrics HTTP server inside the bundled worker). Scraped via the headless
    # worker Service + ServiceMonitor.
    path: /metrics
    port: 3000

hps:
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/hps
    pullPolicy: Always
  # The wait-for-kafka init container uses the centralized busybox image
  # (global.images.busybox); it only needs `nc` to poll the broker TCP port.
  replicas: 1
  # Gather-plane autoscaler (see templates/hps-keda.yaml). Conservative by
  # design: HPS scale events rebalance the response consumer group and can
  # time out in-flight requests, so pods are added/removed one at a time
  # behind long stabilization windows.
  keda:
    enabled: false
    minReplicaCount: 2
    # Leave maxReplicaCount unset to inherit the derived default (~1 HPS per
    # 4 workers of the worker fleet ceiling, floor 8 - see hps-keda.yaml).
    # maxReplicaCount: 16
    pollingInterval: 15
    cooldownPeriod: 600
    # Lag is in chunk MESSAGES (up to FLOW_CHUNK_MAX_ITEMS payload results
    # each); 50 standing messages is already a large payload backlog. Higher
    # thresholds never fire before gather latency crosses the request window.
    lagThreshold: 50
    # Gather saturation shows as ~50% of the 1-CPU request (single JS thread
    # pegs one core); 45 fires just below that plateau, 60 never did.
    cpuThreshold: 45
  # Pre-pull the HPS server + worker images onto every node (DaemonSet) so
  # burst scale-outs skip the image pull on freshly provisioned nodes.
  imagePrepull:
    enabled: true
    # Resident container that keeps the pulled images on the node uses the
    # centralized pause image (global.images.pause).
    # Tolerate the Rulebricks burst pool without tolerating shutdown,
    # out-of-service, or unreachable node taints. Add explicit architecture
    # tolerations here if those pools are tainted.
    nodeSelector: {}
    tolerations:
      - key: rulebricks.com/pool
        operator: Equal
        value: burst
        effect: NoSchedule
    # Near-zero footprint so the DaemonSet never affects bin-packing.
    resources:
      init:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      pause:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 10m
          memory: 32Mi
  # Node scheduling configuration. Custom affinity can include stricter rules
  # if your platform team requires them.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional custom topology spread constraints. The chart does not set a
  # default spread rule so compute pods can prefer non-infrastructure nodes.
  # topologySpreadConstraints: []
  # Pod labels/annotations
  podLabels: {}
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # Extra environment variables.
  # FLOW_CHUNK_MAX_ITEMS is an important throughput dial.
  extraEnv:
    - name: FLOW_CHUNK_MAX_ITEMS
      value: "500"
  extraEnvFrom: []
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  workers:
    enabled: true
    replicas: 3 # Starting replicas
    topics: "solution"
    # Node scheduling configuration.
    # Optional custom topology spread constraints. The chart does not set a
    # default spread rule so workers can prefer non-infrastructure nodes.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # topologySpreadConstraints: []
    # Pod labels/annotations
    podLabels: {}
    podAnnotations: {}
    # Health probes. Empty = no probe rendered. Set these to satisfy a cluster
    # policy that requires liveness/readiness probes. When metrics.enabled (the
    # default) the worker serves a Prometheus endpoint on the "metrics" port
    # (metrics.worker.port, default 3000), which is a convenient probe target, e.g.:
    #   readinessProbe:
    #     httpGet: { path: /metrics, port: metrics }
    #     initialDelaySeconds: 10
    #     periodSeconds: 10
    #   livenessProbe:
    #     tcpSocket: { port: metrics }
    #     initialDelaySeconds: 30
    #     periodSeconds: 15
    livenessProbe: {}
    readinessProbe: {}
    startupProbe: {}
    serviceAccount:
      create: false
      annotations: {}
      automount: true
      name: ""
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    # Extra environment variables
    extraEnv: []
    extraEnvFrom: []
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    # KEDA-based autoscaling for workers
    keda:
      enabled: true
      minReplicaCount: 3
      maxReplicaCount: 50
      lagThreshold: 100 # Scale up when lag > 100 messages
      cpuThreshold: 75 # Backup: scale on CPU
      memoryThreshold: 80
      pollingInterval: 15 # How often to check metrics (seconds)
      cooldownPeriod: 300 # Wait before scaling down (seconds)

redis:
  # Deploy bundled Valkey (set to false to use an external Valkey/Redis-compatible endpoint).
  # The redis key is retained for compatibility with existing chart overrides.
  enabled: true
  # Valkey (OSI-licensed Redis fork), mirrored to docker.io/rulebricks/valkey.
  # The pull is authenticated by the license-key registry secret.
  image:
    registry: docker.io
    repository: rulebricks/valkey
    tag: "9.1.0-debian13"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: "4Gi"
    storageClass: "gp3"
  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  # Serverless Redis-compatible HTTP bridge configuration
  serverlessHttp:
    resources: {}
    livenessProbe: {}
    readinessProbe: {}
  affinity: {}
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "4Gi"
  # External Valkey/Redis-compatible configuration (used when redis.enabled: false)
  external:
    # Host of the external Valkey/Redis-compatible server
    host: ""
    # Port (default: 6379)
    port: 6379
    # Password (leave empty for no auth)
    password: ""
    # Or reference an existing secret
    existingSecret: ""
    existingSecretKey: "redis-password"
    # TLS configuration
    tls:
      enabled: false
    # For Upstash/serverless Redis-compatible HTTP API
    httpApi:
      # If using Upstash or a similar HTTP-based Redis-compatible service
      enabled: false
      url: ""
      token: ""
      existingSecret: ""
      existingSecretUrlKey: "redis-url"
      existingSecretTokenKey: "redis-token"

# Serverless Redis-compatible HTTP bridge (hiett/serverless-redis-http),
# rebuilt from unmodified upstream source (release 0.0.10) on the hardened
# DHI Erlang/OTP runtime and published as docker.io/rulebricks/
# serverless-redis-http (upstream is unmaintained; its 2021 image base
# carried the CISA KEV-listed CVE-2025-32433).
serverlessRedisHttp:
  image:
    registry: docker.io
    repository: rulebricks/serverless-redis-http
    tag: "0.0.10-r1"

cache:
  valkeyAdmin:
    # Official Valkey Admin web console (Apache-2.0). Disabled by default.
    enabled: false
    image:
      registry: docker.io
      repository: rulebricks/valkey-admin
      tag: "1.0.2"
      pullPolicy: IfNotPresent
    replicas: 1
    # "internal" renders only a ClusterIP service. Operators can use
    # kubectl port-forward for zero public surface. "ingress" requires
    # BasicAuth users and exposes the console behind Traefik.
    exposure: internal # internal | ingress
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      type: "ingress" # "ingress" or "gateway-api"
      className: traefik
      hostname: "" # Defaults to valkey.<global.domain>
      annotations: {}
      path: /
      pathType: Prefix
      gatewayApi:
        gatewayName: ""
        gatewayNamespace: ""
        sectionName: ""
      basicAuth:
        # Traefik BasicAuth users in htpasswd format. The CLI should generate
        # this so plaintext passwords never land in values.yaml.
        users: []
        existingSecret: ""
        existingSecretKey: users
      allowedIPs: []
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podLabels: {}
    podAnnotations: {}
  redisExporter:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/redis-exporter
      tag: "1.87.0-debian13"
      pullPolicy: IfNotPresent
    service:
      port: 9121
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podLabels: {}
    podAnnotations: {}

kafkaExporter:
  enabled: true
  image:
    registry: docker.io
    repository: rulebricks/kafka-exporter
    tag: "1.9.0-debian13"
    pullPolicy: IfNotPresent
  service:
    port: 9308
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # Empty means the chart derives the in-cluster Kafka service. For external
  # Kafka, set comma-separated bootstrap brokers here or via the CLI mapping.
  brokers: ""
  topicFilter: ".*"
  groupFilter: ".*"
  # SASL/TLS against external brokers is inherited from app.logging.kafkaSsl
  # and app.logging.kafkaSasl; no exporter-specific auth values are needed.
  # Skip TLS certificate verification (self-signed broker certs).
  tlsInsecureSkipVerify: false
  # Extra kafka_exporter flags, e.g. "--kafka.version=3.6.0".
  extraArgs: []
  # For AWS MSK IAM, set the IRSA annotation (eks.amazonaws.com/role-arn) with
  # a role granting kafka-cluster:Connect + Describe* on the cluster, topics,
  # and groups. The exporter is skipped under aws-iam until the annotation is
  # present (the exporter does not support EKS Pod Identity).
  serviceAccount:
    create: true
    # Defaults to "<release>-kafka-exporter".
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}

ingress:
  enabled: true
  app:
    # Render the app catch-all route. Set false when a separate auth proxy owns app routing.
    enabled: true
  # Ingress type: "ingress" (standard K8s Ingress) or "gateway-api" (HTTPRoute)
  type: "ingress"
  # Ingress class name (used when type: "ingress")
  className: traefik
  # Hostname override (defaults to global.domain if not set)
  hostname: ""
  annotations:
    # CORS configuration using Traefik annotations
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Methods: "GET,OPTIONS,PUT,POST,DELETE,PATCH"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Origin: "*"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Headers: "*"
  # hosts: configured automatically from global.domain
  paths:
    - path: /
      pathType: Prefix
  # Gateway API configuration (used when type: "gateway-api")
  gatewayApi:
    # Name of the Gateway resource to attach to (required for gateway-api)
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (e.g., "https" for TLS listener)
    sectionName: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

volumes: []
volumeMounts: []

podSecurityContext: {}
securityContext: {}
