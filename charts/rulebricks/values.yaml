app:
  image:
    repository: index.docker.io/rulebricks/app
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 2
  # Node scheduling configuration. Keep overrides preferred-only unless your
  # platform team intentionally wants hard placement.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional labels for pods (merged with global.podLabels)
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Additional annotations for pods (merged with global.podAnnotations)
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Extra environment variables to inject (list of name/value or valueFrom objects)
  # Example:
  #   - name: HOSTNAME
  #     value: "0.0.0.0"
  #   - name: MY_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: value
  extraEnv: []
  # Extra envFrom references (additional ConfigMaps/Secrets to load)
  # Example:
  #   - configMapRef:
  #       name: app-extra-config
  #   - secretRef:
  #       name: app-extra-secrets
  extraEnvFrom: []
  # Logging/Kafka configuration (optional)
  logging:
    enabled: false
    kafkaBrokers: ""  # Override Kafka brokers URL, defaults to in-cluster Kafka
    kafkaTopic: "logs"
    loggingDestination: ""
    kafkaSsl: false
    kafkaSasl:
      mechanism: ""    # "aws-iam" | "scram-sha-256" | "scram-sha-512" | "plain" | ""
      region: ""       # Required when mechanism is "aws-iam"; credentials come from pod IAM.
      username: ""     # SCRAM/PLAIN only
      password: ""     # SCRAM/PLAIN only
      existingSecret: ""
      existingSecretUsernameKey: "KAFKA_SASL_USERNAME"
      existingSecretPasswordKey: "KAFKA_SASL_PASSWORD"
  # AI features (optional)
  ai:
    enabled: false
  # SMTP configuration (optional, can also be set via global.smtp)
  smtp: {}
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  tlsEnabled: true
  email: "support@rulebricks.com"
  licenseKey: ""
  supabaseUrl: ""
  supabaseServiceKey: ""
  supabaseAnonKey: ""

hps:
  enabled: true
  image:
    repository: index.docker.io/rulebricks/hps
    pullPolicy: Always
    tag: "latest"
  replicas: 1
  # Node scheduling configuration. Custom affinity can include stricter rules
  # if your platform team requires them.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional custom topology spread constraints. The chart does not set a
  # default spread rule so compute pods can prefer non-infrastructure nodes.
  # topologySpreadConstraints: []
  # Pod labels/annotations
  podLabels: {}
  podAnnotations: {}
  serviceAccount:
    create: false
    annotations: {}
    automount: true
    name: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # Extra environment variables
  extraEnv: []
  extraEnvFrom: []
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  workers:
    enabled: true
    replicas: 3 # Starting replicas
    topics: "solution"
    # Node scheduling configuration.
    # Optional custom topology spread constraints. The chart does not set a
    # default spread rule so workers can prefer non-infrastructure nodes.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # topologySpreadConstraints: []
    # Pod labels/annotations
    podLabels: {}
    podAnnotations: {}
    serviceAccount:
      create: false
      annotations: {}
      automount: true
      name: ""
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    # Extra environment variables
    extraEnv: []
    extraEnvFrom: []
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    # KEDA-based autoscaling for workers
    keda:
      enabled: true
      minReplicaCount: 3
      maxReplicaCount: 50
      lagThreshold: 100 # Scale up when lag > 100 messages
      cpuThreshold: 75 # Backup: scale on CPU
      memoryThreshold: 80
      pollingInterval: 15 # How often to check metrics (seconds)
      cooldownPeriod: 300 # Wait before scaling down (seconds)

redis:
  # Deploy internal Redis (set to false to use external)
  enabled: true
  tag: "7.2"
  persistence:
    enabled: true
    size: "4Gi"
    storageClass: "gp3"
  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  podLabels: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  # Serverless Redis HTTP configuration
  serverlessHttp:
    resources: {}
    livenessProbe: {}
    readinessProbe: {}
  affinity: {}
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "4Gi"
  # External Redis configuration (used when redis.enabled: false)
  external:
    # Host of the external Redis server
    host: ""
    # Port (default: 6379)
    port: 6379
    # Password (leave empty for no auth)
    password: ""
    # Or reference an existing secret
    existingSecret: ""
    existingSecretKey: "redis-password"
    # TLS configuration
    tls:
      enabled: false
    # For Upstash/serverless Redis HTTP API
    httpApi:
      # If using Upstash or similar HTTP-based Redis
      enabled: false
      url: ""
      token: ""
      existingSecret: ""
      existingSecretUrlKey: "redis-url"
      existingSecretTokenKey: "redis-token"

ingress:
  enabled: true
  app:
    # Render the app catch-all route. Set false when a separate auth proxy owns app routing.
    enabled: true
  # Ingress type: "ingress" (standard K8s Ingress) or "gateway-api" (HTTPRoute)
  type: "ingress"
  # Ingress class name (used when type: "ingress")
  className: traefik
  # Hostname override (defaults to global.domain if not set)
  hostname: ""
  annotations:
    # CORS configuration using Traefik annotations
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Methods: "GET,OPTIONS,PUT,POST,DELETE,PATCH"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Origin: "*"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.Access-Control-Allow-Headers: "*"
  # hosts: configured automatically from global.domain
  paths:
    - path: /
      pathType: Prefix
  # Gateway API configuration (used when type: "gateway-api")
  gatewayApi:
    # Name of the Gateway resource to attach to (required for gateway-api)
    gatewayName: ""
    # Namespace of the Gateway (optional, defaults to same namespace)
    gatewayNamespace: ""
    # Section name on the Gateway (e.g., "https" for TLS listener)
    sectionName: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

volumes: []
volumeMounts: []

# Root-level scheduling is deprecated - use app.nodeSelector, app.tolerations, etc.
# These are kept for backward compatibility but will be removed in a future version
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
securityContext: {}
