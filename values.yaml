# =============================================================================
# GLOBAL RULEBRICKS SETTINGS
# These important values are used across multiple components and should be set here
# =============================================================================
global:
  # Domain for ingress and TLS certificate generation
  domain: "<rulebricks-subdomain>.<domain-you-control>"
  # Email for TLS certificate registration (required for cert-manager)
  email: "support@rulebricks.com"
  # License Key for Rulebricks Enterprise (provided in your onboarding space)
  licenseKey: "evaluation"
  # ---------------------------------------------------------------------------
  # Image registry and digest pinning
  # ---------------------------------------------------------------------------
  # Repoints every image host to your own registry mirror for air-gapped
  # installs (keeps the rulebricks/<name> path). Empty = docker.io defaults.
  # cert-manager, traefik, keda, vector, external-dns, and cluster-autoscaler
  # use their own image keys: the CLI rewrites those automatically, and
  # hand-installers must set them too.
  imageRegistry: ""
  # name -> sha256 digest map (generated; do not edit by hand).
  imageDigests: {}
  # Shared leaf images (init/hook/test utilities) rendered through the image helper.
  images:
    postgres17: { registry: docker.io, repository: rulebricks/postgres, tag: "17-debian13" }
    node24: { registry: docker.io, repository: rulebricks/node, tag: "24-alpine-r1" }
    rclone: { registry: docker.io, repository: rulebricks/rclone, tag: "1.74.4" }
    busybox: { registry: docker.io, repository: rulebricks/busybox, tag: "1.38.0-alpine" }
    pause: { registry: docker.io, repository: rulebricks/pause, tag: "3.9" }
    curl: { registry: docker.io, repository: rulebricks/curl, tag: "8.21.0-alpine" }
    kubectl: { registry: docker.io, repository: rulebricks/kubectl, tag: "1.36.2-debian13" }
  # Image pull secret for the private rulebricks/* repos (normally the
  # license registry secret <release>-regcred). keda, traefik, vector, and
  # the strimzi operator need the same secret on their own imagePullSecrets
  # keys; the CLI fills all of these automatically. When imageRegistry points
  # at your own registry, use that registry's pull secret instead.
  imagePullSecrets: []
  registry:
    # BYO seam: name of a pre-created kubernetes.io/dockerconfigjson Secret to
    # use for pulling rulebricks/* images. When set, the chart skips rendering
    # <release>-regcred from global.licenseKey and every rulebricks-owned
    # workload references this Secret instead. Remember to update the
    # subchart imagePullSecrets keys listed above to the same name.
    existingPullSecret: ""
  # Rulebricks product version used by app, HPS, HPS worker, and migration images.
  # CLI-generated values pin this to a semantic version such as "1.8.17".
  version: ""
  # Creates release-scoped <release>-critical and <release>-burst
  # PriorityClasses. Workers default to burst; point kafka/clickhouse at
  # critical via their priorityClassName values (the CLI does this).
  priorityClasses:
    enabled: true
  # Enable TLS/HTTPS - requires DNS records to be configured first
  # Set to `true` when using external-dns OR after manually creating DNS records
  tlsEnabled: false
  # Bring-your-own certificates: TLS secrets are created out-of-band under
  # the names each ingress expects, and the chart issues nothing. Pair with
  # cert-manager.enabled=false. Only meaningful while tlsEnabled is true.
  tlsCertificatesProvided: false
  # Existing cert-manager issuer: point issuance at an issuer your platform
  # team already runs instead of this chart's Let's Encrypt ClusterIssuer.
  # Pair with cert-manager.enabled=false. kind/group default to
  # ClusterIssuer/cert-manager.io when only name is set.
  tlsIssuerRef:
    name: ""
    kind: "ClusterIssuer"
    group: "cert-manager.io"
  # Corporate root CA bundle (PEM) for privately-issued certificates. Mounted
  # into the components that call this deployment's own HTTPS endpoints,
  # additive to the default trust store.
  tlsPrivateCaBundle: ""
  # Enable external-dns integration for automatic DNS record management
  # Works with either: the external-dns subchart below, OR an existing cluster-wide external-dns
  externalDnsEnabled: false
  # =============================================================================
  # Shared Object Storage
  # One cloud provider, one identity, and one bucket/container hold all Rulebricks
  # data. Decision logs and DB backups are just path prefixes within it.
  # =============================================================================
  storage:
    provider: "s3" # s3 | azure-blob | gcs
    # Single bucket (S3/GCS) or storage account (azure-blob).
    bucket: "<rulebricks-bucket>"
    region: "<object-storage-region>"
    s3:
      # Preferred: IAM Roles for Service Accounts (IRSA).
      iamRoleArn: ""
      # Optional escape hatch for static AWS credentials. Secret keys expected:
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Injected into the ClickHouse
      # workload (decision-log queries) and the DB backup upload job.
      existingSecret:
        name: ""
    azure:
      authMode: "workload-identity" # workload-identity | connection-string
      clientId: ""
      tenantId: ""
      # Single blob container holding every prefix below.
      container: ""
      connectionStringSecretRef:
        name: ""
        key: ""
    gcp:
      # Preferred: GKE Workload Identity.
      serviceAccountEmail: ""
    # Per-purpose key prefixes within the single bucket/container.
    paths:
      decisionLogs: "decision-logs"
      dbBackups: "db-backups"
  # Switch for the built-in ClickStack observability backend (lives under
  # global so all subcharts can read it).
  clickstack:
    enabled: true
  # =============================================================================
  # Distributed Tracing (OpenTelemetry)
  # Deploys an in-cluster OpenTelemetry Collector that receives OTLP spans
  # from the app, HPS, workers, and Traefik and forwards them to your tracing
  # backend. Components send OTLP to:
  #   http://<release>-otel-collector.<namespace>.svc.cluster.local:4318  (HTTP)
  #   http://<release>-otel-collector.<namespace>.svc.cluster.local:4317  (gRPC)
  # =============================================================================
  tracing:
    enabled: false
    # Trace destination the collector exports to:
    #   elastic       -> Elastic APM / Elastic Cloud (OTLP/HTTP)
    #   otlp          -> any generic OTLP/HTTP backend
    #   azure-monitor -> Azure Monitor / Application Insights
    destination: "elastic"
    # Head-sampling ratio applied by the application SDKs (0.0 - 1.0). The
    # collector forwards everything it receives; control volume at the source.
    samplingRatio: 1.0
    collector:
      # Contrib collector build (carries the exporters used by every
      # destination below).
      image:
        registry: docker.io
        repository: rulebricks/opentelemetry-collector
        tag: "0.156.0-debian13-contrib"
      replicas: 1
      # Soft cap (MiB) for the memory_limiter processor before it back-pressures.
      memoryLimitMiB: 400
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      podLabels:
        rulebricks.com/workload-group: infrastructure
      nodeSelector: {}
      tolerations: []
      affinity: {}
    # destination: elastic (customer-managed Elastic APM).
    elastic:
      # OTLP endpoint of the Elastic APM Server / managed APM integration, e.g.
      # https://<deployment>.apm.<region>.cloud.es.io:443
      endpoint: ""
      # Auth mode for the Elastic endpoint:
      #   secret-token -> Authorization: Bearer <token>
      #   api-key      -> Authorization: ApiKey <key>
      #   none         -> no Authorization header
      authMode: "secret-token"
      # Inline credential (dev/eval only). For production reference an existing
      # secret via existingSecret below instead of inlining here.
      secretToken: ""
      apiKey: ""
      existingSecret:
        name: ""
        secretTokenKey: "secret-token"
        apiKeyKey: "api-key"
      # Skip TLS verification for the Elastic endpoint (NOT recommended).
      tlsInsecureSkipVerify: false
    # destination: otlp (generic OTLP/HTTP backend).
    otlp:
      # Full OTLP/HTTP traces endpoint of the backend, e.g.
      #   https://otlp-gateway-<region>.grafana.net/otlp        (Grafana Cloud)
      #   https://api.honeycomb.io                              (Honeycomb)
      endpoint: ""
      # Auth mode for the generic endpoint:
      #   none    -> no auth header
      #   bearer  -> Authorization: Bearer <token>
      #   api-key -> Authorization: ApiKey <token>
      #   header  -> <headerName>: <token>   (e.g. x-honeycomb-team)
      authMode: "none"
      # Header name used when authMode is "header".
      headerName: "Authorization"
      # Inline credential for bearer/api-key/header modes (dev/eval only); use
      # existingSecret in production.
      token: ""
      apiKey: ""
      headerValue: ""
      existingSecret:
        name: ""
        tokenKey: "token"
      # Extra static (non-secret) headers added to every export request.
      headers: {}
      # Skip TLS verification for the endpoint (NOT recommended).
      tlsInsecureSkipVerify: false
    # destination: azure-monitor (Azure Monitor / Application Insights).
    azureMonitor:
      # Application Insights connection string (carries the ingestion endpoint
      # and instrumentation key). Inline for dev/eval; use existingSecret in prod.
      connectionString: ""
      existingSecret:
        name: ""
        connectionStringKey: "connection-string"
  # =============================================================================
  # Global Labels and Annotations
  # Applied to ALL resources rendered by this chart (useful for compliance)
  # =============================================================================
  labels: {}
  # Example:
  #   team: rulebricks
  #   environment: production

  annotations: {}
  # Example:
  #   app.kubernetes.io/managed-by: helm

  # Labels applied only to pod templates (not metadata)
  podLabels: {}

  # Annotations applied only to pod templates
  podAnnotations: {}
  # =============================================================================
  # Global Scheduling Defaults
  # Optional scheduling defaults for chart templates that explicitly inherit
  # global.scheduling. Rulebricks workloads and migration jobs honor these;
  # dependency subcharts may require their own scheduling keys.
  # =============================================================================
  scheduling:
    # Node selector applied to workloads that inherit global scheduling
    nodeSelector: {}
    # Example for pinning to ARM64/Graviton nodes:
    #   kubernetes.io/arch: arm64

    # Tolerations applied to workloads that inherit global scheduling
    tolerations: []
    # Example for ARM64-tainted or dedicated node pools:
    #   - key: "kubernetes.io/arch"
    #     operator: "Equal"
    #     value: "arm64"
    #     effect: "NoSchedule"
    #   - key: "Dedicated"
    #     operator: "Equal"
    #     value: "rulebricks"
    #     effect: "NoSchedule"

    # Affinity rules applied to workloads that inherit global scheduling.
    # Prefer soft/preferred rules so node layout does not block installs.
    affinity: {}
  # SMTP Configuration (Vital for instance access and admin)
  smtp:
    host: "smtp.mailtrap.io"
    port: 2525
    user: ""
    pass: ""
    from: "no-reply@rulebricks.com"
    fromName: "Rulebricks"
  # Auth/Database Configuration
  supabase:
    # anonKey / serviceKey are HS256 JWTs signed with jwtSecret (below), not
    # independent secrets. Generate them per the Supabase self-hosting docs,
    # or let the Rulebricks CLI derive and create them. Empty by default.
    anonKey: ""
    serviceKey: ""
    # Runtime alternative to an inline anonKey: an existing Secret carrying
    # the public anon key. This seam sources ONLY the anon key; the other
    # Supabase secrets ride global.secrets.secretRef.
    secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      anonKey: "anonKey"
    # Email Customization (subjects and templates for auth emails)
    emails:
      subjects:
        invite: "Join your team on Rulebricks"
        confirmation: "Confirm Your Email"
        recovery: "Reset Your Password"
        emailChange: "Confirm Email Change"
      templates:
        # HTML templates hosted on S3 (or any public URL)
        invite: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/invite.html"
        confirmation: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/verify.html"
        recovery: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/password_change.html"
        emailChange: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/email_change.html"
    # [Managed Supabase] Leave URL empty if self-hosting
    url: ""
    # [Managed Supabase] Project reference (e.g., "abcdefghijkl")
    projectRef: ""
    # [Managed Supabase] Access token for headless CLI authentication
    # Generate from Supabase Dashboard: Account Settings > Access Tokens
    # Required when using managed Supabase (supabase.enabled=false)
    accessToken: ""
    # [Self-hosted Supabase] JWT signing secret (only needed for self-hosted Supabase).
    # Empty by default - must be provided (>=32 chars); never ship a known default.
    jwtSecret: ""
  # =============================================================================
  # Secret Reference (for external secret management)
  # Use this to reference a pre-existing secret instead of inline values
  # Works with External Secrets Operator, sealed-secrets, or manually created secrets
  # =============================================================================
  secrets:
    # Name of an existing secret to use (created by ESO, sealed-secrets, or manually)
    # When set, the chart will reference this secret instead of creating one
    secretRef: ""
    # Key mappings within the referenced secret
    secretRefKeys:
      licenseKey: "LICENSE_KEY"
      email: "EMAIL"
      smtpUser: "SMTP_USER"
      smtpPass: "SMTP_PASS"
      supabaseServiceKey: "SUPABASE_SERVICE_KEY"
      supabaseAccessToken: "SUPABASE_ACCESS_TOKEN"
      ssoClientId: "SSO_CLIENT_ID"
      ssoClientSecret: "SSO_CLIENT_SECRET"
      # Only read when global.externalAuth.enabled. Keys the app consumes via
      # envFrom are loaded verbatim and cannot be remapped.
      jwtSecret: "JWT_SECRET"
  # =============================================================================
  # SSO Configuration (Optional)
  # Enables Single Sign-On via OIDC
  #
  # NATIVE PROVIDERS (azure, google, okta, keycloak):
  #   Supabase handles authentication directly.
  #
  # CUSTOM PROVIDERS (ory, other):
  #   The app includes a built-in OIDC proxy that translates paths for your IdP.
  # =============================================================================
  sso:
    enabled: false
    # Provider name: azure, google, okta, keycloak (native) | ory, other (custom)
    provider: ""
    # Provider URL - required for all providers except Google
    # Examples:
    #   Azure:    https://login.microsoftonline.com/{tenant-id}
    #   Okta:     https://your-org.okta.com
    #   Keycloak: https://keycloak.example.com/realms/your-realm
    #   Ory:      https://your-org.projects.oryapis.com
    url: ""
    # OAuth client credentials from your identity provider
    # You will need to setup the OAuth client in your identity provider with:
    #   scopes: openid, email, profile
    #   response_type: code
    #   grant_types: authorization_code, refresh_token
    #   authentication_method: http body
    #   Redirect URI's (register the one that matches your provider type):
    #     NATIVE providers (azure, google, okta, keycloak) - GoTrue handles the
    #     OAuth exchange, so the IdP must allow the Supabase callback:
    #       https://supabase.<your-domain>/auth/v1/callback
    #     CUSTOM providers (ory, other) - the app's built-in OIDC proxy is the
    #     callback target:
    #       https://<your-domain>/api/sso-proxy/callback
    #   Registering the wrong one breaks the login flow with a redirect_uri
    #   mismatch at the IdP.
    clientId: ""
    clientSecret: ""
  # =============================================================================
  # External Authentication (Token Passthrough)
  # For deployments behind an identity-aware proxy that has already
  # authenticated the user. Rulebricks does NOT verify the token signature;
  # it trusts whatever the upstream proxy forwards.
  #
  # SECURITY: only enable on private networks fully gated by your proxy.
  # Never enable on public-facing or multi-tenant deployments.
  # Docs: /private-deployment/sso/external-auth
  # =============================================================================
  externalAuth:
    enabled: false
    # Header the upstream proxy uses to forward the JWT.
    # Default "Authorization" auto-strips the "Bearer " prefix.
    header: "Authorization"
    # JWT claim paths - override only if your upstream IdP uses non-standard claim names
    claims:
      id: "sub" # stable external user id (stored in user_metadata.external_sub)
      email: "email" # REQUIRED claim - used as the identity key for user upsert
      name: "name" # display name (copied to public.users.name)
    # URL-path prefixes that should bypass the token check (e.g. embedded public forms).
    # Health, metrics, denied-page, branding, and x-api-key requests are auto-exempt by the app.
    # Rendered as a comma-separated string for EXTERNAL_AUTH_PUBLIC_PATHS.
    publicPaths: []
    # Example:
    #   - /form/
    #   - /api/form/

# =============================================================================
# RULEBRICKS APPLICATION STACK
# This is the core Rulebricks application stack. It is preconfigured to run as-
# is, but you will likely need to manually tune component resources and
# other configurations to your business's performance requirements.
# =============================================================================
rulebricks:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    app:
      path: /api/metrics
    hps:
      path: /metrics

  app:
    image:
      registry: docker.io
      repository: rulebricks/app
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    podLabels:
      rulebricks.com/workload-group: infrastructure

    logging:
      enabled: true
      # Leave empty to auto-discover the in-cluster Kafka; set explicitly
      # only for an external cluster.
      kafkaBrokers: ""
      kafkaTopic: "logs"
      # Prefix applied to all Kafka topic names so they don't collide on a
      # shared or managed cluster. Set to "" to disable prefixing.
      kafkaTopicPrefix: "com.rulebricks."
      # Kafka SSL/SASL for external brokers. For AWS MSK IAM set
      # kafkaSsl=true and mechanism="aws-iam"; credentials come from the pod
      # IAM role.
      kafkaSsl: false
      kafkaSasl:
        mechanism: "" # "aws-iam" | "scram-sha-256" | "scram-sha-512" | "plain" | ""
        region: ""
        username: ""
        password: ""
        existingSecret: ""
        existingSecretUsernameKey: "KAFKA_SASL_USERNAME"
        existingSecretPasswordKey: "KAFKA_SASL_PASSWORD"

  # HPS (High Performance Server): serves the execution endpoints.
  hps:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/hps
      pullPolicy: Always
    replicas: 3 # Minimum recommended
    # HPS autoscaling: adds pods when the response topic lags.
    keda:
      enabled: true
      minReplicaCount: 4
      # The solution-response partition count is the hard upper bound.
      maxReplicaCount: 16
      pollingInterval: 15
      cooldownPeriod: 600
      # Response-topic backlog (messages) that triggers scale-up.
      lagThreshold: 50
      # CPU percentage of request that triggers scale-up.
      cpuThreshold: 45
    # Fleet warm-up (/api/v1/scale): pre-scales the worker fleet to its
    # ceiling ahead of large batch workloads. An unused warm-up costs at most
    # ttlSeconds before normal scale-down reclaims the capacity.
    warmup:
      enabled: true
      ttlSeconds: 600
      # One-shot post-install prewarm so image prepull caches images on burst
      # nodes before they deallocate (the CLI enables this on Azure).
      prewarmOnInstall: false
    # Pre-pull HPS server and worker images onto every node so burst
    # scale-outs skip image pulls.
    imagePrepull:
      enabled: true
      # pauseImage: registry.k8s.io/pause:3.9
      # nodeSelector: {}
      # tolerations:
      #   - key: rulebricks.com/pool
      #     operator: Equal
      #     value: burst
      #     effect: NoSchedule
      # resources:
      #   init:
      #     requests: { cpu: 10m, memory: 32Mi }
      #     limits: { cpu: 100m, memory: 128Mi }
      #   pause:
      #     requests: { cpu: 5m, memory: 16Mi }
      #     limits: { cpu: 10m, memory: 32Mi }
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    # -------------------------------------------------------------------------
    # Payload and deadline envelope (large-batch profile, 100MB-class bulk
    # requests). These values are sized together with the Kafka message caps
    # (kafka.config / kafka.topics), the Traefik timeouts (traefik.ports.*),
    # and the HPS memory limit and heap below; revisit the others if you
    # change one. Docs: private-deployment/configuration-reference.
    # -------------------------------------------------------------------------
    limits:
      # Max HTTP request body on execution endpoints (bytes, 128 MiB).
      bodyLimitBytes: 134217728
      # Whole-request execution deadline (ms). Traefik graceTimeOut and
      # terminationGracePeriodSeconds must stay above this.
      rpcTimeoutMs: 300000
      # Deadline for receiving one request's entire body (ms).
      requestTimeoutMs: 300000
      # Cap per single payload inside a bulk array (bytes); must stay under
      # the Kafka message cap with headroom.
      itemMaxBytes: 6291456
      # Context batch ingestion (body byte cap, records per request).
      contextBatchBodyLimitBytes: 134217728
      contextBatchMaxItems: 100000
      # Admission gate: at most this many concurrent requests larger than the
      # threshold per replica; excess is shed with 429 + Retry-After.
      largeBodyThresholdBytes: 8388608
      largeBodyMaxConcurrent: 2
      # Max chunk fan-out per bulk request (align with solutionPartitions)
      # and the broker-safe per-chunk byte cap (keep under the Kafka message
      # cap with response headroom).
      chunkMaxChunks: 128
      chunkHardMaxBytes: 2097152
      # Consumer fetch ceilings (bytes per partition), 2x the message cap.
      responseFetchMaxBytes: 16777216
      workerFetchMaxBytes: 16777216
      # On SIGTERM, keep consuming until in-flight requests resolve; must
      # cover rpcTimeoutMs, with terminationGracePeriodSeconds just above.
      shutdownDrainMs: 315000
      terminationGracePeriodSeconds: 330
      # Node.js heap (MB) for the HPS server, ~85% of the memory limit.
      nodeHeapMb: 3584
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        # Sized for the payload envelope above: concurrent large bodies live
        # on the heap while parsed and gathered.
        memory: "4Gi"
    workers:
      enabled: true
      replicas: 8
      # Workers default to the release-scoped burst PriorityClass so critical
      # infrastructure can always preempt them. Set to "" to opt out (e.g. on
      # a fixed, non-autoscaling cluster).
      # priorityClassName: ""
      podDisruptionBudget:
        enabled: false
        minAvailable: ""
        maxUnavailable: ""
      # Workers are single-threaded, so the limit is one core. The request is
      # what converts replicas into node capacity for the cluster autoscaler,
      # so keep it near measured mid-load usage.
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
      # Partition count of the "solution" request topic. MUST match the topic
      # definition under kafka.topics below, and keda.maxReplicaCount must
      # stay at or below it. Partitions can never be decreased.
      solutionPartitions: 128
      keda:
        enabled: true
        # Baseline fleet that stays ready with zero lag; bursts scale toward
        # the ceiling.
        minReplicaCount: 28
        maxReplicaCount: 128
        # Poll fast so bursts are detected within seconds.
        pollingInterval: 5
        cooldownPeriod: 300
        # Request-topic backlog (messages) per worker that triggers scale-up;
        # a small threshold makes a sustained burst request the fleet ceiling
        # in the first polling window.
        lagThreshold: 15
        cpuThreshold: 25
        # Optional override for the HPA scaling behavior; leave unset for the
        # chart defaults (fast scale-up, smooth scale-down).
        # scalingBehavior: {}

  ingress:
    enabled: true
    app:
      # Set false when an external auth proxy owns the app catch-all route.
      enabled: true
    className: traefik
    # Host is automatically configured from global.domain
    paths:
      - path: /
        pathType: Prefix

  # Valkey-backed cache (redis key retained for compatibility)
  redis:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "4Gi"
    persistence:
      enabled: true
      size: "4Gi"
      storageClass: gp3

  # Optional Valkey observability and management.
  cache:
    valkeyAdmin:
      # Official Valkey Admin web console (Apache-2.0). Disabled by default and
      # internal-only unless explicitly exposed through authenticated ingress.
      enabled: false
      exposure: internal # internal | ingress
      ingress:
        enabled: false
        type: "ingress" # "ingress" or "gateway-api"
        # Defaults to valkey.<global.domain> when exposure=ingress.
        hostname: ""
        gatewayApi:
          gatewayName: ""
          gatewayNamespace: ""
          sectionName: ""
        basicAuth:
          # Traefik BasicAuth users in htpasswd format. The CLI should generate
          # this so plaintext passwords never land in values.yaml.
          users: []
        allowedIPs: []
      podLabels:
        rulebricks.com/workload-group: infrastructure
    redisExporter:
      enabled: true
      podLabels:
        rulebricks.com/workload-group: infrastructure

  kafkaExporter:
    enabled: true
    podLabels:
      rulebricks.com/workload-group: infrastructure
    # SASL/TLS against external brokers is inherited from
    # rulebricks.app.logging settings; no exporter-specific auth needed.
    # Skip TLS certificate verification (self-signed broker certs).
    tlsInsecureSkipVerify: false
    # Extra kafka_exporter flags, e.g. "--kafka.version=3.6.0".
    extraArgs: []
    # For AWS MSK IAM, set the IRSA annotation (eks.amazonaws.com/role-arn)
    # with a role granting kafka-cluster:Connect and Describe permissions.
    serviceAccount:
      create: true
      name: ""
      annotations: {}

# Message Queue (Kafka)
kafka:
  enabled: true
  # Apache Kafka version. Must be one the Strimzi operator supports.
  version: "4.2.1"
  # Broker image tag is <strimziVersion>-kafka-<kafkaVersion>; keep aligned
  # with the version above.
  image:
    registry: docker.io
    repository: rulebricks/strimzi-kafka
    tag: "1.1.0-debian13-kafka-4.2.1"
  # Single combined controller+broker node (KRaft, no ZooKeeper). The template
  # forces every internal replication factor to this value.
  replicas: 1
  storage:
    # Sized to hold the worst case of every per-topic retention.bytes cap
    # below plus metadata and segment overhead. Kafka halts on a full disk,
    # so keep headroom when changing topic caps.
    size: 75Gi
    class: gp3
  resources:
    requests:
      cpu: "750m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "3Gi"
  jvm:
    xms: "1g"
    xmx: "1g"
    # Strimzi jvmOptions."-XX" map (flag: value).
    extraOpts:
      UseZGC: "true"
      AlwaysPreTouch: "true"
      MaxDirectMemorySize: "256M"
  # Broker properties, rendered into Kafka.spec.kafka.config.
  config:
    auto.create.topics.enable: "true"
    log.retention.hours: "24"
    num.partitions: "12"
    num.network.threads: "8"
    num.io.threads: "8"
    socket.send.buffer.bytes: "1048576"
    socket.receive.buffer.bytes: "1048576"
    socket.request.max.bytes: "209715200"
    # Per-record size cap (large-payload profile). Keep the topic-level
    # max.message.bytes below in lockstep, and replica.fetch above it.
    message.max.bytes: "8388608"
    replica.fetch.max.bytes: "16777216"
    log.retention.bytes: "536870912"
    log.segment.bytes: "1073741824"
    num.replica.fetchers: "4"
    queued.max.requests: "10000"
    replica.socket.receive.buffer.bytes: "1048576"
    log.cleaner.dedupe.buffer.size: "268435456"
    log.cleaner.io.buffer.size: "1048576"
  # Critical-tier scheduling for the broker pod (CLI fills "<release>-critical").
  priorityClassName: ""
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Topics, reconciled by the Strimzi Topic Operator. Names carry the default
  # prefix (com.rulebricks.); the CLI rewrites them if the prefix changes.
  topics:
    # Execution topics: retention.bytes is a per-partition cap sized for
    # in-flight large-batch traffic; max.message.bytes matches the broker's
    # message.max.bytes.
    - name: com.rulebricks.solution
      partitions: 128
      replicas: 1
      config:
        retention.ms: "300000"
        segment.ms: "300000"
        segment.bytes: "67108864"
        retention.bytes: "134217728"
        max.message.bytes: "8388608"
    - name: com.rulebricks.solution-response
      partitions: 128
      replicas: 1
      config:
        retention.ms: "300000"
        segment.ms: "300000"
        segment.bytes: "67108864"
        retention.bytes: "134217728"
        max.message.bytes: "8388608"
    - name: com.rulebricks.logs
      partitions: 24
      replicas: 1
      config:
        retention.ms: "86400000"
        # Per-partition byte cap, sized for a hot partition during bursts: a
        # cap smaller than the burst backlog deletes unconsumed decision
        # logs. Cap times partitions must stay within kafka.storage.size.
        retention.bytes: "1073741824"
        max.message.bytes: "2097152"
  # Topic provisioning for EXTERNAL Kafka (kafka.enabled: false): a
  # pre-install Job creates the `topics` above on the managed cluster.
  # Requires kafkaBridge.enabled for token-auth clusters.
  provisioning:
    enabled: true
    # Replication factor for created topics
    replicationFactor: 3

# Strimzi cluster operator (subchart)
strimzi-kafka-operator:
  watchNamespaces: []
  watchAnyNamespace: false
  # Strimzi does not read the parent global.imageRegistry: for an air-gapped
  # registry the CLI rewrites these keys (hand-installers must set them too).
  defaultImageRegistry: docker.io
  defaultImageRepository: rulebricks
  defaultImageTag: "1.1.0-debian13"
  image:
    registry: docker.io
    repository: rulebricks
    name: strimzi-operator
    tag: "1.1.0-debian13"
  kafka:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  kafkaConnect:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  topicOperator:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  userOperator:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  kafkaInit:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  # Auxiliary component images. Dormant unless the matching Strimzi feature
  # is enabled, but pinned so no toggle ever references an unmirrored image.
  kafkaExporter:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
      tag: "1.1.0-debian13-kafka-4.2.1"
  cruiseControl:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
      tag: "1.1.0-debian13-kafka-4.2.1"
  kafkaMirrorMaker2:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  kafkaBridge:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka-bridge
      tag: "1.0.0-debian13"
  # Connect-build tool images (dormant; pinned like the components above).
  kanikoExecutor:
    image:
      registry: docker.io
      repository: rulebricks
      name: kaniko-executor
      tag: "1.1.0"
  buildah:
    image:
      registry: docker.io
      repository: rulebricks
      name: buildah
      tag: "1.1.0"
  mavenBuilder:
    image:
      registry: docker.io
      repository: rulebricks
      name: maven-builder
      tag: "1.1.0"

# Rulebricks always deploys ClickHouse for native decision-log query support.
# With persistence enabled, rulebricks.decision_logs is a direct MergeTree table
# and the raw object-storage view remains available for trace fallback/import.
# Without persistence, decision_logs is the object-storage-backed view itself.
clickhouse:
  enabled: true
  # ClickHouse server (single node; no keeper/replication)
  image:
    registry: docker.io
    repository: rulebricks/clickhouse-server
    tag: "26.6.1-debian13"
    pullPolicy: IfNotPresent
  priorityClassName: ""
  # Don't let node scale-down evict the decision-log query engine.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  auth:
    username: rulebricks
    password: ""
    # BYO seam: point at an existing Secret to stop the chart from managing
    # credentials. When overriding, also set
    # rulebricks.app.clickhouse.existingSecret and, if ClickStack is enabled,
    # clickstack.clickhouse.existingSecret.
    existingSecret: '{{ printf "%s-clickhouse-credentials" .Release.Name }}'
    existingSecretKey: admin-password
  # Decision-log table retention. Applied during normal merges; changing the
  # value updates the existing table on upgrade. Ignored in stateless mode,
  # where object-store lifecycle policy owns retention.
  decisionLogs:
    retentionDays: 30
  # enabled=true stores the decision_logs table on a PVC; enabled=false runs
  # stateless and serves the object-storage archive view instead. ClickStack
  # telemetry requires persistence.
  #
  # PVC sizing: budget for retained decision-log volume plus ClickStack
  # telemetry (when enabled) and leave at least 35% free for merges.
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      # Keep headroom for archive reads and background merges.
      cpu: "4"
      memory: "12Gi"
  serviceAccount:
    create: true
    annotations: {}
  # Extra pod-template labels (the CLI sets workload-identity labels here
  # when the archive lives in Azure Blob storage).
  podLabels: {}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Enables the system log tables (query_log, etc.), useful for diagnosing
  # slow or failed decision-log queries.
  sampling:
    enabled: true
  queryLimits:
    # Per-query memory ceiling, kept below the server cap so one runaway
    # query fails instead of starving the server.
    maxMemoryUsage: 4294967296
    maxThreads: 4
    maxExecutionTime: 120
    # Row-read safety valve. With readOverflowMode "break", hitting the cap
    # returns a partial result; set "throw" to fail loudly instead.
    maxRowsToRead: 50000000
    readOverflowMode: break
  otelQueryLimits:
    maxMemoryUsage: 4294967296
    maxThreads: 8
    maxExecutionTime: 120
  otelDatabase: otel

# Ingress Controller (Traefik)
traefik:
  enabled: true
  # traefik does not read global.imageRegistry; an air-gapped registry must
  # override image.registry (the CLI does this).
  image:
    registry: docker.io
    repository: rulebricks/traefik
    tag: "3.7.6-debian13"
  deployment:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  ingressClass:
    name: traefik # Must match ingress.className in rulebricks and supabase
  autoscaling:
    enabled: true
    minReplicas: 1
    # Headroom for high-RPS clients; pods are cheap and shed at idle.
    maxReplicas: 8
    # Scale up freely, scale down reluctantly so proxies are not removed
    # mid-load.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  ports:
    # Entrypoint timeouts, sized with the HPS payload envelope
    # (rulebricks.hps.limits): readTimeout covers receiving an entire request
    # body and must sit at or above requestTimeoutMs; graceTimeOut drains
    # in-flight requests on shutdown and must sit above rpcTimeoutMs.
    # If an L4 load balancer sits in front, its TCP idle timeout must also
    # exceed rpcTimeoutMs (the CLI handles this on Azure).
    web:
      port: 8000
      exposedPort: 80
      transport:
        respondingTimeouts:
          readTimeout: "330s"
        lifeCycle:
          requestAcceptGraceTimeout: "5s"
          graceTimeOut: "330s"
    websecure:
      port: 8443
      exposedPort: 443
      transport:
        respondingTimeouts:
          readTimeout: "330s"
        lifeCycle:
          requestAcceptGraceTimeout: "5s"
          graceTimeOut: "330s"
  metrics:
    prometheus:
      enabled: true
      disableAPICheck: true
      serviceMonitor:
        # Edge metrics give end-to-end request visibility; keep enabled.
        enabled: true
  # Distributed tracing (Traefik v3 OTLP): the ingress becomes the root span
  # of every request. The CLI fills the release-scoped collector endpoint
  # automatically; for hand-installs, uncomment and set <release>:
  #
  # tracing:
  #   otlp:
  #     enabled: true
  #     http:
  #       enabled: true
  #       endpoint: "http://<release>-otel-collector:4318/v1/traces"
  tracing: {}
  persistence:
    enabled: false

# Autoscaling (KEDA)
keda:
  enabled: true
  # keda uses its own global.image.registry key; the CLI sets it for an
  # air-gapped registry.
  # Opts KEDA's webhook out of the AKS admissions enforcer, which otherwise
  # takes ownership of webhook fields and breaks later helm upgrades.
  # Harmless on non-AKS clusters.
  additionalAnnotations:
    admissions.enforcer/disabled: "true"
  image:
    keda:
      registry: docker.io
      repository: rulebricks/keda
      tag: "2.20.1-debian13"
    metricsApiServer:
      registry: docker.io
      repository: rulebricks/keda-metrics-apiserver
      tag: "2.20.1-debian13"
    webhooks:
      registry: docker.io
      repository: rulebricks/keda-admission-webhooks
      tag: "2.20.1-debian13"
  podLabels:
    keda:
      rulebricks.com/workload-group: infrastructure
    metricsAdapter:
      rulebricks.com/workload-group: infrastructure
    webhooks:
      rulebricks.com/workload-group: infrastructure
  crds:
    install: false # CRDs are managed in parent chart crds/ directory

# Certificate Management (cert-manager)
cert-manager:
  enabled: true
  # For an air-gapped registry, override image.registry (the CLI does this).
  image:
    registry: docker.io
    repository: rulebricks/cert-manager-controller
    tag: "1.21.0-debian13"
  # CRDs are managed in the parent chart's crds/ directory.
  crds:
    enabled: false
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Controller tolerations. Defaults are empty so AMD64 and untainted ARM64
  # clusters work without architecture-specific values.
  tolerations: []
  # Example for ARM64 node pools tainted with kubernetes.io/arch=arm64:
  # tolerations:
  #   - key: kubernetes.io/arch
  #     operator: Equal
  #     value: arm64
  #     effect: NoSchedule
  # Webhook tolerations
  webhook:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-webhook
      tag: "1.21.0-debian13"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    tolerations: []
    # Example for ARM64-tainted node pools:
    # tolerations:
    #   - key: kubernetes.io/arch
    #     operator: Equal
    #     value: arm64
    #     effect: NoSchedule
  # CAinjector tolerations
  cainjector:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-cainjector
      tag: "1.21.0-debian13"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    tolerations: []
    # Example for ARM64-tainted node pools:
    # tolerations:
    #   - key: kubernetes.io/arch
    #     operator: Equal
    #     value: arm64
    #     effect: NoSchedule
  startupapicheck:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-startupapicheck
      tag: "1.21.0-debian13"
  acmesolver:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-acmesolver
      tag: "1.21.0-debian13"

# =============================================================================
# SELF-HOSTED DATABASE SETTINGS (Supabase)
# Set enabled: false to use an external Supabase instance instead
# =============================================================================
supabase:
  enabled: true
  # Database options:
  #   1. Self-hosted (default): bundled in-cluster Postgres (db.* below).
  #   2. External (managed) PostgreSQL: set externalDatabase.enabled: true. That one
  #      switch disables the bundled database, points every Supabase service at your
  #      instance, and runs a one-time hook to initialize it (externalDatabase.bootstrap).
  externalDatabase:
    enabled: false
    host: ""
    port: 5432
    # Connection fields every service uses. Keep credentials in secret.db, or
    # point secretRef at one existing Secret for host/port/username/password/database.
    secretRef: ""
    secretRefKey:
      # host/port default empty for backward compatibility. Set these to source
      # DB_HOST/DB_PORT from the same external database Secret.
      host: ""
      port: ""
      username: username
      password: password
      database: database
    # One-time initialization of a bare external database (roles, schemas, auth
    # helpers, publication). Set enabled: false if you run bootstrap.sql yourself.
    bootstrap:
      enabled: true
      # Inline master/owner creds (materialized into a short-lived hook Secret).
      masterUsername: "postgres"
      masterPassword: ""     # required unless secretRef is set
      # Advanced: pre-created Secret (keys: master-username/master-password/service-password)
      secretRef: ""
      appRole: "postgres"    # role your app migrations run as (DB master on RDS)
  secret:
    # SMTP credentials are sourced from global.smtp.user and global.smtp.pass
    # JWT keys are sourced from global.supabase.* (anonKey, serviceKey, jwtSecret)
    # Empty by default - provide your own (or let the CLI create the Secret and
    # set secretRef). No shipped working defaults.
    db:
      username: "postgres"
      password: ""
      database: "postgres"
    dashboard:
      username: "supabase"
      password: ""
  # Database resource and storage configuration (for self-hosted)
  db:
    # Critical-tier scheduling and eviction protection for the primary
    # datastore. priorityClassName is "<release>-critical" (CLI fills it).
    priorityClassName: ""
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    resources:
      # CPU is intentionally uncapped so Postgres can burst across spare
      # cores; memory keeps a hard ceiling to protect the node.
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3
  # Kong API Gateway ingress configuration
  kong:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    ingress:
      enabled: true
      className: traefik
      annotations: {}
  # Optional separate hostname for Supabase Studio
  studio:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    ingress:
      enabled: false
      type: "ingress"
      className: traefik
      hostname: "" # Defaults to studio.<global.domain>
      annotations: {}
  auth:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  rest:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  realtime:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  meta:
    podLabels:
      rulebricks.com/workload-group: infrastructure

# =============================================================================
# DATABASE BACKUPS
# Periodic Supabase Postgres base backups are written to global.storage.dbBackups.
# Requires self-hosted Supabase.
# =============================================================================
backup:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 30
  # Postgres role used for logical dumps/restores. Must be a superuser so it can
  # read schemas owned by supabase_admin (auth, storage, realtime, etc.).
  superuser: supabase_admin
  # Time to keep completed backup jobs and their pod logs (seconds, default 30 days)
  ttlSecondsAfterFinished: 2592000
  # Uploads run through rclone (S3 / Azure Blob / GCS) using the pod's
  # workload identity; no static credentials needed.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jobHistory:
    successful: 30
    failed: 30

# =============================================================================
# SMTP RELAY (Azure Communication Services, API-key mode), opt-in
# In-cluster SMTP listener that forwards mail to the ACS Email REST API for
# tenants that hold an API key instead of Entra SMTP credentials. When
# enabled, point global.smtp.host/port at <release>-smtp-relay:1025 and leave
# global.smtp.user/pass empty. The CLI wires this automatically for the
# "Azure Communication Services (API key)" email provider.
# =============================================================================
smtpRelay:
  enabled: false
  image:
    registry: docker.io
    repository: rulebricks/smtp-acs-bridge
    tag: "1.4.0-r2"
  replicas: 1
  # REQUIRED when enabled. The address mail is sent from - a MailFrom address
  # on a (verified) domain linked to the ACS resource, e.g.
  # DoNotReply@xxxx.azurecomm.net. Normally equals global.smtp.from.
  senderAddress: ""
  # Optional comma-separated domain allow-list: client MAIL FROM addresses on
  # these domains are forwarded as-is; anything else falls back to
  # senderAddress.
  allowedSenderDomains: ""
  # ACS connection string, inline (evaluation only - prefer existingSecret).
  connectionString: ""
  # Runtime alternative to the inline connectionString: an existing Secret
  # (CLI-created or synced by External Secrets Operator) carrying the
  # connection string.
  existingSecret:
    name: ""
    connectionStringKey: "connection-string"
  service:
    port: 1025
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podLabels:
    rulebricks.com/workload-group: infrastructure
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# DECISION LOGS (Vector)
# Aggregates and forwards rule execution logs to one or more configurable sinks (console, S3, etc.)
# The Kafka broker address is automatically configured via the vector-env-configmap.yaml template.
# =============================================================================
vector:
  enabled: true
  image:
    repository: docker.io/rulebricks/vector
    tag: "0.57.0-debian13"
  # Dormant HAProxy LB (only used with an HAProxy-fronted vector role).
  haproxy:
    image:
      repository: docker.io/rulebricks/haproxy
      tag: "3.4.2-debian13"
  podLabels:
    rulebricks.com/workload-group: infrastructure
  role: "Stateless-Aggregator"
  replicas: 2
  # The object-storage sink buffers whole uncompressed batches in memory
  # before flushing: keep limits.memory comfortably above the configured
  # batch size times expected concurrent batches.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  service:
    enabled: true
    ports:
      - name: api
        port: 8686
        protocol: TCP
        targetPort: 8686
  # CA trust bundle: the hardened vector image ships no system CA store, so
  # this init container seeds one before Vector starts. Without it every TLS
  # sink connection fails and decision logs are dropped. Keep as-is.
  initContainers:
    - name: ca-certs
      image: docker.io/rulebricks/curl:8.21.0-alpine
      command:
        - curl
        - -sSf
        - -o
        - /certs/ca-certificates.crt
        - file:///etc/ssl/certs/ca-certificates.crt
      volumeMounts:
        - name: ca-certs
          mountPath: /certs
  extraVolumes:
    - name: ca-certs
      emptyDir: {}
  extraVolumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs
      readOnly: true
  # Kafka connection settings come from the templated vector-kafka-env
  # ConfigMap. Token auth mechanisms (MSK IAM, GCP OAUTHBEARER) are handled
  # by the kafka-proxy bridge sidecar (kafkaBridge below).
  env:
    # The kafka source below is driven by ${KAFKA_*} placeholders; Vector
    # 0.57+ requires this flag for env-var interpolation in config files.
    - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
      value: "true"
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
    - name: KAFKA_BOOTSTRAP_SERVERS
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_BOOTSTRAP_SERVERS
    - name: KAFKA_TLS_ENABLED
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_TLS_ENABLED
    - name: KAFKA_SASL_ENABLED
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_SASL_ENABLED
    - name: KAFKA_SASL_MECHANISM
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_SASL_MECHANISM
    - name: KAFKA_LOG_TOPIC
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_LOG_TOPIC
    - name: KAFKA_CONSUMER_GROUP
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_CONSUMER_GROUP
    # SASL credentials (inline PLAIN/SCRAM). Optional so in-cluster/token-auth deploys
    # work without the secret existing. existingSecret users can override these entries.
    - name: KAFKA_SASL_USERNAME
      valueFrom:
        secretKeyRef:
          name: vector-kafka-credentials
          key: KAFKA_SASL_USERNAME
          optional: true
    - name: KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: vector-kafka-credentials
          key: KAFKA_SASL_PASSWORD
          optional: true
  customConfig:
    sources:
      kafka:
        type: kafka
        # KAFKA_BOOTSTRAP_SERVERS is set automatically via env from the vector-kafka-env ConfigMap.
        # Fallback value is only used if the env var is somehow not set.
        bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-rulebricks-kafka-kafka-bootstrap:9092}"
        # KAFKA_LOG_TOPIC carries the namespace prefix (e.g. com.rulebricks.logs).
        topics:
          - "${KAFKA_LOG_TOPIC:-logs}"
        # KAFKA_CONSUMER_GROUP carries the same prefix so co-tenant
        # deployments on a shared cluster don't rebalance each other.
        group_id: "${KAFKA_CONSUMER_GROUP:-vector-consumers}"
        auto_offset_reset: latest
        # TLS + SASL are driven by env from vector-kafka-env. Disabled by default
        # (in-cluster Kafka and the bridge path both use plaintext).
        tls:
          enabled: ${KAFKA_TLS_ENABLED:-false}
        sasl:
          enabled: ${KAFKA_SASL_ENABLED:-false}
          mechanism: "${KAFKA_SASL_MECHANISM:-PLAIN}"
          # username/password are intentionally omitted; the CLI injects them
          # for external SASL Kafka. Do not add empty-string defaults here.
    transforms:
      normalize_logs:
        type: remap
        inputs:
          - kafka
        # HPS owns the decision-log schema. Vector owns the Kafka-to-JSON
        # typing boundary so storage sinks stay stable during rolling deploys.
        source: '{{ include "rulebricks.vector.normalizeLogs" . }}'
    sinks:
      console:
        type: console
        inputs:
          - normalize_logs
        encoding:
          codec: json
      # ==== Decision Log Storage Sink ====
      # When clickhouse.enabled and global.storage (bucket + paths.decisionLogs)
      # are configured, add a decision_logs sink so ClickHouse can query the
      # NDJSON archive directly.
      # The key prefix MUST match the partition layout used by ClickHouse's
      # named_collection URLs in clickhouse.configdFiles (year=YYYY/month=MM/...).
      # The CLI generates this automatically; hand-installs should set it here.
      #
      # decision_logs:
      #   type: aws_s3            # or azure_blob | gcp_cloud_storage
      #   inputs:
      #     - normalize_logs
      #   bucket: "your-bucket"
      #   region: "us-east-1"
      #   key_prefix: "decision-logs/year=%Y/month=%m/day=%d/hour=%H/"
      #   # Extension MUST end in .zst (or .gz): ClickHouse's named collection
      #   # globs *.{gz,zst} and auto-detects compression from the extension.
      #   # A bare "ndjson" extension uploads fine but is invisible to the app.
      #   # (azure_blob has no filename_extension; it writes .log.zst itself.)
      #   filename_extension: "ndjson.zst"
      #   compression: zstd
      #   encoding:
      #     codec: json
      #   framing:
      #     method: newline_delimited
      #   batch:
      #     max_bytes: 268435456
      #     timeout_secs: 300
      #   # Authentication via IRSA (recommended) - no credentials needed in config.
      #   # Vector will use the IAM role attached to its service account.

# =============================================================================
# VECTOR KAFKA BRIDGE (token-auth managed Kafka)
# For external Kafka using token auth (AWS MSK IAM, GCP OAUTHBEARER), which
# Vector cannot speak natively: a kafka-proxy sidecar authenticates upstream
# with the pod's workload identity and exposes a local plaintext listener.
# The CLI sets this automatically; for hand-installs, enable it, add the
# sidecar to vector.extraContainers (example below), and annotate the Vector
# service account with the cloud identity.
# =============================================================================
kafkaBridge:
  enabled: false
  # Cloud provider for the upstream auth method: "aws" | "gcp"
  provider: ""
  # Region (required for AWS MSK IAM signing)
  region: ""
  # Comma-separated upstream broker list (the real managed-Kafka brokers).
  brokers: ""
  # Local port the proxy listens on; Vector points KAFKA_BOOTSTRAP_SERVERS here.
  localPort: 19092
  image: "docker.io/rulebricks/kafka-proxy:0.4.3-r1"
  # Workload identity used by the bridge. AWS: IRSA role ARN; GCP: Workload
  # Identity service account email. The CLI writes the matching annotation
  # onto the Vector and HPS service accounts.
  awsRoleArn: ""
  gcpServiceAccountEmail: ""
#
# Example vector.extraContainers entry for AWS MSK IAM (generated by the CLI):
#
# vector:
#   extraContainers:
#     - name: kafka-proxy
#       image: grepplabs/kafka-proxy:latest
#       args:
#         - server
#         - --bootstrap-server-mapping=b-1.msk.example:9098,127.0.0.1:19092
#         - --bootstrap-server-mapping=b-2.msk.example:9098,127.0.0.1:19093
#         - --tls-enable
#         - --sasl-enable
#         - --sasl-method=AWS_MSK_IAM
#         - --sasl-aws-region=us-east-1
#       ports:
#         - containerPort: 19092
#   serviceAccount:
#     create: true
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/vector-msk-consumer

# =============================================================================
# APPLICATION / CONTAINER LOG SHIPPING (Vector agent DaemonSet)
# A second Vector deployment that tails Kubernetes pod logs and ships them to
# a customer-managed backend (Elasticsearch, Loki, or generic HTTP). Distinct
# from the decision-log aggregator above; decision logs stay in ClickHouse.
# Disabled by default. The CLI generates the sink; for hand-installs, enable
# below and replace the console sink with a backend sink (examples included).
# =============================================================================
vector-agent:
  enabled: false
  image:
    repository: docker.io/rulebricks/vector
    tag: "0.57.0-debian13"
  role: "Agent"
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Same CA-bundle seeding as the vector aggregator above. Keep as-is.
  initContainers:
    - name: ca-certs
      image: docker.io/rulebricks/curl:8.21.0-alpine
      command:
        - curl
        - -sSf
        - -o
        - /certs/ca-certificates.crt
        - file:///etc/ssl/certs/ca-certificates.crt
      volumeMounts:
        - name: ca-certs
          mountPath: /certs
  extraVolumes:
    - name: ca-certs
      emptyDir: {}
  extraVolumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs
      readOnly: true
  env:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
  # Tolerate the Rulebricks burst pool so worker-node logs are collected.
  tolerations:
    - key: rulebricks.com/pool
      operator: Equal
      value: burst
      effect: NoSchedule
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  customConfig:
    data_dir: /vector-data-dir
    sources:
      kubernetes_logs:
        type: kubernetes_logs
        # Skip both Vector deployments (decision logs belong in ClickHouse,
        # and the agent must not scrape itself). All other pods are collected.
        extra_label_selector: "app.kubernetes.io/name notin (vector,vector-agent)"
    transforms:
      app_logs:
        type: remap
        inputs:
          - kubernetes_logs
        # Parse structured JSON log lines to lift trace_id/span_id for
        # logs-to-traces correlation; plain lines pass through untouched.
        source: |
          parsed, err = parse_json(to_string(.message) ?? "")
          if err == null && is_object(parsed) {
            .log = parsed
            .trace_id = parsed.trace_id
            .span_id = parsed.span_id
            if exists(parsed.level) { .level = to_string(parsed.level) ?? "info" }
          }
          .pod = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
    sinks:
      # Default console sink keeps the agent valid when enabled without an
      # Elasticsearch endpoint configured. The CLI replaces this with the
      # elasticsearch sink below.
      console:
        type: console
        inputs:
          - app_logs
        encoding:
          codec: json
      # ==== Elasticsearch sink (CLI-generated; hand-install example) ====
      # elasticsearch:
      #   type: elasticsearch
      #   inputs:
      #     - app_logs
      #   endpoints:
      #     - "https://<your-elasticsearch-host>:9200"
      #   mode: bulk
      #   bulk:
      #     index: "rulebricks-app-logs"
      #   # Basic auth:
      #   auth:
      #     strategy: basic
      #     user: "elastic"
      #     password: "<password>"
      #   # API key auth (alternative): drop `auth` and set a request header:
      #   # request:
      #   #   headers:
      #   #     Authorization: "ApiKey <base64-api-key>"
      #   tls:
      #     verify_certificate: true
      # ==== Loki sink (CLI-generated; hand-install example) ====
      # loki:
      #   type: loki
      #   inputs:
      #     - app_logs
      #   endpoint: "https://<your-loki-host>/loki/api/v1/push"
      #   labels:
      #     app: rulebricks
      #     namespace: "{{ namespace }}"
      #     pod: "{{ pod }}"
      #     container: "{{ container }}"
      #   encoding:
      #     codec: json
      # ==== Generic HTTP sink (CLI-generated; hand-install example) ====
      # generic_http:
      #   type: http
      #   inputs:
      #     - app_logs
      #   uri: "https://logs.example.com/ingest"
      #   method: post
      #   encoding:
      #     codec: json

# =============================================================================
# CLICKSTACK OBSERVABILITY BACKEND
# Built-in logs, traces, and mirrored metrics via ClickHouse + HyperDX. When
# enabled, the ClickStack OTel gateway owns the <release>-otel-collector service
# that app/HPS/worker/Traefik already send OTLP to. Decision logs stay in object
# storage and are queried through the object-storage-backed ClickHouse archive.
# =============================================================================
clickstack:
  # NOTE: the on/off switch is global.clickstack.enabled (the subchart's
  # dependency condition; it also drives the cross-subchart OTLP wiring).
  # The keys below only configure ClickStack when it is enabled.
  clickhouse:
    database: otel
    username: rulebricks
    existingSecret: ""
    existingSecretKey: admin-password
    retentionDays: 7
    # Advanced override. Leave empty to derive from retentionDays.
    ttl: ""
  hyperdx:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/hyperdx
      tag: "2.31.0"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    ingress:
      enabled: true
      type: "ingress" # "ingress" or "gateway-api"
      className: traefik
      hostname: "" # Defaults to observability.<global.domain>
      allowedIPs: []
      gatewayApi:
        gatewayName: ""
        gatewayNamespace: ""
        sectionName: ""
  collector:
    image:
      registry: docker.io
      repository: rulebricks/clickstack-otel-collector
      tag: "2.31.0-r1"
    memoryLimitMiB: 800
    # Telemetry noise controls (dropped at the gateway before storage): keep
    # HTTP trace spans for the /api/v1 API, drop health-probe and
    # metrics-scrape spans and log lines. "" disables a rule.
    filters:
      traces:
        httpPathAllowRegex: "^/api/v1(/|$)"
        httpPathDenyRegex: "^/(api/)?(health|healthz|livez|readyz|metrics|ping)([/?]|$)"
      logs:
        bodyDenyRegex: "(GET|HEAD) /(api/)?(health|healthz|livez|readyz|metrics|ping)([ ?]|$)"
    gateway:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 1Gi
    agent:
      enabled: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  ferretdb:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/ferretdb
      tag: "2.7.0-r1"
    postgresImage:
      registry: docker.io
      repository: rulebricks/postgres-documentdb
      tag: "17-0.107.0-ferretdb-2.7.0-r1"
    auth:
      username: hyperdx
      password: ""
      existingSecret: ""
      existingSecretKey: password
    persistence:
      enabled: true
      size: 10Gi
    resources:
      ferretdb:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      postgres:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

# =============================================================================
# MONITORING & ALERTING
# Controls cluster metrics and alerting via Prometheus
# =============================================================================
monitoring:
  enabled: true
kube-prometheus-stack:
  # kube-prometheus-stack honors the parent global.imageRegistry, so a single
  # override repoints these images too.
  alertmanager:
    enabled: false
    alertmanagerSpec:
      image:
        registry: docker.io
        repository: rulebricks/alertmanager
        tag: "0.33.1-debian13"
  grafana:
    # In-cluster Grafana is opt-in. When enabled, the dashboard sidecar
    # imports the provisioned Rulebricks dashboards automatically.
    enabled: false
    image:
      registry: docker.io
      repository: rulebricks/grafana
      tag: "13.1.0-debian13"
    sidecar:
      image:
        registry: docker.io
        repository: rulebricks/k8s-sidecar
        tag: "2.8.1-debian13"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    # Dormant grafana helper images, pinned.
    testFramework:
      image:
        registry: docker.io
        repository: rulebricks/bats
        tag: "1.13.0-debian13"
    downloadDashboardsImage:
      registry: docker.io
      repository: rulebricks/curl
      tag: "8.21.0-alpine"
    initChownData:
      image:
        registry: docker.io
        repository: rulebricks/busybox
        tag: "1.38.0-alpine"
    imageRenderer:
      image:
        registry: docker.io
        repository: rulebricks/grafana-image-renderer
        tag: "5.10.1-debian13"
  prometheus:
    prometheusSpec:
      image:
        registry: docker.io
        repository: rulebricks/prometheus
        tag: "3.13.1-debian13"
      retention: 30d
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      remoteWrite: []
      # Examples:
      # - Azure Monitor managed Prometheus:
      #   remoteWrite:
      #     - url: "https://<workspace>.<region>.metrics.ingest.monitor.azure.com/dataCollectionRules/<dcr-id>/streams/Microsoft-PrometheusMetrics/api/v1/write?api-version=2023-04-24"
      #       azureAd:
      #         cloud: AzurePublic
      #         managedIdentity:
      #           clientId: "<managed-identity-client-id>"
      # - Grafana Cloud / Mimir-compatible:
      #   remoteWrite:
      #     - url: "https://prometheus-prod-XX.grafana.net/api/prom/push"
      #       basicAuth:
      #         username:
      #           name: prometheus-remote-write
      #           key: username
      #         password:
      #           name: prometheus-remote-write
      #           key: password
  prometheusOperator:
    image:
      registry: docker.io
      repository: rulebricks/prometheus-operator
      tag: "0.92.1-debian13"
    prometheusConfigReloader:
      image:
        registry: docker.io
        repository: rulebricks/prometheus-config-reloader
        tag: "0.92.1-debian13"
    admissionWebhooks:
      patch:
        image:
          registry: docker.io
          repository: rulebricks/kube-webhook-certgen
          tag: "1.8.4-debian13"
      deployment:
        image:
          registry: docker.io
          repository: rulebricks/prometheus-operator-admission-webhook
          tag: "0.92.1-debian13"
    thanosImage:
      registry: docker.io
      repository: rulebricks/thanos
      tag: "0.42.2-debian13"
  kube-state-metrics:
    image:
      registry: docker.io
      repository: rulebricks/kube-state-metrics
      tag: "2.19.1-debian13"
    kubeRBACProxy:
      image:
        registry: docker.io
        repository: rulebricks/kube-rbac-proxy
        tag: "0.22.1-debian13"
  prometheus-node-exporter:
    image:
      registry: docker.io
      repository: rulebricks/node-exporter
      tag: "1.12.1-debian13"
      # This image is already distroless; don't append the chart's suffix.
      distroless: false
    # Dormant, pinned so enabling it never pulls an upstream default.
    kubeRBACProxy:
      image:
        registry: docker.io
        repository: rulebricks/kube-rbac-proxy
        tag: "0.22.1-debian13"
    permissionInitContainer:
      image:
        registry: docker.io
        repository: rulebricks/busybox
        tag: "1.38.0-alpine"
  # Dormant optional sub-images, pinned so no feature toggle ever reaches
  # outside the mirrored registry.
  thanosRuler:
    thanosRulerSpec:
      image:
        registry: docker.io
        repository: rulebricks/thanos
        tag: "0.42.2-debian13"
  crds:
    upgradeJob:
      image:
        busybox:
          registry: docker.io
          repository: rulebricks/busybox
          tag: "1.38.0-alpine"
        kubectl:
          registry: docker.io
          repository: rulebricks/kubectl
          tag: "1.36.2-debian13"
  prometheus-windows-exporter:
    image:
      registry: docker.io
      repository: rulebricks/windows-exporter
      tag: "0.31.7"

# =============================================================================
# EXTERNAL SECRETS
# This chart consumes pre-existing Kubernetes Secrets through the *.secretRef /
# *.existingSecret seams (see .secrets.example and the README "Secrets" section)
# and does NOT render SecretStore/ExternalSecret resources itself. Sync your
# vault (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, HashiCorp
# Vault, ...) into those Secrets with the External Secrets Operator - see
# examples/external-secrets/ for per-provider copy-paste manifests.
# =============================================================================
externalSecrets:
  # Install a namespace-scoped External Secrets Operator alongside this release
  # (images mirrored to docker.io/rulebricks/*; see the external-secrets block
  # below). Leave false when ESO is already managed at cluster scope.
  installOperator: false

# Dependency values for the optional External Secrets Operator installation.
external-secrets:
  installCRDs: true
  crds:
    createClusterExternalSecret: false
    createClusterSecretStore: false
    createSecretStore: true
    createClusterGenerator: false
    createClusterPushSecret: false
    createPushSecret: false
  scopedRBAC: true
  processClusterExternalSecret: false
  processClusterPushSecret: false
  processClusterStore: false
  processClusterGenerator: false
  processPushSecret: false
  processSecretStore: true
  global:
    repository: docker.io/rulebricks/external-secrets
  # The mirrored tag differs from the chart default, so pin it explicitly on
  # all three ESO deployments.
  image:
    tag: "2.8.0-debian13"
  webhook:
    image:
      tag: "2.8.0-debian13"
  certController:
    image:
      tag: "2.8.0-debian13"

# =============================================================================
# STORAGE CLASS (AWS EBS gp3)
# Creates a gp3 StorageClass if it doesn't exist
# =============================================================================
storageClass:
  create: true
  name: gp3
  provisioner: ebs.csi.aws.com
  type: gp3
  fsType: ext4
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true

# =============================================================================
# MIGRATION JOB SETTINGS
# Configuration for database migration jobs (self-hosted and managed)
# =============================================================================
migrations:
  # Strategy for migration job execution:
  #   - "hook": Runs as Helm post-install/post-upgrade hook (default)
  #   - "deployment": Creates job as regular resource (supports post-rendering)
  #   - "manual": Renders template without hooks (apply separately)
  strategy: "hook"
  # Time to keep completed jobs and their pod logs (seconds, default 30 days)
  ttlSecondsAfterFinished: 2592000
  # Number of retries before marking job as failed
  backoffLimit: 3
  # Pod restart policy
  restartPolicy: OnFailure
  # Node selector for migration pods (inherits from global.scheduling if not set)
  nodeSelector: {}
  # Tolerations for migration pods. Defaults are empty; add the example below
  # only for clusters that taint ARM64 nodes with kubernetes.io/arch=arm64.
  tolerations: []
  # tolerations:
  #   - key: kubernetes.io/arch
  #     operator: Equal
  #     value: arm64
  #     effect: NoSchedule
  # Additional annotations for the job
  annotations: {}
  # External database configuration (used when supabase.db.enabled: false)
  externalDb:
    # Host of the external PostgreSQL server
    host: ""
    # Port (default: 5432)
    port: "5432"
    # Reference to existing secret containing password
    existingSecret: ""
    existingSecretKey: "password"

# =============================================================================
# AUTOMATIC DNS MANAGEMENT (External-DNS)
# Deploys external-dns to automatically create DNS records for your domain.
# This enables single-phase installation with TLS from the start.
#
# Two usage modes:
#   1. Deploy external-dns with this chart:
#      Set external-dns.enabled=true AND global.externalDnsEnabled=true
#
#   2. Use existing cluster-wide external-dns:
#      Set only global.externalDnsEnabled=true (external-dns.enabled=false)
#      Your existing external-dns will pick up the ingress annotations
# =============================================================================
external-dns:
  enabled: false
  # Self-mirrored to rulebricks/*. external-dns image.repository is the full path
  # (no image.registry field in this chart).
  image:
    repository: docker.io/rulebricks/external-dns
    tag: "0.21.0-debian13"
  # Provider: route53, cloudflare, google, azure (object form per external-dns 1.21+)
  provider:
    name: route53
  # Sources to watch for DNS records (ingress is the default)
  sources:
    - ingress
  # Domain filter - restricts external-dns to your domain only
  domainFilters: []
  # Policy: sync (create & delete), upsert-only (create only)
  policy: upsert-only
  # --- Provider-specific configuration ---
  # For AWS Route53: uses IRSA by default (recommended)
  # Ensure your EKS cluster has IRSA configured and the service account
  # has the appropriate IAM role attached.
  #
  # For Cloudflare: set env variables
  # extraEnvVars:
  #   - name: CF_API_TOKEN
  #     valueFrom:
  #       secretKeyRef:
  #         name: cloudflare-api-token
  #         key: api-token
  #
  # For Google Cloud DNS: uses workload identity by default
  # google:
  #   project: "your-gcp-project"
  #
  # For Azure DNS:
  # azure:
  #   resourceGroup: "your-resource-group"
  #   subscriptionId: "your-subscription-id"

# Kubernetes cluster-autoscaler (AWS EKS only; GKE and AKS node pools
# autoscale natively). Required on EKS for the burst worker pool to activate.
# The CLI enables this for AWS deployments and sets autoDiscovery.clusterName.
cluster-autoscaler:
  enabled: false
  cloudProvider: aws
  # This subchart requires a full repository path and does not honor
  # global.imageRegistry.
  image:
    repository: docker.io/rulebricks/cluster-autoscaler
    tag: "1.35.1-debian13"
    # Takes secret-name strings (the CLI sets [<release>-regcred]).
    pullSecrets: []
  # REQUIRED when enabling: the autoscaler finds nodegroup ASGs by the
  # standard EKS nodegroup tags for this cluster name.
  autoDiscovery:
    clusterName: ""
  # REQUIRED when enabling.
  awsRegion: ""
  # Fixed ServiceAccount name so the workload-identity binding is stable
  # across releases.
  rbac:
    serviceAccount:
      name: cluster-autoscaler
  extraArgs:
    # Nodegroups span AZs; treat per-AZ groups as one pool.
    balance-similar-node-groups: true
    # Drain burst nodes promptly once the worker fleet cools down.
    scale-down-unneeded-time: 5m
    # Don't let lingering system pods block burst-node scale-down.
    skip-nodes-with-system-pods: false
    expander: least-waste
  # The autoscaler must never be evicted or preempted by the workloads it
  # rescues.
  priorityClassName: system-cluster-critical
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  resources:
    requests:
      cpu: "100m"
      memory: "300Mi"
    limits:
      cpu: "500m"
      memory: "600Mi"
