# =============================================================================
# GLOBAL RULEBRICKS SETTINGS
# These important values are used across multiple components and should be set here
# =============================================================================
global:
  # Domain for ingress and TLS certificate generation
  domain: "<rulebricks-subdomain>.<domain-you-control>"
  # Email for TLS certificate registration (required for cert-manager)
  email: "support@rulebricks.com"
  # License Key for Rulebricks Enterprise (provided in your onboarding space)
  licenseKey: "evaluation"
  # ---------------------------------------------------------------------------
  # Image registry & digest pinning
  # ---------------------------------------------------------------------------
  # Single override that repoints every image to your own registry (e.g. an Azure
  # Container Registry mirror) for air-gapped installs with no external egress.
  # Empty = the chart default docker.io/rulebricks/*. It replaces only the registry
  # HOST and keeps the rulebricks/<name> path, e.g. imageRegistry=myacr.azurecr.io
  # renders myacr.azurecr.io/rulebricks/clickhouse-server.
  # NOTE: a plain `helm install` propagates this to kube-prometheus-stack and to the
  # rulebricks/clickstack/supabase subcharts automatically, but cert-manager, traefik,
  # keda, vector, external-dns and cluster-autoscaler each use their own image keys.
  # the CLI rewrites those for you; hand-installers must also set the per-chart image
  # registry/repo.
  imageRegistry: ""
  # name -> sha256 digest map. GENERATED by scripts/images/render-digests.sh from
  # images/manifest.yaml
  imageDigests: {}
  # Shared leaf images (init/hook/test utilities) rendered through the image helper.
  images:
    postgres17: { registry: docker.io, repository: rulebricks/postgres, tag: "17-debian13" }
    node24: { registry: docker.io, repository: rulebricks/node, tag: "24-alpine-r1" }
    rclone: { registry: docker.io, repository: rulebricks/rclone, tag: "1.74.4" }
    busybox: { registry: docker.io, repository: rulebricks/busybox, tag: "1.38.0-alpine" }
    pause: { registry: docker.io, repository: rulebricks/pause, tag: "3.9" }
  # Image pull secret for the private rulebricks/* repos on Docker Hub. References
  # the license registry secret <release>-regcred (index.docker.io, authed by the
  # license PAT). kube-prometheus-stack + cert-manager honor this global value; keda,
  # traefik, vector and the strimzi operator each need the SAME secret on their own
  # key too (the CLI fills all of these automatically):
  #   keda.imagePullSecrets, traefik.deployment.imagePullSecrets,
  #   vector.image.pullSecrets, vector-agent.image.pullSecrets,
  #   strimzi-kafka-operator.image.imagePullSecrets,
  #   external-secrets.global.imagePullSecrets (when installOperator is on),
  #   cluster-autoscaler.image.pullSecrets (list of secret-name strings)
  # For hand-installs, use [{name: <release>-regcred}] for the object-shaped
  # keys above and [<release>-regcred] for cluster-autoscaler.image.pullSecrets.
  # When imageRegistry points at your own registry, replace this with that registry's
  # pull secret (the license PAT only authenticates docker.io/rulebricks/*).
  imagePullSecrets: []
  registry:
    # BYO seam: name of a pre-created kubernetes.io/dockerconfigjson Secret to
    # use for pulling rulebricks/* images. When set, the chart skips rendering
    # <release>-regcred from global.licenseKey and every rulebricks-owned
    # workload references this Secret instead. Remember to update the
    # subchart imagePullSecrets keys listed above to the same name.
    existingPullSecret: ""
  # Rulebricks product version used by app, HPS, HPS worker, and migration images.
  # CLI-generated values pin this to a semantic version such as "1.8.17".
  version: ""
  # Scheduling priority tiers (see templates/priorityclasses.yaml): creates
  # release-scoped <release>-critical and <release>-burst PriorityClasses.
  # Workers default to the burst class; point kafka/clickhouse at
  # <release>-critical via their priorityClassName values (the CLI does this
  # automatically).
  # the burst class is -5 (below the default 0)
  priorityClasses:
    enabled: true
  # Enable TLS/HTTPS - requires DNS records to be configured first
  # Set to `true` when using external-dns OR after manually creating DNS records
  tlsEnabled: false
  # Enable external-dns integration for automatic DNS record management
  # Works with either: the external-dns subchart below, OR an existing cluster-wide external-dns
  externalDnsEnabled: false
  # =============================================================================
  # Shared Object Storage
  # One cloud provider, one identity, and one bucket/container hold all Rulebricks
  # data. Decision logs and DB backups are just path prefixes within it.
  # =============================================================================
  storage:
    provider: "s3" # s3 | azure-blob | gcs
    # Single bucket (S3/GCS) or storage account (azure-blob).
    bucket: "<rulebricks-bucket>"
    region: "<object-storage-region>"
    s3:
      # Preferred: IAM Roles for Service Accounts (IRSA).
      iamRoleArn: ""
      # Optional escape hatch for static AWS credentials. Secret keys expected:
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Injected into the ClickHouse
      # workload (decision-log queries) and the DB backup upload job.
      existingSecret:
        name: ""
    azure:
      authMode: "workload-identity" # workload-identity | connection-string
      clientId: ""
      tenantId: ""
      # Single blob container holding every prefix below.
      container: ""
      connectionStringSecretRef:
        name: ""
        key: ""
    gcp:
      # Preferred: GKE Workload Identity.
      serviceAccountEmail: ""
    # Per-purpose key prefixes within the single bucket/container.
    paths:
      decisionLogs: "decision-logs"
      dbBackups: "db-backups"
  # Cross-chart switch for the built-in ClickStack observability backend. This
  # lives under global because sibling subcharts (rulebricks, clickhouse, etc.)
  # cannot see top-level clickstack.enabled.
  clickstack:
    enabled: true
  # =============================================================================
  # Distributed Tracing (OpenTelemetry)
  # Deploys an in-cluster OpenTelemetry Collector (parent-chart templates) that
  # receives OTLP spans from the Next.js app, the HPS gather plane, HPS workers,
  # and Traefik, then forwards them to a customer-managed Elastic APM endpoint
  # (BYO; e.g. Elastic Cloud or the Elastic add-on from AWS Marketplace).
  # Self-hosted only. Lives under global so the rulebricks subchart deployments
  # can read it and emit OTLP to the collector.
  #
  # Apps emit OTLP to the in-cluster collector service:
  #   http://<release>-otel-collector.<namespace>.svc.cluster.local:4318  (HTTP)
  #   http://<release>-otel-collector.<namespace>.svc.cluster.local:4317  (gRPC)
  # =============================================================================
  tracing:
    enabled: false
    # Trace destination the in-cluster collector exports to. One of:
    #   elastic       -> Elastic APM / Elastic Cloud (OTLP/HTTP)        [default]
    #   otlp          -> any generic OTLP/HTTP backend (Tempo, Honeycomb,
    #                    Jaeger, vendor OTLP gateways, AWS/Azure OTLP ingestion)
    #   azure-monitor -> Azure Monitor / Application Insights
    # AWS- and Azure-compatible: pick `otlp` for a vendor-neutral endpoint or
    # `azure-monitor` for Azure-native ingestion. The app/HPS/worker
    # instrumentation is unchanged regardless of destination.
    destination: "elastic"
    # Head-sampling ratio applied by the application SDKs (0.0 - 1.0). The
    # collector forwards everything it receives; control volume at the source.
    samplingRatio: 1.0
    collector:
      # OpenTelemetry Collector, CONTRIB variant - carries the otlphttp +
      # azuremonitor exporters used by all destinations below (the core distro
      # does not). Self-mirrored from the DHI image into docker.io/rulebricks/*.
      image:
        registry: docker.io
        repository: rulebricks/opentelemetry-collector
        tag: "0.156.0-debian13-contrib"
      replicas: 1
      # Soft cap (MiB) for the memory_limiter processor before it back-pressures.
      memoryLimitMiB: 400
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      podLabels:
        rulebricks.com/workload-group: infrastructure
      nodeSelector: {}
      tolerations: []
      affinity: {}
    # destination: elastic -- Customer-managed Elastic APM (BYO). The collector
    # forwards every received span to this OTLP endpoint.
    elastic:
      # OTLP endpoint of the Elastic APM Server / managed APM integration, e.g.
      # https://<deployment>.apm.<region>.cloud.es.io:443
      endpoint: ""
      # Auth mode for the Elastic endpoint:
      #   secret-token -> Authorization: Bearer <token>
      #   api-key      -> Authorization: ApiKey <key>
      #   none         -> no Authorization header
      authMode: "secret-token"
      # Inline credential (dev/eval only). For production reference an existing
      # secret via existingSecret below instead of inlining here.
      secretToken: ""
      apiKey: ""
      existingSecret:
        name: ""
        secretTokenKey: "secret-token"
        apiKeyKey: "api-key"
      # Skip TLS verification for the Elastic endpoint (NOT recommended).
      tlsInsecureSkipVerify: false
    # destination: otlp -- generic OTLP/HTTP backend.
    otlp:
      # Full OTLP/HTTP traces endpoint of the backend, e.g.
      #   https://otlp-gateway-<region>.grafana.net/otlp        (Grafana Cloud)
      #   https://api.honeycomb.io                              (Honeycomb)
      endpoint: ""
      # Auth mode for the generic endpoint:
      #   none    -> no auth header
      #   bearer  -> Authorization: Bearer <token>
      #   api-key -> Authorization: ApiKey <token>
      #   header  -> <headerName>: <token>   (e.g. x-honeycomb-team)
      authMode: "none"
      # Header name used when authMode is "header".
      headerName: "Authorization"
      # Inline credential for bearer/api-key/header modes (dev/eval only); use
      # existingSecret in production.
      token: ""
      apiKey: ""
      headerValue: ""
      existingSecret:
        name: ""
        tokenKey: "token"
      # Extra static (non-secret) headers added to every export request.
      headers: {}
      # Skip TLS verification for the endpoint (NOT recommended).
      tlsInsecureSkipVerify: false
    # destination: azure-monitor -- Azure Monitor / Application Insights.
    azureMonitor:
      # Application Insights connection string (carries the ingestion endpoint
      # and instrumentation key). Inline for dev/eval; use existingSecret in prod.
      connectionString: ""
      existingSecret:
        name: ""
        connectionStringKey: "connection-string"
  # =============================================================================
  # Global Labels and Annotations
  # Applied to ALL resources rendered by this chart (useful for compliance)
  # =============================================================================
  labels: {}
  # Example:
  #   team: rulebricks
  #   environment: production

  annotations: {}
  # Example:
  #   app.kubernetes.io/managed-by: helm

  # Labels applied only to pod templates (not metadata)
  podLabels: {}

  # Annotations applied only to pod templates
  podAnnotations: {}
  # =============================================================================
  # Global Scheduling Defaults
  # Optional scheduling defaults for chart templates that explicitly inherit
  # global.scheduling. Rulebricks workloads and migration jobs honor these;
  # dependency subcharts may require their own scheduling keys.
  # =============================================================================
  scheduling:
    # Node selector applied to workloads that inherit global scheduling
    nodeSelector: {}
    # Example for pinning to ARM64/Graviton nodes:
    #   kubernetes.io/arch: arm64

    # Tolerations applied to workloads that inherit global scheduling
    tolerations: []
    # Example for ARM64-tainted or dedicated node pools:
    #   - key: "kubernetes.io/arch"
    #     operator: "Equal"
    #     value: "arm64"
    #     effect: "NoSchedule"
    #   - key: "Dedicated"
    #     operator: "Equal"
    #     value: "rulebricks"
    #     effect: "NoSchedule"

    # Affinity rules applied to workloads that inherit global scheduling.
    # Prefer soft/preferred rules so node layout does not block installs.
    affinity: {}
  # SMTP Configuration (Vital for instance access and admin)
  smtp:
    host: "smtp.mailtrap.io"
    port: 2525
    user: ""
    pass: ""
    from: "no-reply@rulebricks.com"
    fromName: "Rulebricks"
  # Auth/Database Configuration
  supabase:
    # anonKey / serviceKey are derived from jwtSecret (below), NOT independent
    # secrets. For self-hosted Supabase each is an HS256 JWT signed with jwtSecret:
    #   payload {"role":"anon","iss":"supabase","iat":<now>,"exp":<later>}  -> anonKey
    #   payload {"role":"service_role", ...}                                 -> serviceKey
    # Generate them at https://supabase.com/docs/guides/self-hosting/self-hosted-auth-keys
    # (or any JWT encoder), or just let the Rulebricks CLI derive + create them.
    # Empty by default - never ship demo keys signed with a known secret.
    anonKey: ""
    serviceKey: ""
    # Runtime alternative to an inline anonKey: specify an existing Secret
    # (e.g. synced by External Secrets Operator from an external secret store)
    # that carries the public anon key, using the same secretRef/secretRefKey
    # pattern as the supabase subchart's secret.* blocks. The app deployment
    # injects the key as an explicit env var, overriding the ConfigMap's
    # template-time value.
    # NOTE: this seam sources ONLY the anon key. The other Supabase secrets
    # (serviceKey, jwtSecret, accessToken) ride global.secrets.secretRef; the
    # anon key cannot, because the app ConfigMap consumes it at template time.
    # Point this at the same Secret Kong reads (supabase.secret.jwt.secretRef;
    # the CLI-created <release>-supabase-jwt stores it under "anonKey").
    secretRef: ""
    # override secret keys for existing secret refs
    secretRefKey:
      anonKey: "anonKey"
    # Email Customization (subjects and templates for auth emails)
    emails:
      subjects:
        invite: "Join your team on Rulebricks"
        confirmation: "Confirm Your Email"
        recovery: "Reset Your Password"
        emailChange: "Confirm Email Change"
      templates:
        # HTML templates hosted on S3 (or any public URL)
        invite: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/invite.html"
        confirmation: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/verify.html"
        recovery: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/password_change.html"
        emailChange: "https://prefix-files.s3.us-west-2.amazonaws.com/templates/email_change.html"
    # [Managed Supabase] Leave URL empty if self-hosting
    url: ""
    # [Managed Supabase] Project reference (e.g., "abcdefghijkl")
    projectRef: ""
    # [Managed Supabase] Access token for headless CLI authentication
    # Generate from Supabase Dashboard: Account Settings > Access Tokens
    # Required when using managed Supabase (supabase.enabled=false)
    accessToken: ""
    # [Self-hosted Supabase] JWT signing secret (only needed for self-hosted Supabase).
    # Empty by default - must be provided (>=32 chars); never ship a known default.
    jwtSecret: ""
  # AI Features (Optional)
  # Enables AI-powered rule generation and suggestions
  ai:
    enabled: false
    openaiApiKey: "" # Your OpenAI API key
  # =============================================================================
  # Secret Reference (for external secret management)
  # Use this to reference a pre-existing secret instead of inline values
  # Works with External Secrets Operator, sealed-secrets, or manually created secrets
  # =============================================================================
  secrets:
    # Name of an existing secret to use (created by ESO, sealed-secrets, or manually)
    # When set, the chart will reference this secret instead of creating one
    secretRef: ""
    # Key mappings within the referenced secret
    secretRefKeys:
      licenseKey: "LICENSE_KEY"
      email: "EMAIL"
      smtpUser: "SMTP_USER"
      smtpPass: "SMTP_PASS"
      supabaseServiceKey: "SUPABASE_SERVICE_KEY"
      openaiApiKey: "OPENAI_API_KEY"
      supabaseAccessToken: "SUPABASE_ACCESS_TOKEN"
      ssoClientId: "SSO_CLIENT_ID"
      ssoClientSecret: "SSO_CLIENT_SECRET"
      # Only read when global.externalAuth.enabled. NOTE: other keys the app
      # consumes via envFrom (e.g. SUPABASE_ANON_KEY, REDIS_PASSWORD,
      # KAFKA_SASL_*) are loaded verbatim and cannot be remapped.
      jwtSecret: "JWT_SECRET"
  # =============================================================================
  # SSO Configuration (Optional)
  # Enables Single Sign-On via OIDC
  #
  # NATIVE PROVIDERS (azure, google, okta, keycloak):
  #   Supabase handles authentication directly.
  #
  # CUSTOM PROVIDERS (ory, other):
  #   The app includes a built-in OIDC proxy that translates paths for your IdP.
  # =============================================================================
  sso:
    enabled: false
    # Provider name: azure, google, okta, keycloak (native) | ory, other (custom)
    provider: ""
    # Provider URL - required for all providers except Google
    # Examples:
    #   Azure:    https://login.microsoftonline.com/{tenant-id}
    #   Okta:     https://your-org.okta.com
    #   Keycloak: https://keycloak.example.com/realms/your-realm
    #   Ory:      https://your-org.projects.oryapis.com
    url: ""
    # OAuth client credentials from your identity provider
    # You will need to setup the OAuth client in your identity provider with:
    #   scopes: openid, email, profile
    #   response_type: code
    #   grant_types: authorization_code, refresh_token
    #   authentication_method: http body
    #   Redirect URI's (register the one that matches your provider type):
    #     NATIVE providers (azure, google, okta, keycloak) - GoTrue handles the
    #     OAuth exchange, so the IdP must allow the Supabase callback:
    #       https://supabase.<your-domain>/auth/v1/callback
    #     CUSTOM providers (ory, other) - the app's built-in OIDC proxy is the
    #     callback target:
    #       https://<your-domain>/api/sso-proxy/callback
    #   Registering the wrong one breaks the login flow with a redirect_uri
    #   mismatch at the IdP.
    clientId: ""
    clientSecret: ""
  # =============================================================================
  # External Authentication (Token Passthrough)
  # For self-hosted deployments behind an identity-aware proxy or API gateway
  # that has already authenticated the user. Rulebricks will NOT verify the
  # token signature - it trusts whatever the upstream proxy forwards.
  #
  # SECURITY: Only enable this on deployments inside a private network that is
  # fully gated by your upstream proxy. Never enable on public-facing or
  # multi-tenant deployments. See docs: /private-deployment/sso/external-auth
  #
  # When enabled, the following are automatically wired to the app container:
  #   - EXTERNAL_AUTH_TOKEN_PASSTHROUGH / NEXT_PUBLIC_EXTERNAL_AUTH_TOKEN_PASSTHROUGH = "true"
  #   - JWT_SECRET sourced from global.supabase.jwtSecret
  #   - EMAIL sourced from global.email (designates the workspace admin)
  # =============================================================================
  externalAuth:
    enabled: false
    # Header the upstream proxy uses to forward the JWT.
    # Default "Authorization" auto-strips the "Bearer " prefix.
    header: "Authorization"
    # JWT claim paths - override only if your upstream IdP uses non-standard claim names
    claims:
      id: "sub" # stable external user id (stored in user_metadata.external_sub)
      email: "email" # REQUIRED claim - used as the identity key for user upsert
      name: "name" # display name (copied to public.users.name)
    # URL-path prefixes that should bypass the token check (e.g. embedded public forms).
    # Health, metrics, denied-page, branding, and x-api-key requests are auto-exempt by the app.
    # Rendered as a comma-separated string for EXTERNAL_AUTH_PUBLIC_PATHS.
    publicPaths: []
    # Example:
    #   - /form/
    #   - /api/form/

# =============================================================================
# RULEBRICKS APPLICATION STACK
# This is the core Rulebricks application stack. It is preconfigured to run as-
# is, but you will likely need to manually tune component resources and
# other configurations to your business's performance requirements.
# =============================================================================
rulebricks:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    app:
      path: /api/metrics
    hps:
      path: /metrics

  app:
    image:
      registry: docker.io
      repository: rulebricks/app
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    podLabels:
      rulebricks.com/workload-group: infrastructure

    logging:
      enabled: true
      # Leave empty to auto-discover Kafka from the kafka subchart (recommended)
      # Only set explicitly if using an external Kafka cluster
      kafkaBrokers: ""
      kafkaTopic: "logs"
      # Prefix applied to ALL Kafka topic names so they don't collide on a shared/
      # managed Kafka cluster (e.g. "com.rulebricks.solution"). HPS prepends this to
      # its own topics; the chart applies it to KEDA lag triggers and the Vector
      # consumer so everything stays in sync. Set to "" to disable prefixing.
      kafkaTopicPrefix: "com.rulebricks."
      # Kafka SSL/SASL settings for external brokers.
      # For AWS MSK IAM, set kafkaSsl=true and kafkaSasl.mechanism="aws-iam";
      # credentials are sourced from the HPS pod IAM role via IRSA.
      kafkaSsl: false
      kafkaSasl:
        mechanism: "" # "aws-iam" | "scram-sha-256" | "scram-sha-512" | "plain" | ""
        region: ""
        username: ""
        password: ""
        existingSecret: ""
        existingSecretUsernameKey: "KAFKA_SASL_USERNAME"
        existingSecretPasswordKey: "KAFKA_SASL_PASSWORD"

  # HPS (High Performance Server)
  # HPS intercepts requests on solution endpoints via Traefik and processes them scalably
  hps:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/hps
      pullPolicy: Always # HPS image may receive silent updates
    replicas: 3 # Minimum recommended
    # Gather-plane autoscaling. HPS consumes/parses every chunk response, so
    # its capacity scales with request traffic; this scaler adds pods when the
    # response topic lags.
    keda:
      enabled: true
      minReplicaCount: 3
      # ~1 gather pod per 4 workers of fleet ceiling (derivation in the
      # hps-keda.yaml template); the solution-response partition count is the
      # hard upper bound.
      maxReplicaCount: 16
      pollingInterval: 15
      cooldownPeriod: 600
      # Lag is in chunk MESSAGES (self-sized, ~50 small payloads or up to
      # 256KiB each), so 50 standing messages already represent thousands of
      # payload results waiting to be gathered.
      lagThreshold: 50
      # The gather loop is one JS thread: saturation plateaus near ~50% of
      # the 1-CPU request, so the trigger sits just below that plateau.
      cpuThreshold: 45
    # Pre-pull HPS server + worker images onto every node so burst scale-outs
    # skip image pulls
    imagePrepull:
      enabled: true
      # pauseImage: registry.k8s.io/pause:3.9
      # nodeSelector: {}
      # tolerations:
      #   - key: rulebricks.com/pool
      #     operator: Equal
      #     value: burst
      #     effect: NoSchedule
      # resources:
      #   init:
      #     requests: { cpu: 10m, memory: 32Mi }
      #     limits: { cpu: 100m, memory: 128Mi }
      #   pause:
      #     requests: { cpu: 5m, memory: 16Mi }
      #     limits: { cpu: 10m, memory: 32Mi }
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    resources:
      requests:
        cpu: "1000m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    workers:
      enabled: true
      replicas: 8
      # Scheduling priority for worker pods. When global.priorityClasses.enabled
      # is true (default) and this is left unset, workers default to the
      # release-scoped "<release>-burst" class (-5) so they are the first
      # preemption victims, letting critical infra always reschedule. Set to ""
      # to opt workers out of preemption (e.g. on a fixed, non-autoscaling
      # cluster where workers should run at default priority).
      # priorityClassName: ""
      podDisruptionBudget:
        enabled: false
        minAvailable: ""
        maxUnavailable: ""
      # Workers are single-threaded Node processes doing CPU-bound rule
      # evaluation: the limit is one full core (the single-threaded ceiling),
      # and the request is sized to measured mid-load usage. The request is
      # what converts replicas into node capacity - the cluster-autoscaler
      # provisions burst nodes to fit replicas x request, so undersizing it
      # caps fleet CPU below what saturated workers actually consume.
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
      # Partition count of the (prefixed) "solution" request topic. MUST match
      # kafka.provisioning.topics[com.rulebricks.solution].partitions below.
      # This is the hard ceiling on worker fleet concurrency; keda.maxReplicaCount
      # must stay <= this value.
      # Partitions are consumption lanes (each worker consumes its owned
      # partitions serially): 2x maxReplicaCount so every worker runs two
      # concurrent lanes at full fleet. Partitions can never be decreased.
      solutionPartitions: 128
      keda:
        enabled: true
        # Baseline (non-scaled) fleet: sized so steady-state throughput needs
        # no scaling event at all; bursts scale out from here exponentially
        # (see scalingBehavior defaults in the worker ScaledObject template).
        minReplicaCount: 8
        maxReplicaCount: 128
        # Poll fast so bursts are detected within seconds.
        pollingInterval: 5
        cooldownPeriod: 300
        # Lag is measured in MESSAGES. With chunked bulk dispatch (HPS splits
        # batches into <=CHUNK_MAX_ITEMS-payload messages) a message is a
        # bounded unit of work (~50-150ms), so:
        #   lagThreshold ~= target drain seconds * per-worker messages/sec
        # 50 messages ~= 5-8s of backlog for one worker: one replica is added
        # per ~5s of fleet backlog, biasing toward early scale-out.
        lagThreshold: 50
        cpuThreshold: 25
        # Optional override for the HPA scaling behavior rendered into the
        # worker ScaledObject; leave unset to use the chart's aggressive
        # exponential scale-up / smooth scale-down defaults.
        # scalingBehavior: {}

  ingress:
    enabled: true
    app:
      # Set false when an external auth proxy owns the app catch-all route.
      enabled: true
    className: traefik
    # Host is automatically configured from global.domain
    paths:
      - path: /
        pathType: Prefix

  # Valkey-backed cache (redis key retained for compatibility)
  redis:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "4Gi"
    persistence:
      enabled: true
      size: "4Gi"
      storageClass: gp3

  # Optional Valkey observability and management.
  cache:
    valkeyAdmin:
      # Official Valkey Admin web console (Apache-2.0). Disabled by default and
      # internal-only unless explicitly exposed through authenticated ingress.
      enabled: false
      exposure: internal # internal | ingress
      ingress:
        enabled: false
        type: "ingress" # "ingress" or "gateway-api"
        # Defaults to valkey.<global.domain> when exposure=ingress.
        hostname: ""
        gatewayApi:
          gatewayName: ""
          gatewayNamespace: ""
          sectionName: ""
        basicAuth:
          # Traefik BasicAuth users in htpasswd format. The CLI should generate
          # this so plaintext passwords never land in values.yaml.
          users: []
        allowedIPs: []
      podLabels:
        rulebricks.com/workload-group: infrastructure
    redisExporter:
      enabled: true
      podLabels:
        rulebricks.com/workload-group: infrastructure

  kafkaExporter:
    enabled: true
    podLabels:
      rulebricks.com/workload-group: infrastructure
    # SASL/TLS against external brokers is inherited from
    # rulebricks.app.logging.kafkaSsl / kafkaSasl; no exporter-specific auth
    # values are needed.
    # Skip TLS certificate verification (self-signed broker certs).
    tlsInsecureSkipVerify: false
    # Extra kafka_exporter flags, e.g. "--kafka.version=3.6.0".
    extraArgs: []
    # For AWS MSK IAM, set the IRSA annotation (eks.amazonaws.com/role-arn)
    # with a role granting kafka-cluster:Connect + Describe* actions. The
    # exporter is skipped under aws-iam until the annotation is present (the
    # exporter does not support EKS Pod Identity).
    serviceAccount:
      create: true
      name: ""
      annotations: {}

# Message Queue (Kafka)
kafka:
  enabled: true
  # Apache Kafka version. Must be one the upstream Strimzi operator supports
  version: "4.2.1"
  # Broker image: self-mirrored from dhi.io/strimzi-kafka into rulebricks/* and set
  # on the Kafka CR (spec.kafka.image) so global.imageRegistry reaches the broker.
  # Tag is <strimziVersion>-kafka-<kafkaVersion>; keep aligned with version above.
  image:
    registry: docker.io
    repository: rulebricks/strimzi-kafka
    tag: "1.1.0-debian13-kafka-4.2.1"
  # Single combined controller+broker node (KRaft, no ZooKeeper). The template
  # forces every internal replication factor to this value.
  replicas: 1
  storage:
    # Sized against the per-topic retention.bytes caps; Kafka halts on a full disk.
    size: 20Gi
    class: gp3
  resources:
    requests:
      cpu: "750m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "3Gi"
  jvm:
    xms: "1g"
    xmx: "1g"
    # Strimzi jvmOptions."-XX" map (flag: value).
    extraOpts:
      UseZGC: "true"
      AlwaysPreTouch: "true"
      MaxDirectMemorySize: "256M"
  # Broker properties -> Kafka.spec.kafka.config. These are the KAFKA_CFG_* tuning
  # values from the prior Bitnami config, translated to their Kafka property names.
  config:
    auto.create.topics.enable: "true"
    log.retention.hours: "24"
    num.partitions: "12"
    num.network.threads: "8"
    num.io.threads: "8"
    socket.send.buffer.bytes: "1048576"
    socket.receive.buffer.bytes: "1048576"
    socket.request.max.bytes: "209715200"
    message.max.bytes: "2097152"
    replica.fetch.max.bytes: "4194304"
    log.retention.bytes: "536870912"
    log.segment.bytes: "1073741824"
    num.replica.fetchers: "4"
    queued.max.requests: "10000"
    replica.socket.receive.buffer.bytes: "1048576"
    log.cleaner.dedupe.buffer.size: "268435456"
    log.cleaner.io.buffer.size: "1048576"
  # Critical-tier scheduling for the broker pod (CLI fills "<release>-critical").
  priorityClassName: ""
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Topics, reconciled by the Strimzi Topic Operator (KafkaTopic CRs). Creates and
  # aligns partitions/configs - replaces the old provisioning + topic-align Jobs.
  # Names carry the default prefix (com.rulebricks.); the CLI rewrites them if the
  # prefix changes.
  topics:
    - name: com.rulebricks.solution
      partitions: 128
      replicas: 1
      config:
        retention.ms: "300000"
        segment.ms: "300000"
        segment.bytes: "67108864"
        retention.bytes: "67108864"
        max.message.bytes: "2097152"
    - name: com.rulebricks.solution-response
      partitions: 128
      replicas: 1
      config:
        retention.ms: "300000"
        segment.ms: "300000"
        segment.bytes: "67108864"
        retention.bytes: "67108864"
        max.message.bytes: "2097152"
    - name: com.rulebricks.logs
      partitions: 24
      replicas: 1
      config:
        retention.ms: "86400000"
        retention.bytes: "268435456"
        max.message.bytes: "2097152"
  # Topic provisioning for EXTERNAL Kafka (kafka.enabled: false). The Strimzi
  # Topic Operator only runs for the in-cluster broker, and managed clusters
  # (esp. MSK Serverless) won't auto-create topics, so a pre-install Job creates
  # the `topics` above on the managed cluster through the kafka-proxy bridge,
  # matching the app's SASL/TLS. Requires kafkaBridge.enabled (token auth); SASL
  # PLAIN/SCRAM clusters a plain client can reach directly are not handled here.
  provisioning:
    enabled: true
    # Replication factor for created topics
    replicationFactor: 3

# Strimzi cluster operator (subchart)
strimzi-kafka-operator:
  watchNamespaces: []
  watchAnyNamespace: false
  # Operator + entity-operator images self-mirrored from quay.io/strimzi into
  # docker.io/rulebricks/*. Strimzi does NOT read the parent global.imageRegistry,
  # so for an air-gapped registry the CLI rewrites these keys (hand-installers must
  # set defaultImageRegistry + each component image.registry themselves). The Kafka
  # BROKER image is set separately on the Kafka CR (kafka.image) so the single
  # global.imageRegistry knob does reach the broker.
  defaultImageRegistry: docker.io
  defaultImageRepository: rulebricks
  defaultImageTag: "1.1.0-debian13"
  image:
    registry: docker.io
    repository: rulebricks
    name: strimzi-operator
    tag: "1.1.0-debian13"
  kafka:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  kafkaConnect:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  topicOperator:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  userOperator:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  kafkaInit:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-operator
  # Auxiliary component defaults injected into the operator's STRIMZI_DEFAULT_*
  # env vars. Dormant (only pulled when a KafkaBridge / Connect-build / exporter /
  # Cruise Control / MirrorMaker2 CR feature is enabled) but pinned to mirrored
  # rulebricks/* images so no Strimzi toggle ever references an unmirrored image.
  # Exporter / Cruise Control / MirrorMaker2 all run from the Strimzi Kafka image.
  # NOTE: the operator's STRIMZI_KAFKA_*_IMAGES version maps also list Kafka
  # 4.2.0 and 4.3.0 entries; only the chart-pinned 4.2.1 tag is mirrored (DHI
  # builds 4.2.1/4.3.0 on the 1.1.0 stream, no 4.2.0). Unreachable unless
  # kafka.version is changed off 4.2.1.
  # Exporter / Cruise Control default env images: the 1.1.0 chart suffixes these
  # with -kafka-4.3.0 (its newest supported Kafka), which we don't mirror. Pin the
  # tag to the mirrored broker build (explicit tag suppresses the chart's suffix).
  kafkaExporter:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
      tag: "1.1.0-debian13-kafka-4.2.1"
  cruiseControl:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
      tag: "1.1.0-debian13-kafka-4.2.1"
  kafkaMirrorMaker2:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka
  kafkaBridge:
    image:
      registry: docker.io
      repository: rulebricks
      name: strimzi-kafka-bridge
      tag: "1.0.0-debian13"
  # Connect-build tools: mirrored from quay.io/strimzi (no DHI equivalent), so
  # their tags carry no -debian13 suffix and must override defaultImageTag.
  kanikoExecutor:
    image:
      registry: docker.io
      repository: rulebricks
      name: kaniko-executor
      tag: "1.1.0"
  buildah:
    image:
      registry: docker.io
      repository: rulebricks
      name: buildah
      tag: "1.1.0"
  mavenBuilder:
    image:
      registry: docker.io
      repository: rulebricks
      name: maven-builder
      tag: "1.1.0"

# Rulebricks always deploys ClickHouse for native decision-log query support.
# Decision logs remain object-storage-backed via a view. When clickstack.enabled
# is true (the default), ClickHouse also statefully stores operational telemetry
# AND a decision_logs_recent MergeTree hot tier (a disk-pressure-bounded cache
# that accelerates decision-log queries; the object-storage archive stays the
# durable system of record - see templates/_defaults.tpl and
# templates/clickhouse-retention-cronjob.yaml).
clickhouse:
  enabled: true
  # ClickHouse server (single node; no keeper/replication)
  image:
    registry: docker.io
    repository: rulebricks/clickhouse-server
    tag: "26.6.1-debian13"
    pullPolicy: IfNotPresent
  priorityClassName: ""
  # Don't let node scale-down evict the decision-log query engine.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  auth:
    username: rulebricks
    password: ""
    # BYO seam: point at an existing Secret (e.g. synced by External Secrets
    # Operator) to stop the chart from managing <release>-clickhouse-credentials.
    # When overriding, also set rulebricks.app.clickhouse.existingSecret (the app
    # subchart reads its ClickHouse password independently) and, if ClickStack is
    # enabled, clickstack.clickhouse.existingSecret.
    existingSecret: '{{ printf "%s-clickhouse-credentials" .Release.Name }}'
    existingSecretKey: admin-password
  # Persistence: required while clickstack.enabled (telemetry + the
  # decision_logs_recent hot tier live in local MergeTree tables). Statefulness
  # is DERIVED: with ClickStack disabled the chart always renders ClickHouse
  # stateless - a Deployment with emptyDir (no StatefulSet, no PVC) - regardless
  # of this flag; decision logs stay in object storage and the query views are
  # re-seeded automatically on pod start via /docker-entrypoint-initdb.d.
  # Setting enabled: false while ClickStack is on fails the render.
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      # Decision-log queries read gzipped NDJSON straight from object storage and
      # aggregate in memory, so they are CPU- and memory-hungry. The previous
      # 1 CPU / 2Gi ceiling caused MEMORY_LIMIT_EXCEEDED (server cap ~1.8Gi) and
      # TIMEOUT_EXCEEDED from CPU throttling. Give the single replica real
      # headroom (server memory cap becomes ~5.4Gi at 0.9 x 6Gi).
      cpu: "4"
      memory: "12Gi"
  serviceAccount:
    create: true
    annotations: {}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Enables the system log tables (query_log, etc.). Off by default to save
  # memory; safe to keep on now that the replica has headroom, and essential for
  # diagnosing slow/failed decision-log queries after the fact.
  sampling:
    enabled: true
  queryLimits:
    # Per-query memory ceiling. Kept below the server cap so a single runaway
    # decision-log query fails (code 241) instead of starving the whole server.
    maxMemoryUsage: 4294967296
    maxThreads: 4
    # Raised from 60s: large decision-log scans legitimately run longer.
    maxExecutionTime: 120
    # Safety valve so a query can never read an unbounded number of records and
    # OOM the server. With readOverflowMode "break", hitting the cap returns the
    # rows gathered so far (partial result) instead of raising an error; set it
    # to "throw" if you would rather fail loudly than return partial data.
    maxRowsToRead: 50000000
    readOverflowMode: break
  otelQueryLimits:
    maxMemoryUsage: 4294967296
    maxThreads: 8
    maxExecutionTime: 120
  otelDatabase: otel

# Ingress Controller (Traefik)
traefik:
  enabled: true
  # Self-mirrored to rulebricks/*. traefik does NOT read global.imageRegistry, so an
  # air-gapped registry must override image.registry (the CLI does this).
  image:
    registry: docker.io
    repository: rulebricks/traefik
    tag: "3.7.6-debian13"
  deployment:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  ingressClass:
    name: traefik # Must match ingress.className in rulebricks and supabase
  autoscaling:
    enabled: true
    minReplicas: 1
    # Headroom for high-RPS clients (small-payload traffic is request-rate
    # bound at the proxy). Traefik pods are cheap (100m request) and the HPA
    # sheds them at idle
    maxReplicas: 8
    # Scale up freely, scale down reluctantly: proxy CPU tracks connection
    # churn rather than bytes proxied, so utilization can sit low even at
    # peak payload throughput and a short scale-down window would remove
    # proxies mid-load. The lifeCycle drain below covers the churn that
    # remains.
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  ports:
    # Graceful termination on both entrypoints: keep accepting for 5s after
    # SIGTERM (covers endpoint-removal propagation), then drain in-flight
    # requests for up to 40s - above the 30s HPS RPC timeout, so a stopping
    # proxy never severs a still-viable bulk request (Traefik's default is
    # 10s).
    web:
      port: 8000
      exposedPort: 80
      transport:
        lifeCycle:
          requestAcceptGraceTimeout: "5s"
          graceTimeOut: "40s"
    websecure:
      port: 8443
      exposedPort: 443
      transport:
        lifeCycle:
          requestAcceptGraceTimeout: "5s"
          graceTimeOut: "40s"
  metrics:
    prometheus:
      enabled: true
      disableAPICheck: true
      serviceMonitor:
        # Edge metrics are important for end-to-end request visibility. The
        # umbrella chart installs Prometheus Operator CRDs with monitoring, so
        # keep this on by default for self-hosted installs.
        enabled: true
  # Distributed tracing (Traefik v3 OTLP). When global.tracing.enabled, the
  # ingress becomes the ROOT span of every request and propagates the W3C
  # traceparent header to the app/HPS backends - so a trace shows the full
  # lineage starting at the edge. The endpoint must point at the in-cluster
  # OpenTelemetry Collector deployed by this chart; because the collector
  # service name is release-scoped (<release>-otel-collector) and this static
  # values file cannot template the release name, the CLI fills the concrete
  # endpoint automatically. For hand-installs, uncomment and set <release>:
  #
  # tracing:
  #   otlp:
  #     enabled: true
  #     http:
  #       enabled: true
  #       endpoint: "http://<release>-otel-collector:4318/v1/traces"
  tracing: {}
  persistence:
    enabled: false

# Autoscaling (KEDA)
keda:
  enabled: true
  # Self-mirrored to rulebricks/*. keda uses global.image.registry (not the parent
  # global.imageRegistry); the CLI sets it for an air-gapped registry.
  image:
    keda:
      registry: docker.io
      repository: rulebricks/keda
      tag: "2.20.1-debian13"
    metricsApiServer:
      registry: docker.io
      repository: rulebricks/keda-metrics-apiserver
      tag: "2.20.1-debian13"
    webhooks:
      registry: docker.io
      repository: rulebricks/keda-admission-webhooks
      tag: "2.20.1-debian13"
  podLabels:
    keda:
      rulebricks.com/workload-group: infrastructure
    metricsAdapter:
      rulebricks.com/workload-group: infrastructure
    webhooks:
      rulebricks.com/workload-group: infrastructure
  crds:
    install: false # CRDs are managed in parent chart crds/ directory

# Certificate Management (cert-manager)
cert-manager:
  enabled: true
  # Self-mirrored to rulebricks/*. cert-manager prepends image.registry to
  # image.repository; the CLI rewrites image.registry for an air-gapped registry.
  image:
    registry: docker.io
    repository: rulebricks/cert-manager-controller
    tag: "1.21.0-debian13"
  # CRDs are managed in the parent chart's crds/ directory, so the subchart
  # must not template its own (cert-manager v1.15+ uses crds.enabled, not the
  # deprecated installCRDs flag).
  crds:
    enabled: false
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Controller tolerations. Defaults are empty so AMD64 and untainted ARM64
  # clusters work without architecture-specific values.
  tolerations: []
  # Example for ARM64 node pools tainted with kubernetes.io/arch=arm64:
  # tolerations:
  #   - key: kubernetes.io/arch
  #     operator: Equal
  #     value: arm64
  #     effect: NoSchedule
  # Webhook tolerations
  webhook:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-webhook
      tag: "1.21.0-debian13"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    tolerations: []
    # Example for ARM64-tainted node pools:
    # tolerations:
    #   - key: kubernetes.io/arch
    #     operator: Equal
    #     value: arm64
    #     effect: NoSchedule
  # CAinjector tolerations
  cainjector:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-cainjector
      tag: "1.21.0-debian13"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    tolerations: []
    # Example for ARM64-tainted node pools:
    # tolerations:
    #   - key: kubernetes.io/arch
    #     operator: Equal
    #     value: arm64
    #     effect: NoSchedule
  startupapicheck:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-startupapicheck
      tag: "1.21.0-debian13"
  acmesolver:
    image:
      registry: docker.io
      repository: rulebricks/cert-manager-acmesolver
      tag: "1.21.0-debian13"

# =============================================================================
# SELF-HOSTED DATABASE SETTINGS (Supabase)
# Set enabled: false to use an external Supabase instance instead
# =============================================================================
supabase:
  enabled: true
  # Database options:
  #   1. Self-hosted (default): bundled in-cluster Postgres (db.* below).
  #   2. External (managed) PostgreSQL: set externalDatabase.enabled: true. That one
  #      switch disables the bundled database, points every Supabase service at your
  #      instance, and runs a one-time hook to initialize it (externalDatabase.bootstrap).
  externalDatabase:
    enabled: false
    host: ""
    port: 5432
    # Connection fields every service uses. Keep credentials in secret.db, or
    # point secretRef at one existing Secret for host/port/username/password/database.
    secretRef: ""
    secretRefKey:
      # host/port default empty for backward compatibility. Set these to source
      # DB_HOST/DB_PORT from the same external database Secret.
      host: ""
      port: ""
      username: username
      password: password
      database: database
    # One-time initialization of a bare external database (roles, schemas, auth
    # helpers, publication). Set enabled: false if you run bootstrap.sql yourself.
    bootstrap:
      enabled: true
      # Inline master/owner creds (materialized into a short-lived hook Secret).
      masterUsername: "postgres"
      masterPassword: ""     # required unless secretRef is set
      # Advanced: pre-created Secret (keys: master-username/master-password/service-password)
      secretRef: ""
      appRole: "postgres"    # role your app migrations run as (DB master on RDS)
  secret:
    # SMTP credentials are sourced from global.smtp.user and global.smtp.pass
    # JWT keys are sourced from global.supabase.* (anonKey, serviceKey, jwtSecret)
    # Empty by default - provide your own (or let the CLI create the Secret and
    # set secretRef). No shipped working defaults.
    db:
      username: "postgres"
      password: ""
      database: "postgres"
    dashboard:
      username: "supabase"
      password: ""
  # Database resource and storage configuration (for self-hosted)
  db:
    # Critical-tier scheduling + eviction protection: the primary datastore
    # must always be able to preempt burst workers to reschedule, and the
    # cluster-autoscaler must never evict it during node scale-down.
    # priorityClassName is "<release>-critical" (CLI fills automatically).
    priorityClassName: ""
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podLabels:
      rulebricks.com/workload-group: infrastructure
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3
  # Kong API Gateway ingress configuration
  kong:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    ingress:
      enabled: true
      className: traefik
      annotations: {}
  # Optional separate hostname for Supabase Studio
  studio:
    podLabels:
      rulebricks.com/workload-group: infrastructure
    podDisruptionBudget:
      enabled: false
      minAvailable: ""
      maxUnavailable: ""
    ingress:
      enabled: false
      type: "ingress"
      className: traefik
      hostname: "" # Defaults to studio.<global.domain>
      annotations: {}
  auth:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  rest:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  realtime:
    podLabels:
      rulebricks.com/workload-group: infrastructure
  meta:
    podLabels:
      rulebricks.com/workload-group: infrastructure

# =============================================================================
# DATABASE BACKUPS
# Periodic Supabase Postgres base backups are written to global.storage.dbBackups.
# Requires self-hosted Supabase.
# =============================================================================
backup:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 30
  # Postgres role used for logical dumps/restores. Must be a superuser so it can
  # read schemas owned by supabase_admin (auth, storage, realtime, etc.).
  superuser: supabase_admin
  # Time to keep completed backup jobs and their pod logs (seconds, default 30 days)
  ttlSecondsAfterFinished: 2592000
  # Cross-cloud uploader. rclone speaks S3 / Azure Blob / GCS and authenticates via
  # the pod's workload identity (env_auth), so no per-cloud CLI or custom image is
  # needed. The image is centralized at global.images.rclone (digest-pinned by CI);
  # the pg_dump step reuses supabase.db.image.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jobHistory:
    successful: 30
    failed: 30

# =============================================================================
# DECISION LOGS (Vector)
# Aggregates and forwards rule execution logs to one or more configurable sinks (console, S3, etc.)
# The Kafka broker address is automatically configured via the vector-env-configmap.yaml template.
# =============================================================================
vector:
  enabled: true
  # Self-mirrored to rulebricks/*. vector image.repository is the full path.
  image:
    repository: docker.io/rulebricks/vector
    tag: "0.57.0-debian13"
  # Dormant HAProxy LB (only with an HAProxy-fronted vector role) pinned to rulebricks/*.
  haproxy:
    image:
      repository: docker.io/rulebricks/haproxy
      tag: "3.4.2-debian13"
  podLabels:
    rulebricks.com/workload-group: infrastructure
  role: "Stateless-Aggregator"
  replicas: 2
  # The decision_logs object-storage sink buffers a whole uncompressed batch
  # (customConfig sinks.decision_logs.batch.max_bytes, ~64 MiB from the CLI) in
  # memory before flushing. The previous 256Mi limit was smaller than that batch,
  # so under load Vector was OOMKilled before it could ever write a blob - which
  # silently disabled decision-log export. Keep limits.memory comfortably above
  # the configured batch size.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  service:
    enabled: true
    ports:
      - name: api
        port: 8686
        protocol: TCP
        targetPort: 8686
  # CA TRUST BUNDLE: the hardened rulebricks/vector image ships NO system CA
  # store (no /etc/ssl/certs at all), so every TLS sink connection - S3/GCS/
  # Azure object storage for decision logs, Datadog/Splunk/etc. - fails at the
  # connector level with "dispatch failure" and decision logs are silently
  # dropped. Seed the standard bundle from the (mirrored, cert-carrying)
  # rulebricks/curl image into an emptyDir before Vector starts. curl copies
  # its own CA file via a file:// URL because the hardened image has no shell.
  # SSL_CERT_FILE (env below) covers both OpenSSL and rustls code paths.
  initContainers:
    - name: ca-certs
      image: docker.io/rulebricks/curl:8.21.0-alpine
      command:
        - curl
        - -sSf
        - -o
        - /certs/ca-certificates.crt
        - file:///etc/ssl/certs/ca-certificates.crt
      volumeMounts:
        - name: ca-certs
          mountPath: /certs
  extraVolumes:
    - name: ca-certs
      emptyDir: {}
  extraVolumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs
      readOnly: true
  # Kafka connection settings are sourced from the templated vector-kafka-env ConfigMap
  # (see templates/vector-env-configmap.yaml). For in-cluster Kafka the internal service
  # name is derived from the release name; for external Kafka the CLI/chart sets brokers,
  # TLS, and SASL (PLAIN/SCRAM). Token mechanisms (MSK IAM / GCP OAUTHBEARER) are handled
  # by the kafka-proxy bridge sidecar and Vector connects to it over local plaintext.
  env:
    # Vector 0.57 disabled env-var interpolation in config files by default
    # (vector.dev 0.57 upgrade guide). The kafka source below is driven entirely
    # by ${KAFKA_*} placeholders, so restore the pre-0.57 behavior. The
    # "dangerously" caveat (env vars readable via config) is moot here: every
    # interpolated variable already lives in this pod's environment.
    - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
      value: "true"
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
    - name: KAFKA_BOOTSTRAP_SERVERS
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_BOOTSTRAP_SERVERS
    - name: KAFKA_TLS_ENABLED
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_TLS_ENABLED
    - name: KAFKA_SASL_ENABLED
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_SASL_ENABLED
    - name: KAFKA_SASL_MECHANISM
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_SASL_MECHANISM
    - name: KAFKA_LOG_TOPIC
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_LOG_TOPIC
    - name: KAFKA_CONSUMER_GROUP
      valueFrom:
        configMapKeyRef:
          name: vector-kafka-env
          key: KAFKA_CONSUMER_GROUP
    # SASL credentials (inline PLAIN/SCRAM). Optional so in-cluster/token-auth deploys
    # work without the secret existing. existingSecret users can override these entries.
    - name: KAFKA_SASL_USERNAME
      valueFrom:
        secretKeyRef:
          name: vector-kafka-credentials
          key: KAFKA_SASL_USERNAME
          optional: true
    - name: KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: vector-kafka-credentials
          key: KAFKA_SASL_PASSWORD
          optional: true
  customConfig:
    sources:
      kafka:
        type: kafka
        # KAFKA_BOOTSTRAP_SERVERS is set automatically via env from the vector-kafka-env ConfigMap.
        # Fallback value is only used if the env var is somehow not set.
        bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-rulebricks-kafka-kafka-bootstrap:9092}"
        # KAFKA_LOG_TOPIC carries the namespace prefix (e.g. com.rulebricks.logs).
        topics:
          - "${KAFKA_LOG_TOPIC:-logs}"
        # KAFKA_CONSUMER_GROUP carries the same prefix (e.g.
        # com.rulebricks.vector-consumers) so co-tenant deployments on a shared
        # Kafka cluster don't rebalance each other.
        group_id: "${KAFKA_CONSUMER_GROUP:-vector-consumers}"
        auto_offset_reset: latest
        # TLS + SASL are driven by env from vector-kafka-env. Disabled by default
        # (in-cluster Kafka and the bridge path both use plaintext).
        tls:
          enabled: ${KAFKA_TLS_ENABLED:-false}
        sasl:
          enabled: ${KAFKA_SASL_ENABLED:-false}
          mechanism: "${KAFKA_SASL_MECHANISM:-PLAIN}"
          # username/password are intentionally omitted here. They are only set
          # for external Kafka with SASL (the CLI injects them from the
          # vector-kafka-credentials secret). With an empty default
          # (${KAFKA_SASL_USERNAME:-}) Helm's toYaml drops the quotes and Vector
          # reads the value as YAML null, which it rejects at startup
          # ("invalid type: unit value, expected any valid TOML value").
    transforms:
      normalize_logs:
        type: remap
        inputs:
          - kafka
        # HPS owns the decision-log schema. Vector owns the Kafka-to-JSON
        # typing boundary so storage sinks stay stable during rolling deploys.
        source: '{{ include "rulebricks.vector.normalizeLogs" . }}'
    sinks:
      console:
        type: console
        inputs:
          - normalize_logs
        encoding:
          codec: json
      # ==== Decision Log Storage Sink ====
      # When clickhouse.enabled and global.storage (bucket + paths.decisionLogs)
      # are configured, add a decision_logs sink so ClickHouse can query the
      # NDJSON archive directly.
      # The key prefix MUST match the partition layout used by ClickHouse's
      # named_collection URLs in clickhouse.configdFiles (year=YYYY/month=MM/...).
      # The CLI generates this automatically; hand-installs should set it here.
      #
      # decision_logs:
      #   type: aws_s3            # or azure_blob | gcp_cloud_storage
      #   inputs:
      #     - normalize_logs
      #   bucket: "your-bucket"
      #   region: "us-east-1"
      #   key_prefix: "decision-logs/year=%Y/month=%m/day=%d/hour=%H/"
      #   # Extension MUST end in .zst (or .gz): ClickHouse's named collection
      #   # globs *.{gz,zst} and auto-detects compression from the extension.
      #   # A bare "ndjson" extension uploads fine but is invisible to the app.
      #   # (azure_blob has no filename_extension; it writes .log.zst itself.)
      #   filename_extension: "ndjson.zst"
      #   compression: zstd
      #   encoding:
      #     codec: json
      #   framing:
      #     method: newline_delimited
      #   batch:
      #     max_bytes: 268435456
      #     timeout_secs: 300
      #   # Authentication via IRSA (recommended) - no credentials needed in config.
      #   # Vector will use the IAM role attached to its service account.

# =============================================================================
# VECTOR KAFKA BRIDGE (token-auth managed Kafka)
# =============================================================================
# Vector's kafka source speaks SSL + SASL PLAIN/SCRAM natively, but NOT the
# token-based mechanisms used by AWS MSK IAM (aws-iam) or GCP Managed Kafka
# (oauthbearer). When external Kafka uses one of those, enable this bridge: a
# kafka-proxy sidecar runs in the Vector pod, authenticates upstream using the
# pod's workload identity (IRSA / GKE Workload Identity), and exposes a local
# plaintext listener that Vector consumes from. No static credentials required.
#
# The CLI sets this automatically when you externalize Kafka with a token
# mechanism. For hand-installs, set kafkaBridge.enabled and add the matching
# sidecar to vector.extraContainers (example below), and annotate the Vector
# service account with the cloud identity (see vector.serviceAccount).
kafkaBridge:
  enabled: false
  # Cloud provider for the upstream auth method: "aws" | "gcp"
  provider: ""
  # Region (required for AWS MSK IAM signing)
  region: ""
  # Comma-separated upstream broker list (the real managed-Kafka brokers).
  brokers: ""
  # Local port the proxy listens on; Vector points KAFKA_BOOTSTRAP_SERVERS here.
  localPort: 19092
  # kafka-proxy image used for the AWS MSK IAM sidecar (rebuilt from unmodified
  # upstream source on a hardened base and published to rulebricks/*; the CLI
  # applies global.imageRegistry to the vector sidecar that runs it).
  image: "docker.io/rulebricks/kafka-proxy:0.4.3-r1"
  # Workload identity used by the bridge (and shared with the HPS service account).
  # AWS: IRSA role ARN; GCP: GKE Workload Identity service account email.
  # The rulebricks.kafka.identityAnnotations helper maps these to the correct SA
  # annotation; the CLI writes that annotation onto vector.serviceAccount.annotations
  # and rulebricks.hps.serviceAccount.annotations.
  awsRoleArn: ""
  gcpServiceAccountEmail: ""
#
# Example vector.extraContainers entry for AWS MSK IAM (generated by the CLI):
#
# vector:
#   extraContainers:
#     - name: kafka-proxy
#       image: grepplabs/kafka-proxy:latest
#       args:
#         - server
#         - --bootstrap-server-mapping=b-1.msk.example:9098,127.0.0.1:19092
#         - --bootstrap-server-mapping=b-2.msk.example:9098,127.0.0.1:19093
#         - --tls-enable
#         - --sasl-enable
#         - --sasl-method=AWS_MSK_IAM
#         - --sasl-aws-region=us-east-1
#       ports:
#         - containerPort: 19092
#   serviceAccount:
#     create: true
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/vector-msk-consumer

# =============================================================================
# APPLICATION / CONTAINER LOG SHIPPING (Vector agent DaemonSet)
# A SECOND Vector deployment (role: Agent) that tails all Kubernetes pod logs
# (kubernetes_logs source) and ships them to a customer-managed log backend
# (BYO Elasticsearch/Kibana, Grafana Loki, or generic HTTP). This is DISTINCT from the
# decision-log `vector` aggregator above (Kafka -> object storage/ClickHouse);
# decision logs stay in ClickHouse and are NOT double-written to Elastic.
#
# The agent parses structured JSON log lines and lifts trace_id/span_id so app
# logs join distributed traces in Kibana/Grafana. Disabled by default; the CLI
# generates the sink (Elasticsearch, Loki, or generic HTTP) from
# features.logging.appLogs. For hand-installs, enable below and replace the
# console sink with a backend sink (examples included).
# =============================================================================
vector-agent:
  enabled: false
  image:
    repository: docker.io/rulebricks/vector
    tag: "0.57.0-debian13"
  role: "Agent"
  podLabels:
    rulebricks.com/workload-group: infrastructure
  # Same CA-bundle seeding as the decision-log `vector` aggregator above: the
  # hardened image has no system CA store, and this agent ships logs to
  # customer backends (Elasticsearch/Loki/HTTP) over TLS.
  initContainers:
    - name: ca-certs
      image: docker.io/rulebricks/curl:8.21.0-alpine
      command:
        - curl
        - -sSf
        - -o
        - /certs/ca-certificates.crt
        - file:///etc/ssl/certs/ca-certificates.crt
      volumeMounts:
        - name: ca-certs
          mountPath: /certs
  extraVolumes:
    - name: ca-certs
      emptyDir: {}
  extraVolumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs
      readOnly: true
  env:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt
  # Tolerate active Rulebricks worker pools without tolerating shutdown,
  # out-of-service, or unreachable node taints. Add explicit architecture
  # tolerations here if those pools are tainted.
  tolerations:
    - key: rulebricks.com/pool
      operator: Equal
      value: burst
      effect: NoSchedule
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  customConfig:
    data_dir: /vector-data-dir
    sources:
      kubernetes_logs:
        type: kubernetes_logs
        # Skip both Vector deployments: the aggregator (app.kubernetes.io/name=vector)
        # re-emits decision logs on stdout via its console sink (those belong in
        # ClickHouse, not Elasticsearch), and the agent itself (vector-agent) to
        # avoid a self-scrape loop. All other pods are still collected.
        extra_label_selector: "app.kubernetes.io/name notin (vector,vector-agent)"
    transforms:
      app_logs:
        type: remap
        inputs:
          - kubernetes_logs
        # Parse structured JSON log lines (app + HPS emit JSON to stdout) to
        # lift trace_id/span_id for logs<->traces correlation in Kibana, and
        # flatten the most useful Kubernetes metadata. Plain (non-JSON) lines
        # pass through untouched.
        source: |
          parsed, err = parse_json(to_string(.message) ?? "")
          if err == null && is_object(parsed) {
            .log = parsed
            .trace_id = parsed.trace_id
            .span_id = parsed.span_id
            if exists(parsed.level) { .level = to_string(parsed.level) ?? "info" }
          }
          .pod = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
    sinks:
      # Default console sink keeps the agent valid when enabled without an
      # Elasticsearch endpoint configured. The CLI replaces this with the
      # elasticsearch sink below.
      console:
        type: console
        inputs:
          - app_logs
        encoding:
          codec: json
      # ==== Elasticsearch sink (CLI-generated; hand-install example) ====
      # elasticsearch:
      #   type: elasticsearch
      #   inputs:
      #     - app_logs
      #   endpoints:
      #     - "https://<your-elasticsearch-host>:9200"
      #   mode: bulk
      #   bulk:
      #     index: "rulebricks-app-logs"
      #   # Basic auth:
      #   auth:
      #     strategy: basic
      #     user: "elastic"
      #     password: "<password>"
      #   # API key auth (alternative): drop `auth` and set a request header:
      #   # request:
      #   #   headers:
      #   #     Authorization: "ApiKey <base64-api-key>"
      #   tls:
      #     verify_certificate: true
      # ==== Loki sink (CLI-generated; hand-install example) ====
      # loki:
      #   type: loki
      #   inputs:
      #     - app_logs
      #   endpoint: "https://<your-loki-host>/loki/api/v1/push"
      #   labels:
      #     app: rulebricks
      #     namespace: "{{ namespace }}"
      #     pod: "{{ pod }}"
      #     container: "{{ container }}"
      #   encoding:
      #     codec: json
      # ==== Generic HTTP sink (CLI-generated; hand-install example) ====
      # generic_http:
      #   type: http
      #   inputs:
      #     - app_logs
      #   uri: "https://logs.example.com/ingest"
      #   method: post
      #   encoding:
      #     codec: json

# =============================================================================
# CLICKSTACK OBSERVABILITY BACKEND
# Built-in logs, traces, and mirrored metrics via ClickHouse + HyperDX. When
# enabled, the ClickStack OTel gateway owns the <release>-otel-collector service
# that app/HPS/worker/Traefik already send OTLP to. Decision logs stay in object
# storage and are queried through the object-storage-backed ClickHouse archive.
# =============================================================================
clickstack:
  # NOTE: the on/off switch is global.clickstack.enabled (the subchart's
  # dependency condition; it also drives the cross-subchart OTLP wiring).
  # The keys below only configure ClickStack when it is enabled.
  clickhouse:
    database: otel
    username: rulebricks
    existingSecret: ""
    existingSecretKey: admin-password
    retentionDays: 7
    # Advanced override. Leave empty to derive from retentionDays.
    ttl: ""
  hyperdx:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/hyperdx
      tag: "2.31.0"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    ingress:
      enabled: true
      type: "ingress" # "ingress" or "gateway-api"
      className: traefik
      hostname: "" # Defaults to observability.<global.domain>
      allowedIPs: []
      gatewayApi:
        gatewayName: ""
        gatewayNamespace: ""
        sectionName: ""
  collector:
    image:
      registry: docker.io
      repository: rulebricks/clickstack-otel-collector
      tag: "2.31.0-r1"
    memoryLimitMiB: 800
    gateway:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 1Gi
    agent:
      enabled: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  ferretdb:
    enabled: true
    image:
      registry: docker.io
      repository: rulebricks/ferretdb
      # Rebuilt from unmodified upstream source on a current Go toolchain and
      # hardened runtime (images/ferretdb in this repo); -rN increments on
      # rebuilds.
      tag: "2.7.0-r1"
    postgresImage:
      registry: docker.io
      repository: rulebricks/postgres-documentdb
      # FerretDB's image with a Debian security patch layer applied
      # (images/postgres-documentdb in this repo); -rN increments on rebuilds.
      tag: "17-0.107.0-ferretdb-2.7.0-r1"
    auth:
      username: hyperdx
      password: ""
      existingSecret: ""
      existingSecretKey: password
    persistence:
      enabled: true
      size: 10Gi
    resources:
      ferretdb:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      postgres:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

# =============================================================================
# MONITORING & ALERTING
# Controls cluster metrics and alerting via Prometheus
# =============================================================================
monitoring:
  enabled: true
kube-prometheus-stack:
  # All kube-prometheus-stack images self-mirrored to rulebricks/*. KPS honors the
  # parent global.imageRegistry for the host, so a single override repoints these too.
  alertmanager:
    enabled: false
    alertmanagerSpec:
      image:
        registry: docker.io
        repository: rulebricks/alertmanager
        tag: "0.33.1-debian13"
  grafana:
    # In-cluster Grafana is opt-in (the CLI enables it for the local-grafana
    # monitoring destination). When enabled, the dashboard sidecar imports the
    # provisioned Rulebricks dashboards from ConfigMaps labeled
    # grafana_dashboard="1" (see templates/grafana-dashboards-configmap.yaml).
    enabled: false
    image:
      registry: docker.io
      repository: rulebricks/grafana
      tag: "13.1.0-debian13"
    sidecar:
      image:
        registry: docker.io
        repository: rulebricks/k8s-sidecar
        tag: "2.8.1-debian13"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    # Dormant grafana helpers (test/render/dashboard-download/chown) pinned to rulebricks/*.
    testFramework:
      image:
        registry: docker.io
        repository: rulebricks/bats
        tag: "1.13.0-debian13"
    downloadDashboardsImage:
      registry: docker.io
      repository: rulebricks/curl
      tag: "8.21.0-alpine"
    initChownData:
      image:
        registry: docker.io
        repository: rulebricks/busybox
        tag: "1.38.0-alpine"
    imageRenderer:
      image:
        registry: docker.io
        repository: rulebricks/grafana-image-renderer
        tag: "5.10.1-debian13"
  prometheus:
    prometheusSpec:
      image:
        registry: docker.io
        repository: rulebricks/prometheus
        tag: "3.13.1-debian13"
      retention: 30d
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      remoteWrite: []
      # Examples:
      # - Azure Monitor managed Prometheus:
      #   remoteWrite:
      #     - url: "https://<workspace>.<region>.metrics.ingest.monitor.azure.com/dataCollectionRules/<dcr-id>/streams/Microsoft-PrometheusMetrics/api/v1/write?api-version=2023-04-24"
      #       azureAd:
      #         cloud: AzurePublic
      #         managedIdentity:
      #           clientId: "<managed-identity-client-id>"
      # - Grafana Cloud / Mimir-compatible:
      #   remoteWrite:
      #     - url: "https://prometheus-prod-XX.grafana.net/api/prom/push"
      #       basicAuth:
      #         username:
      #           name: prometheus-remote-write
      #           key: username
      #         password:
      #           name: prometheus-remote-write
      #           key: password
  prometheusOperator:
    image:
      registry: docker.io
      repository: rulebricks/prometheus-operator
      tag: "0.92.1-debian13"
    prometheusConfigReloader:
      image:
        registry: docker.io
        repository: rulebricks/prometheus-config-reloader
        tag: "0.92.1-debian13"
    admissionWebhooks:
      patch:
        image:
          registry: docker.io
          repository: rulebricks/kube-webhook-certgen
          tag: "1.8.4-debian13"
      deployment:
        image:
          registry: docker.io
          repository: rulebricks/prometheus-operator-admission-webhook
          tag: "0.92.1-debian13"
    thanosImage:
      registry: docker.io
      repository: rulebricks/thanos
      tag: "0.42.2-debian13"
  kube-state-metrics:
    image:
      registry: docker.io
      repository: rulebricks/kube-state-metrics
      tag: "2.19.1-debian13"
    kubeRBACProxy:
      image:
        registry: docker.io
        repository: rulebricks/kube-rbac-proxy
        tag: "0.22.1-debian13"
  prometheus-node-exporter:
    image:
      registry: docker.io
      repository: rulebricks/node-exporter
      tag: "1.12.1-debian13"
      # DHI node-exporter is already distroless; don't append the chart's -distroless suffix.
      distroless: false
    # Dormant (kubeRBACProxy.enabled defaults false); pinned so enabling it never
    # pulls the upstream quay.io/brancz default (matches the kube-state-metrics pin).
    kubeRBACProxy:
      image:
        registry: docker.io
        repository: rulebricks/kube-rbac-proxy
        tag: "0.22.1-debian13"
    permissionInitContainer:
      image:
        registry: docker.io
        repository: rulebricks/busybox
        tag: "1.38.0-alpine"
  # Dormant/optional KPS sub-images (Thanos ruler, CRD upgrade job, Windows nodes) -
  # pinned to rulebricks/* so no feature toggle ever reaches outside our registry.
  thanosRuler:
    thanosRulerSpec:
      image:
        registry: docker.io
        repository: rulebricks/thanos
        tag: "0.42.2-debian13"
  crds:
    upgradeJob:
      image:
        busybox:
          registry: docker.io
          repository: rulebricks/busybox
          tag: "1.38.0-alpine"
        kubectl:
          registry: docker.io
          repository: rulebricks/kubectl
          tag: "1.36.2-debian13"
  prometheus-windows-exporter:
    image:
      registry: docker.io
      repository: rulebricks/windows-exporter
      tag: "0.31.7"

# =============================================================================
# EXTERNAL SECRETS
# This chart consumes pre-existing Kubernetes Secrets through the *.secretRef /
# *.existingSecret seams (see .secrets.example and the README "Secrets" section)
# and does NOT render SecretStore/ExternalSecret resources itself. Sync your
# vault (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, HashiCorp
# Vault, ...) into those Secrets with the External Secrets Operator - see
# examples/external-secrets/ for per-provider copy-paste manifests.
# =============================================================================
externalSecrets:
  # Install a namespace-scoped External Secrets Operator alongside this release
  # (images mirrored to docker.io/rulebricks/*; see the external-secrets block
  # below). Leave false when ESO is already managed at cluster scope.
  installOperator: false

# Dependency values for the optional External Secrets Operator installation.
external-secrets:
  installCRDs: true
  crds:
    createClusterExternalSecret: false
    createClusterSecretStore: false
    createSecretStore: true
    createClusterGenerator: false
    createClusterPushSecret: false
    createPushSecret: false
  scopedRBAC: true
  processClusterExternalSecret: false
  processClusterPushSecret: false
  processClusterStore: false
  processClusterGenerator: false
  processPushSecret: false
  processSecretStore: true
  global:
    repository: docker.io/rulebricks/external-secrets
  # Mirrored from dhi.io/external-secrets; the DHI tag (2.8.0-debian13) differs
  # from the chart appVersion default (v2.8.0), so pin it explicitly on all
  # three ESO deployments (controller / webhook / cert-controller).
  image:
    tag: "2.8.0-debian13"
  webhook:
    image:
      tag: "2.8.0-debian13"
  certController:
    image:
      tag: "2.8.0-debian13"

# =============================================================================
# STORAGE CLASS (AWS EBS gp3)
# Creates a gp3 StorageClass if it doesn't exist
# =============================================================================
storageClass:
  create: true
  name: gp3
  provisioner: ebs.csi.aws.com
  type: gp3
  fsType: ext4
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true

# =============================================================================
# MIGRATION JOB SETTINGS
# Configuration for database migration jobs (self-hosted and managed)
# =============================================================================
migrations:
  # Strategy for migration job execution:
  #   - "hook": Runs as Helm post-install/post-upgrade hook (default)
  #   - "deployment": Creates job as regular resource (supports post-rendering)
  #   - "manual": Renders template without hooks (apply separately)
  strategy: "hook"
  # Time to keep completed jobs and their pod logs (seconds, default 30 days)
  ttlSecondsAfterFinished: 2592000
  # Number of retries before marking job as failed
  backoffLimit: 3
  # Pod restart policy
  restartPolicy: OnFailure
  # Node selector for migration pods (inherits from global.scheduling if not set)
  nodeSelector: {}
  # Tolerations for migration pods. Defaults are empty; add the example below
  # only for clusters that taint ARM64 nodes with kubernetes.io/arch=arm64.
  tolerations: []
  # tolerations:
  #   - key: kubernetes.io/arch
  #     operator: Equal
  #     value: arm64
  #     effect: NoSchedule
  # Additional annotations for the job
  annotations: {}
  # External database configuration (used when supabase.db.enabled: false)
  externalDb:
    # Host of the external PostgreSQL server
    host: ""
    # Port (default: 5432)
    port: "5432"
    # Reference to existing secret containing password
    existingSecret: ""
    existingSecretKey: "password"

# =============================================================================
# AUTOMATIC DNS MANAGEMENT (External-DNS)
# Deploys external-dns to automatically create DNS records for your domain.
# This enables single-phase installation with TLS from the start.
#
# Two usage modes:
#   1. Deploy external-dns with this chart:
#      Set external-dns.enabled=true AND global.externalDnsEnabled=true
#
#   2. Use existing cluster-wide external-dns:
#      Set only global.externalDnsEnabled=true (external-dns.enabled=false)
#      Your existing external-dns will pick up the ingress annotations
# =============================================================================
external-dns:
  enabled: false
  # Self-mirrored to rulebricks/*. external-dns image.repository is the full path
  # (no image.registry field in this chart).
  image:
    repository: docker.io/rulebricks/external-dns
    tag: "0.21.0-debian13"
  # Provider: route53, cloudflare, google, azure (object form per external-dns 1.21+)
  provider:
    name: route53
  # Sources to watch for DNS records (ingress is the default)
  sources:
    - ingress
  # Domain filter - restricts external-dns to your domain only
  domainFilters: []
  # Policy: sync (create & delete), upsert-only (create only)
  policy: upsert-only
  # --- Provider-specific configuration ---
  # For AWS Route53: uses IRSA by default (recommended)
  # Ensure your EKS cluster has IRSA configured and the service account
  # has the appropriate IAM role attached.
  #
  # For Cloudflare: set env variables
  # extraEnvVars:
  #   - name: CF_API_TOKEN
  #     valueFrom:
  #       secretKeyRef:
  #         name: cloudflare-api-token
  #         key: api-token
  #
  # For Google Cloud DNS: uses workload identity by default
  # google:
  #   project: "your-gcp-project"
  #
  # For Azure DNS:
  # azure:
  #   resourceGroup: "your-resource-group"
  #   subscriptionId: "your-subscription-id"

# Kubernetes cluster-autoscaler (AWS EKS only; GKE and AKS node pools
# autoscale natively). Without it nothing moves EKS nodegroup ASGs when
# scaled-out workers go Pending, so the burst pool (min 0) never activates.
# The CLI enables this for AWS deployments and sets autoDiscovery.clusterName;
# IAM comes from the cluster-setup stack's <cluster>-cluster-autoscaler Pod
# Identity role, bound to this ServiceAccount at deploy time.
cluster-autoscaler:
  enabled: false
  cloudProvider: aws
  # Hardened DHI image mirrored by images/manifest.yaml. This subchart requires
  # a full repository path and does not honor global.imageRegistry.
  image:
    repository: docker.io/rulebricks/cluster-autoscaler
    tag: "1.35.1-debian13"
    # Unlike most subcharts, cluster-autoscaler expects secret-name strings.
    # The CLI sets this to [<release>-regcred] automatically.
    pullSecrets: []
  # autoDiscovery.clusterName is REQUIRED when enabling: the autoscaler finds
  # nodegroup ASGs by the k8s.io/cluster-autoscaler/<clusterName> tags that
  # EKS managed nodegroups apply automatically.
  autoDiscovery:
    clusterName: ""
  # awsRegion is REQUIRED when enabling (no metadata-service fallback needed).
  awsRegion: ""
  # Fixed ServiceAccount name so the workload-identity binding is stable
  # across releases.
  rbac:
    serviceAccount:
      name: cluster-autoscaler
  extraArgs:
    # Nodegroups span AZs; treat per-AZ groups as one pool.
    balance-similar-node-groups: true
    # Burst nodes should drain promptly once the worker fleet cools down
    # (KEDA cooldown is 300s; the default 10m unneeded-time doubles the tail).
    scale-down-unneeded-time: 5m
    # Workers are the only tenants of burst nodes; don't let lingering
    # DaemonSet-adjacent system pods block scale-down.
    skip-nodes-with-system-pods: false
    expander: least-waste
  # The autoscaler must never be evicted or preempted by the workloads it
  # rescues; it is also the component that un-sticks Pending critical pods.
  priorityClassName: system-cluster-critical
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  resources:
    requests:
      cpu: "100m"
      memory: "300Mi"
    limits:
      cpu: "500m"
      memory: "600Mi"
