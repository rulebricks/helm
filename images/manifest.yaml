  - { name: node-exporter, kind: mirror, source: dhi.io/node-exporter, tag: "1.12.1-debian13", auth: dhi, digest: "" }
  - { name: kube-state-metrics, kind: mirror, source: dhi.io/kube-state-metrics, tag: "2.19.1-debian13", auth: dhi, digest: "" }
  - { name: prometheus-config-reloader, kind: mirror, source: dhi.io/prometheus-config-reloader, tag: "0.92.1-debian13", auth: dhi, digest: "" }
  - { name: kube-webhook-certgen, kind: mirror, source: dhi.io/kube-webhook-certgen, tag: "1.8.4-debian13", auth: dhi, digest: "" }
  - { name: k8s-sidecar, kind: mirror, source: dhi.io/k8s-sidecar, tag: "2.8.1-debian13", auth: dhi, digest: "" }
  # prometheus-operator + alertmanager: DHI now carries 0.92.1 / 0.33.1
  # (previously quay-sourced while DHI lacked these versions).
  - { name: prometheus-operator, kind: mirror, source: dhi.io/prometheus-operator, tag: "0.92.1-debian13", auth: dhi, digest: "" }
  - { name: alertmanager, kind: mirror, source: dhi.io/alertmanager, tag: "0.33.1-debian13", auth: dhi, digest: "" }

  # --- Tier-2: traefik / keda / cert-manager / vector / external-dns /
  #     cluster-autoscaler (DHI) ---
  - { name: traefik, kind: mirror, source: dhi.io/traefik, tag: "3.7.6-debian13", auth: dhi, digest: "" }
  - { name: keda, kind: mirror, source: dhi.io/keda, tag: "2.20.1-debian13", auth: dhi, digest: "" }
  - { name: keda-metrics-apiserver, kind: mirror, source: dhi.io/keda-metrics-apiserver, tag: "2.20.1-debian13", auth: dhi, digest: "" }
  - { name: keda-admission-webhooks, kind: mirror, source: dhi.io/keda-admission-webhooks, tag: "2.20.1-debian13", auth: dhi, digest: "" }
  - { name: cert-manager-controller, kind: mirror, source: dhi.io/cert-manager-controller, tag: "1.21.0-debian13", auth: dhi, digest: "" }
  - { name: cert-manager-webhook, kind: mirror, source: dhi.io/cert-manager-webhook, tag: "1.21.0-debian13", auth: dhi, digest: "" }
  - { name: cert-manager-cainjector, kind: mirror, source: dhi.io/cert-manager-cainjector, tag: "1.21.0-debian13", auth: dhi, digest: "" }
  - { name: cert-manager-startupapicheck, kind: mirror, source: dhi.io/cert-manager-startupapicheck, tag: "1.21.0-debian13", auth: dhi, digest: "" }
  - { name: cert-manager-acmesolver, kind: mirror, source: dhi.io/cert-manager-acmesolver, tag: "1.21.0-debian13", auth: dhi, digest: "" }
  - { name: vector, kind: mirror, source: dhi.io/vector, tag: "0.57.0-debian13", auth: dhi, digest: "" }
  - { name: external-dns, kind: mirror, source: dhi.io/external-dns, tag: "0.21.0-debian13", auth: dhi, digest: "" }
