# =============================================================================
# AWS Secrets Manager -> Rulebricks via External Secrets Operator
#
# Client-applied manifests (kubectl apply -f) - the Rulebricks chart does NOT
# render these. Prerequisites:
#
#   1. External Secrets Operator installed - either your own cluster-wide
#      install, or set `externalSecrets.installOperator: true` in the Rulebricks
#      values for a namespace-scoped operator with mirrored images.
#   2. An IAM role with secretsmanager:GetSecretValue (and DescribeSecret) on
#      the rulebricks-* secrets, trusted by the ServiceAccount below via
#      IRSA (EKS OIDC provider). With EKS Pod Identity, drop the annotation and
#      create a pod-identity association for the ServiceAccount instead.
#   3. One Secrets Manager entry per section of .secrets.example, stored as a
#      JSON object whose keys match that section exactly, e.g.
#        aws secretsmanager create-secret --name rulebricks-app \
#          --secret-string '{"LICENSE_KEY":"...","EMAIL":"...","SMTP_USER":"..."}'
#
# Then point the chart at the synced Secrets in your Rulebricks values:
#
#   global:
#     secrets:
#       secretRef: rulebricks-app
#     supabase:
#       secretRef: rulebricks-supabase-jwt   # browser anon key seam
#   supabase:
#     secret:
#       jwt: { secretRef: rulebricks-supabase-jwt }
#       db:  { secretRef: rulebricks-supabase-db }
#   clickhouse:
#     auth:
#       existingSecret: rulebricks-clickhouse
#   rulebricks:
#     app:
#       clickhouse:
#         existingSecret: rulebricks-clickhouse
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rulebricks-secrets-reader
  namespace: rulebricks
  annotations:
    # IRSA: role that can read the rulebricks-* Secrets Manager entries.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<SECRETS_READER_ROLE>
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rulebricks-aws-secrets-manager
  namespace: rulebricks
spec:
  provider:
    aws:
      service: SecretsManager
      region: <AWS_REGION>
      auth:
        jwt:
          serviceAccountRef:
            name: rulebricks-secrets-reader
---
# Application secret (.secrets.example section 1) - always required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-app
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-aws-secrets-manager
    kind: SecretStore
  target:
    name: rulebricks-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-app
  # Alternative: one Secrets Manager entry per key instead of a JSON object.
  # data:
  #   - secretKey: LICENSE_KEY
  #     remoteRef: { key: rulebricks-app-license-key }
  #   - secretKey: SMTP_PASS
  #     remoteRef: { key: rulebricks-app-smtp-pass }
---
# Supabase JWT (.secrets.example section 2) - self-hosted Supabase only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-supabase-jwt
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-aws-secrets-manager
    kind: SecretStore
  target:
    name: rulebricks-supabase-jwt
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-supabase-jwt
---
# Postgres credentials (.secrets.example section 3) - self-hosted Supabase only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-supabase-db
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-aws-secrets-manager
    kind: SecretStore
  target:
    name: rulebricks-supabase-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-supabase-db
---
# ClickHouse admin password (.secrets.example section 8).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-clickhouse
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-aws-secrets-manager
    kind: SecretStore
  target:
    name: rulebricks-clickhouse
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-clickhouse
# -----------------------------------------------------------------------------
# Remaining optional Secrets (.secrets.example sections 4-7 and 9: db-bootstrap,
# dashboard, smtp, realtime, ferretdb): duplicate any ExternalSecret above and
# change metadata.name, target.name, and the extract key to the section's
# suggested Secret name.
# -----------------------------------------------------------------------------
