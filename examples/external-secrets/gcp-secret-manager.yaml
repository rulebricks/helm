# =============================================================================
# GCP Secret Manager -> Rulebricks via External Secrets Operator
#
# Client-applied manifests (kubectl apply -f) - the Rulebricks chart does NOT
# render these. Prerequisites:
#
#   1. External Secrets Operator installed - either your own cluster-wide
#      install, or set `externalSecrets.installOperator: true` in the Rulebricks
#      values for a namespace-scoped operator with mirrored images.
#   2. GKE Workload Identity enabled, and a Google service account with
#      roles/secretmanager.secretAccessor bound to the Kubernetes
#      ServiceAccount below:
#        gcloud iam service-accounts add-iam-policy-binding \
#          <GSA>@<PROJECT_ID>.iam.gserviceaccount.com \
#          --role roles/iam.workloadIdentityUser \
#          --member "serviceAccount:<PROJECT_ID>.svc.id.goog[rulebricks/rulebricks-secrets-reader]"
#   3. One Secret Manager entry per section of .secrets.example, stored as a
#      JSON object whose keys match that section exactly, e.g.
#        echo '{"LICENSE_KEY":"...","EMAIL":"..."}' | \
#          gcloud secrets create rulebricks-app --data-file=-
#
# Then point the chart at the synced Secrets in your Rulebricks values:
#
#   global:
#     secrets:
#       secretRef: rulebricks-app
#     supabase:
#       secretRef: rulebricks-supabase-jwt   # browser anon key seam
#   supabase:
#     secret:
#       jwt: { secretRef: rulebricks-supabase-jwt }
#       db:  { secretRef: rulebricks-supabase-db }
#   clickhouse:
#     auth:
#       existingSecret: rulebricks-clickhouse
#   rulebricks:
#     app:
#       clickhouse:
#         existingSecret: rulebricks-clickhouse
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rulebricks-secrets-reader
  namespace: rulebricks
  annotations:
    iam.gke.io/gcp-service-account: <GSA>@<PROJECT_ID>.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rulebricks-gcp-secret-manager
  namespace: rulebricks
spec:
  provider:
    gcpsm:
      projectID: <PROJECT_ID>
      auth:
        workloadIdentity:
          clusterLocation: <CLUSTER_LOCATION>
          clusterName: <CLUSTER_NAME>
          serviceAccountRef:
            name: rulebricks-secrets-reader
---
# Application secret (.secrets.example section 1) - always required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-app
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-gcp-secret-manager
    kind: SecretStore
  target:
    name: rulebricks-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-app
  # Alternative: one Secret Manager entry per key instead of a JSON object.
  # data:
  #   - secretKey: LICENSE_KEY
  #     remoteRef: { key: rulebricks-app-license-key }
---
# Supabase JWT (.secrets.example section 2) - self-hosted Supabase only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-supabase-jwt
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-gcp-secret-manager
    kind: SecretStore
  target:
    name: rulebricks-supabase-jwt
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-supabase-jwt
---
# Postgres credentials (.secrets.example section 3) - self-hosted Supabase only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-supabase-db
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-gcp-secret-manager
    kind: SecretStore
  target:
    name: rulebricks-supabase-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-supabase-db
---
# ClickHouse admin password (.secrets.example section 8).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rulebricks-clickhouse
  namespace: rulebricks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rulebricks-gcp-secret-manager
    kind: SecretStore
  target:
    name: rulebricks-clickhouse
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rulebricks-clickhouse
# -----------------------------------------------------------------------------
# Remaining optional Secrets (.secrets.example sections 4-7 and 9: db-bootstrap,
# dashboard, smtp, realtime, ferretdb): duplicate any ExternalSecret above and
# change metadata.name, target.name, and the extract key to the section's
# suggested Secret name.
# -----------------------------------------------------------------------------
