{{- /* The chart's own Let's Encrypt issuer. Not rendered when an existing
     issuer is referenced (global.tlsIssuerRef) or certificates are provided
     out-of-band. */}}
{{- $issuerRef := .Values.global.tlsIssuerRef | default dict }}
{{- if and (index .Values "cert-manager" "enabled") .Values.global.tlsEnabled (not $issuerRef.name) (not .Values.global.tlsCertificatesProvided) }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-letsencrypt
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  acme:
    # Use Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.global.email | required "global.email is required for TLS certificate generation" }}
    privateKeySecretRef:
      name: {{ .Release.Name }}-letsencrypt-account-key
    solvers:
    - http01:
        ingress:
          # ingressClassName (not the older `class:` field): `class` emits only
          # the legacy kubernetes.io/ingress.class annotation, which Traefik v3
          # does not honor - solver ingresses must carry spec.ingressClassName
          # to be routed deterministically.
          ingressClassName: traefik
{{- end }}

