{{- if and .Values.clickhouse.enabled .Values.clickhouse.persistence.enabled }}
{{- $ch := .Values.clickhouse }}
{{- $clickstack := .Values.clickstack | default dict -}}
{{- $clickstackClickhouse := $clickstack.clickhouse | default dict -}}
{{- $otelDb := $clickstackClickhouse.database | default "otel" }}
{{- /* The existing cleanup releases only enough of the oldest local parts to
     restore headroom. Decision-log indexes live inside those same parts. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-retention" (include "rulebricks.clickhouse.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-retention
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: retention
            app.kubernetes.io/managed-by: {{ .Release.Service }}
            rulebricks.com/workload-group: infrastructure
            {{- with .Values.global.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: {{ include "rulebricks-chart.registrySecretName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: retention
              image: {{ include "rulebricks.image" (dict "root" . "image" .Values.global.images.busybox "name" "busybox") | quote }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: CLICKHOUSE_HOST
                  value: {{ include "rulebricks.clickhouse.fullname" . | quote }}
                - name: CLICKHOUSE_USER
                  value: {{ $ch.auth.username | default "rulebricks" | quote }}
                - name: CLICKSTACK_DATABASE
                  value: {{ $otelDb | quote }}
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                      key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  set -f
                  q() {
                    query="$1"
                    settings="${2:-}"
                    headers="/tmp/clickhouse-headers.$$"
                    response=""
                    if ! response=$(wget -S -O - \
                      --header "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
                      --header "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
                      --post-data "${query}" \
                      "http://${CLICKHOUSE_HOST}:8123/${settings}" \
                      2>"${headers}"); then
                      echo "ClickHouse query failed: ${query}" >&2
                      # BusyBox wget does not reliably print ClickHouse's 500
                      # response body, but -S preserves the status and
                      # X-ClickHouse-Exception-Code header. Print both when
                      # available so retention failures are diagnosable.
                      cat "${headers}" >&2
                      if [ -n "${response}" ]; then
                        printf '%s\n' "${response}" >&2
                      fi
                      rm -f "${headers}"
                      return 1
                    fi
                    rm -f "${headers}"
                    if [ -n "${response}" ]; then
                      printf '%s\n' "${response}"
                    fi
                  }

                  case "${CLICKSTACK_DATABASE}" in
                    ""|system|rulebricks|*[!a-zA-Z0-9_]*)
                      echo "unsafe ClickStack database name '${CLICKSTACK_DATABASE}'" >&2
                      exit 1
                      ;;
                  esac

                  # Start above 75% used and restore 30% free. Plan from one
                  # snapshot so a delay releasing files cannot empty the store.
                  needed=$(q "SELECT if(free_space < intDiv(total_space, 4),
                    intDiv(total_space * 3, 10) - free_space, 0)
                    FROM system.disks WHERE name = 'default' FORMAT TSVRaw")
                  case "$needed" in 0) exit 0 ;; ''|*[!0-9]*) exit 1 ;; esac

                  # Helm installs the CronJob before the post-upgrade hook.
                  # Wait for the old separately stored index to be replaced.
                  kind=$(q "SELECT engine FROM system.tables WHERE database='rulebricks' AND name='decision_log_index' FORMAT TSVRaw")
                  [ "$kind" = View ] || exit 0

                  plan=/tmp/evictable-parts
                  # Merge copies of live data occupy working space. Once their block
                  # range is evicted, count those files toward the same eviction.
                  q "WITH eligible AS (
                      SELECT database, table, name, active, bytes_on_disk, max_block_number,
                        maxOrNullIf(max_block_number, active) OVER (
                          PARTITION BY database, table, partition_id ORDER BY min_block_number, active DESC, max_block_number DESC
                          ROWS UNBOUNDED PRECEDING) AS live_range_end,
                        multiIf(max_time > toDateTime(0, 'UTC'), max_time,
                          max_date > toDate(0), toDateTime(max_date, 'UTC'), modification_time) AS newest
                      FROM system.parts
                      WHERE disk_name = 'default' AND bytes_on_disk > 0 AND rows > 0 AND
                        ((database = 'rulebricks' AND table = 'decision_logs') OR database = '${CLICKSTACK_DATABASE}')
                    ),
                    (SELECT sum(bytes_on_disk) FROM eligible WHERE NOT active AND
                      (isNull(live_range_end) OR live_range_end < max_block_number)) AS pending
                    SELECT database, table, name FROM eligible WHERE active
                    WINDOW oldest AS (ORDER BY newest, database, table, max_block_number, name ROWS UNBOUNDED PRECEDING)
                    QUALIFY pending + sum(bytes_on_disk) OVER oldest - bytes_on_disk < ${needed}
                    ORDER BY newest, database, table, max_block_number, name FORMAT TSVRaw" > "$plan"

                  while IFS="$(printf '\t')" read -r db table part; do
                    case "$db" in rulebricks|"${CLICKSTACK_DATABASE}") ;; *) exit 1 ;; esac
                    case "$table" in ''|*[!a-zA-Z0-9_]*) exit 1 ;; esac
                    case "$part" in ''|*[!a-zA-Z0-9_-]*) exit 1 ;; esac
                    [ "$db" != rulebricks ] || [ "$table" = decision_logs ] || exit 1
                    echo "Releasing ${db}.${table} part ${part}"
                    if ! q "ALTER TABLE \`${db}\`.\`${table}\` DROP PART '${part}'" "?max_partition_size_to_drop=0"; then
                      # A background merge can replace the selected part. Build
                      # a fresh plan next minute rather than dropping its successor.
                      active=$(q "SELECT count() FROM system.parts WHERE active AND database='${db}' AND table='${table}' AND name='${part}' FORMAT TSVRaw")
                      [ "$active" = 0 ] || exit 1
                      exit 0
                    fi
                  done < "$plan"
{{- end }}
