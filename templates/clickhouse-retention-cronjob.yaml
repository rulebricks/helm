{{- if and .Values.clickhouse.enabled .Values.clickhouse.persistence.enabled }}
{{- $ch := .Values.clickhouse }}
{{- /* Disk-pressure safety valve for the persistent decision_logs table (see
     _defaults.tpl decisionLogsViewSql). The configured table TTL is the normal
     retention mechanism. If free space falls below 35%, this job drops the
     oldest completed daily partition early so MergeTree merges and shared OTel
     telemetry retain working space. This is intentionally an emergency,
     lossy action for the local table; the separately written raw archive can
     still be used for an explicit fallback/import. The table-level
     min_free_disk_ratio_to_perform_insert=0.2 remains the final backstop.

     The hardened clickhouse-server image has no shell, so this runs busybox
     (already mirrored for other init/hook duties) against the ClickHouse HTTP
     interface. POST is required: ClickHouse treats GET as readonly and
     rejects ALTER. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-retention" (include "rulebricks.clickhouse.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            {{- include "rulebricks.clickhouse.selectorLabels" . | nindent 12 }}
            rulebricks.com/workload-group: infrastructure
            {{- with .Values.global.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: {{ include "rulebricks-chart.registrySecretName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          containers:
            - name: retention
              image: {{ include "rulebricks.image" (dict "root" . "image" .Values.global.images.busybox "name" "busybox") | quote }}
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: CLICKHOUSE_HOST
                  value: {{ include "rulebricks.clickhouse.fullname" . | quote }}
                - name: CLICKHOUSE_USER
                  value: {{ $ch.auth.username | default "rulebricks" | quote }}
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                      key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  q() {
                    query="$1"
                    settings="${2:-}"
                    headers="/tmp/clickhouse-headers.$$"
                    response=""
                    if ! response=$(wget -S -O - \
                      --header "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
                      --header "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
                      --post-data "${query}" \
                      "http://${CLICKHOUSE_HOST}:8123/${settings}" \
                      2>"${headers}"); then
                      echo "ClickHouse query failed: ${query}" >&2
                      # BusyBox wget does not reliably print ClickHouse's 500
                      # response body, but -S preserves the status and
                      # X-ClickHouse-Exception-Code header. Print both when
                      # available so retention failures are diagnosable.
                      cat "${headers}" >&2
                      if [ -n "${response}" ]; then
                        printf '%s\n' "${response}" >&2
                      fi
                      rm -f "${headers}"
                      return 1
                    fi
                    rm -f "${headers}"
                    printf '%s' "${response}"
                  }
                  i=0
                  while [ "$i" -lt 32 ]; do
                    free_ok=$(q "SELECT free_space >= 0.35 * total_space FROM system.disks WHERE name = 'default' FORMAT TSVRaw")
                    if [ "$free_ok" = "1" ]; then
                      echo "disk healthy (>=35% free); nothing to do"
                      exit 0
                    fi
                    if [ "$free_ok" != "0" ]; then
                      echo "unexpected system.disks response '${free_ok}'" >&2
                      exit 1
                    fi
                    # partition_id for toYYYYMMDD partitioning is the YYYYMMDD string,
                    # so lexicographic min = chronologically oldest. min() over an
                    # empty set returns '' for String, which reads as "nothing left".
                    oldest=$(q "SELECT min(partition_id) FROM system.parts WHERE database = 'rulebricks' AND table = 'decision_logs' AND active FORMAT TSVRaw")
                    if [ -z "$oldest" ]; then
                      echo "free space low but decision_logs is empty; nothing to evict"
                      exit 0
                    fi
                    today=$(date -u +%Y%m%d)
                    if [ "$oldest" -ge "$today" ] 2>/dev/null; then
                      insert_ok=$(q "SELECT free_space >= 0.20 * total_space FROM system.disks WHERE name = 'default' FORMAT TSVRaw")
                      if [ "$insert_ok" = "1" ]; then
                        echo "only the active partition remains and insert headroom is healthy (>=20% free); leaving it"
                        exit 0
                      fi
                      if [ "$insert_ok" != "0" ]; then
                        echo "unexpected system.disks response '${insert_ok}'" >&2
                        exit 1
                      fi
                      # A single high-volume day can fill the disk before UTC
                      # rollover. Below the table's 20% insert backstop, keeping
                      # today's local partition would wedge ingest indefinitely.
                      # The independently-written object archive remains durable.
                      echo "free space below insert backstop; dropping active decision_logs partition ${oldest}"
                    else
                      echo "free space low; dropping decision_logs partition ${oldest}"
                    fi
                    # Override ClickHouse's 50 GB safety cap for this emergency
                    # retention operation only. The server-wide guard remains in
                    # place for every other DROP query.
                    q "ALTER TABLE rulebricks.decision_logs DROP PARTITION ID '${oldest}'" "?max_partition_size_to_drop=0"
                    i=$((i + 1))
                  done
                  echo "eviction cap reached this run; continuing next schedule"
{{- end }}
