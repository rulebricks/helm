{{- if .Values.clickhouse.enabled }}
{{- $ch := .Values.clickhouse }}
{{- $storageAnnotations := include "rulebricks.storage.serviceAccountAnnotations" . | fromYaml | default dict }}
{{- $serviceAccountAnnotations := mergeOverwrite (dict) $storageAnnotations ($ch.serviceAccount.annotations | default dict) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rulebricks.clickhouse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
    - name: metrics
      port: 9363
      targetPort: metrics
{{- if $ch.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
  {{- with $serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if and $ch.metrics.enabled $ch.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rulebricks.clickhouse.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
{{- end }}
