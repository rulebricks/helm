{{- if .Values.clickhouse.enabled }}
{{- $ch := .Values.clickhouse }}
{{- $cv := merge (dict "global" .Values.global) (deepCopy .Values.clickhouse) -}}
{{- $cctx := dict "Values" $cv "Release" .Release "Chart" .Chart "Template" .Template "Capabilities" .Capabilities "Files" .Files -}}
{{- $user := $ch.auth.username | default "rulebricks" -}}
{{- $clickstack := .Values.clickstack | default dict -}}
{{- $clickstackClickhouse := $clickstack.clickhouse | default dict -}}
{{- $otelDb := $clickstackClickhouse.database | default "otel" -}}
{{- $adminDb := include "rulebricks.clickhouse.adminDatabase" . -}}
{{- $generation := include "rulebricks.clickhouse.compatibilityGeneration" . -}}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $otelDb) -}}
{{- fail "clickstack.clickhouse.database must be a valid unquoted ClickHouse identifier" -}}
{{- end -}}
{{- if and .Values.global.clickstack.enabled (or (eq $otelDb "system") (eq $otelDb "rulebricks") (eq $otelDb $adminDb)) -}}
{{- fail (printf "clickstack.clickhouse.database must not be system, rulebricks, or %s" $adminDb) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # ClickHouse may still be starting when the hook fires; retry until it answers.
  backoffLimit: 30
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-init
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- if $ch.persistence.enabled }}
      initContainers:
        - name: verify-local-storage
          image: {{ include "rulebricks.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "rulebricks.clickhouse.fullname" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                  key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              set -f
              q() {
                query="$1"
                settings="${2:-}"
                headers="/tmp/clickhouse-headers.$$"
                response=""
                if ! response=$(wget -S -O - \
                  --header "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
                  --header "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
                  --post-data "${query}" \
                  "http://${CLICKHOUSE_HOST}:8123/${settings}" \
                  2>"${headers}"); then
                  echo "ClickHouse cutover query failed: ${query}" >&2
                  cat "${headers}" >&2
                  [ -z "${response}" ] || printf '%s\n' "${response}" >&2
                  rm -f "${headers}"
                  return 1
                fi
                rm -f "${headers}"
                printf '%s' "${response}"
              }

              # ClickHouse keeps its tables on the PVC: a table created with
              # no explicit policy must land on the local default policy.
              q "CREATE DATABASE IF NOT EXISTS rulebricks"
              q "DROP TABLE IF EXISTS rulebricks.__storage_probe SYNC"
              q "CREATE TABLE rulebricks.__storage_probe (id UInt8) ENGINE = MergeTree ORDER BY id"
              probe_policy=$(q "SELECT storage_policy FROM system.tables WHERE database = 'rulebricks' AND name = '__storage_probe' FORMAT TSVRaw")
              q "DROP TABLE rulebricks.__storage_probe SYNC"
              if [ "${probe_policy}" != "default" ]; then
                echo "ClickHouse global MergeTree policy is '${probe_policy}', expected default (the PVC)" >&2
                exit 1
              fi
        {{- if .Values.global.clickstack.enabled }}
        - name: seed-clickstack-schema
          image: {{ include "rulebricks.image" (dict "root" $ "image" .Values.clickstack.collector.image "name" "clickstack-otel-collector") | quote }}
          imagePullPolicy: {{ .Values.clickstack.collector.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_ENDPOINT
              value: {{ printf "tcp://%s:9000?dial_timeout=10s&compress=lz4" (include "rulebricks.clickhouse.fullname" .) | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                  key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
            - name: HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE
              value: {{ $otelDb | quote }}
            - name: HYPERDX_OTEL_EXPORTER_TABLES_TTL
              value: "720h"
            - name: ENABLE_PROMQL
              # The PromQL TimeSeries schema has no upstream TTL and is not
              # consumed by the bundled dashboards or collector pipelines.
              value: "false"
          command: ["/usr/local/bin/migrate"]
          args: ["/etc/otel/schema/seed"]
        {{- end }}
      {{- end }}
      containers:
        - name: seed-and-audit
          image: {{ include "rulebricks.image" (dict "root" $ "image" $ch.image "name" "clickhouse-server") | quote }}
          imagePullPolicy: {{ $ch.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "rulebricks.clickhouse.fullname" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                  key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
            - name: BOOTSTRAP_SQL
              value: {{ include "rulebricks.clickhouse.decisionLogsViewSql" $cctx | quote }}
            - name: PERSISTENT_MODE
              value: {{ $ch.persistence.enabled | quote }}
            - name: ADMIN_DATABASE
              value: {{ $adminDb | quote }}
            - name: COMPATIBILITY_GENERATION
              value: {{ $generation | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ch() {
                clickhouse-client \
                  --host "${CLICKHOUSE_HOST}" \
                  --port 9000 \
                  --user "${CLICKHOUSE_USER}" \
                  --password "${CLICKHOUSE_PASSWORD}" \
                  "$@"
              }
              ch --multiquery --query "${BOOTSTRAP_SQL}"
              [ "${PERSISTENT_MODE}" = "true" ] || exit 0

              # Upgrades must clear a deadline already stored in the table metadata.
              # REMOVE TTL is only valid on a table that currently has one.
              changes=$(ch --query "
                SELECT concat('ALTER TABLE rulebricks.', name, ' ',
                  if(position(engine_full, ' TTL ') > 0, 'REMOVE TTL, ', ''),
                  'RESET SETTING ttl_only_drop_parts;')
                FROM system.tables
                WHERE database = 'rulebricks' AND name IN ('decision_logs', 'decision_log_index')
                  AND engine LIKE '%MergeTree'
                  AND (position(engine_full, ' TTL ') > 0 OR position(engine_full, 'ttl_only_drop_parts') > 0)
                FORMAT TSVRaw")
              if [ -n "${changes}" ]; then
                ch --multiquery --query "${changes}"
              fi

              # Native indexes belong to the log part. Adding their definitions
              # indexes new parts and normal merges without rewriting the PVC.
              # Bound normal merges on small volumes too. A single hour can
              # occupy many independently evictable parts on any PVC size.
              merge_bytes=$(ch --query "SELECT least(268435456, intDiv(total_space, 32)) FROM system.disks WHERE name='default' FORMAT TSVRaw")
              case "$merge_bytes" in ''|0|*[!0-9]*) exit 1 ;; esac
              ch --query "ALTER TABLE rulebricks.decision_logs MODIFY SETTING
                min_free_disk_ratio_to_perform_insert = 0.2, max_bytes_to_merge_at_max_space_in_pool = ${merge_bytes}"
              ch --query "ALTER TABLE rulebricks.decision_logs
                ADD INDEX IF NOT EXISTS idx_legacy_search (isNull(search_record_id) AND ifNull(operation, '') NOT IN ('flow-trace', 'flow-trace-chunk', 'flow-values')) TYPE minmax GRANULARITY 1,
                ADD INDEX IF NOT EXISTS idx_asset (rule_name, rule_id, rule_slug, flow_slug, flow_name, operation) TYPE set(2000) GRANULARITY 1,
                ADD INDEX IF NOT EXISTS idx_parallel_execution_id parallel_execution_id TYPE bloom_filter(0.001) GRANULARITY 1,
                ADD INDEX IF NOT EXISTS idx_request_fields ifNull(request_fields, '') TYPE text(tokenizer = splitByNonAlpha) GRANULARITY 100000000,
                ADD INDEX IF NOT EXISTS idx_response_fields ifNull(response_fields, '') TYPE text(tokenizer = splitByNonAlpha) GRANULARITY 100000000,
                ADD INDEX IF NOT EXISTS idx_rule_name rule_name TYPE text(tokenizer = splitByNonAlpha) GRANULARITY 100000000,
                ADD INDEX IF NOT EXISTS idx_flow_name flow_name TYPE text(tokenizer = splitByNonAlpha) GRANULARITY 100000000"

              # Keep the existing app-facing name. Only the old derived table
              # is replaced. Concurrent log inserts always target decision_logs.
              kind=$(ch --query "SELECT if(engine='View' AND (SELECT count() FROM system.columns
                WHERE database='rulebricks' AND table='decision_log_index' AND name='search_has_data')=1,
                'ready', engine) FROM system.tables WHERE database='rulebricks' AND name='decision_log_index' FORMAT TSVRaw")
              case "$kind" in
                ''|MergeTree|View)
                  ch --query "CREATE VIEW IF NOT EXISTS rulebricks.decision_log_index_cutover AS
                    SELECT timestamp, api_key, user_id, environment, ip, method, url, status,
                      rule_name, rule_id, rule_slug, rule_version, operation, error, trace_id,
                      span_id, flow_execution_id, flow_name, flow_slug, flow_node_id,
                      parallel_execution_id, parallel_path, log_id, search_record_id,
                      isNotNull(decision_logs.request_fields) AS search_has_data,
                      ifNull(decision_logs.request_fields, '') AS request_fields, ifNull(decision_logs.response_fields, '') AS response_fields
                    FROM rulebricks.decision_logs
                    WHERE ifNull(operation, '') NOT IN ('flow-trace', 'flow-trace-chunk', 'flow-values')"
                  ch --query "ALTER TABLE rulebricks.decision_log_index_cutover MODIFY COMMENT 'covers:0'"
                  if [ -n "$kind" ]; then
                    # Preserve the previous writer's payload coverage boundary.
                    fields=$(ch --query "SELECT comment FROM system.columns WHERE database='rulebricks' AND table='decision_log_index' AND name='request_fields' AND match(comment, '^covers:[0-9]+$') FORMAT TSVRaw")
                    if [ -n "$fields" ]; then
                      ch --query "ALTER TABLE rulebricks.decision_log_index_cutover COMMENT COLUMN request_fields '$fields'"
                    fi
                    # Readers can use the main table if the hook is interrupted
                    # after the old writer stops and before the names switch.
                    ch --query "ALTER TABLE rulebricks.decision_log_index MODIFY COMMENT ''"
                    ch --query "DROP VIEW IF EXISTS rulebricks.decision_log_index_mv SYNC"
                    if ! error=$(ch --query "EXCHANGE TABLES rulebricks.decision_log_index AND rulebricks.decision_log_index_cutover" 2>&1); then
                      case "$error" in
                        *UNSUPPORTED_METHOD*)
                          # Filesystems without atomic exchange support ordinary
                          # renames. A retry can publish the prepared view if
                          # only the first rename succeeded.
                          ch --query "RENAME TABLE rulebricks.decision_log_index TO rulebricks.decision_log_index_previous,
                            rulebricks.decision_log_index_cutover TO rulebricks.decision_log_index" ;;
                        *) echo "$error" >&2; exit 1 ;;
                      esac
                    fi
                  else
                    ch --query "RENAME TABLE rulebricks.decision_log_index_cutover TO rulebricks.decision_log_index"
                  fi ;;
                ready) ;;
                *) echo "Unexpected decision_log_index engine: $kind" >&2; exit 1 ;;
              esac
              # Also completes an upgrade interrupted immediately after EXCHANGE.
              ch --max_table_size_to_drop=0 --multiquery --query "
                DROP TABLE IF EXISTS rulebricks.decision_log_index_cutover SYNC;
                DROP TABLE IF EXISTS rulebricks.decision_log_index_previous SYNC;"

              # No MergeTree may be backed by object storage: the PVC is the
              # only place ClickHouse keeps table data.
              violations="$(
                ch --query "
                    SELECT database, name, engine, storage_policy
                    FROM system.tables
                    WHERE database != 'system'
                      AND engine LIKE '%MergeTree%'
                      AND storage_policy = 'object_storage'
                    ORDER BY database, name
                    FORMAT TSVRaw
                  "
              )"
              if [ -n "${violations}" ]; then
                echo "ClickHouse post-seed audit failed; MergeTree tables are backed by object storage:" >&2
                printf '%s\n' "${violations}" >&2
                exit 1
              fi

              ch --multiquery \
                --query "
                  CREATE DATABASE IF NOT EXISTS \`${ADMIN_DATABASE}\`;
                  DROP TABLE IF EXISTS \`${ADMIN_DATABASE}\`.clickhouse_compatibility SYNC;
                  CREATE TABLE \`${ADMIN_DATABASE}\`.clickhouse_compatibility
                  (
                    generation String,
                    applied_at DateTime DEFAULT now()
                  )
                  ENGINE = TinyLog;
                  INSERT INTO \`${ADMIN_DATABASE}\`.clickhouse_compatibility (generation)
                  VALUES ('${COMPATIBILITY_GENERATION}');
                "
{{- end }}
