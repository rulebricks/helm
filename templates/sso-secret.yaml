{{/*
SSO Secret for Supabase GoTrue Auth
Contains OAuth client credentials for the configured SSO provider.
This secret is only created if:
  1. global.sso.enabled is true
  2. global.secrets.secretRef is NOT set (enterprise users provide their own)
The Supabase auth deployment references this secret for GOTRUE_EXTERNAL_* env vars.
*/}}
{{- $secretRef := "" }}
{{- if and .Values.global .Values.global.secrets .Values.global.secrets.secretRef }}
  {{- $secretRef = .Values.global.secrets.secretRef }}
{{- end }}
{{- if and (not $secretRef) .Values.global .Values.global.sso .Values.global.sso.enabled .Values.global.sso.provider }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sso
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sso
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  SSO_CLIENT_ID: {{ .Values.global.sso.clientId | default "" | quote }}
  SSO_CLIENT_SECRET: {{ .Values.global.sso.clientSecret | default "" | quote }}
{{- end }}
