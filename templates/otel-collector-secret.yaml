{{- $tracing := .Values.global.tracing | default dict }}
{{- $clickstack := (.Values.global.clickstack | default dict) }}
{{- if and $tracing.enabled (not ($clickstack.enabled | default false)) }}
{{- $destination := $tracing.destination | default "elastic" }}
{{- $elastic := $tracing.elastic | default dict }}
{{- $otlp := $tracing.otlp | default dict }}
{{- $azure := $tracing.azureMonitor | default dict }}
{{- $elasticAuthMode := $elastic.authMode | default "secret-token" }}
{{- $otlpAuthMode := $otlp.authMode | default "none" }}
{{- /*
  Create our own credential secret only when the operator inlined the
  credential AND did not point us at an existing secret. The collector reads it
  from env (TRACING_AUTH_TOKEN for elastic/otlp, AZURE_MONITOR_CONNECTION_STRING
  for azure-monitor); the auth scheme is baked into the exporter in the ConfigMap.
*/}}
{{- if eq $destination "elastic" }}
{{- $existing := $elastic.existingSecret | default dict }}
{{- if and (ne $elasticAuthMode "none") (not $existing.name) }}
{{- $token := "" }}
{{- if eq $elasticAuthMode "api-key" }}{{- $token = ($elastic.apiKey | default "") }}{{- else }}{{- $token = ($elastic.secretToken | default "") }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-otel-elastic
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- else if eq $destination "otlp" }}
{{- $existing := $otlp.existingSecret | default dict }}
{{- if and (ne $otlpAuthMode "none") (not $existing.name) }}
{{- $token := "" }}
{{- if eq $otlpAuthMode "api-key" }}{{- $token = ($otlp.apiKey | default "") }}{{- else if eq $otlpAuthMode "header" }}{{- $token = ($otlp.headerValue | default "") }}{{- else }}{{- $token = ($otlp.token | default "") }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-otel-otlp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- else if eq $destination "azure-monitor" }}
{{- $existing := $azure.existingSecret | default dict }}
{{- if not $existing.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-otel-azure-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  connection-string: {{ $azure.connectionString | default "" | quote }}
{{- end }}
{{- end }}
{{- end }}
