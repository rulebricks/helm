{{- $relay := .Values.smtpRelay | default dict }}
{{- $existing := $relay.existingSecret | default dict }}
{{- /* Create the connection-string secret only when the operator inlined the
     credential and did not point us at an existing secret (External Secrets
     Operator or CLI-created). The relay reads it from env
     (ACS_CONNECTION_STRING) in smtp-relay-deployment.yaml. */}}
{{- if and $relay.enabled (not $existing.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-smtp-relay
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: smtp-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: email
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  connection-string: {{ $relay.connectionString | default "" | quote }}
{{- end }}
