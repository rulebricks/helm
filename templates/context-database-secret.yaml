{{- /*
The durable Context processes need a direct PostgreSQL connection. Prefer an
operator/CLI-created Secret with a least-privilege Context role by setting
rulebricks.hps.contexts.database.existingSecret.

For the default inline bundled-Postgres install, create a release-scoped Secret
so the same workload contract works out of the box. Kubernetes-secret mode in
the CLI always supplies existingSecret and this resource is therefore skipped.
*/ -}}
{{- $hps := (.Values.rulebricks | default dict).hps | default dict -}}
{{- $contexts := $hps.contexts | default dict -}}
{{- $database := $contexts.database | default dict -}}
{{- if and ($hps.enabled | default false) ($contexts.enabled | default false) (not ($database.existingSecret | default "")) }}
{{- $supabase := .Values.supabase | default dict -}}
{{- $dbSecret := (($supabase.secret | default dict).db) | default dict -}}
{{- $external := $supabase.externalDatabase | default dict -}}
{{- $host := include "rulebricks.supabase.db.fullname" . -}}
{{- $port := 5432 -}}
{{- $sslMode := "disable" -}}
{{- if $external.enabled -}}
  {{- $host = required "supabase.externalDatabase.host is required to generate the Context database Secret; alternatively set rulebricks.hps.contexts.database.existingSecret" $external.host -}}
  {{- $port = $external.port | default 5432 -}}
  {{- $sslMode = "require" -}}
{{- end -}}
{{- $username := $dbSecret.username | default "postgres" -}}
{{- $password := required "supabase.secret.db.password is required to generate the Context database Secret; alternatively set rulebricks.hps.contexts.database.existingSecret" $dbSecret.password -}}
{{- $dbname := $dbSecret.database | default "postgres" -}}
{{- $escapedUser := urlquery $username | replace "+" "%20" -}}
{{- $escapedPassword := urlquery $password | replace "+" "%20" -}}
{{- $escapedDatabase := urlquery $dbname | replace "+" "%20" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-context-database" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: context-database
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: context-database
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{ $database.urlKey | default "CONTEXT_DATABASE_URL" }}: {{ printf "postgresql://%s:%s@%s:%v/%s?sslmode=%s" $escapedUser $escapedPassword $host $port $escapedDatabase $sslMode | quote }}
{{- end }}
