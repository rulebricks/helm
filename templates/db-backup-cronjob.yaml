{{- if and .Values.backup .Values.backup.enabled .Values.supabase.enabled .Values.supabase.db.enabled }}
{{- $storage := .Values.global.storage | default dict -}}
{{- $provider := $storage.provider | default "s3" -}}
{{- $azure := $storage.azure | default dict -}}
{{- $authMode := $azure.authMode | default "workload-identity" -}}
{{- $bucket := include "rulebricks.storage.bucket" (list . "dbBackups") -}}
{{- $region := include "rulebricks.storage.region" (list . "dbBackups") -}}
{{- $container := include "rulebricks.storage.azureContainer" (list . "dbBackups") -}}
{{- $path := include "rulebricks.storage.path" (list . "dbBackups") -}}
{{- $dbImage := printf "%s:%s" .Values.supabase.db.image.repository (.Values.supabase.db.image.tag | default .Chart.AppVersion) -}}
{{- $rcloneImage := (.Values.backup.rclone | default dict).image | default "rclone/rclone:latest" -}}
{{- $target := ternary (printf "%s/%s" $container $path) (printf "%s/%s" $bucket $path) (eq $provider "azure-blob") -}}
# Logical Postgres backup: an init container streams pg_dump over the network into
# a shared emptyDir, then rclone uploads it to object storage using the workload
# identity / IRSA / GKE WI already bound to the backup ServiceAccount. No barman,
# no local PGDATA, no sidecar -- and the artifacts are real dumps, not metadata.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rulebricks.backup.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "rulebricks.backup.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-backup
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.backup.schedule | default "0 2 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ (.Values.backup.jobHistory | default dict).successful | default 30 }}
  failedJobsHistoryLimit: {{ (.Values.backup.jobHistory | default dict).failed | default 30 }}
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished | default 2592000 | int }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "rulebricks.backup.fullname" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: db-backup
            rulebricks.com/workload-group: infrastructure
            {{- include "rulebricks.storage.podLabels" . | nindent 12 }}
            {{- with .Values.global.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.global.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "rulebricks.backup.serviceAccountName" . }}
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: {{ $dbImage | quote }}
              imagePullPolicy: {{ .Values.supabase.db.image.pullPolicy | default "IfNotPresent" }}
              env:
                - name: PGHOST
                  value: {{ include "rulebricks.supabase.db.fullname" . | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: "postgres"
                # Dump as a superuser so we can lock/read schemas owned by
                # supabase_admin (auth, storage, realtime, etc.); the secret's
                # `username` role (postgres) is not a superuser in Supabase.
                - name: PGUSER
                  value: {{ .Values.backup.superuser | default "supabase_admin" | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "rulebricks.supabase.db.secretName" . }}
                      key: {{ .Values.supabase.secret.db.secretRefKey.password | default "password" }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  DEST="/work/${TS}"
                  mkdir -p "${DEST}"
                  echo "Dumping cluster globals (roles) to ${DEST}/globals.sql"
                  pg_dumpall -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" \
                    --globals-only --no-role-passwords > "${DEST}/globals.sql"
                  echo "Dumping database ${PGDATABASE} (custom format) to ${DEST}/db.dump"
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" \
                    -d "${PGDATABASE}" -Fc -f "${DEST}/db.dump"
                  echo "Logical dump complete: $(ls -la "${DEST}")"
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: {{ $rcloneImage | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | default 30 | quote }}
                - name: RB_TARGET
                  value: {{ $target | quote }}
                {{- if eq $provider "azure-blob" }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "azureblob"
                - name: RCLONE_CONFIG_DEST_ACCOUNT
                  value: {{ $bucket | quote }}
                {{- if eq $authMode "connection-string" }}
                - name: RCLONE_CONFIG_DEST_CONNECTION_STRING
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "global.storage.azure.connectionStringSecretRef.name is required for connection-string auth" $azure.connectionStringSecretRef.name }}
                      key: {{ required "global.storage.azure.connectionStringSecretRef.key is required for connection-string auth" $azure.connectionStringSecretRef.key }}
                {{- else }}
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "true"
                {{- end }}
                {{- else if eq $provider "gcs" }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "google cloud storage"
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "true"
                - name: RCLONE_CONFIG_DEST_BUCKET_POLICY_ONLY
                  value: "true"
                {{- else }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: "s3"
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: "AWS"
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "true"
                - name: RCLONE_CONFIG_DEST_REGION
                  value: {{ $region | quote }}
                {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Uploading dumps to dest:${RB_TARGET}/"
                  rclone copy /work "dest:${RB_TARGET}/" --create-empty-src-dirs --transfers 4
                  echo "Pruning backups older than ${RETENTION_DAYS} days"
                  rclone delete "dest:${RB_TARGET}/" --min-age "${RETENTION_DAYS}d" || true
                  rclone rmdirs "dest:${RB_TARGET}/" --leave-root || true
                  echo "Backup uploaded and pruned"
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
{{- end }}
