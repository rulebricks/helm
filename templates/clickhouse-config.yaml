{{- if .Values.clickhouse.enabled }}
{{- /* Rebuild the subchart-style context the decision-log helpers expect:
       .Values = clickhouse values (with the shared global merged in). */ -}}
{{- $cv := merge (dict "global" .Values.global) (deepCopy .Values.clickhouse) -}}
{{- $cctx := dict "Values" $cv "Release" .Release "Chart" .Chart "Template" .Template "Capabilities" .Capabilities "Files" .Files -}}
{{- $user := .Values.clickhouse.auth.username | default "rulebricks" -}}
{{- $runtimeUser := "rulebricks" -}}
{{- $clickstack := .Values.clickstack | default dict -}}
{{- $clickstackClickhouse := $clickstack.clickhouse | default dict -}}
{{- $otelDb := $clickstackClickhouse.database | default "otel" -}}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $otelDb) -}}
{{- fail "clickstack.clickhouse.database must be a valid unquoted ClickHouse identifier" -}}
{{- end -}}
{{- $provider := .Values.global.storage.provider | default "s3" -}}
{{- $namedCollection := printf "decision_logs_%s" (ternary "azure" $provider (eq $provider "azure-blob")) -}}
{{- $sourceType := ternary "AZURE" "S3" (eq $provider "azure-blob") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}-config-d
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
data:
  # The DHI/official image's docker_related_config.xml (which sets listen_host)
  # lives in config.d; our mount overlays the dir, so re-assert it here.
  01-listen.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  02-crash-reports.xml: |
    <clickhouse>
      <send_crash_reports>
        <enabled>false</enabled>
      </send_crash_reports>
    </clickhouse>
  03-prometheus.xml: |
    <clickhouse>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
    </clickhouse>
  04-server-guardrails.xml: |
    <clickhouse>
      <!-- Bound the single server below its pod memory limit and shed excess
           query load instead of relying on the kernel OOM killer. -->
      <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
      <max_concurrent_queries>64</max_concurrent_queries>
      <max_concurrent_select_queries>48</max_concurrent_select_queries>
      <max_concurrent_insert_queries>16</max_concurrent_insert_queries>
    </clickhouse>
  05-server-logging.xml: |
    <clickhouse>
      <!-- Keep diagnostic files useful without allowing trace-level output to
           consume the pod's node-ephemeral log volume. -->
      <logger>
        <level>information</level>
        <size>100M</size>
        <count>3</count>
      </logger>
    </clickhouse>
  {{- if .Values.clickhouse.persistence.enabled }}
  08-object-storage.xml: |
{{ include "rulebricks.clickhouse.objectStorageXml" $cctx | indent 4 }}
  {{- end }}
  09-decision-log-storage.xml: |
{{ include "rulebricks.clickhouse.decisionLogStorageXml" $cctx | indent 4 }}
  zz-disable-system-logs.xml: |
    <clickhouse>
      <!-- Persistent system log tables previously competed with product data
           for disk. Diagnostics remain available through stdout/stderr and
           the Prometheus endpoint above. -->
      <query_log remove="1"/>
      <query_thread_log remove="1"/>
      <query_views_log remove="1"/>
      <part_log remove="1"/>
      <background_schedule_pool_log remove="1"/>
      <trace_log remove="1"/>
      <crash_log remove="1"/>
      <text_log remove="1"/>
      <metric_log remove="1"/>
      <transposed_metric_log remove="1"/>
      <error_log remove="1"/>
      <filesystem_cache_log remove="1"/>
      <filesystem_read_prefetches_log remove="1"/>
      <s3queue_log remove="1"/>
      <azure_queue_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <opentelemetry_span_log remove="1"/>
      <zookeeper_log remove="1"/>
      <session_log remove="1"/>
      <transactions_info_log remove="1"/>
      <processors_profile_log remove="1"/>
      <asynchronous_insert_log remove="1"/>
      <backup_log remove="1"/>
      <blob_storage_log remove="1"/>
      <query_metric_log remove="1"/>
      <dead_letter_queue remove="1"/>
      <zookeeper_connection_log remove="1"/>
      <aggregated_zookeeper_log remove="1"/>
      <iceberg_metadata_log remove="1"/>
      <delta_lake_metadata_log remove="1"/>
      <predicate_statistics_log remove="1"/>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}-users-d
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
data:
  00-users.xml: |
    <clickhouse>
      <users>
        <{{ $user }}>
          <password from_env="CLICKHOUSE_PASSWORD"/>
          <profile>default</profile>
          <quota>default</quota>
          <networks>
            <ip>::/0</ip>
          </networks>
          <access_management>1</access_management>
        </{{ $user }}>
        <!-- All pods that serve traffic use this non-DDL identity. The shared
             password keeps Secret rotation atomic while privileges keep schema
             ownership exclusively with the hook-only admin above. -->
        <{{ $runtimeUser }}>
          <password from_env="CLICKHOUSE_PASSWORD"/>
          <profile>runtime</profile>
          <quota>default</quota>
          <networks>
            <ip>::/0</ip>
          </networks>
          <access_management>0</access_management>
          <named_collection_control>0</named_collection_control>
          <show_named_collections>1</show_named_collections>
          <show_named_collections_secrets>0</show_named_collections_secrets>
          <grants>
            <query>GRANT SELECT ON system.*</query>
            <query>GRANT SELECT, INSERT ON rulebricks.*</query>
            <query>GRANT SELECT, INSERT ON {{ $otelDb }}.*</query>
            <query>GRANT SHOW DATABASES, SHOW TABLES, SHOW COLUMNS, SHOW DICTIONARIES ON *.*</query>
            <query>GRANT NAMED COLLECTION ON {{ $namedCollection }}</query>
            <query>GRANT SHOW NAMED COLLECTIONS ON {{ $namedCollection }}</query>
            <query>GRANT READ ON {{ $sourceType }}</query>
            <!-- ClickHouse implements table functions through an internal
                 temporary table; this does not permit persistent table DDL. -->
            <query>GRANT CREATE TEMPORARY TABLE ON *.*</query>
          </grants>
        </{{ $runtimeUser }}>
        <!-- Lock the built-in default user to loopback so it can't be used remotely. -->
        <default replace="replace">
          <profile>default</profile>
          <quota>default</quota>
          <password></password>
          <networks>
            <ip>127.0.0.1</ip>
            <ip>::1</ip>
          </networks>
        </default>
      </users>
    </clickhouse>
  10-query-limits.xml: |
{{ include "rulebricks.clickhouse.queryLimitsXml" $cctx | indent 4 }}
  11-named-collection-access.xml: |
{{ include "rulebricks.clickhouse.userAccessXml" $cctx | indent 4 }}
{{- /* Stateless mode re-seeds the archive views on every emptyDir start.
       Persistence is the sole statefulness switch; ClickStack only adds its
       own local telemetry tables. Keep this in sync with the workload. */}}
{{- if not .Values.clickhouse.persistence.enabled }}
---
{{- /* Stateless mode only: mounted at /docker-entrypoint-initdb.d so the image
       entrypoint re-seeds the decision-log views whenever a pod starts with a
       fresh (empty) data dir. With emptyDir storage that happens on every pod
       reschedule; the post-install/post-upgrade view Job alone would leave the
       views missing until the next helm upgrade. The SQL is idempotent
       (CREATE ... IF NOT EXISTS / CREATE OR REPLACE) and identical to the
       view Job's. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}-init-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
data:
  01-decision-log-views.sql: |
    {{ include "rulebricks.clickhouse.decisionLogsViewSql" $cctx }}
{{- end }}
{{- end }}
