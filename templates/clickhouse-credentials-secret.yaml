{{- if .Values.clickhouse.enabled }}
{{- $secretName := printf "%s-clickhouse-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- /* Upgrade-safe: prefer an explicit password, else reuse the existing secret's
       value, else generate one. Mirrors the old common.secrets.passwords.manage. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if .Values.clickhouse.auth.password }}
{{-   $password = .Values.clickhouse.auth.password }}
{{- else if and $existing $existing.data (index $existing.data "admin-password") }}
{{-   $password = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{-   $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  admin-password: {{ $password | b64enc | quote }}
{{- end }}
