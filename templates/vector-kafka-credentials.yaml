{{- if .Values.vector.enabled }}
{{- $logging := (.Values.rulebricks.app).logging | default dict }}
{{- $brokers := $logging.kafkaBrokers | default "" }}
{{- $sasl := $logging.kafkaSasl | default dict }}
{{- $mechanism := $sasl.mechanism | default "" }}
{{- $tokenMech := or (eq $mechanism "aws-iam") (eq $mechanism "oauthbearer") }}
{{- $bridge := and .Values.kafkaBridge .Values.kafkaBridge.enabled }}
{{- /* Provide SASL credentials to Vector only when it connects directly with an
       inline PLAIN/SCRAM credential. Token mechanisms use the bridge (no creds),
       and existingSecret users wire their own secret into vector.env. */ -}}
{{- if and (ne $brokers "") (ne $mechanism "") (not $tokenMech) (not $bridge) (not $sasl.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: vector-kafka-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  KAFKA_SASL_USERNAME: {{ $sasl.username | default "" | quote }}
  KAFKA_SASL_PASSWORD: {{ $sasl.password | default "" | quote }}
{{- end }}
{{- end }}
