{{- if and .Values.clickhouse.enabled .Values.clickhouse.persistence.enabled }}
{{- $ch := .Values.clickhouse -}}
{{- $user := $ch.auth.username | default "rulebricks" -}}
{{- $clickstack := .Values.clickstack | default dict -}}
{{- $clickstackClickhouse := $clickstack.clickhouse | default dict -}}
{{- $otelDb := $clickstackClickhouse.database | default "otel" -}}
{{- $adminDb := include "rulebricks.clickhouse.adminDatabase" . -}}
{{- $generation := include "rulebricks.clickhouse.compatibilityGeneration" . -}}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $otelDb) -}}
{{- fail "clickstack.clickhouse.database must be a valid unquoted ClickHouse identifier" -}}
{{- end -}}
{{- if or (eq $otelDb "system") (eq $otelDb "rulebricks") (eq $otelDb $adminDb) -}}
{{- fail (printf "clickstack.clickhouse.database must not be system, rulebricks, or %s" $adminDb) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}-reset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-reset
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: reset
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: reset-incompatible-layout
          image: {{ include "rulebricks.image" (dict "root" $ "image" .Values.global.images.busybox "name" "busybox") | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "rulebricks.clickhouse.fullname" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                  key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
            - name: CLICKSTACK_DATABASE
              value: {{ $otelDb | quote }}
            - name: ADMIN_DATABASE
              value: {{ $adminDb | quote }}
            - name: EXPECTED_GENERATION
              value: {{ $generation | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              q() {
                query="$1"
                settings="${2:-}"
                wget -q -O - \
                  --header "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
                  --header "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
                  --post-data "${query}" \
                  "http://${CLICKHOUSE_HOST}:8123/${settings}"
              }

              attempt=0
              until q "SELECT 1" >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 60 ]; then
                  echo "Existing ClickHouse did not become reachable for the pre-upgrade compatibility check" >&2
                  exit 1
                fi
                sleep 5
              done

              marker_exists="$(
                q "SELECT count() FROM system.tables WHERE database = '${ADMIN_DATABASE}' AND name = 'clickhouse_compatibility' FORMAT TSVRaw"
              )"
              current_generation=""
              if [ "${marker_exists}" = "1" ]; then
                current_generation="$(
                  q "SELECT generation FROM \`${ADMIN_DATABASE}\`.clickhouse_compatibility LIMIT 1 FORMAT TSVRaw"
                )"
              fi
              incompatible="$(
                q "SELECT count() FROM system.tables WHERE database NOT IN ('system', '${ADMIN_DATABASE}') AND engine LIKE '%MergeTree%' AND storage_policy != 'object_storage' FORMAT TSVRaw"
              )"

              if [ "${current_generation}" = "${EXPECTED_GENERATION}" ] && [ "${incompatible}" = "0" ]; then
                echo "ClickHouse compatibility generation ${EXPECTED_GENERATION} is current; preserving data"
                exit 0
              fi

              echo "Resetting ClickHouse databases for compatibility generation ${EXPECTED_GENERATION}; previous generation was '${current_generation:-unset}'"
              q "DROP DATABASE IF EXISTS rulebricks SYNC" "?max_table_size_to_drop=0&max_partition_size_to_drop=0"
              q "DROP DATABASE IF EXISTS \`${CLICKSTACK_DATABASE}\` SYNC" "?max_table_size_to_drop=0&max_partition_size_to_drop=0"

              system_tables="$(
                q "SELECT name FROM system.tables WHERE database = 'system' AND match(name, '^(query_log|query_thread_log|part_log|background_schedule_pool_log|trace_log|crash_log|text_log|metric_log|transposed_metric_log|error_log|filesystem_cache_log|filesystem_read_prefetches_log|s3queue_log|azure_queue_log|asynchronous_metric_log|opentelemetry_span_log|query_views_log|zookeeper_log|session_log|transactions_info_log|processors_profile_log|asynchronous_insert_log|backup_log|blob_storage_log|query_metric_log|dead_letter_queue|zookeeper_connection_log|aggregated_zookeeper_log|iceberg_metadata_log|delta_lake_metadata_log|predicate_statistics_log)(_[0-9]+)?$') FORMAT TSVRaw"
              )"
              for table in ${system_tables}; do
                case "${table}" in
                  *[!a-zA-Z0-9_]*)
                    echo "Unsafe system-log table name '${table}'" >&2
                    exit 1
                    ;;
                esac
                q "DROP TABLE IF EXISTS system.\`${table}\` SYNC" "?max_table_size_to_drop=0&max_partition_size_to_drop=0"
              done

              remaining="$(
                q "SELECT database, name, storage_policy FROM system.tables WHERE database NOT IN ('system', '${ADMIN_DATABASE}') AND engine LIKE '%MergeTree%' AND storage_policy != 'object_storage' ORDER BY database, name FORMAT TSVRaw"
              )"
              if [ -n "${remaining}" ]; then
                echo "Incompatible local MergeTree tables remain after the ClickHouse reset:" >&2
                printf '%s\n' "${remaining}" >&2
                exit 1
              fi
{{- end }}
