{{- if .Values.clickhouse.enabled }}
{{- $ch := .Values.clickhouse }}
{{- /* Stateless mode (persistence.enabled=false) keeps decision-log querying
     fully functional - the archive lives in object storage and is read through
     the named-collection views - but local MergeTree data does NOT survive pod
     rescheduling. ClickStack stores its telemetry (logs/traces/metrics) in
     local MergeTree tables on this same ClickHouse, so the two settings are
     incompatible. */}}
{{- if and (not $ch.persistence.enabled) .Values.global.clickstack.enabled }}
{{- fail "clickhouse.persistence.enabled=false requires the ClickStack observability backend to be disabled (global.clickstack.enabled=false): ClickStack stores telemetry in local MergeTree tables that would be lost on every ClickHouse pod restart. Enable persistence or disable ClickStack." }}
{{- end }}
{{- /* Stateless mode renders a Deployment, not a StatefulSet: there are no
     volume claims and no reliance on stable pod identity (the ClusterIP
     Service fronts the single pod either way), so the workload kind itself
     is proof that ClickHouse holds no state. Recreate matches the
     single-instance semantics of the StatefulSet and avoids a surge pod
     briefly doubling the memory request at critical priority.
     UPGRADE NOTE: releases prior to this change shipped a StatefulSet with
     the same name in stateless mode; Helm replaces the workload kind during
     upgrade. The kind swap also applies when flipping an existing persistent
     install to stateless (previously rejected: volumeClaimTemplates is an
     immutable StatefulSet field). A leftover data-<release>-clickhouse-0 PVC
     from a previously-persistent install is NOT auto-deleted - remove it
     manually to reclaim the disk. */}}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $ch.persistence.enabled }}
metadata:
  name: {{ include "rulebricks.clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rulebricks.clickhouse.labels" . | nindent 4 }}
spec:
  {{- if $ch.persistence.enabled }}
  serviceName: {{ include "rulebricks.clickhouse.fullname" . }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "rulebricks.clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rulebricks.clickhouse.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with $ch.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/clickhouse-config.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ include "rulebricks-chart.registrySecretName" . }}
      {{- if $ch.serviceAccount.create }}
      serviceAccountName: {{ include "rulebricks.clickhouse.fullname" . }}
      {{- end }}
      {{- with $ch.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- $sched := .Values.global.scheduling | default dict }}
      {{- with ($ch.nodeSelector | default $sched.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($ch.tolerations | default $sched.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($ch.affinity | default $sched.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ include "rulebricks.image" (dict "root" $ "image" $ch.image "name" "clickhouse-server") | quote }}
          imagePullPolicy: {{ $ch.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          env:
            # Users are defined entirely by the mounted users.d configMap (the
            # `rulebricks` user reads its password via from_env="CLICKHOUSE_PASSWORD").
            # Skip the image entrypoint's own user setup, which would otherwise try to
            # write default-user.xml into the read-only users.d configMap mount and crash.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rulebricks.clickhouse.credentialSecret" . }}
                  key: {{ $ch.auth.existingSecretKey | default "admin-password" }}
            {{- if not $ch.persistence.enabled }}
            {{- /* Stateless mode runs the entrypoint's initdb flow on every fresh
                 data dir (pod reschedule loses the emptyDir). The entrypoint's
                 embedded clickhouse-client authenticates as CLICKHOUSE_USER
                 (default "default", which our users.d locks to loopback with an
                 EMPTY password - it would fail with CLICKHOUSE_PASSWORD set), so
                 point it at the rulebricks user instead. */}}
            - name: CLICKHOUSE_USER
              value: {{ $ch.auth.username | default "rulebricks" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: metrics
              containerPort: 9363
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- with $ch.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: config-d
              mountPath: /etc/clickhouse-server/config.d
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            {{- if not $ch.persistence.enabled }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: config-d
          configMap:
            name: {{ include "rulebricks.clickhouse.fullname" . }}-config-d
        - name: users-d
          configMap:
            name: {{ include "rulebricks.clickhouse.fullname" . }}-users-d
        {{- if not $ch.persistence.enabled }}
        {{- /* Stateless mode: /var/lib/clickhouse only holds the decision-log
             view definitions (metadata) plus scratch space for queries. The
             init-scripts mount below recreates the views whenever a pod starts
             with a fresh data dir, so nothing here needs to survive. */}}
        - name: data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: {{ include "rulebricks.clickhouse.fullname" . }}-init-scripts
        {{- end }}
  {{- if $ch.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $ch.persistence.storageClass }}
        storageClassName: {{ $ch.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $ch.persistence.size | default "100Gi" }}
  {{- end }}
{{- end }}
